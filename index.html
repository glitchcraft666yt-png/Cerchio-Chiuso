    biblioteca:{name:"Biblioteca", crimeFrom:0,
      desc:[
        "Tremila volumi e una galleria in ferro battuto a cui si sale da una scala a chiocciola. Al centro, sul tappeto persiano, Julian Ashcombe: bellissimo anche adesso, la testa piegata in un angolo impossibile.",
        "Il corpo di Julian è stato coperto con un lenzuolo. Il sangue sul tappeto è diventato nero.",
        "Il lenzuolo sul corpo di Julian. L'odore comincia a farsi sentire, nonostante il freddo.",
        "La biblioteca è al buio. Nessuno ha più voglia di entrarci."],
      objects:[
        {id:"fermacarte",label:"Il fermacarte di marmo",clue:"c_fermacarte",
         text:"Marmo verde del Connemara, pesante come un mattone. Sangue e capelli su un solo spigolo. Julian è stato colpito alla tempia destra. Un destro che colpisce un uomo di fronte prende la tempia sinistra. Chi l'ha colpito gli stava davanti, e usava l'altra mano."},
        {id:"tappeto",label:"Il tappeto",clue:"c_trascinamento",
         text:"Due solchi paralleli nel pelo del tappeto, dalla base della scala a chiocciola fino al centro della stanza: talloni trascinati. Julian è caduto dalla galleria ed è morto lì. Poi qualcuno l'ha spostato e ha rovesciato due sedie per inscenare una lotta. Le sedie sono cadute troppo ordinatamente."},
        {id:"galleria",label:"La ringhiera della galleria",clue:"c_pizzo",
         text:"Sali la scala a chiocciola. Sulla ringhiera, all'altezza di una mano, è impigliato un frammento di pizzo nero. Chantilly: fine, caro, francese. In questa casa vestono a lutto due donne."},
        {id:"bicchiere",label:"Il bicchiere sul tavolino",clue:"c_bicchiere",
         text:"Un bicchiere di brandy a metà accanto alla poltrona. Sul fondo, un deposito biancastro che con il brandy non ha niente a che fare. Lo annusi: amaro, farmaceutico."},
        {id:"leggio",label:"Il libro sul leggio",clue:"c_landsteiner",
         text:"Un trattato in tedesco, Landsteiner, sui gruppi sanguigni. Una pagina segnata con un biglietto del tram di Edimburgo, una tabella sottolineata con violenza. A margine, a matita, una grafia nervosa: «AB non può dare O». Se un genitore è di gruppo AB, il figlio non può essere di gruppo O. Mai."}
      ]},
    sala_pranzo:{name:"Sala da pranzo", crimeFrom:99,
      desc:[
        "La tavola di stasera non è stata sparecchiata. Sette coperti, sette segnaposto, l'argenteria che luccica sotto il lampadario spento.",
        "Kitty ha sparecchiato all'alba, ma la tovaglia è ancora lì, macchiata.",
        null,null],
      objects:[
        {id:"tavola",label:"Il posto di Lady Agatha",clue:"c_bicchiere_sx",
         text:"Al posto di Lady Agatha le posate sono composte con precisione militare. Ma il bicchiere dell'acqua è a sinistra del piatto, e la macchia di claret sulla tovaglia è a sinistra. Come chi, stanca, smette per un attimo di sorvegliarsi."},
        {id:"sedia",label:"La sedia spostata",
         text:"La sedia di Lady Agatha è stata spinta indietro con calma. È uscita alle 22:20, ricordi bene: emicrania. Un'ora e dieci minuti prima dell'urlo."},
        {id:"credenza",label:"La credenza",
         text:"Argenteria in fila come una compagnia di granatieri. Non manca niente: Kitty conta i coltelli ogni sera, e lo dice con un certo orgoglio."}
      ]},
    cucina:{name:"Cucina", crimeFrom:99,
      desc:[
        "La cucina è l'unico posto caldo della casa. Rame alle pareti, un tavolo di pietra, odore di brodo e di cenere.",
        "Le stufe accese dalle cinque. Kitty non si siede mai.",null,null],
      objects:[
        {id:"vassoio",label:"Il vassoio e le tazze",clue:"c_tazza",
         text:"Sul piano di pietra, il vassoio d'argento del brandy, lavato di fresco. Accanto, la tazza da tisana di Lady Agatha, quella con le violette: pulita, asciutta, la polvere della credenza ancora sul bordo. Stanotte nessuno ci ha bevuto."},
        {id:"barattolo",label:"Il barattolo del tè",clue:"c_figlio",
         text:"Dietro il barattolo del tè, infilata tra il legno e il muro, una piccola fotografia: un bambino di dieci o undici anni in divisa d'istituto. Sul retro, a matita: «Tommy — orfanotrofio di Plymouth — 1911»."},
        {id:"coltelli",label:"I coltelli",clue:"c_rina_destra",
         text:"I coltelli di Kitty: affilati, puliti, tutti al loro posto. I manici di legno sono consumati sul lato destro, lisci come vetro. Mani destre, da trent'anni."}
      ]},
    studio:{name:"Studio di Sir Lionel",mapName:"Studio", crimeFrom:99,
      desc:[
        "Lo studio di Sir Lionel è rimasto com'era. Libri mastri, un globo, la scrivania di noce. Helena Voss vi lavora come se il padrone potesse rientrare da un momento all'altro.",
        "Helena è alla scrivania dalle sei. Ha l'aria di chi ha appena concluso un buon affare.",
        "La sedia di Helena è vuota. Le sue carte, ordinate fino all'ossessione, aspettano qualcuno che non tornerà.",
        null],
      objects:[
        {id:"bozza",label:"La bozza del testamento",clue:"c_testamento",
         text:act=>act<2?"Helena ti porge un fascicolo senza alzarsi. «È questo che è venuto a leggere, avvocato. La versione che Sir Lionel non ha fatto in tempo a firmare.» Una rendita minima a Julian, «poiché egli non è sangue mio». Il grosso alla Fondazione Ashcombe. Una parte cospicua a Helena Voss.":"La bozza del testamento è ancora sulla scrivania. Una rendita minima a Julian, «poiché egli non è sangue mio». Il grosso alla Fondazione Ashcombe e a Helena Voss. Due dei tre beneficiari sono morti."},
        {id:"calendario",label:"Il calendario da tavolo",clue:"c_calendario",from:2,
         text:"Il calendario dell'anno, conservato come un registro. Il 3 maggio è cerchiato in rosso: il giorno in cui morì Sir Lionel. Sulla casella del 2 maggio, nella grafia minuta di Helena: «tisana — J.»"},
        {id:"registro",label:"Il cassetto della scrivania",clue:"c_registro",from:2,
         text:"Sotto la carta assorbente, un quaderno nero con la copertina di tela. Non sono i conti della tenuta. Sono incassi. «R. — £500 entro Natale.» «S.B. — ottobre — saldato.» «C.M. — 10 scellini al mese.» E una riga sola, diversa: «J.A. — ottobre — £300 — la carta del '04». Helena non vendeva solo silenzio. Vendeva anche documenti."},
        {id:"archivio",label:"Lo schedario di ferro",clue:"c_referto_vero",req:"chiavi_elena",
         reqMsg:"Uno schedario in ferro, chiuso a chiave. Helena portava le chiavi alla cintura, sempre.",
         text:"La chiave più piccola del mazzo di Helena gira con uno scatto. Fascicoli ordinati per cognome. In quello intestato a REID, una busta ingiallita: Università di Edimburgo, Laboratorio di Fisiologia, marzo 1904. Gruppi sanguigni. Lionel Ashcombe: O. Agatha Ashcombe: O. Julian Ashcombe: O. Malcolm Reid: AB. In fondo, a mano: «Il dott. R. è escluso come padre. Riservato.» Reid conosce la verità da otto anni. E ha taciuto."}
      ]},
    camera_jacopo:{name:"Camera di Julian",mapName:"Julian", crimeFrom:99,
      desc:[
        "La stanza di un uomo che non voleva essere qui: bauli mai disfatti, abiti di Savile Row buttati sulle sedie, un odore dolciastro sotto quello del tabacco turco.",
        null,null,null],
      objects:[
        {id:"camino",label:"Il camino spento",clue:"c_fiala",
         text:"Tra la cenere, qualcosa di vetro. Una piccola fiala annerita, rotta a metà. L'etichetta è bruciata per tre quarti: «…ITALINA — E. Merck, Darmstadt». Digitalina. A dosi giuste regola il cuore. A dosi sbagliate lo ferma, e un medico frettoloso scrive: arresto cardiaco."},
        {id:"astuccio",label:"L'astuccio di pelle",clue:"c_morfina",
         text:"Un astuccio di marocchino: siringa d'argento, sei alloggi per ampolle di morfina. Quattro sono vuoti. Anche per un uomo abituato come Julian, quattro in una sera sono un suicidio. O un aiuto."},
        {id:"agenda",label:"L'agenda",clue:"c_agenda",
         text:"Un'agenda in pelle piena di indirizzi di Mayfair, debiti di gioco, nomi di donna. L'ultima pagina scritta è di ieri: «Ven. — confess. da padre A. — poi dirle la verità sul dottore. Prima che l'avvocato legga.»"},
        {id:"finestra",label:"La finestra",
         text:"Neve sul davanzale, intatta. Nessuno è entrato né uscito da qui."}
      ]},
    camera_allegra:{name:"Camera di Lady Agatha",mapName:"Lady Agatha", crimeFrom:99,
      lock:g=>g.act<1?"La porta è chiusa a chiave. Lady Agatha tiene la chiave su di sé.":null,
      desc:[null,
        "Una stanza severa: letto a baldacchino, un inginocchiatoio, un telaio da ricamo vicino alla finestra. Nessuno specchio.",
        "Lady Agatha è seduta accanto alla finestra, nella luce grigia. Ti guarda entrare senza voltare la testa. «Faccia pure, avvocato. Non ho niente da nascondere che lei sappia trovare.»",
        "La stanza è vuota. Il letto non è stato disfatto."],
      objects:[
        {id:"foto",label:"Le fotografie sul comò",clue:"c_foto_viareggio",
         text:"Una sola fotografia in cornice d'argento: Agatha e Lionel giovani, sul molo, abbracciati, ridono. Lei non sembra la donna di sotto. Sul retro: «Brighton, agosto 1878. L'unica estate. A.» Fai i conti: Julian è nato nel maggio del 1879."},
        {id:"messale",label:"Il messale sull'inginocchiatoio",clue:"c_lettera_allegra",
         text:"Tra le pagine della Messa dei defunti, una lettera piegata in quattro, senza busta. «Lionel. Il figlio di Malcolm ti ha ucciso. Me l'ha detto ridendo, il mese scorso, come si racconta una barzelletta: ti ho liberata, mamma. Il frutto del mio peccato ha ucciso te. Rimedierò io a ciò che ho generato, prima che l'avvocato legga le tue carte. Poi verrò a chiederti perdono. A.» La grafia pende all'indietro, come quella di chi scrive con la mano sinistra."},
        {id:"telaio",label:"Il telaio da ricamo",clue:"c_ricamo",
         text:"Un ricamo a punto pieno, gigli neri su lino. Il lavoro procede da destra verso sinistra, e l'ago è infilato dal lato opposto a quello di qualunque ricamatrice tu abbia mai visto."},
        {id:"comò",label:"Il cassetto del comò",clue:"c_astuccio_vuoto",from:2,
         text:"Gli effetti personali di Sir Lionel, disposti con cura: i gemelli, l'orologio da tasca fermo, il portasigari. E un astuccio di cuoio per rasoio, con le iniziali L.A. impresse in oro. Lo apri. È vuoto."},
        {id:"guanti",label:"I guanti sul parafuoco",clue:"c_guanti",from:2,
         text:"Un paio di guanti di capretto nero stesi ad asciugare. Lavati da poco: sono ancora umidi. Il sinistro è più rigido del destro, e sotto la cucitura del pollice resta un alone rossastro che l'acqua non ha portato via."}
      ]},
    camera_dottore:{name:"Camera del dottore",mapName:"Il dottore", crimeFrom:99,
      lock:g=>null,
      desc:[
        "Odore di whisky e di acido fenico. La borsa del medico aperta sulla sedia, una bottiglia sul comodino, già a metà.",
        "Il letto disfatto. La bottiglia è finita.",
        null,
        "Reid apre la porta solo quando sente la tua voce, e la richiude subito alle tue spalle, a doppia mandata. Ha una seconda bottiglia e gli occhi di un cane bastonato."],
      objects:[
        {id:"borsa",label:"La borsa del medico",clue:"c_borsa",
         text:"Stetoscopio, bisturi, garze, un flacone di laudano. E una scatola di cartone bianco: digitalina Merck, dodici alloggi. Le fiale sono undici."},
        {id:"portafoglio",label:"Il portafoglio sul comodino",clue:"c_foto_rinaldi",
         text:"Banconote stropicciate, una ricevuta del banco dei pegni, e una fotografia consumata agli angoli: una ragazza bellissima e severa accanto a uno studente in toga. «Edimburgo, primavera 1878.» Dedica: «Al mio Malcolm — A.» La ragazza è Lady Agatha."},
        {id:"giacca",label:"La giacca appesa",clue:"c_ricatto",
         text:"Nella tasca interna, una lettera battuta a macchina, senza firma ma con le iniziali H.V. a penna: «So del referto. So del 1904. Cinquecento sterline entro Natale, o Lady Agatha saprà.»"}
      ]},
    camera_sofia:{name:"Camera di Sophia",mapName:"Sophia", crimeFrom:99,
      desc:[
        "Una stanza per gli ospiti, piccola, ordinata in modo quasi doloroso. Un baule già pronto ai piedi del letto.",
        null,null,null],
      objects:[
        {id:"diario",label:"Il quaderno sotto il cuscino",clue:"c_diario_sofia",
         text:"Un diario rilegato in tela grigia. Le ultime pagine: «Ho trovato la lettera tra le carte di Gerald. Julian lo ha ucciso, e la famiglia mi ha pagata perché non facessi domande. Ho preso i loro soldi. Ora mi fanno ribrezzo. Domenica, a tavola, la leggerò a tutti. Voglio vederli in faccia mentre ascoltano.»"},
        {id:"armadio",label:"L'armadio",clue:"c_regalo_pizzo",
         text:"Due abiti neri, sobri. Il colletto di pizzo del più bello è intatto. Su una mensola, avvolto in carta velina, un taglio di pizzo di Chantilly mai usato, con un biglietto: «Per il tuo lutto. A.A.» Lo stesso pizzo, identico, che orna le maniche di Lady Agatha."},
        {id:"valigia",label:"Il baule",
         text:"Pronto, chiuso con le cinghie. Sophia pensava di andarsene domenica, subito dopo il pranzo. Dopo aver detto quello che aveva da dire."}
      ]},
    cappella:{name:"Cappella", crimeFrom:1,
      desc:[
        "La cappella di famiglia: gli Ashcombe sono rimasti cattolici per tre secoli, contro la Corona e contro il buon senso. Banchi di noce, un altare barocco, due candelabri d'argento alti come un bambino. Fa più freddo che fuori.",
        "Padre Ambrose è disteso davanti all'altare, sulla schiena, gli occhi aperti verso un Cristo dorato. Uno dei due candelabri è a terra. La corda intorno al collo non è legata a niente.",
        "Hanno portato via il corpo del prete e l'hanno messo accanto a quello di Julian. La macchia sul marmo è rimasta.",
        null],
      objects:[
        {id:"altare",label:"L'altare",to:0,
         text:"Due candelabri d'argento massiccio, uno per lato, simmetrici e pesanti. Sulla tovaglia d'altare, cera fresca: padre Ambrose è passato di qui stasera, prima di cena."},
        {id:"confess0",label:"Il confessionale",to:0,
         text:"Odore di vino da messa e di legno vecchio. Sulla panca del sacerdote, una stola viola piegata con cura. Qualcuno si è confessato oggi."},
        {id:"candelabro",label:"Il candelabro a terra",clue:"c_candelabro",from:1,
         text:"Lo sollevi a fatica, con due mani. Sangue e capelli grigi alla base. Le ferite sulla testa del prete sono tante, irregolari: chi l'ha usato non aveva la forza di farlo bene al primo colpo."},
        {id:"corpo",label:"Le mani del prete",item:"chiave_torretta",from:1,to:1,
         text:"La mano destra di padre Ambrose è chiusa a pugno, le nocche bianche. Gliela apri, dito per dito. Dentro, una chiave di ferro lunga un palmo. Kitty, sulla porta, si fa il segno della croce: «È la chiave della torretta. Sir Lionel l'aveva data a lui. Diceva che era l'unico di cui si fidava.»"},
        {id:"confessionale",label:"Il confessionale",clue:"c_nota_anselmo",from:1,
         text:"Nella cassetta delle elemosine accanto al confessionale, tra la cenere di una candela, un foglio piegato bruciato per metà. La grafia tremante di un vecchio: «J. mi ha detto tutto. Il veleno. E il resto: che il dottore ha mentito, per trent'anni… [bruciato] …devo parlar… alla madre, prima della Messa. Dio mi perdoni il sigillo.»"}
      ]},
    torretta:{name:"Torretta", crimeFrom:99,
      lock:g=>g.items.includes("chiave_torretta")?null:"Una porta di quercia rinforzata in ferro, in cima a una scala a chiocciola. Chiusa. Kitty dice che la chiave ce l'aveva solo Sir Lionel. E, forse, il suo confessore.",
      desc:["Una stanza rotonda sotto il tetto, gelida. Uno scrittoio, una finestrella che guarda lo stagno ghiacciato e, oltre, la brughiera. Polvere su tutto, tranne che sulla sedia."],
      objects:[
        {id:"diario",label:"Il diario di Sir Lionel",clue:"c_diario",
         text:"Un diario in pelle, cinquant'anni di vita a frammenti. «Agosto 1878. Brighton. Agatha è tornata. Per un'estate siamo stati quello che avremmo dovuto essere.» «Novembre 1882. Ada. Che Dio mi perdoni, perché lo stagno non lo farà.» «Novembre 1911. Reid mi ha portato il referto. Julian non è mio. Lo sospettavo da trent'anni; ora è scritto.» «Aprile 1912. Ho detto a Helena di preparare il nuovo testamento. Julian ha sentito tutto, dietro la porta.» L'ultima riga: «2 maggio. Stasera la tisana me l'ha portata Julian. Gentilezza improvvisa. Forse ci siamo capiti.»"},
        {id:"busta",label:"La busta nel diario",clue:"c_referto_falso",
         text:"Infilato nell'ultima pagina, un foglio su carta intestata «Dott. Malcolm Reid — Medico Chirurgo — Princetown». Gruppi sanguigni: Lionel O. Agatha O. Julian B. «Ne consegue che Sir Lionel è da escludersi come padre.» Firmato e datato: novembre 1911."},
        {id:"lago",label:"La finestrella",clue:"c_ada",
         text:"Lo stagno, laggiù, è una lastra bianca. Sul davanzale qualcuno ha inciso con un temperino, tanti anni fa, un nome: ADA. Nel diario, un'altra pagina: «Era incinta. Mio. È entrata nell'acqua a novembre, e io non sono sceso a cercarla.»"}
      ]},
    cantine:{name:"Cantine", crimeFrom:2,
      desc:[
        "Volte di mattoni, botti di rovere, bottiglie coperte di polvere. Un mucchio di carbone per le stufe. Fa un freddo che entra nelle ossa.",
        null,
        "Helena Voss è seduta contro il muro tra due botti, la testa reclinata, la gola aperta. Il sangue le ha inzuppato il vestito grigio fino alla vita. Sopra di lei, sull'intonaco, a lettere alte una spanna: BUGIARDI.",
        "Il corpo di Helena è stato coperto. La parola sul muro no: nessuno ha il coraggio di cancellarla."],
      objects:[
        {id:"botti",label:"Le botti",to:1,
         text:"Porto del '96, Madera, una botte di sherry. Niente di interessante, a parte il vino."},
        {id:"parete",label:"La scritta sul muro",clue:"c_bugiardi",from:2,
         text:"BUGIARDI. Lettere grandi, tracciate con due dita. Guardi da vicino: ogni lettera è sbavata dal polso che è passato sopra quella appena scritta. Chi scrive con la destra si lascia le lettere fresche alle spalle. Chi scrive con la sinistra ci passa sopra."},
        {id:"tasche",label:"Le tasche di Helena",clue:"c_nota_sola",item:"chiavi_elena",from:2,
         text:"Alla cintura, un mazzo di chiavi d'ottone: lo prendi. Nella tasca del vestito, un biglietto in stampatello, a matita: «CANTINA, ORE 15. PORTI QUELLO CHE HA. VERRÒ SOLA.» Sola. Chi l'ha scritto è una donna."},
        {id:"rasoio",label:"Dietro la botte",clue:"c_rasoio",from:2,
         text:"Gettato nel buio dietro la botte dello sherry, un rasoio a mano libera con il manico d'avorio. Sulla lama, le iniziali incise: L.A."},
        {id:"pavimento",label:"La polvere di carbone",clue:"c_impronte",from:2,
         text:"Il carbone ha lasciato una polvere nera sul pavimento di mattoni. Ci sono le impronte di Kitty, larghe, con gli zoccoli. E altre: scarpe da donna, tacco stretto, un piede piccolo. Vanno verso il corpo e tornano indietro."}
      ]}
  },

  chars:{
    allegra:{name:"Lady Agatha Ashcombe",short:"Lady Agatha",mk:"LA",age:57,role:"Vedova di Sir Lionel",
      bio:"Elegante, controllata, sempre in nero. Voce calma, occhi freddi. Tiene in piedi la famiglia con la sola forza di volontà, e tutti la temono un poco.",
      p:{hair:"veil",acc:"pearls",dress:"#0d0b0a",tone:"#d9c3a5"},
      loc:["salone","salone","camera_allegra","salone"],
      alibi:[
        "«Mi sono ritirata alle dieci e venti. Emicrania. Kitty mi ha portato una tisana verso le undici meno un quarto. Ho sentito l'urlo come tutti, avvocato. Forse più di tutti.»",
        "«Dormivo. Alla mia età il sonno è l'unica cosa che non chiede niente in cambio.»",
        "«Riposavo. Qui. Sola. Lo scriva pure, se le fa piacere.»",
        "«Sono qui da ore, a guardare la neve che ci seppellisce tutti.»"],
      crime:[
        "«Mio figlio è morto in una biblioteca, tra libri che non ha mai aperto. C'è una certa coerenza, non trova?»",
        "«Padre Ambrose beveva. Forse il Signore si è stancato di aspettare che smettesse.»",
        "«Helena sapeva tutto di questa casa. Evidentemente qualcuno ha pensato che sapesse troppo.»",
        "«Tre morti in un giorno. Mio marito ne avrebbe approfittato per rifare il testamento.»"],
      self:"«Sono stata sposata trentotto anni a un uomo che non amavo, e ho tenuto in piedi questa casa con queste mani. Non pretendo che lei capisca quanto costa.»",
      others:"«Il dottore è un uomo debole. Sophia è una bambina che recita la parte della vedova. Kitty è fedele. Helena era indispensabile. Le persone indispensabili diventano presto insopportabili.»",
      react:{
        c_pizzo:"«Chantilly. Ne ho metri. Anche Sophia, se è per questo: gliel'ho regalato io, per il lutto. La generosità, vede, lascia tracce.»",
        c_regalo_pizzo:"«Sì, gliel'ho regalato io. Una vedova deve vestirsi da vedova. Anche quando non lo è nel cuore.»",
        c_fiala:"Una pausa appena troppo lunga. «Digitalina. Lionel aveva il cuore debole, lo sapevano tutti. Chi l'abbia buttata nel camino di Julian… lo chieda a Julian.»",
        c_foto_rinaldi:"«Avevo ventitré anni e un marito che passava le notti a Londra con le ballerine dell'Alhambra. Non me ne vergogno. Me ne vergognavo, una volta.»",
        c_foto_viareggio:"La sua mano, per la prima volta, si muove: va a toccare il bordo della cornice e si ritira. «Brighton. L'unica estate.» Un silenzio. «Metta giù quella fotografia, avvocato.»",
        c_lettera_allegra:"«Ha frugato nel mio messale. Dio la perdonerà, io no. Quella lettera era per un morto. I morti non testimoniano.»",
        c_bugiardi:"«Una parola sola. Chiunque l'abbia scritta aveva un senso dell'economia che apprezzo.»",
        c_rasoio:"«Il rasoio di Lionel. Lo tenevo in camera, con i suoi gemelli e il suo orologio. Tutta la casa sa dove tengo le cose di mio marito. Kitty lo sa. Helena lo sapeva.»",
        c_astuccio_vuoto:"«Qualcuno ha frugato nei miei cassetti prima di lei, a quanto pare. In questa casa non c'è più rispetto per niente.»",
        c_guanti:"«Mi sono sporcata scendendo in cantina, dopo, quando abbiamo trovato Helena. Lei c'era, avvocato. Si ricorda chi ha toccato cosa?»",
        c_testimonianza_rina:"Silenzio. «Kitty è una brava donna. Le brave donne, sotto pressione, dicono quello che l'interlocutore vuole sentirsi dire.»",
        c_mancina:"«Le suore del convento di York mi hanno insegnato a usare la mano giusta. Ho imparato. Si impara tutto, avvocato. Anche a non essere sé stessi.»",
        c_bicchiere_sx:"«Ero stanca. Alla fine di una cena come quella, si diventa disordinati.» Ti guarda. «Lei nota cose curiose.»",
        c_ricamo:"«Ricamo come mi pare. È l'unica cosa che faccio come mi pare.»",
        c_referto_falso:"«Lo conosco. Lionel me lo sbatté sul tavolo un anno fa, credendo di umiliarmi. Mi confermava soltanto quello che Malcolm mi ripeteva da trent'anni. Julian era figlio suo. Di Malcolm.»",
        c_referto_vero:[
          {minAct:1,text:"Lo legge. Lo rilegge. Lo piega in due, con cura, e te lo restituisce. «Lo sapevo già, avvocato.» La voce non cambia. Le mani sì. «Da stamattina. Da troppo poco.»"}],
        c_confessione_rinaldi:"Per un istante Lady Agatha chiude gli occhi. Quando li riapre, guarda le scale, verso la camera del dottore. «Malcolm è sempre stato un uomo debole. Le bugie dei deboli sono le più lunghe.»",
        c_nota_anselmo:"«Padre Ambrose voleva parlare con una madre. In questa casa ce n'erano due, di madri, avvocato. O forse nessuna.»",
        c_agenda:"«La verità sul dottore. Julian aveva molte verità. Le vendeva a peso.»",
        c_diario:"«Lionel teneva un diario? A me non ha mai scritto nemmeno un biglietto d'auguri.»",
        c_bicchiere:"«Brandy. Julian beveva qualunque cosa avesse un tappo.»",
        c_tazza:"«Kitty avrà preso un'altra tazza. Non conto le tazze, avvocato. Ho la servitù per questo.»",
        c_ciondolo:"Legge il frammento senza espressione. «Povera Sophia. Ha scoperto che mio figlio era un assassino. Benvenuta in famiglia.»"
      },
      def:["«Mi sta facendo perdere tempo, avvocato. E qui il tempo è l'unica cosa che scarseggia più del carbone.»","«Non ho niente da dire su questo.»","«Lei guarda le cose come un avvocato. Le conta. Non le capisce.»"]},

    rinaldi:{name:"Dott. Malcolm Reid",short:"Reid",mk:"Dr",age:54,role:"Medico di famiglia",
      bio:"Medico degli Ashcombe da oltre vent'anni, scozzese, laureato a Edimburgo. Ha firmato il certificato di morte di Sir Lionel. Affabile, un po' troppo servizievole, beve più di quanto ammetta.",
      p:{hair:"grey",acc:"glasses",dress:"#2a2420",tone:"#d8b896"},
      loc:["biblioteca","cappella","cantine","camera_dottore"],
      alibi:[
        "«Ho giocato a cribbage con padre Ambrose fino alle undici, poi sono salito in camera. Avevo… una bottiglia. Non mi guardi così, è inverno.»",
        "«Dormivo. Male, ma dormivo. Mi ha svegliato Kitty, bussando. Gridava.»",
        "«Ero nel salone con la signora Blake, dalle due e mezza. Mi ha fatto un caffè, cercava di rimettermi in piedi. Lo chieda a lei.»",
        "«Sono chiuso qui e ci resto. Anzi: quando esce, mi chiuda lei da fuori.»"],
      crime:[
        "«Collo spezzato. Ma guardi le pupille: due capocchie di spillo. Era pieno di morfina, molto più del solito, e Julian il solito lo reggeva bene. Il colpo alla tempia l'ha stordito, la caduta dalla galleria ha fatto il resto. Poi l'hanno trascinato fin qui. Chi l'ha ucciso non avrebbe potuto affrontarlo da sveglio.»",
        "«Colpito alla testa con il candelabro, quattro, cinque volte. La corda è una farsa: non è mai stato appeso, gliel'hanno stretta al collo dopo. Chi l'ha fatto non aveva la forza di sollevare un uomo.»",
        "«Un taglio solo, netto, da sinistra… no, aspetti.» Si china, si rialza pallido. «Da destra verso sinistra. Era dietro di lei. E teneva la lama con la mano sinistra.»",
        "«Ci ammazzerà tutti, uno per uno. E il prossimo sono io. Lo so.»"],
      unlock:{crime0:"c_pupille",crime1:"c_corda",crime2:"c_taglio",alibi2:"c_alibi_sofia3"},
      self:"«Faccio il medico di questa famiglia da ventidue anni. Ho fatto nascere, ho curato, ho chiuso occhi. A un certo punto smetti di distinguere una cosa dall'altra.»",
      others:"«Lady Agatha è… una donna straordinaria. Non le farei mai del male. Julian era un disgraziato. Helena una serpe. Il prete un ubriacone, come me, ma con più scuse.»",
      react:{
        c_fiala:{text:"Si asciuga la fronte. «Digitalina Merck. È… è la stessa che uso io. Mi mancava una fiala da maggio, lo giuro.» Poi crolla sulla sedia. «Sì, ho firmato quel certificato senza nemmeno guardarlo. Julian mi teneva in pugno: sapeva di me e di Agatha. Ho visto il corpo di Lionel con gli occhi del colpevole, non del medico.»",unlock:"c_certificato"},
        c_borsa:"«Una fiala mancante non fa un assassino, avvocato. Le ho contate a maggio. Ne mancava già una, allora.»",
        c_diario:{text:"Legge l'ultima riga e diventa grigio. «La tisana. Julian.» Si siede. «L'ho sempre saputo, credo. Ho firmato il certificato senza guardare. Il ragazzo mi ricattava.»",unlock:"c_certificato"},
        c_foto_rinaldi:"«Edimburgo. Primavera del settantotto. Eravamo giovani. Julian è nato l'anno dopo: faccia due conti, avvocato. Julian era mio.»",
        c_foto_viareggio:"«Questo non prova niente! Un'estate al mare. A settembre lei tornò da me. Julian era mio, mio, lo capisce?»",
        c_ricatto:"«Helena voleva cinquecento sterline per non raccontare a Lady Agatha della nostra… relazione. Tutto qui. Roba vecchia.»",
        c_referto_falso:"«L'ho scritto io, sì. Lionel voleva una prova, e io gliel'ho data. Era la verità. Solo… messa in bella copia.»",
        c_landsteiner:"«Landsteiner. I gruppi sanguigni. È scienza seria.» Si passa la lingua sulle labbra. «Perché me lo mostra?»",
        c_referto_vero:{text:"Lo guarda come si guarda un cadavere. «Dove… Helena. Certo. Helena.» Si lascia cadere sul letto. «Avevo vent'anni quando l'ho amata e quarantasei quando ho fatto quell'analisi, di nascosto. Il ragazzo era di Lionel. Lo era sempre stato. Ma se Agatha l'avesse saputo, cosa le sarebbe rimasto di me? Una fotografia. Così ho continuato a mentire. A lei. E poi a Lionel, con quel referto falso: speravo che la cacciasse. Che lei venisse finalmente da me.» Si copre la faccia. «Ho ucciso tutti, vero? Senza toccare nessuno.»",unlock:"c_confessione_rinaldi"},
        c_nota_anselmo:"«Il dottore ha mentito.» Rilegge. «No. No, no. Il prete era ubriaco. Non sapeva quello che scriveva.»",
        c_agenda:"«La verità sul dottore.» Ride, una risata brutta. «Julian aveva sempre una verità in tasca, da vendere.»",
        c_bugiardi:"Fissa la parola e non riesce a staccarne gli occhi. «Bugiardi. Lo dice a me. Lo dice a me, quella parola.»",
        c_pupille:"«Gliel'ho detto. Era imbottito. Qualcuno gliel'ha data, o gliel'ha messa nel bicchiere.»",
        c_bicchiere:"«Morfina sciolta nel brandy. Amara come il fiele, ma Julian non sentiva più i sapori da anni.»",
        c_mancina:"«Mancina? Agatha?» Ci pensa. Qualcosa gli torna in mente da trent'anni fa e gli si gela la faccia. «A Edimburgo… sì. Scriveva le lettere con la sinistra, quando era sola con me.»",
        c_guanti:"«Il sangue non si toglie con l'acqua fredda. Serve l'acqua ossigenata. Lo sanno i medici.» Si ferma. «E le mogli dei medici. E le donne che hanno fatto le infermiere in Sudafrica.»"
      },
      def:["«Non… non so niente di questo.»","«Posso avere qualcosa da bere, prima?»","«Chieda a Lady Agatha. Lei sa sempre tutto.»"]},

    sofia:{name:"Sophia Blake",short:"Sophia",age:28,role:"Vedova di un cugino degli Ashcombe",
      bio:"Vedova di Gerald Blake, cugino degli Ashcombe, morto due anni fa in un «incidente di caccia» sulla brughiera. Bella in modo discreto, silenziosa, sembra fragile. Porta sempre al collo un medaglione con il ritratto del marito.",
      p:{hair:"long",acc:"locket",dress:"#141110",tone:"#e3ccb0"},
      loc:["salone","salone","salone","salone"],
      alibi:[
        "«Ero qui, nel salone, con padre Ambrose. Mi leggeva Tennyson. Male, ma con impegno. Poi l'urlo.»",
        "«In camera mia. Non dormo più da due anni. Ho sentito la campanella della cappella verso le sei e mezza, una volta sola. Ho pensato che il padre si preparasse alla Messa.»",
        "«Con il dottor Reid, qui. Tremava come una foglia. Gli ho fatto il caffè forte e l'ho tenuto sveglio dalle due e mezza fino a quando Kitty ha gridato.»",
        "«Voglio solo che smetta di nevicare.»"],
      unlock:{alibi2:"c_alibi_sofia3"},
      crime:[
        "«Non piangerò Julian. Non me lo chieda.»",
        "«Il padre era l'unico gentile con me, in questa casa.»",
        "«Helena mi guardava come si guarda un conto da saldare.»",
        "«Chi uccide così non si ferma. Si ferma quando non resta più nessuno.»"],
      self:"«Ho sposato Gerald a vent'anni. Due anni fa è uscito a caccia con Julian e non è tornato. Mi hanno detto: un incidente. Mi hanno dato del denaro. Come se certe cose si potessero saldare.»",
      others:"«Lady Agatha mi ha regalato il pizzo che porto. Non so se per gentilezza o per ricordarmi chi paga.»",
      react:{
        c_diario_sofia:{text:"Arrossisce, poi impallidisce. «Ha letto il mio diario.» Si slaccia il medaglione con le dita che tremano e lo apre. Dietro il ritratto di Gerald, un pezzo di carta piegato. «Ecco. È questa la lettera. Volevo leggerla domenica, davanti a tutti. Qualcuno mi ha tolto anche questo.»",unlock:"c_ciondolo"},
        c_registro:{text:"«S.B.» Sbianca. «Sì. Helena sapeva che avevo trovato una cosa. Voleva che stessi zitta, e mi faceva pagare per il suo silenzio, come se fossi io la colpevole.» Apre il medaglione. «Ecco cosa avevo trovato.»",unlock:"c_ciondolo"},
        c_ciondolo:"«Gerald è morto per un cervo che non c'era. Volevo vedere la faccia di Julian mentre la leggevo. Sì, lo odiavo. Ma l'odio non spezza il collo a nessuno, avvocato. Servono le mani.»",
        c_pizzo:"«Il mio colletto? Guardi pure, è intatto. Ma Lady Agatha me ne ha regalato un metro intero. Il resto l'ha tenuto per sé.»",
        c_regalo_pizzo:"«Non l'ho mai usato. Mi sembrava di indossare la sua elemosina.»",
        c_nota_sola:"«Non è la mia grafia. Io scrivo in corsivo, come mi hanno insegnato le Orsoline. Lo stampatello lo usa chi non vuole essere riconosciuto.»",
        c_impronte:"«Ho il piede piccolo. Anche Lady Agatha. Anche metà delle signore d'Inghilterra.»",
        c_mancina:"«Mancina? Lady Agatha? Non l'ho mai vista usare la sinistra. Mai, nemmeno per sbaglio.» Ci pensa. «Non è strano? Chi è così attento a una mano sola?»",
        c_alibi_sofia3:"«Il dottore può dirglielo. Non l'ho lasciato un minuto. Aveva paura di addormentarsi.»",
        c_bicchiere_sx:"«A tavola ero seduta di fronte a lei. Tagliava l'arrosto come un chirurgo. Ma quando ha preso il bicchiere…» Esita. «Ha allungato la sinistra. Poi l'ha ritirata, come se si fosse scottata.»",
        c_fiala:"«Veleno. Allora anche Sir Lionel…» Ti guarda dritto. «Lo chieda a chi ha firmato il certificato.»"
      },
      def:["«Non so niente di questo, avvocato.»","«Perché lo chiede a me? Sono l'ultima arrivata in questa famiglia.»","«Mi lasci in pace, la prego.»"]},

    anselmo:{name:"Padre Ambrose Hale",short:"P. Ambrose",mk:"PA",age:61,role:"Cappellano di famiglia",deadFrom:1,
      bio:"Confessore degli Ashcombe da trent'anni. Conosce i peccati di quasi tutti. Beve in segreto. Ha l'aria stanca e disillusa di chi ha perdonato troppo.",
      p:{hair:"bald",acc:"collar",dress:"#121010",tone:"#d6b48e"},
      loc:["salone"],
      alibi:["«Ero con la signora Blake. Le leggevo Tennyson. Lei fingeva di ascoltare, io fingevo di non avere sete.»"],
      unlock:{alibi0:"c_alibi_sofia1",others:"c_ada"},
      crime:["«Ho dato l'estrema unzione a un ragazzo di trentatré anni con il collo spezzato. Signore, pietà.» Abbassa la voce. «Ci sono cose che so, avvocato, ma non sono mie. Sono di Dio.»"],
      self:"«Sono il confessore di questa famiglia da trent'anni. Sapesse quante cose si possono perdonare. E quante no.»",
      others:"«Lady Agatha è una donna di fede. Di una fede tutta sua. Sir Lionel aveva molto da farsi perdonare: una ragazza, tanti anni fa. Ada. Annegata nello stagno del parco. Ma questo non gliel'ho detto io.»",
      react:{
        c_agenda:{text:"Diventa grigio. «Julian è venuto da me ieri pomeriggio. Ha chiesto di confessarsi, per la prima volta in quindici anni. Non posso dirle cosa. Non posso.» Si versa da bere con la mano che trema. «Le dico solo questo: in questa casa qualcuno ha creduto per trent'anni a una cosa falsa. E la verità, quando arriva tardi, è peggio di una bugia.»",unlock:"c_confessione_jacopo"},
        c_fiala:"«Rimetta via quella cosa. Non qui. Non davanti a me.»",
        c_landsteiner:"«Scienza.» Sorride, triste. «Una volta per sapere di chi era un figlio bastava chiederlo alla madre. Ora lo chiedono al sangue. Il sangue, almeno, non mente.»",
        c_testamento:"«Lionel voleva sistemare i conti con Dio lasciando i soldi a una fondazione. Dio non accetta assegni.»",
        c_foto_rinaldi:"«Vecchie storie. Le ho perdonate tutte, a suo tempo.» Guarda la fotografia un momento di troppo. «Non tutte erano vere, però.»"
      },
      def:["«Non posso parlarne, figliolo.»","«Preghi, avvocato. Qui dentro è l'unica cosa che non costa niente.»","«Il sigillo della confessione non è una formalità.»"]},

    elena:{name:"Helena Voss",short:"Helena",age:42,role:"Segretaria e amministratrice",deadFrom:2,
      bio:"Al servizio di Sir Lionel per diciotto anni. Tedesca di Amburgo, precisissima, sempre in grigio. Conosce ogni debito, ogni lettera, ogni segreto finanziario della famiglia. La servitù la chiama «la vera padrona» di Ravenscourt.",
      p:{hair:"bun",acc:"glasses",dress:"#45433f",tone:"#e6cfb3"},
      loc:["studio","studio"],
      alibi:[
        "«Nello studio, a riordinare le carte di Sir Lionel. Qualcuno in questa casa deve lavorare.»",
        "«Qui dalle sei. Non ho visto nessuno. Ho sentito la campanella della cappella, verso le sei e mezza.»"],
      crime:[
        "«Julian aveva debiti con mezza Londra. Ma i creditori non vengono a spezzarti il collo in campagna durante una bufera. È stato qualcuno di casa.»",
        "«Il prete parlava troppo, quando beveva. E beveva sempre.»"],
      self:"«Diciotto anni al servizio di Sir Lionel. Conosco ogni sterlina di questa famiglia. Anche quelle che non risultano.»",
      others:"«Mi chieda di chiunque, avvocato. Ma sappia che in questa casa le informazioni hanno un prezzo.»",
      react:{
        c_testamento:"«Sir Lionel era un uomo giusto, alla fine. Tardi, ma giusto. Sì, mi lasciava molto. Me l'ero guadagnato.»",
        c_ricatto:"Sorride, per la prima volta. «Il dottore conserva la mia corrispondenza. Commovente. Lei crede che parli di una vecchia tresca, vero? Lo crede anche lui. Lo crede anche Lady Agatha. Nessuno legge con attenzione, in questa casa.»",
        c_fiala:"Gli occhi le si stringono. «Digitalina. Allora era vero.» Ti restituisce la fiala come si restituisce un assegno. «Grazie, avvocato. Mi ha appena fatto guadagnare molto denaro.»",
        c_nota_anselmo:"«Il dottore ha mentito. Il prete è arrivato prima di me.» Un'occhiata alla finestra, verso la cappella. «E guardi dov'è finito.»",
        c_landsteiner:"«Sir Lionel comprava libri che non leggeva. Qualcun altro, a quanto pare, li legge.»",
        c_figlio:"«La governante ha i suoi segreti. Ce li hanno tutti, in questa casa. Io li tengo solo in ordine alfabetico.»",
        c_agenda:"«Julian voleva dire la verità alla madre?» Una risatina. «Allora ha venduto la stessa merce due volte. Era il suo stile.»"
      },
      def:["«Non vedo come questo la riguardi, avvocato.»","«Ho del lavoro da finire.»","«Le informazioni hanno un prezzo. Questa non le interessa abbastanza da pagarla.»"]},

    rina:{name:"Catherine «Kitty» Moore",short:"Kitty",age:39,role:"Governante di Ravenscourt",
      bio:"Governante da quindici anni. Sa tutto quello che succede nelle stanze. Fedelissima a Lady Agatha… o almeno così sembra.",
      p:{hair:"bun2",acc:"apron",dress:"#2b2621",tone:"#d3ad87"},
      loc:["cucina","cucina","cucina","cucina"],
      alibi:[
        "«In cucina. Alle undici meno un quarto ho portato la tisana a milady, poi sono tornata giù.»",
        "«Dalle cinque ero in piedi alle stufe. Il padre l'ho trovato io, alle sette, quando sono andata ad aprire la cappella.»",
        "«Stiravo. Qui. Da sola. Lo so cosa vuol dire, non sono stupida.»",
        "«Sono qui. Non salgo più le scale se non c'è luce.»"],
      crime:[
        "«Il signorino Julian da piccolo veniva qui a rubare lo zucchero. Poi ha cominciato a rubare altro.»",
        "«Il padre era steso davanti all'altare. Con quella corda al collo… ma non era appeso a niente, signore. A niente.»",
        "«Helena a pranzo mi ha detto che doveva vedere qualcuno, nel pomeriggio. Rideva. Non l'avevo mai vista ridere.»",
        "«Non ce la faccio più a contare i morti, signore.»"],
      unlock:{crime2:"c_appuntamento"},
      self:"«Quindici anni in questa casa. Ho visto tutto. Ho imparato a non vedere niente.»",
      others:"«Milady mi ha presa quando nessuno mi voleva. Io le devo tutto.»",
      react:{
        c_bicchiere:[
          {minAct:2,text:"Guarda il pavimento a lungo. «No. Non è vero quello che ho detto. È stata milady. Alle dieci e mezza è scesa in cucina e mi ha detto: porta il brandy a Julian in biblioteca, e non dire niente a nessuno. E la tisana… quella sera non gliel'ho portata. Mi ha detto lei di dire così.» Si copre la bocca. «Tre morti, signore. Io non ce la faccio più.»",unlock:"c_testimonianza_rina"},
          {text:"«Il brandy gliel'ho portato io, verso le undici. Il signorino lo chiedeva sempre.» Non ti guarda negli occhi."}],
        c_tazza:[
          {minAct:2,text:"«Non l'ho usata. Lo sa già, vero?» Si siede su uno sgabello. «Me l'ha detto lei di dire così. La tisana non c'è mai stata. Il brandy per Julian, invece, sì: me l'ha fatto portare lei, alle dieci e mezza.»",unlock:"c_testimonianza_rina"},
          {text:"«Ho… lavato la tazza. Sì. Stanotte. Non mi ricordo bene, signore, con tutto quello che è successo.»"}],
        c_bugiardi:{text:"Si fa il segno della croce tre volte. «Bugiardi. Io sono una bugiarda, signore.» Le parole escono tutte insieme. «Il brandy a Julian me l'ha fatto portare milady. La tisana non gliel'ho mai portata. Mi ha detto di mentire e io ho mentito.»",unlock:"c_testimonianza_rina"},
        c_ricamo:{text:"«Milady ricama solo quando è sola. Con la sinistra.» Abbassa la voce. «Da bambina, in convento dalle suore, gliela legavano dietro la schiena perché imparasse a usare la destra. Lei ha imparato a nasconderla. Non a non usarla.»",unlock:"c_mancina"},
        c_bicchiere_sx:{text:"«Il bicchiere a sinistra… sì. Quando è stanca le scappa.» Esita. «Milady è mancina, signore. Nessuno lo sa. Da bambina le legavano la mano dietro la schiena. Lei ha imparato a nasconderla.»",unlock:"c_mancina"},
        c_figlio:"Ti strappa la fotografia di mano. «Tommy. Ha dodici anni. Helena lo sapeva e mi faceva pagare dieci scellini al mese per non dirlo a milady. Sì, la odiavo. No, non l'ho uccisa. Le ho dato i soldi anche questo mese.»",
        c_registro:"«C.M. Catherine Moore. Sono io.» Non aggiunge altro.",
        c_rasoio:"«Le cose di Sir Lionel le tiene milady. In camera sua, nel cassetto del comò. Non le tocca nessuno.»",
        c_guanti:"«Li ho visti stesi sul parafuoco, alle quattro. Ho pensato: strano. Milady non lava mai niente da sé.»",
        c_rina_destra:"«Destra, sì. Perché?»",
        c_impronte:"«Io porto gli zoccoli. Quelle piccole non sono mie.»",
        c_nota_sola:"«Io lo stampatello non lo so fare bene, signore. Sono andata a scuola fino a dieci anni.»"
      },
      def:["«Non so niente, signore. Io sto in cucina.»","«Lo chieda a milady.»","«Non mi faccia queste domande, per carità.»"]},

    jacopo:{name:"Julian Ashcombe",short:"Julian",age:33,role:"Unico figlio degli Ashcombe",deadFrom:0,
      bio:"Bellissimo, dissipato, morfinomane di buona società. Tornava a Ravenscourt solo quando finivano i soldi. Odiava la casa e tutto ciò che rappresentava.",
      p:{hair:"slick",acc:"tie",dress:"#1a1714",tone:"#e0c3a2"},
      loc:[]}
  },

  accusation:[
    {id:"who",q:"Chi ha ucciso Julian, padre Ambrose e Helena Voss?",type:"char",options:["allegra","rinaldi","sofia","rina"]},
    {id:"lorenzo",q:"Come è morto Sir Lionel, il 3 maggio?",options:[
      {id:"cuore",t:"Di cuore, come dice il certificato."},
      {id:"allegra_rinaldi",t:"Avvelenato da Lady Agatha, con la complicità del dottor Reid.",req:["c_fiala"]},
      {id:"jacopo",t:"Avvelenato da Julian, con la digitalina del dottore.",req:["c_fiala"]},
      {id:"elena",t:"Avvelenato da Helena, per l'eredità.",req:["c_testamento"]}]},
    {id:"why",q:"Perché l'assassino ha cominciato da Julian?",options:[
      {id:"gustavo",t:"Per vendicare Gerald Blake, ucciso da Julian.",req:["c_ciondolo"]},
      {id:"segreto",t:"Per proteggere un vecchio segreto e l'eredità."},
      {id:"ricatto",t:"Per far tacere un ricattatore."},
      {id:"parricida",t:"Per punire chi aveva ucciso Sir Lionel, credendolo il figlio del proprio adulterio.",req:["c_lettera_allegra","c_referto_falso"]}]},

    "Il 2 maggio Julian portò al padre una tisana con dentro la digitalina rubata dalla borsa del dottor Reid. Aveva sentito Sir Lionel dettare il nuovo testamento: una rendita da miserabile, «poiché egli non è sangue mio». Sir Lionel ci credeva perché Reid, nel 1911, gli aveva consegnato un referto falso.",

CASE_RAVEN.endingBase = function(ans,g,sl){
  const dead = g.flags.rinaldiMorto;
  const R = (k,title,eyebrow,paras)=>({kind:k,title,eyebrow,paras});
  if(ans.who==="allegra"){
    const score=(ans.lorenzo==="jacopo")+(ans.why==="parricida")+(ans.lie==="rinaldi")-(sl&&!sl.dec?1:0)-(sl&&sl.failed.length>=2?1:0);
    if(score===3) return R("vera","La verità","Finale vero",[
      "Li hai riuniti nel salone. Hai parlato a lungo. Quando hai finito, l'unico rumore era il fuoco.",
      "«Lady Agatha. Julian ha avvelenato suo padre il 2 maggio, con la digitalina del dottore. Lei lo ha saputo da lui, e lo ha ucciso venerdì notte. Senza esitare, perché da trentatré anni credeva che non fosse figlio di Lionel, ma del suo peccato. Di Malcolm Reid.»",
      "«All'alba padre Ambrose le ha detto che il dottore aveva mentito. Helena aveva il referto del 1904 e voleva venderglielo. Lei li ha uccisi tutti e due. E in cantina ha scritto, con la sinistra, l'unica parola che le era rimasta.»",
      "Lady Agatha non si muove. Poi, lentamente, si sfila il guanto sinistro, dito per dito, e lo posa sul bracciolo.",
      "«Sa qual è la cosa più ridicola, avvocato? Ho ucciso il figlio di Lionel per vendicare Lionel. Trentatré anni a guardarlo e a vedere Malcolm. Aveva il mento di suo padre. Il mento di Lionel. Lo vedevo ogni mattina, e vedevo un'altra cosa, perché un uomo mi aveva detto di vederla.»",
      "Guarda il dottore, finalmente. Lui è sceso dalla sua stanza e sta in piedi contro il muro, e piange senza rumore.",
      "«Bugiardi. Lui per tenermi. Lionel per punirmi. Julian per i soldi. Il prete per Dio, Helena per il prezzo.» Una pausa. «E io, avvocato. Io per prima.»",
      dead?"Ne mancava uno, di bugiardi. Ora non manca più: Reid è morto stanotte, prima che tu parlassi. Lady Agatha lo guarda sul letto con l'espressione di chi ha finito un ricamo.":"Kitty si fa il segno della croce. Sophia non distoglie lo sguardo. Reid scivola lungo il muro fino a sedersi per terra.",
      "La neve smise lunedì all'alba. L'ispettore arrivò da Exeter a mezzogiorno, con una slitta presa in prestito a Princetown. Lady Agatha lo aspettava nell'atrio, vestita di nero, i guanti in mano.",
      "Sul registro della prigione di Holloway, alla voce «segni particolari», un secondino scrisse una parola sola: mancina.",
      "Hai ricostruito l'intera catena. Una sola verità."]);
    if(score===2) return R("quasi","Quasi tutta la verità","Finale parzialmente corretto",[
      "Hai accusato Lady Agatha e hai spiegato quasi tutto. Il veleno, la vendetta, il sangue in cantina.",
      "Lei ti ha ascoltato fino in fondo, con le mani in grembo. «Complimenti, avvocato. Ha contato bene.» Un sorriso minimo. «Quasi.»",
      "Non ha aggiunto altro, né quella sera né mai.",
      dead?"Reid era già morto. Qualunque cosa sapesse, se l'è portata via.":"All'Old Bailey il dottor Reid giurò con le lacrime agli occhi che Julian era suo figlio. I giornali lo trovarono commovente. Lady Agatha, in aula, rise una volta sola.",
      "Ti resta una domanda che non ti lascia dormire: perché, sul muro, «bugiardi» era al plurale?",
      "Hai trovato l'assassina e quasi tutto il perché. Manca un filo. Rigioca per trovarlo."]);
    return R("parziale","La Vedova Nera di Dartmoor","Finale parzialmente corretto",[
      "Hai accusato Lady Agatha. Hai raccontato una storia: una moglie che uccide il marito, un amante complice, una scia di testimoni da eliminare.",
      "Lei ti ha lasciato finire. «Lei ha contato i morti, avvocato. Non si è mai chiesto perché.»",
      ans.lorenzo==="allegra_rinaldi"?"L'ispettore arrestò anche il dottor Reid, per l'omicidio di Sir Lionel. Lui non si difese. Forse pensava di meritarlo, per altre ragioni.":"I giornali di Londra la chiamarono «la Vedova Nera di Dartmoor». Il processo durò tre settimane.",
      "La storia ufficiale è quella che hai raccontato tu. È sbagliata quasi in ogni punto, tranne il nome.",
      "Hai preso l'assassina, ma non hai capito niente. Rigioca."]);
  }
  const W={
    rinaldi:[
      "Hai accusato il dottor Reid. Lui non ha nemmeno provato a difendersi: ha pianto, ha balbettato di un certificato firmato senza guardare, di una bugia lunga trent'anni. Sembrava una confessione. Lo hai chiuso a chiave nella sua stanza.",
      "Alle tre di notte la porta era ancora chiusa. Dentro, Reid aveva la gola tagliata. La chiave di riserva era nel mazzo della governante. Il mazzo era nella stanza di Lady Agatha.",
      "Avevi la chiave giusta in mano. Hai aperto la porta sbagliata."],
    sofia:[
      "Hai accusato Sophia Blake. Lei ha riso, una risata secca, poi ha aperto il medaglione e ti ha messo in mano la lettera di Julian. «Sì, lo odiavo. Mi arresti per questo.»",
      "L'avete chiusa nella sua stanza. All'alba di domenica il dottor Reid è stato trovato morto, mentre la porta di Sophia era ancora chiusa a chiave dall'esterno.",
      "La vendetta era una maschera, sì. Ma non quella che cercavi."],
    rina:[
      "Hai accusato Kitty Moore. La governante ti ha guardato come si guarda un temporale: senza sorpresa. «Io ho mentito, signore. Ma non per me.» Non ha detto per chi.",
      "Domenica mattina il dottor Reid non ha aperto la porta. La governante era chiusa in cucina, sorvegliata da te.",
      "Kitty lasciò Ravenscourt a febbraio, assolta. Non disse mai, nemmeno all'ispettore, per chi avesse mentito."]
  };
  const p=W[ans.who].slice();
  if(dead) p[1]="Reid era già morto. Ma la morte di un uomo non smette di essere un indizio: nessuno degli altri poteva entrare in quella stanza senza la chiave che teneva Lady Agatha.";
  p.push("Lunedì, quando la neve si fermò, l'ispettore di Exeter trovò nel messale di Lady Agatha una lettera indirizzata a un morto. Era troppo tardi.");
  return R("errato","La porta sbagliata","Finale errato",p);
};

        {id:"tazze",label:"Il vassoio del tè",clue:"e_tazze",text:"Il vassoio che MacRae ha portato alle 22:40, con una tazza. Ma le tazze sono due. La seconda ha il bordo dorato del vagone ristorante e, sul fondo, un deposito biancastro dall'odore acre e dolciastro."},
        {id:"corpo_g",label:"Il corpo",when:g=>locOf("graham")==="scomp4",text:"Sir Alastair è chino sul corpo e ti sbarra il passo con un sorriso. «Lasci fare a un medico, avvocato. Laudano, senza dubbio. Nessun segno di violenza.» Ti conviene tornare quando non c'è."},
        {id:"corpo",label:"Il corpo",clue:"e_ago",when:g=>locOf("graham")!=="scomp4",text:"Sollevi il lenzuolo dal fondo della cuccetta. I piedi nudi di Pell. Tra il quarto e il quinto dito del sinistro, un forellino minuscolo con un alone livido. Lyle trattiene il fiato. «Un'iniezione. Dove nessun medico di provincia guarderebbe mai.» Poi, piano: «Non lo dica a nessuno. Un segreto, in mano nostra, vale più di una prova.»"},
        {id:"macchina",label:"La macchina per scrivere",clue:"e_macchina",text:"Una portatile pieghevole americana, l'ultima novità. Nella custodia, tre lettere battute da Pell nei giorni scorsi: margini perfetti, battute uniformi, nessun errore. Mani da dattilografo."},
        {id:"cappotto",label:"Il cappotto appeso",clue:"e_nastro",text:"Un cappotto grigio, consumato ai polsi. All'occhiello, un nastrino azzurro: la Lega della Temperanza. Chi lo porta ha giurato di non toccare alcol."},
        {id:"taccuino",label:"Il taccuino sotto il cuscino",clue:"e_taccuino",text:"Un taccuino nero. L'ultima pagina, di ieri: «Martedì. G. sarà sul treno. Gli do tempo fino a Inverness: o rinuncia alla nomina, o il dossier va al Consiglio Medico.» Il dossier non è da nessuna parte."},
        {id:"lavabo",label:"Il lavabo",text:"Il lavabo pieghevole è asciutto, ma intorno allo scarico c'è un alone ambrato, appiccicoso. Qualcuno ci ha versato del whisky, o del laudano, o tutti e due."}]},
    scomp5:{name:"Scompartimento 5",mapName:"N. 5 · Margaret",crimeFrom:99,
      desc:["Lo scompartimento di Margaret Pell, accanto a quello del fratello. Un libro aperto sulla cuccetta, il segnalibro all'ultima pagina.","Margaret non è uscita di qui per tutta la mattina. Il libro è chiuso.","Il baule è pronto. Margaret non ha intenzione di scendere a Kingussie senza una risposta."],
      objects:[
        {id:"parete",label:"La parete divisoria",clue:"e_parete",text:"Bussi piano sulla parete che separa il 5 dal 4. Legno sottile, poco più di un'anta d'armadio. Lyle, dall'altra parte, apre il rubinetto del lavabo: lo senti scorrere come se fosse qui."},
        {id:"nastro_m",label:"Il baule di Margaret",text:"Un baule modesto. Sul coperchio, lo stesso nastrino azzurro della Lega della Temperanza. «Henry l'ha firmata a quindici anni», ti dice Margaret. «Io a dodici. Nostro padre beveva.»"},
        {id:"libro",label:"Il libro sulla cuccetta",text:"Un romanzo di Stevenson, con il segnalibro all'ultima pagina. Margaret l'ha finito stanotte. Era sveglia."}]},
    scomp7:{name:"Scompartimento 7",mapName:"N. 7 · Graham",crimeFrom:99,
      lock:g=>locOf("graham")==="scomp7"?"Sir Alastair è nel suo scompartimento. Ti apre, ti sorride, e ti richiude la porta con garbo. «Più tardi, avvocato. Mi sto radendo.»":null,
      desc:["Lo scompartimento di Sir Alastair, ordinato come una sala operatoria. Odore di acqua di colonia e di acido fenico.","Sir Alastair non c'è. La sua borsa è sotto la cuccetta.","I bagagli sono già chiusi, le etichette scritte: «Kingussie»."],
      objects:[
        {id:"borsa",label:"La borsa del chirurgo",clue:"e_borsa",text:"Una borsa di cuoio con le iniziali A. G. Bisturi, garze, una boccetta di cloralio idrato a metà. Un astuccio di morfina: sei alloggi, cinque fiale. E una siringa d'argento, pulita di fresco: odora ancora di acido fenico."},
        {id:"cappotto7",label:"Il cappotto da viaggio",clue:"e_lettera_g",text:"Un cappotto con il collo di astrakan. Nella tasca interna, una lettera piegata in quattro: «Saremo sullo stesso treno, scompartimento 4. Mi porti la sua risposta prima di Inverness. H. P.» Sir Alastair ha bruciato il dossier. Questa, se l'è dimenticata."},
        {id:"scarpe",label:"Le scarpe da sera",text:"Scarpe di vernice, lucidate. Un uomo che non è mai uscito dal salottino fumatori, stanotte, non dovrebbe avere il bordo delle suole macchiato di cenere grigia."},
        {id:"lavabo7",label:"Il lavabo",text:"Una saponetta all'acido fenico consumata quasi del tutto. Un chirurgo si lava le mani, certo. Ma questa saponetta era nuova ieri sera: lo dice la carta, ancora nel cestino."}]},
    dispensa:{name:"Dispensa del conduttore",mapName:"Dispensa",crimeFrom:99,
      desc:["La dispensa di MacRae: una stufetta di ghisa, un bollitore, stoviglie in fila. Qui si preparano tè e toddy per tutta la carrozza.","MacRae ha svuotato la stufa per accenderla di nuovo. Su un giornale, la cenere della notte.","La stufa è accesa. Il bollitore canta."],
      objects:[
        {id:"stufa",label:"La stufa",clue:"e_cenere",from:1,text:"Sul giornale steso da MacRae, la cenere della notte. La rigiri con un cucchiaino: un fermaglio d'ottone fuso a metà, e un lembo di carta risparmiato dal fuoco. «…registro operatorio, Ospedale di San Bartolomeo, 1909… undici decessi…» Il dossier di Henry Pell. Bruciato qui, a due passi dal suo cadavere."},
        {id:"registro_s",label:"Il tavolino di MacRae",text:"Il tè, lo zucchero, il whisky della compagnia, i limoni. Per un toddy servono tre minuti. MacRae l'ha preparato alle 23:25, su ordine di Sir Alastair."},
        {id:"stoviglie",label:"Le stoviglie",text:"Tazze bianche con lo stemma della ferrovia. Nessuna ha il bordo dorato: quelle stanno nel vagone ristorante."}]},
    ristorante:{name:"Carrozza ristorante",mapName:"Ristorante",crimeFrom:99,
      desc:["Tovaglie bianche, lampade dai paralumi rossi, il profumo del porridge. Fuori, la neve all'altezza dei finestrini.","I passeggeri si sono riuniti qui, dove fa più caldo. Si parla sottovoce.","È qui che riunirai tutti, quando sarà il momento."],
      objects:[
        {id:"servizio",label:"Il servizio da tè",clue:"e_servizio",text:"Le tazze dal bordo dorato, in fila sulla credenza. Ne conti undici: un posto è vuoto. Il cameriere giura che a cena erano dodici. «Le conto io, signore, ogni sera.»"},
        {id:"tavolo",label:"Il tavolo di Sir Alastair",text:"Il tavolo dove Sir Alastair ha cenato con Pell. Il cameriere ricorda che si sono parlati poco, e che Pell non ha toccato il vino: «Ha chiesto acqua, signore, come sempre.»"},
        {id:"menu",label:"Il menù della cena",text:"Zuppa di porri, salmone del Tay, budino. Un piatto onesto. Sir Alastair, ricorda il cameriere, ha lasciato la tavola alle 22:45 portando via una tazza di tè. «Ha detto che era per un amico.»"}]},
    fumatori:{name:"Salottino fumatori",mapName:"Fumatori",crimeFrom:99,
      desc:["Poltrone di cuoio, tappezzeria a quadri, un tavolino da gioco ancora coperto di carte. È qui che Sir Alastair ha costruito il suo alibi, mano dopo mano.","Sir Alastair e il capitano giocano di nuovo. Sir Alastair vince, e fischietta.","Il salottino è pieno di fumo e di attesa."],
      objects:[
        {id:"segnapunti",label:"Il segnapunti",clue:"e_segnapunti",text:"Un foglio a quadretti con i punti del whist, nella grafia militare del capitano Lennox. In alto: «Inizio 23:05.» In fondo: «Sir A. lascia all'1:15, va a letto.» L'alibi è perfetto: dalle 23:05 all'1:15. Ma chi ha detto che il delitto è avvenuto in quelle ore?"},
        {id:"posacenere",label:"Il posacenere",text:"Mozziconi di sigaro di Sir Alastair, tutti fumati fino in fondo. Un uomo calmo. O un uomo che ha bisogno di sembrarlo."},
        {id:"giornale",label:"Il giornale di Edimburgo",text:"Lo «Scotsman» di ieri. In terza pagina: «Sir Alastair Graham sarà nominato chirurgo di Sua Maestà la prossima settimana.» Qualcuno ha cerchiato l'articolo a matita."}]},
    locomotiva:{name:"La locomotiva",mapName:"Locomotiva",crimeFrom:99,
      desc:["Per arrivarci affondi nella neve fino alle ginocchia. Nella cabina, il fuoco della caldaia è basso: il macchinista Grant risparmia carbone e acqua.","Grant e il fochista spalano la neve davanti alle ruote. Inutilmente.","La caldaia è di nuovo in pressione. Grant guarda verso nord, dove arriverà il soccorso."],
      objects:[
        {id:"giornale_m",label:"Il giornale di macchina",text:"«23:40 fermi al km 71, neve alta un metro e mezzo. 00:30 ridotto riscaldamento carrozze. Linea del telegrafo interrotta.» Grant scrive come parla: poco e preciso."},
        {id:"manometri",label:"I manometri",text:"Pressione bassa, quanto basta per non far gelare la caldaia. Alle 00:30 il vapore alle carrozze è stato ridotto: da allora, nei corridoi, si gela."},
        {id:"forno",label:"La bocca del forno",text:"Il fuoco rosso della caldaia. Da qui, guardando indietro lungo il treno, si vedono i comignoli delle carrozze. Grant dice che li guarda per abitudine, di notte, per vedere chi tiene acceso."}]}
  },
  chars:{
    graham:{name:"Sir Alastair Graham",short:"Sir Alastair",mk:"AG",age:56,role:"Chirurgo, designato chirurgo di Sua Maestà",
      bio:"Il chirurgo più famoso di Londra. Affascinante, spiritoso, servizievole: si è offerto di aiutare l'indagine. Fischietta Gilbert e Sullivan. Tu sai che stanotte ha ucciso.",
      p:{},loc:["scomp4","fumatori","ristorante"],
      alibi:["«Dopo cena sono andato dritto al salottino fumatori. Non ho più visto il povero Henry dopo le dieci e mezza.»","«All'una e un quarto sono andato a letto e ho dormito come un sasso fino alle sette. Il whist mi stanca più di un'operazione.»","«Le ho già detto tutto, avvocato. Il capitano e il signor Cobb possono confermare ogni minuto.»"],
      crime:["«Laudano, senza dubbio. Nessun segno di violenza: l'ho esaminato io. È morto tra mezzanotte e l'una, direi.»","«Henry era un uomo fragile. Brillante, ma fragile. Lo dicevo sempre, a Londra.»","«Un suicidio, avvocato. Triste, ma semplice. Non lo complichi.»"],
      self:"«Trent'anni di bisturi. Ho operato duchi e lavandaie, con le stesse mani. La prossima settimana opererò il Re, se Dio vuole.»",
      others:"«Il capitano Lennox gioca male ma paga bene. Il signor Cobb vende macchine per scrivere a chi non sa scrivere. La signorina Pell è sconvolta, poverina: non le dia retta, in questi giorni.»",
      react:{
        e_biglietto:"«Le ultime parole di un uomo stanco. Le legga con rispetto, avvocato.»",
        e_toddy:"«Il toddy? L'aveva chiesto lui, povero Henry: non riusciva a dormire. L'ho ordinato io a MacRae, per gentilezza.»",
        e_orologio:"«Un orologio che si ferma? Si sarà dimenticato di caricarlo, sconvolto com'era.»",
        e_laudano:"«Pell soffriva d'insonnia da anni. Il laudano lo conosceva bene.»",
        e_tazze:{text:"Una pausa appena troppo lunga. «Due tazze? Avrà ricevuto qualcuno.» Sorride. «Non me, se è questo che pensa.»",press:1},
        e_borsa:{text:"«Ha frugato nella mia borsa? Che maleducazione.» Ride. «Cloralio e morfina: li trova nella borsa di qualunque medico d'Inghilterra.»",press:1},
        e_lettera_g:{text:"Per un istante il sorriso si irrigidisce. «Henry mi scriveva spesso. Voleva un posto a Londra, e io non potevo darglielo.»",press:1},
        e_cenere:{text:"«Carta bruciata in una stufa. Che cosa vuole che sia?» Non guarda il lembo di carta. Non lo guarda proprio.",press:1},
        e_segnapunti:"«Il mio alibi, se vuole chiamarlo così. Non che mi serva un alibi, per un suicidio.»",
        e_dattilo:{text:"«Due dita? Gli uomini disperati non battono a macchina come segretarie, avvocato.»",press:1},
        e_rito:{text:"«Abitudini da bambino. La sera in cui decidi di morire, non carichi l'orologio.» È una buona risposta. Ma per un attimo ha guardato l'orologio come si guarda un testimone.",press:1},
        e_porta:{text:"«La signorina Pell sente porte e fischi nel cuore della notte. Il dolore fa brutti scherzi.»",press:1},
        e_fischio:"«I Pirati di Penzance. Un'aria allegra. Mi fa compagnia in sala operatoria.»",
        e_nastro:{text:"«La Lega della Temperanza.» Si stringe nelle spalle. «I nastrini si portano. I giuramenti si rompono.»",press:1},
        e_fumo:{text:"«Fumo da un comignolo, in un treno. Che scoperta straordinaria.»",press:1},
        e_ago:{text:"Il colore gli scivola via dalla faccia, e torna. «Un'iniezione? Morfina, allora. Henry se la faceva da sé, lo sapevano tutti a Edimburgo.» Ma adesso sa che tu sai.",press:1}
      },
      def:["«Affascinante. Davvero affascinante, avvocato.»","«Non vedo il nesso, ma la ascolto con piacere.»","«Le serve altro? Il capitano mi aspetta per la rivincita.»"]},
    margaret:{name:"Margaret Pell",short:"Margaret",mk:"MP",age:34,role:"Sorella della vittima, maestra a Inverness",
      bio:"La sorella di Henry. Insegna a Inverness. Era venuta a prenderlo a Edimburgo per riportarlo a casa. Non crede al suicidio, e lo dice a tutti.",
      p:{},loc:["scomp5","ristorante","scomp5"],
      alibi:["«Ero qui, nel 5. Non dormo, non dormo da mesi. Ho letto tutta la notte.»","«Qui. Dove vuole che vada?»","«A preparare il baule. Henry tornava a casa. Torno io, al suo posto.»"],
      unlock:{crime1:"e_porta"},
      crime:["«Henry non si è ucciso. Henry aveva paura di una sola cosa al mondo: di diventare come nostro padre. Non avrebbe mai toccato un bicchiere.»","«Stanotte ho sentito delle cose. Non so se contano.» Esita. «Me lo chieda di nuovo, quando non sarò così stanca.»","«Se lei non lo dimostra, avvocato, nessuno lo farà. Sir Alastair è amico del Re.»"],
      self:"«Faccio la maestra. Insegno ai bambini a contare e a dire la verità. Una delle due cose mi riesce meglio.»",
      others:"«Sir Alastair è stato gentile con me, stamattina. Troppo gentile. Henry diceva che è l'uomo più pericoloso d'Inghilterra.»",
      react:{
        e_orologio:{text:"Margaret prende l'orologio tra le mani. «Fermo.» Lo guarda a lungo. «Henry lo caricava ogni sera alle undici in punto. Da quando aveva dieci anni. Non ha mai saltato una sera, nemmeno con la febbre.» Alza gli occhi. «Allora alle undici era già…»",unlock:"e_rito"},
        e_toddy:"«Whisky?» Ride, una risata amara. «Henry non ha bevuto una goccia in vita sua. Nostro padre è morto di whisky. Chi gli ha mandato quel bicchiere non lo conosceva affatto.»",
        e_biglietto:"«Battuto a macchina. Henry mi scriveva sempre a mano, a me. Sempre. Diceva che le macchine sono per gli estranei.»",
        e_nastro:"«Il nastrino azzurro. L'ha firmata a quindici anni, la Lega. Non se l'è mai tolto.»",
        e_parete:{text:"«Sì, si sente tutto.» Si porta una mano alla bocca. «Stanotte… verso l'una e venti. La porta di Henry si è aperta e chiusa. Ho sentito l'acqua del lavabo. E qualcuno che fischiettava piano, un motivetto allegro.» Ti guarda. «Henry non fischiava. Non ha mai fischiato in vita sua.»",unlock:"e_porta"},
        e_taccuino:"«G. È lui, vero? È Graham. Henry aveva lavorato quattro anni con lui, a Londra. Poi è tornato in Scozia e non dormiva più.»",
        e_cenere:"Legge il lembo di carta e le tremano le mani. «Undici. Henry diceva undici. Li chiamava per nome, la notte.»",
        e_ago:"«Un ago?» Impallidisce. «Henry aveva il terrore degli aghi. Si faceva vaccinare con gli occhi chiusi.» Poi, piano: «Non lo dirò a nessuno, se lei me lo chiede.»",
        e_fischio:"«I Pirati di Penzance.» Diventa bianca. «Era quella. Era quella l'aria.»"
      },
      def:["«Non so niente di questo.»","«Mi scusi. Non riesco a pensare.»","«Lo chieda a Sir Alastair. Lui ha sempre una risposta.»"]},
    macrae:{name:"Angus MacRae",short:"MacRae",mk:"MR",age:58,role:"Conduttore della carrozza letti",
      bio:"Trent'anni sui treni delle Highlands. Annota tutto nel suo registro. Ha trovato lui il corpo, alle 7:10. Si sente in colpa per aver dormito.",
      p:{},loc:["corridoio","dispensa","corridoio"],
      alibi:["«Ho servito il tè al 4 alle 22:40, il toddy l'ho lasciato fuori alle 23:30. All'una ho coperto la stufa e mi sono steso nel 3, che era vuoto. Mi vergogno, signore.»","«Qui, a pulire la stufa. Il riscaldamento è ridotto, bisogna tenere il tè caldo per i signori.»","«Sto preparando i bagagli dei signori che scendono a Kingussie.»"],
      crime:["«Il dottor Pell era vivo alle undici e mezza, signore. Il toddy l'ha preso lui: stamattina il bicchiere era dentro, vuoto.» Si gratta la testa. «Solo che non ha risposto, quando ho bussato.»","«Ho trovato una cosa nella cenere, stamattina. Gliela mostro, se vuole: è sul giornale, accanto alla stufa.»","«In trent'anni non mi era mai morto nessuno nella carrozza. Mai.»"],
      self:"«Trent'anni sulla linea. Ho portato il tè a due duchi e a un vescovo. Il vescovo dava le mance migliori.»",
      others:"«Sir Alastair è un vero signore: mi ha dato mezza corona per il toddy. Il capitano beve troppo. Il signor Cobb parla troppo. La signorina Pell non ha toccato la colazione.»",
      react:{
        e_toddy:"«Il toddy l'ha ordinato Sir Alastair, alle 23:20, passando dal salottino. Ha detto: il dottor Pell non riesce a dormire, gliene porti uno alle undici e mezza e lo lasci fuori, non lo disturbi.»",
        e_tazze:"«Due tazze? Io ne ho portata una sola, signore. Quella col bordo d'oro viene dal ristorante.»",
        e_cenere:"«L'ho trovato io, stamattina. All'una la stufa l'avevo coperta, ci avevo messo solo la brace. Carta non ne ho bruciata, signore. Non io.»",
        e_registro:"«Annoto tutto, signore. È il regolamento. E poi, alla mia età, la memoria fa scherzi.»",
        e_segnapunti:"«All'una e un quarto Sir Alastair è andato a letto, sì. Io dormivo già nel 3. Non ho sentito niente.»",
        e_fumo:"«Fumo all'una e mezza? Ma io la stufa l'avevo coperta all'una!» Si siede. «Allora qualcuno l'ha riaperta.»"
      },
      def:["«Non saprei, signore.»","«Lo chieda al capotreno. Io servo il tè.»","«Mi scusi, devo portare le coperte al 2.»"]},
    lennox:{name:"Cap. Hugh Lennox",short:"Lennox",age:44,role:"Ex ufficiale dei Fucilieri delle Highlands",
      bio:"Ex capitano, rumoroso, generoso con il whisky e con le opinioni. Ha giocato a whist con Sir Alastair per tutta la notte. È il suo alibi, e non lo sa.",
      p:{},loc:["fumatori","fumatori","fumatori"],
      alibi:["«Al salottino, dalle undici alle due. Whist col morto: io, Sir Alastair e quel chiacchierone di Cobb. Il segnapunti è sul tavolo.»","«Qui, a perdere a carte con Sir Alastair. Di nuovo.»","«Dove vuole che stia? Fuori ci sono due metri di neve.»"],
      unlock:{crime0:"e_mani"},
      crime:["«Sir Alastair è arrivato al tavolo alle undici e cinque, con le mani gelate, appena lavate. Sapevano di sapone da ospedale. Ho pensato: un chirurgo, che altro?»","«Un suicidio, dice Sir Alastair. Se lo dice lui.»","«In guerra ho visto morire tanta gente. Non ho mai visto un uomo uccidersi con calma, come dicono.»"],
      self:"«Fucilieri delle Highlands, vent'anni. Sudafrica, Sudan. Ora vendo cavalli a gente che non sa cavalcare.»",
      others:"«Sir Alastair gioca a whist come opera: senza un errore, e fischiettando. Cobb vende macchine per scrivere e parla come una mitragliatrice. La signorina Pell ha la spina dorsale di un sergente.»",
      react:{
        e_segnapunti:"«Il mio segnapunti. Tengo i conti come al reggimento: ora d'inizio, ora di fine. Sir Alastair è andato via all'una e un quarto, l'ho scritto.»",
        e_porta:{text:"«Un motivetto?» Si batte la fronte. «I Pirati di Penzance! Sir Alastair l'ha fischiettato tutta la sera, quella maledetta aria. Mi ha fatto impazzire.»",unlock:"e_fischio"},
        e_fischio:"«Ancora quell'aria. La sento anche adesso, dal salottino.»",
        e_toddy:"«Il toddy per Pell? Sì, Sir Alastair l'ha ordinato a MacRae verso le undici e venti. Ha detto: povero Henry, non dorme mai. Che cuore d'oro, ho pensato.»",
        e_tazze:"«Una tazza del ristorante? Sir Alastair ha lasciato la cena prima di noi, alle undici meno un quarto. È arrivato al tavolo alle undici e cinque.» Si ferma. «Venti minuti per prendere un sigaro.»",
        e_mani:"«Gelate. E arrossate, come se le avesse strofinate con la spazzola.»"
      },
      def:["«Non capisco niente di queste cose, io.»","«Ne parli con Sir Alastair: è lui il dottore.»","«Un goccio? No? Peggio per lei.»"]},
    cobb:{name:"Bertram Cobb",short:"Cobb",age:47,role:"Rappresentante di macchine per scrivere",
      bio:"Commesso viaggiatore di Glasgow, vende macchine per scrivere in tutta la Scozia. Parla senza sosta, e di macchine per scrivere sa tutto.",
      p:{},loc:["ristorante","fumatori","ristorante"],
      alibi:["«Whist col morto, signore, dalle undici fino alle due. Sir Alastair è andato via all'una e un quarto. Il capitano e io abbiamo continuato con una partita a due, che è come ballare da soli.»","«A giocare, a parlare, a vendere. Ho quasi convinto il capitano a comprare una portatile.»","«Qui. Sto scrivendo a mia moglie. A mano, che vergogna, per uno del mestiere.»"],
      crime:["«Una macchina per scrivere sul tavolino del morto, dicono. Una portatile americana! Mi piacerebbe vederla, sa. Per mestiere.»","«Il biglietto battuto a macchina, eh? Me lo faccia vedere, se vuole. Una macchina per scrivere parla, a chi la sa ascoltare.»","«Ci arrivi, avvocato. Io credo che lei ci arrivi.»"],
      self:"«Vent'anni a vendere macchine per scrivere. Batto ottanta parole al minuto a occhi chiusi. Mia moglie dice che è l'unica cosa che faccio a occhi chiusi.»",
      others:"«Sir Alastair è un gran signore, ma batte a macchina come un pollo che becca il granturco: l'ho visto una volta a Londra, a una fiera. Il capitano non compra niente. La signorina Pell mi fa pena.»",
      react:{

function goFull(){const d=document.documentElement,f=d.requestFullscreen||d.webkitRequestFullscreen;if(!f||isFull())return;try{const p=f.call(d);if(p&&p.catch)p.catch(()=>{})}catch(e){}}
function toggleFull(){if(isFull()){fullPref=false;const x=document.exitFullscreen||document.webkitExitFullscreen;try{const p=x&&x.call(document);if(p&&p.catch)p.catch(()=>{})}catch(e){}}else{fullPref=true;goFull();}}
document.addEventListener("pointerup",()=>{if(entered&&fullPref&&coarse()&&!isFull())goFull();if(entered)AU.init();});

/* ---------------- EFFETTI ---------------- */
function lightning(silent){const f=$("#flash");f.classList.remove("on");void f.offsetWidth;f.classList.add("on");const b=document.body;b.classList.add("lightning");setTimeout(()=>b.classList.remove("lightning"),150);setTimeout(()=>{b.classList.add("lightning");setTimeout(()=>b.classList.remove("lightning"),90)},280);if(!silent)setTimeout(()=>AU.sfx("thunder"),500+Math.random()*1100);}
(function sched(){setTimeout(()=>{if(G&&$("#game").classList.contains("on")&&!document.hidden)lightning();sched();},26000+Math.random()*40000);})();
let ambK=0;setInterval(()=>{if(!G||!AU.ctx||!AU.on||!$("#game").classList.contains("on"))return;ambK++;const r=G.room,rm=G.tab==="room";
  if(["salone","cucina"].includes(r)&&Math.random()<(rm?.5:.15))AU.sfx("crackle");
  if(r==="cantine"&&Math.random()<.05)AU.sfx("drip");
  if(["biblioteca","studio","sala_pranzo"].includes(r)&&ambK%4===0)AU.sfx("clk");
  if(r==="torretta"&&Math.random()<.006)AU.sfx("wind");
  if(/^camera/.test(r)&&Math.random()<.008)AU.sfx("creak");
  if(r==="cappella"&&Math.random()<.004)AU.sfx("creak");},260);
document.addEventListener("visibilitychange",()=>{if(!AU.ctx)return;document.hidden?AU.ctx.suspend():AU.ctx.resume();});
function shake(){document.body.classList.remove("shake");void document.body.offsetWidth;document.body.classList.add("shake");}

const coarse=()=>matchMedia("(pointer:coarse)").matches;

<div class="t-ui"><div class="t-kick">Racconti di delitto e deduzione</div><h1 class="t-logo">Cerchio Chiuso<em>misteri della nebbia e della brughiera</em></h1><div class="t-rule"></div>
<div id="tmenu">${started?menuHTML():`<div class="t-press">— Tocca per iniziare —</div>`}</div>
<div class="t-quote">«Eliminato l'impossibile, ciò che resta, per quanto improbabile, dev'essere la verità.»<span>Arthur Conan Doyle</span></div></div><div class="t-ver">Anno MCMXII</div>`;
  $("#title").onclick=started?null:startGame;}
function menuHTML(){const sv=loadSave(),st=sv&&!sv.ended&&STORIES.find(s=>s.id===sv.story&&!s.locked);let i=0;

function startGame(){if(started)return;started=true;entered=true;if(coarse()&&fullPref)goFull();AU.init();AU.music(true,"title");lightning(true);setTimeout(()=>AU.sfx("thunder"),300);
  $("#title").onclick=null;$("#tmenu").innerHTML=menuHTML();}
function showTitle(){closePanels();$("#game").classList.remove("on");$("#title").classList.add("on");buildTitle();snow(true);if(started)AU.music(true,"title");if(AU.ctx)AU.setRoom(null);}
function closePanels(){document.querySelectorAll(".panel.on").forEach(p=>p.classList.remove("on"));}
function openArchive(){const done=getDone(),sv=loadSave();AU.sfx("page");

function openOptions(){AU.sfx("page");const row=(t,sub,lab,on)=>`<div class="opt-row"><div>${t}${sub?`<small>${sub}</small>`:""}</div><button class="btn ink tog" onclick="${on};openOptions()">${lab}</button></div>`;

let fastText=false;try{fastText=localStorage.getItem("cc_fast")==="1"}catch(e){}
function wipeAll(){note("Cancellare tutto?",`<p>Verranno cancellati il salvataggio in corso e l'elenco dei casi risolti.</p><div class="row"><button class="btn red" onclick="try{localStorage.removeItem(SAVE);localStorage.removeItem(DONE);localStorage.removeItem(BEST);localStorage.removeItem(MED)}catch(e){};closeOv();closePanels();buildTitle()">Cancella</button><button class="btn ink" onclick="closeOv()">Annulla</button></div>`,true);}
function howTo(){note("Come si gioca",`<p>Ogni caso è diviso in <b>atti</b>. In ognuno hai un numero limitato di spostamenti: le candele accanto all'orologio. Ogni stanza raggiunta costa un quarto d'ora.</p>
<p>Nelle stanze, i <b>bagliori</b> indicano che cosa si può esaminare. Tocca le <b>sagome</b> per interrogare i presenti, e mostra loro i reperti del taccuino: le reazioni giuste aprono nuove piste.</p>

/* ---------------- FILMATO ---------------- */
let filmT=[],filmEnd=null;
function playFilm(shots,onDone){AU.init();AU.music(true,"title");
  const f=$("#film");f.innerHTML=`<div id="shots"></div><div class="bars"></div><div class="cap"><p id="capt"></p></div><button class="fskip" id="skipb">Salta ›</button>`;
  f.style.opacity="1";f.style.transition="";f.classList.add("on");document.body.classList.add("filming");
  let idx=-1,cur=null,ended=false,waiting=false;
  const T=(fn,ms)=>{const t=setTimeout(fn,ms);filmT.push(t);return t;};
  const clear=()=>{filmT.forEach(clearTimeout);filmT=[];};
  const finish=()=>{if(ended)return;ended=true;clear();f.style.transition="opacity 1.1s";f.style.opacity="0";AU.music(false);
    setTimeout(()=>{f.classList.remove("on");f.innerHTML="";document.body.classList.remove("filming");snow(false);onDone&&onDone();},1100);};
  filmEnd=finish;
  const next=()=>{clear();idx++;if(idx>=shots.length){finish();return;}const sh=shots[idx];
    const el=document.createElement("div");el.className="shot";
    el.innerHTML=`<div class="cam">${sh.img?`<img src="${artURL(sh.img)}" alt="">`:""}${sh.svg?sh.svg():""}${sh.svgBg?`<div style="position:absolute;inset:0;opacity:.35">${sh.svgBg()}</div>`:""}</div><div class="tint"></div>${sh.html||""}`;
    $("#shots").appendChild(el);const old=cur;cur=el;
    requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add("on")));
    if(old)setTimeout(()=>old.remove(),1500);
    if(sh.cam&&el.querySelector(".cam").animate)el.querySelector(".cam").animate([{transform:sh.cam[0]},{transform:sh.cam[1]}],{duration:sh.dur+1600,easing:"ease-in-out",fill:"forwards"});
    snow(!!sh.snow);
    const c=$("#capt");c.classList.remove("on");
    if(sh.cap)T(()=>{c.innerHTML=(sh.place?`<span class="place">${sh.place}</span>`:"")+sh.cap;c.classList.add("on");},sh.capAt||900);
    if(sh.cap2)T(()=>{c.classList.remove("on");T(()=>{c.innerHTML=sh.cap2;c.classList.add("on");},700);},sh.cap2At);
    T(()=>c.classList.remove("on"),sh.dur-700);
    if(sh.run)sh.run(el,T);
    if(sh.choice){waiting=true;T(()=>{c.classList.remove("on");const ch=document.createElement("div");ch.className="fchoice";ch.innerHTML=`<p>${sh.choice.prompt}</p>${sh.choice.opts.map((o,i)=>`<button data-i="${i}">${o.t}</button>`).join("")}<div class="fr" id="fr"></div>`;el.appendChild(ch);
      ch.onclick=e=>{e.stopPropagation();const b=e.target.closest("button");if(!b)return;const o=sh.choice.opts[+b.dataset.i];const fr=ch.querySelector("#fr");fr.textContent=o.r;fr.className="fr "+(o.ok?"ok":"no");AU.sfx(o.ok?"stamp":"tick");
        if(o.ok){ch.querySelectorAll("button").forEach(x=>x.disabled=true);b.classList.add("ok");T(()=>{waiting=false;next();},2900);}else{b.disabled=true;b.classList.add("no");}};},sh.capAt?sh.capAt+2600:3600);return;}
    T(next,sh.dur);};
  f.onclick=e=>{if(e.target.id==="skipb"){AU.sfx("page");finish();return;}if(ended||waiting)return;AU.init();next();};
  next();}
