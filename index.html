<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0807">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cerchio Chiuso">
<title>Cerchio Chiuso — Gialli d'epoca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=La+Belle+Aurore&family=Special+Elite&display=swap" rel="stylesheet">
<style>
/*
VOICE: un fascicolo vittoriano alla Conan Doyle, elegante e sanguinoso.
IDEA: le pagine dello Strand Magazine, un taccuino da detective, una bacheca di sughero.
PICTURE: stanze illustrate esplorabili, pianta a china, reperti disegnati.
COLOUR and TYPE: inchiostro e luce a gas, carta ingiallita, ottone, rosso sangue; IM Fell English.
LAYOUT: schermo intero, HUD con orologio da tasca, scena in alto, testo sotto.
*/
:root{--ink:#0b0807;--paper:#ece0c4;--paper2:#d3c09a;--sepia:#2b1d10;--muted:#8f826e;--gold:#c9a45c;--gold2:#ecd29a;--blood:#8a1414;--blood2:#c0392b;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
--noise:none}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html,body{height:100%;background:var(--ink);color:var(--paper);font-family:'EB Garamond',Georgia,serif;font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
b{font-weight:600}
#snow{position:fixed;inset:0;pointer-events:none;z-index:41;transition:opacity 1.2s}
body.filming #snow{z-index:52}
#grain{position:fixed;inset:0;pointer-events:none;z-index:60;background-image:var(--noise);opacity:.05}
#vig{position:fixed;inset:0;pointer-events:none;z-index:59;background:radial-gradient(ellipse at 50% 45%,transparent 58%,rgba(0,0,0,.5))}
#flash{position:fixed;inset:0;pointer-events:none;z-index:58;background:#dfe8ff;opacity:0}
#flash.on{animation:fl 1s}
@keyframes fl{0%{opacity:0}5%{opacity:.5}10%{opacity:.04}17%{opacity:.36}30%{opacity:0}100%{opacity:0}}
#fade{position:fixed;inset:0;background:#000;z-index:55;opacity:0;pointer-events:none;transition:opacity .35s}
#fade.on{opacity:1;pointer-events:all}
.shake{animation:shake .55s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.screen{position:fixed;inset:0;z-index:5;display:none;flex-direction:column}
.screen.on{display:flex}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 18px;border:1px solid var(--gold);color:var(--gold2);background:linear-gradient(#3a2a1c,#1c140d);font-family:'IM Fell English SC',serif;font-size:1.02rem;letter-spacing:.1em;box-shadow:inset 0 1px 0 rgba(255,220,150,.18),0 3px 8px rgba(0,0,0,.5);transition:filter .2s,transform .1s}
.btn:hover{filter:brightness(1.25)}.btn:active{transform:translateY(1px)}
.btn.red{border-color:#c0392b;color:#f6d6cc;background:linear-gradient(#6a1616,#300909)}
.btn.ink{border-color:#2b1d10;color:var(--gold2);background:linear-gradient(#3a2818,#1f150c)}
.btn.sm{min-height:34px;padding:5px 12px;font-size:.88rem;margin-top:8px}
.btn.big{width:100%;padding:14px;font-size:1.2rem;margin-top:6px}
.btn:disabled{opacity:.35;cursor:default;filter:none}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.row.c{justify-content:center}
.muted{color:var(--muted)}.center{text-align:center}.small{font-size:.9rem;font-style:italic;color:#6a5a44}

/* ----- SCHERMATA DEL TITOLO: lo studio dell'investigatore, di notte ----- */
#title{background:#0b0705;overflow:hidden;touch-action:none;--lx:44%;--ly:60%;--lr:400px}
.t-bg{position:absolute;inset:0}
.t-bg img{width:100%;height:100%;object-fit:cover;display:block}
.t-rain{position:absolute;z-index:1;pointer-events:none;overflow:hidden;opacity:.45}
.t-rain:before{content:'';position:absolute;inset:-100% -20% 0;background:repeating-linear-gradient(103deg,transparent 0 11px,rgba(180,200,220,.5) 11px 12px,transparent 12px 29px),repeating-linear-gradient(98deg,transparent 0 23px,rgba(180,200,220,.3) 23px 24px,transparent 24px 41px);background-size:100% 120px,100% 90px;animation:tRain .5s linear infinite;will-change:transform}
@keyframes tRain{from{transform:translateY(0)}to{transform:translateY(50%)}}
.t-glow{position:absolute;left:calc(var(--lx) - var(--lr));top:calc(var(--ly) - var(--lr));width:calc(var(--lr)*2);height:calc(var(--lr)*2);pointer-events:none;background:radial-gradient(circle,rgba(255,196,110,.2),rgba(255,170,80,.06) 45%,transparent 70%);will-change:opacity;animation:glow 3.4s infinite alternate ease-in-out}
.t-dust{position:absolute;inset:-10% 0;pointer-events:none;opacity:.5;will-change:transform;background:radial-gradient(1.5px 1.5px at 22% 40%,#ffe9c088,transparent),radial-gradient(1px 1px at 38% 62%,#ffe9c077,transparent),radial-gradient(1.5px 1.5px at 51% 30%,#ffe9c066,transparent),radial-gradient(1px 1px at 47% 75%,#ffe9c088,transparent),radial-gradient(1px 1px at 30% 52%,#ffe9c066,transparent);animation:dust 30s linear infinite}
.t-shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 36%,rgba(9,6,4,.72) 58%,rgba(9,6,4,.94) 80%),linear-gradient(0deg,rgba(9,6,4,.9),transparent 34%)}
/* lente */
.t-lens{position:absolute;left:0;top:0;width:184px;height:184px;z-index:4;pointer-events:none;opacity:0;transition:opacity .35s}
.t-lens.on{opacity:1}
.t-glass{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:#140c08;box-shadow:0 0 0 7px #b8935a,0 0 0 9px #6a4a22,0 0 0 11px #2a1a0c,0 16px 34px rgba(0,0,0,.7)}
.t-glass svg{display:block;width:100%;height:100%}
.t-glass:after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.3),rgba(255,255,255,.06) 22%,transparent 40%),radial-gradient(circle,transparent 62%,rgba(0,0,0,.35) 100%)}
.t-handle{position:absolute;left:50%;top:calc(100% + 9px);width:16px;height:70px;margin-left:-8px;border-radius:3px 3px 8px 8px;background:linear-gradient(90deg,#24120a,#6a3e1e 45%,#2a160a);transform-origin:50% calc(var(--R,92) * -1px - 9px);transform:rotate(-40deg);transition:transform .35s}
.t-handle:before{content:'';position:absolute;left:-2px;right:-2px;top:0;height:12px;border-radius:2px;background:linear-gradient(90deg,#6a4a22,#e0c080 45%,#6a4a22)}
.t-lens.down .t-handle{transform:none;height:48px}
.t-lens .tag{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);white-space:nowrap;font-family:'IM Fell English SC',serif;letter-spacing:.18em;font-size:.66rem;color:#f0dcae;background:rgba(10,6,3,.75);padding:3px 10px;animation:tPulse 2.4s infinite}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.t-toc{font-family:'IM Fell English SC',serif;letter-spacing:.24em;font-size:.64rem;color:#a88a58;margin-bottom:2px}
@keyframes tPulse{0%,100%{opacity:.55}50%{opacity:1}}
/* il frontespizio */
.t-panel{position:absolute;z-index:3;right:clamp(18px,6vw,100px);top:50%;transform:translateY(-50%);width:min(440px,42vw);max-height:calc(100% - 32px - var(--st) - var(--sb));overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:none;color:#eadcbe;animation:tIn 1.4s .2s both}
.t-panel::-webkit-scrollbar{display:none}
.t-kick{font-family:'IM Fell English SC',serif;letter-spacing:.28em;font-size:.7rem;color:#c9a45c}
.t-logo{font-family:'IM Fell English',serif;font-weight:400;font-size:clamp(2.5rem,5.4vw,3.8rem);line-height:.95;color:#f3e6c8;margin:8px 0 0;white-space:nowrap;text-shadow:0 2px 18px rgba(0,0,0,.9)}
.t-logo em{display:block;font-style:italic;font-size:.3em;letter-spacing:.06em;color:#b9a27c;margin-top:10px}
.t-orn{display:block;width:180px;height:16px;margin:14px 0 10px;opacity:.9}
.t-press{font-family:'IM Fell English SC',serif;letter-spacing:.22em;color:#e0b870;font-size:.92rem;padding:10px 0;animation:tPulse 2.6s infinite}
.t-menu{display:flex;flex-direction:column}
.t-menu button{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;font-family:'IM Fell English',serif;font-size:clamp(1.15rem,2.2vw,1.38rem);color:#eadcbe;padding:7px 0;opacity:0;animation:rise .6s forwards;transition:color .2s}
.t-menu .tm-l{flex:0 1 auto}.t-menu .tm-d{flex:1;border-bottom:1px dotted rgba(201,164,92,.35);transform:translateY(-5px);min-width:16px}
.t-menu .tm-p{font-family:'IM Fell English SC',serif;font-size:.78em;color:#a88a58;min-width:1.6em;text-align:right}
.t-menu button:hover,.t-menu button:focus-visible{color:#f0c878;outline:none}
.t-menu button.main{color:#f0c070}
.t-menu small{display:block;font-family:'EB Garamond',serif;font-style:italic;font-size:.84rem;color:rgba(234,220,190,.5);margin:-5px 0 3px}
/* la citazione */
.t-quote{position:absolute;z-index:3;left:clamp(18px,4vw,60px);bottom:calc(clamp(16px,4vh,36px) + var(--sb));width:min(430px,44vw);color:#eadcbe;cursor:pointer;touch-action:manipulation;animation:tIn 1.4s .9s both}
.t-quote .ck{font-family:'IM Fell English SC',serif;letter-spacing:.24em;font-size:.6rem;color:#a88a58;display:flex;gap:10px;align-items:center;margin-bottom:8px}
.t-quote .ck:after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(201,164,92,.5),transparent)}
#tquoteq{transition:opacity .45s}#tquoteq.out{opacity:0}
.t-quote .qt{font-family:'IM Fell English',serif;font-style:italic;font-size:1.08rem;line-height:1.4;text-shadow:0 1px 8px #000}
.t-quote .qa{font-family:'IM Fell English SC',serif;letter-spacing:.14em;font-size:.78rem;color:#c9a45c;margin-top:6px}
.t-quote .qs{font-style:italic;font-size:.76rem;color:rgba(234,220,190,.45)}
#title.out .t-panel,#title.out .t-quote{transition:opacity .8s;opacity:0}
/* telefono e tablet in verticale: scena sopra, frontespizio sotto */
@media(orientation:portrait){
  .t-shade{background:linear-gradient(180deg,rgba(9,6,4,.88) 0,rgba(9,6,4,.4) 11%,transparent 19%,transparent 46%,rgba(9,6,4,.86) 57%,#090604 68%)}
  .t-panel{left:0;right:0;top:auto;bottom:0;transform:none;width:auto;max-width:520px;margin:0 auto;max-height:50%;padding:0 22px calc(14px + var(--sb))}
  .t-kick{text-align:center;font-size:.58rem}.t-logo{text-align:center;font-size:2.2rem;margin-top:4px}.t-logo em{margin-top:5px}.t-orn{margin:8px auto 4px;width:150px}.t-toc{display:none}
  .t-press{text-align:center}
  .t-menu button{font-size:1.12rem;padding:5px 0}.t-menu small{font-size:.78rem;margin:-4px 0 2px}
  .t-quote{left:20px;right:20px;width:auto;top:calc(12px + var(--st));bottom:auto;text-align:center;max-width:520px;margin:0 auto}
  .t-quote .ck{display:none}.t-quote .qt{font-size:.94rem;line-height:1.32}.t-quote .qa{font-size:.7rem;margin-top:3px}.t-quote .qs{display:none}}
/* telefono in orizzontale: tutto più compatto */
@media(orientation:landscape) and (max-height:520px){
  .t-panel{width:min(360px,44vw);right:14px;max-height:calc(100% - 16px)}
  .t-kick{font-size:.58rem}.t-logo{font-size:2rem;margin-top:2px}.t-logo em{margin-top:4px}.t-orn{margin:6px 0 2px;width:140px}
  .t-menu button{padding:2px 0;font-size:1.02rem}.t-menu small{display:none}
  .t-quote{width:min(330px,42vw);left:14px;bottom:10px}.t-quote .ck{display:none}.t-quote .qt{font-size:.86rem}.t-quote .qs{display:none}}

/* ----- PANNELLI (archivio, opzioni) ----- */
.panel{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;background:rgba(4,5,7,.94);overflow-y:auto;padding:calc(22px + var(--st)) 16px calc(30px + var(--sb))}
.panel.on{display:flex;animation:tIn .45s ease}
.p-head{max-width:980px;width:100%;margin:0 auto 22px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid rgba(201,164,92,.35);padding-bottom:12px}
.p-head h2{font-family:'IM Fell English',serif;font-weight:400;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1}
.p-head p{font-style:italic;color:var(--muted);font-size:.95rem;margin-top:4px}
.p-back{font-family:'IM Fell English SC',serif;letter-spacing:.14em;color:var(--gold);font-size:.95rem;padding:8px 2px;flex:0 0 auto}
.issues{max-width:980px;width:100%;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}
.issue{position:relative;background:#e9dcbc;background-image:var(--noise);background-blend-mode:multiply;color:var(--sepia);box-shadow:0 18px 40px rgba(0,0,0,.6);display:flex;flex-direction:column;animation:rise .6s both}
.issue:nth-child(2){animation-delay:.1s}.issue:nth-child(3){animation-delay:.2s}
.is-mast{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px 6px;border-bottom:2px solid #2b1d10;margin:0 10px}
.is-mast b{font-family:'IM Fell English SC',serif;font-weight:400;font-size:1.05rem;letter-spacing:.12em}
.is-mast span{font-family:'IM Fell English SC',serif;font-size:.7rem;letter-spacing:.14em;color:#6a5236}
.is-art{margin:10px 10px 0;aspect-ratio:16/10;overflow:hidden;background:#0b0d12;border:1px solid #2b1d10;position:relative}
.is-art img{width:100%;height:100%;object-fit:cover;display:block;filter:sepia(.35)}
.is-art .plate{position:absolute;left:0;right:0;bottom:0;padding:16px 10px 6px;background:linear-gradient(transparent,rgba(0,0,0,.8));color:#e9dcbc;font-style:italic;font-size:.82rem;text-align:center}
.is-body{padding:12px 16px 16px;flex:1;display:flex;flex-direction:column}
.is-num{font-family:'IM Fell English SC',serif;letter-spacing:.22em;font-size:.74rem;color:var(--blood)}
.is-body h3{font-family:'IM Fell English',serif;font-weight:400;font-size:1.65rem;line-height:1.05;margin:3px 0}
.is-yr{font-style:italic;color:#6a5236;font-size:.93rem}
.is-bl{margin:8px 0 12px;font-size:.98rem;color:#3b2a1a;flex:1}
.is-best{font-family:'IM Fell English SC',serif;letter-spacing:.1em;font-size:.8rem;color:#6a5236;margin:-4px 0 10px}.is-best b{color:var(--blood);font-size:1rem}
.is-acts{display:flex;gap:8px;flex-wrap:wrap}
.issue .stamp{position:absolute;right:16px;top:58px;transform:rotate(8deg);font-family:'IM Fell English SC',serif;border:2px solid #8a1414;color:#8a1414;background:rgba(233,220,188,.85);padding:2px 8px;font-size:.74rem;letter-spacing:.14em;z-index:2}
.issue.locked{filter:grayscale(.8) brightness(.55)}
.opts{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px}
@media(max-width:600px){.p-head{flex-direction:column-reverse;align-items:flex-start}.t-kick{letter-spacing:.24em}}
.opt-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid rgba(201,164,92,.2);font-size:1.08rem}
.opt-row small{display:block;color:var(--muted);font-style:italic;font-size:.85rem}
.tog{min-width:92px}

/* ----- FILMATO ----- */
#film{position:fixed;inset:0;z-index:50;background:#000;display:none;overflow:hidden;cursor:pointer}
#film.on{display:block}
.shot{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease}
.shot.on{opacity:1}
.shot .cam{position:absolute;inset:0;will-change:transform}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot .tint{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.85));pointer-events:none}
.bars:before,.bars:after{content:'';position:absolute;left:0;right:0;height:9vh;background:#000;z-index:5}
.bars:before{top:0}.bars:after{bottom:0}
.cap{position:absolute;left:0;right:0;bottom:calc(11vh + var(--sb));z-index:6;text-align:center;padding:0 22px;pointer-events:none}
.cap p{display:inline-block;max-width:760px;font-family:'IM Fell English',serif;font-size:clamp(1.2rem,3.6vw,1.75rem);line-height:1.3;color:#f1e6cc;text-shadow:0 2px 10px #000,0 0 30px #000;opacity:0;transform:translateY(8px);transition:opacity 1s,transform 1s}
.cap p.on{opacity:1;transform:none}
.cap .place{display:block;font-family:'IM Fell English SC',serif;letter-spacing:.34em;font-size:.55em;color:var(--gold2);margin-bottom:6px}
.fskip{position:absolute;right:14px;top:calc(9vh + 10px + var(--st));z-index:7;font-family:'IM Fell English SC',serif;letter-spacing:.2em;font-size:.82rem;color:rgba(236,210,154,.75);border:1px solid rgba(201,164,92,.45);padding:7px 12px;background:rgba(0,0,0,.35)}
.tele{position:absolute;left:50%;top:50%;width:min(560px,86vw);transform:translate(-50%,-52%) rotate(-2deg);background:#efe3c2;background-image:var(--noise);background-blend-mode:multiply;color:#2b1d10;padding:18px 20px 22px;box-shadow:0 30px 60px rgba(0,0,0,.8);z-index:3}
.tele .th{font-family:'IM Fell English SC',serif;text-align:center;letter-spacing:.2em;font-size:.85rem;border-bottom:1px solid #8a7a5a;padding-bottom:6px;margin-bottom:10px}
.tele .tb{font-family:'Special Elite',monospace;font-size:clamp(.82rem,2.6vw,1.02rem);line-height:1.65;white-space:pre-wrap;min-height:9.5em}
.tele .ts{text-align:right;font-family:'Special Elite',monospace;font-size:.8rem;margin-top:8px;color:#6a5236}
.clockface{position:absolute;left:50%;top:44%;width:min(46vh,70vw);aspect-ratio:1;transform:translate(-50%,-50%);z-index:3}
.film-title{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.film-title .k{font-family:'IM Fell English SC',serif;letter-spacing:.5em;color:var(--gold);font-size:.85rem;opacity:0;animation:rise 1.6s .4s forwards}
.film-title h1{font-family:'IM Fell English',serif;font-weight:400;font-size:clamp(2.6rem,9vw,5rem);line-height:.95;color:#f1e6cc;margin:14px 0;opacity:0;animation:rise 2s .9s forwards}
.film-title .orn{opacity:0;animation:rise 1.6s 1.6s forwards}
.redflash{position:absolute;inset:0;background:#7a0808;mix-blend-mode:multiply;opacity:0;z-index:4;pointer-events:none}
.redflash.on{animation:rf 1.6s}
@keyframes rf{0%{opacity:0}8%{opacity:.85}100%{opacity:0}}

/* ----- GIOCO ----- */
#game{background:#0b0807}
.hud{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:calc(6px + var(--st)) 8px 6px;background:linear-gradient(#1c130d,#0d0907);border-bottom:1px solid rgba(201,164,92,.35);position:relative;z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.6)}
.ib{width:42px;height:42px;display:grid;place-items:center;color:var(--gold);flex:0 0 auto}.ib svg{width:24px;height:24px}
.hud .ttl{flex:1;min-width:0}
.hud .act{font-family:'IM Fell English SC',serif;font-size:.7rem;letter-spacing:.08em;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .rm{font-family:'IM Fell English',serif;font-size:1.18rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.watch{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.watch .w{width:42px;height:42px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.watch .tm{font-family:'Special Elite',monospace;font-size:.8rem;color:var(--paper2);text-align:center;line-height:1}
.cands{display:flex;gap:1px;align-items:flex-end;height:24px}.cands svg{width:7px;height:24px}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
.wrap{max-width:1040px;margin:0 auto;padding-bottom:28px}
.nav{flex:0 0 auto;display:flex;background:linear-gradient(#140e0a,#090605);border-top:1px solid rgba(201,164,92,.35);padding-bottom:var(--sb);position:relative;z-index:6}
.nav button{flex:1;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:'IM Fell English SC',serif;font-size:.74rem;letter-spacing:.06em;color:var(--muted);position:relative;min-height:56px}
.nav button svg{width:26px;height:26px;opacity:.6;transition:transform .25s,opacity .25s}
.nav button.on{color:var(--gold2)}.nav button.on svg{opacity:1;transform:translateY(-2px)}
.nav .dot{position:absolute;top:7px;left:calc(50% + 9px);width:9px;height:9px;border-radius:50%;background:var(--blood2);box-shadow:0 0 10px var(--blood2)}
.nav button.bump svg{animation:bump .55s}@keyframes bump{40%{transform:scale(1.45) rotate(-10deg)}}

/* scena */
.scene{position:relative;width:100%;aspect-ratio:16/9;max-height:62vh;background:#000;overflow:hidden;border-bottom:1px solid rgba(201,164,92,.35)}
@media(max-width:700px){.scene{aspect-ratio:4/3.15}}
.scn{position:absolute;inset:0;width:100%;height:100%}
.scn *,#chap .ch-art svg *{animation:none!important}
.scene .scn{animation:scnIn .7s ease}
@keyframes scnIn{from{opacity:0}to{opacity:1}}
.scene .glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 60% 70% at 50% 60%,rgba(255,170,80,.10),transparent 70%);will-change:opacity;animation:glow 3.2s infinite alternate ease-in-out}
@keyframes glow{0%{opacity:.4}35%{opacity:1}55%{opacity:.55}80%{opacity:.9}100%{opacity:.7}}
.scene .dust{position:absolute;inset:-10% 0;pointer-events:none;opacity:.5;will-change:transform;background:radial-gradient(1px 1px at 12% 30%,#fff8,transparent),radial-gradient(1px 1px at 33% 70%,#fff6,transparent),radial-gradient(1.5px 1.5px at 58% 22%,#fff5,transparent),radial-gradient(1px 1px at 76% 64%,#fff7,transparent),radial-gradient(1.5px 1.5px at 90% 38%,#fff4,transparent),radial-gradient(1px 1px at 46% 48%,#fff6,transparent);animation:dust 24s linear infinite}
@keyframes dust{from{transform:translate3d(0,0,0)}to{transform:translate3d(-3%,-9%,0)}}
.hots{position:absolute;inset:0;pointer-events:none}
.hs{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;pointer-events:auto;border-radius:50%}
.hs i{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:1.5px solid rgba(255,226,160,.9);will-change:transform,opacity;animation:ring 2.2s infinite}
.hs b{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;background:#fff4d6;clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);will-change:transform,opacity;animation:gl 2.2s infinite ease-in-out;filter:none}
.hs.seen i,.hs.seen b{display:none}
.hs.seen:after{content:'';position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:rgba(233,220,192,.4)}
.hot,.fig{cursor:pointer}.fig:hover .fbody{fill:#2a1c12}
.fname{font-family:'IM Fell English SC',serif;font-size:14px;fill:#ecd29a;letter-spacing:1px;paint-order:stroke;stroke:#000;stroke-width:4px}
.sfall{animation:sfall linear infinite}@keyframes sfall{to{transform:translateY(130px)}}
.flick{animation:flick 2.8s infinite}@keyframes flick{0%{opacity:.85}18%{opacity:1}30%{opacity:.72}46%{opacity:.95}62%{opacity:.8}80%{opacity:1}100%{opacity:.88}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flame .45s infinite alternate ease-in-out}.flame.b{animation-duration:.33s;animation-delay:-.15s}
@keyframes flame{from{transform:scale(1,1) skewX(-3deg)}to{transform:scale(.92,1.14) skewX(3deg)}}
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:br 4.6s infinite ease-in-out}@keyframes br{50%{transform:scale(1.006,1.016)}}
.glint{transform-box:fill-box;transform-origin:center;animation:gl 2.2s infinite ease-in-out}@keyframes gl{0%,100%{opacity:.25;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.2s infinite}@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.8);opacity:0}}
.drip{transform-box:fill-box;transform-origin:50% 0;animation:drip 5s ease-in both}@keyframes drip{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.steam{animation:smoke 3s ease-in-out infinite alternate}
.lightning .winsky{fill:#e8f0ff!important}
.roomtxt{padding:16px 16px 0}
.plaque{display:flex;align-items:center;gap:12px;justify-content:center;margin:2px 0 8px}
.plaque h2{font-family:'IM Fell English SC',serif;font-weight:400;font-size:1.75rem;letter-spacing:.07em;text-align:center;line-height:1.1}
.plaque .fl{flex:1;max-width:160px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}.plaque .fl.r{background:linear-gradient(90deg,var(--gold),transparent)}
.desc{color:var(--paper2);font-size:1.06rem;max-width:66ch;margin:0 auto;text-align:center;font-style:italic}
.sect{font-family:'IM Fell English SC',serif;font-size:.82rem;letter-spacing:.2em;color:var(--gold);margin:20px 0 10px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:820px;margin:0 auto}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border:1px solid rgba(201,164,92,.4);background:rgba(255,240,210,.035);font-size:1rem;min-height:42px;transition:background .2s}
.chip:hover{background:rgba(201,164,92,.14)}
.chip.seen{opacity:.5}.chip .gl{color:var(--gold2);display:inline-flex}
.chip.pers{padding:4px 14px 4px 5px}.chip .pf{width:32px}.chip .pf svg{display:block;width:100%}
.warnbar{margin:18px auto 0;max-width:640px;padding:10px 12px;border-left:3px solid var(--blood2);background:rgba(138,20,20,.18);font-size:.97rem;font-style:italic}

/* mappa */
.plan{margin:16px auto;width:calc(100% - 24px);max-width:560px;background-image:var(--noise),radial-gradient(ellipse at 30% 20%,#f0e3c4,#dbc69c 70%,#bea478);background-blend-mode:multiply;box-shadow:0 20px 44px rgba(0,0,0,.75),inset 0 0 60px rgba(90,60,20,.45);color:var(--sepia);padding:12px 10px 10px;transform:rotate(-.4deg);animation:planIn .6s ease}
@keyframes planIn{from{opacity:0;transform:rotate(-3deg) scale(.96)}to{opacity:1;transform:rotate(-.4deg)}}
.plan svg{width:100%;display:block}.plan text{font-family:'IM Fell English',serif;fill:#3b2a1a}
.plan .rm{cursor:pointer}.plan .rm:hover .wall{fill:rgba(138,20,20,.12)}
.pin{transition:transform .75s cubic-bezier(.5,0,.3,1)}
.legend{font-style:italic;font-size:.88rem;color:#5a4428;text-align:center;margin-top:4px}

/* taccuino */
.journal{margin:16px auto;width:calc(100% - 20px);max-width:780px;background:linear-gradient(#3a2416,#24160d);padding:12px 10px 12px 14px;border-radius:4px 8px 8px 4px;box-shadow:0 20px 44px rgba(0,0,0,.75),inset 4px 0 0 #1a0f08}
.ribbons{display:flex;gap:6px;margin:-2px 0 10px;flex-wrap:wrap}
.ribbons button{background:#6a1616;color:#f3d0c6;font-family:'IM Fell English SC',serif;padding:7px 12px 13px;font-size:.9rem;letter-spacing:.06em;clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%)}
.ribbons button.on{background:var(--gold);color:var(--sepia)}
.pg{background-image:var(--noise),repeating-linear-gradient(#efe4c8 0 27px,#cdbd96 27px 28px);background-color:#efe4c8;background-blend-mode:multiply;color:var(--sepia);padding:14px 14px 22px 30px;position:relative;min-height:58vh;box-shadow:inset 10px 0 20px rgba(80,50,20,.28)}
.pg:before{content:'';position:absolute;left:20px;top:0;bottom:0;width:1px;background:#c0392b;opacity:.45}
.hand{font-family:'La Belle Aurore',cursive;font-size:1.15rem;color:#1f2a4a;line-height:1.75}
.jsect{font-family:'IM Fell English SC',serif;letter-spacing:.18em;color:var(--blood);font-size:.85rem;margin:14px 0 2px}
.entry{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed rgba(59,42,26,.3);cursor:pointer;animation:entryIn .4s both}
@keyframes entryIn{from{opacity:0;transform:translateX(-8px)}}
.entry .th{width:96px;flex:0 0 96px;border:3px solid #fff8e6;box-shadow:0 2px 6px rgba(0,0,0,.35);transform:rotate(-2deg);background:#000;align-self:flex-start}.entry .th svg{width:100%;display:block}
.entry h4{font-family:'IM Fell English',serif;font-weight:400;font-size:1.18rem;line-height:1.1}
.entry p{font-size:.95rem;color:#3b2a1a;margin-top:2px}
.entry.new h4:after{content:' ✦';color:var(--blood2)}
.dossier{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed rgba(59,42,26,.3)}
.dossier .pf{width:76px;flex:0 0 76px}.dossier .pf svg{width:100%;display:block}
.dossier.dead .pf{filter:grayscale(1) brightness(.85)}
.dossier h4{font-family:'IM Fell English',serif;font-weight:400;font-size:1.25rem;line-height:1.1}
.dossier .role{font-style:italic;color:#6a5a44;font-size:.92rem}.dossier p{font-size:.95rem;margin-top:3px}
.dossier .st{font-family:'IM Fell English SC',serif;font-size:.78rem;letter-spacing:.12em;margin-top:4px;color:#4a6a3a}.dossier .st.d{color:var(--blood)}

/* bacheca */
.court{max-width:820px;margin:0 auto;padding:16px 12px 0}
.cork{position:relative;margin:16px 10px;padding:22px 12px 26px;background-image:var(--noise),radial-gradient(circle at 30% 30%,#a8804f,#7a5532);background-blend-mode:multiply;border:11px solid #3a2414;box-shadow:0 14px 30px rgba(0,0,0,.6),inset 0 0 34px rgba(0,0,0,.45)}
.cork svg.str{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.tcard{position:relative;z-index:1;background-image:var(--noise);background-color:#f1e7cf;background-blend-mode:multiply;color:var(--sepia);padding:14px 14px 12px;max-width:440px;margin:0 auto 22px;box-shadow:0 6px 14px rgba(0,0,0,.45);transform:rotate(-1deg)}
.tcard h3{font-family:'IM Fell English',serif;font-weight:400;font-size:1.38rem;line-height:1.1}
.tcard p{font-style:italic;font-size:.96rem;color:#4a3a28;margin:3px 0 8px}
.tcard.hidden{background-color:#3a2a1c;color:#cdb88f}.tcard.hidden p{color:#a8946e}
.tcard.truth{box-shadow:0 0 0 3px #8a1414,0 6px 18px rgba(0,0,0,.5)}
.meter{height:6px;background:#d2c3a0;position:relative;overflow:hidden}.meter i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#6a1616,#c0392b);transition:width .6s}
.lab{display:flex;justify-content:space-between;font-family:'IM Fell English SC',serif;font-size:.75rem;letter-spacing:.08em;color:#6a5a44;margin-top:3px}
.pin{position:absolute;top:-6px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a7a,#a01818 60%,#5a0808);box-shadow:0 3px 4px rgba(0,0,0,.5);z-index:2}
.plan .pin{position:static;width:auto;height:auto;margin:0;border-radius:0;background:none;box-shadow:none}
.pcards{display:flex;flex-wrap:wrap;gap:18px 12px;justify-content:center;position:relative;z-index:1}
.pcard{width:108px;background:#fbf5e6;padding:5px 5px 7px;box-shadow:0 4px 10px rgba(0,0,0,.45);position:relative;color:var(--sepia);font-size:.8rem;line-height:1.15;text-align:center;font-family:'IM Fell English',serif;cursor:pointer;transition:transform .2s}
.pcard:hover{z-index:4}.pcard svg{width:100%;display:block;margin-bottom:4px}
.pcard.neg{filter:grayscale(.65)}.pcard.neg:after{content:'✕';position:absolute;inset:0;display:grid;place-items:center;font-size:3.4rem;color:rgba(160,24,24,.7);font-family:serif;pointer-events:none}
.emptyc{color:#f1e7cf;font-style:italic;opacity:.8}

/* accusa */
.qblock{background-image:var(--noise);background-color:#efe4c8;background-blend-mode:multiply;color:var(--sepia);padding:14px 14px 10px;margin:14px 0;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.qblock h3{font-family:'IM Fell English',serif;font-weight:400;font-size:1.22rem;line-height:1.2;margin-bottom:8px}.qn{color:var(--blood)}
.sus{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sus button{background:#fbf5e6;padding:5px 4px 6px;box-shadow:0 3px 8px rgba(0,0,0,.35);transition:transform .25s;color:var(--sepia);font-family:'IM Fell English',serif}
.sus button svg{width:100%;display:block}.sus button.on{transform:translateY(-6px) rotate(-2deg);outline:3px solid var(--blood)}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:8px 2px;border-bottom:1px dashed rgba(59,42,26,.35);font-size:1.02rem;color:var(--sepia);min-height:44px}
.opt .bx{width:20px;height:20px;border:1.5px solid #3b2a1a;flex:0 0 20px;margin-top:3px;position:relative}
.opt.on .bx:after{content:'✗';position:absolute;left:1px;top:-12px;font-size:1.7rem;color:var(--blood);font-family:'La Belle Aurore',cursive}
.opt.lock{opacity:.45}.opt .why{display:block;font-size:.82rem;font-style:italic}

/* interrogatorio */
#talk{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;background:radial-gradient(ellipse at 50% 18%,#3e2616 0%,#130c08 55%,#050302 100%)}
#talk.on{display:flex;animation:tIn .45s ease}@keyframes tIn{from{opacity:0}}
.tk-glow{position:absolute;left:50%;top:-80px;width:420px;height:420px;margin-left:-210px;background:radial-gradient(circle,rgba(255,190,110,.22),transparent 65%);animation:flick 3s infinite;pointer-events:none}
.tk-head{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:calc(14px + var(--st)) 16px 12px;position:relative;max-width:760px;width:100%;margin:0 auto}
.tk-head .pf{width:min(124px,29vw);flex:0 0 auto;filter:drop-shadow(0 12px 22px rgba(0,0,0,.85));animation:pfIn .6s ease}
@keyframes pfIn{from{transform:translateY(-14px) scale(.95);opacity:0}}
.tk-head .pf svg{display:block;width:100%}
.np{display:inline-block;background:linear-gradient(#e0c27e,#8e6a30);color:var(--sepia);padding:5px 12px;font-family:'IM Fell English SC',serif;letter-spacing:.05em;box-shadow:inset 0 1px 0 #fff3c4,0 3px 8px rgba(0,0,0,.6);font-size:1.08rem;line-height:1.2}
.tk-id .role{font-style:italic;color:var(--paper2);margin-top:7px;font-size:.96rem}
.tk-close{position:absolute;right:10px;top:calc(8px + var(--st));width:44px;height:44px;font-size:1.4rem;color:var(--gold)}
.tk-log{flex:1;overflow-y:auto;margin:0 auto;width:calc(100% - 24px);max-width:740px;padding:12px 16px 16px;background-image:var(--noise);background-color:#ebdfc3;background-blend-mode:multiply;color:var(--sepia);box-shadow:inset 0 0 34px rgba(90,60,20,.38),0 10px 30px rgba(0,0,0,.6)}
.tk-log .q{font-family:'IM Fell English SC',serif;font-size:.82rem;letter-spacing:.09em;color:var(--blood);margin-top:12px}
.tk-log .a{font-size:1.07rem;line-height:1.5}.tk-log .a.react{border-left:2px solid var(--blood);padding-left:10px}.tk-log .a.muted{font-style:italic;color:#6a5a44}
.nc{display:block;border:1px dashed var(--blood);padding:6px 10px;margin-top:6px;font-size:.95rem}.nc b{display:block;font-family:'IM Fell English SC',serif;font-weight:400;font-size:.75rem;letter-spacing:.14em;color:var(--blood)}
.tk-act{flex:0 0 auto;padding:10px 12px calc(12px + var(--sb));max-width:760px;width:100%;margin:0 auto}
.topics{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.topics button{background-image:var(--noise);background-color:#e6d6b0;background-blend-mode:multiply;color:var(--sepia);font-family:'IM Fell English',serif;font-size:1.02rem;padding:8px 14px;box-shadow:0 3px 7px rgba(0,0,0,.55);min-height:42px;transition:transform .15s}
.topics button:hover{transform:translateY(-2px)}.topics button.show{background-color:#6a1616;color:#f3d0c6}
.strip{display:flex;gap:10px;overflow-x:auto;padding:12px 2px 4px;scroll-snap-type:x mandatory}
.strip button{flex:0 0 96px;background:#fbf5e6;padding:4px 4px 6px;color:var(--sepia);font-size:.74rem;line-height:1.1;scroll-snap-align:start;box-shadow:0 3px 7px rgba(0,0,0,.5);font-family:'IM Fell English',serif}
.strip button svg{width:100%;display:block;margin-bottom:3px}.strip button.shown{opacity:.5}

/* reperto */
#plate{position:fixed;inset:0;z-index:35;display:none;align-items:center;justify-content:center;background:rgba(4,3,2,.9);padding:calc(12px + var(--st)) 12px calc(12px + var(--sb));overflow-y:auto}
#plate.on{display:flex}
.pl{width:min(560px,100%);margin:auto;background-image:var(--noise);background-color:#efe4c8;background-blend-mode:multiply;color:var(--sepia);padding:16px 16px 18px;box-shadow:0 30px 70px rgba(0,0,0,.85);position:relative;animation:plIn .55s cubic-bezier(.2,.8,.2,1)}
@keyframes plIn{from{transform:translateY(40px) rotate(3deg) scale(.95);opacity:0}to{transform:none;opacity:1}}
.pl .tag{font-family:'IM Fell English SC',serif;letter-spacing:.18em;font-size:.76rem;color:var(--blood);text-align:center}
.pl h2{font-family:'IM Fell English',serif;font-weight:400;font-size:1.6rem;text-align:center;line-height:1.1;margin:4px 0 12px;padding:0 30px}
.pl .art{border:7px solid #fff8e6;box-shadow:0 5px 14px rgba(0,0,0,.4);margin:0 auto 14px;max-width:440px;background:#000;transform:rotate(-.6deg)}.pl .art svg{display:block;width:100%}
.pl .art.small{max-width:200px;transform:rotate(2deg)}
.pl .txt{font-size:1.06rem}.got{font-family:'IM Fell English SC',serif;color:var(--blood);margin-top:8px;letter-spacing:.06em}
.pl .stamp{position:absolute;right:10px;top:44px;border:3px double #8a1414;color:#8a1414;font-family:'IM Fell English SC',serif;letter-spacing:.14em;padding:3px 10px;font-size:1rem;animation:stampIn .45s .35s both cubic-bezier(.3,1.6,.5,1);mix-blend-mode:multiply}
@keyframes stampIn{from{transform:rotate(-14deg) scale(3);opacity:0}to{transform:rotate(-14deg) scale(1);opacity:.9}}
.pl .acts{text-align:center;margin-top:14px}
.doc{background-image:var(--noise);background-color:#f6eed8;background-blend-mode:multiply;color:var(--sepia);padding:22px 20px;box-shadow:0 6px 16px rgba(0,0,0,.38);transform:rotate(-1deg);margin:0 auto 16px;max-width:440px;position:relative}
.doc .db{white-space:pre-line}
.doc.hand .db{font-family:'La Belle Aurore',cursive;font-size:1.24rem;line-height:1.6;color:#1f2a4a}
.doc.hand.back .db{transform:skewX(14deg);transform-origin:left;color:#1a1a1a}
.doc.typed .db,.doc.ledger td{font-family:'Special Elite',monospace}
.doc.caps .db{font-family:'Special Elite',monospace;letter-spacing:.14em;color:#4a4a4a;font-size:1.08rem}
.doc .fh{font-family:'IM Fell English SC',serif;text-align:center;font-size:.9rem;letter-spacing:.07em;border-bottom:1px solid #8a7a5a;padding-bottom:6px;margin-bottom:8px}
.doc .fs{text-align:center;font-style:italic;font-size:.92rem;margin-bottom:8px}
.doc table{width:100%;border-collapse:collapse}.doc td{border-bottom:1px solid #b8a77f;padding:5px 6px}.doc td.g{text-align:right;font-family:'Special Elite',monospace;font-size:1.15rem}
.doc.ledger td{font-size:.86rem;padding:5px 3px}
.doc .fn{margin-top:12px;font-family:'La Belle Aurore',cursive;color:var(--blood);font-size:1.15rem;transform:rotate(-2deg)}
.doc .sg{text-align:right;font-family:'La Belle Aurore',cursive;font-size:1.3rem;margin-top:8px}
.doc.burnt{box-shadow:inset 0 0 44px 12px rgba(60,25,5,.75),0 6px 16px rgba(0,0,0,.35);clip-path:polygon(0 0,100% 2%,98% 60%,92% 80%,80% 86%,66% 97%,48% 90%,30% 100%,14% 92%,0 97%);padding-bottom:44px}
.doc.diary{border-left:16px solid #3a1a0c}.doc.agenda{background-color:#e8dbb6}
.testi{display:flex;gap:12px;align-items:flex-start;background:repeating-linear-gradient(#f6eed8 0 26px,#cbb98f 26px 27px);padding:14px;margin:0 auto 14px;max-width:460px;box-shadow:0 5px 14px rgba(0,0,0,.35);transform:rotate(-.6deg)}
.testi .pf{width:76px;flex:0 0 76px}.testi .pf svg{width:100%;display:block}
.testi .tq{font-family:'La Belle Aurore',cursive;font-size:1.12rem;color:#2a2a2a;line-height:1.55}
.fly{position:fixed;z-index:70;width:100px;pointer-events:none;transition:transform .8s cubic-bezier(.5,-.3,.6,1),opacity .8s;border:3px solid #fff8e6;box-shadow:0 6px 16px rgba(0,0,0,.6)}.fly svg{display:block;width:100%}

/* capitoli */
#chap{position:fixed;inset:0;z-index:40;display:none;overflow-y:auto;background:#040302}
#chap.on{display:block;animation:tIn .6s}
#chap .ch-art{pointer-events:none;position:relative;height:min(44vh,430px);overflow:hidden;background:#000}
#chap .ch-art .cam{position:absolute;inset:-3%;will-change:transform;animation:kb2 16s ease-out both}
#chap .ch-art .cam>svg{width:100%;height:100%;display:block}

    c_diario_sofia:{name:"Il diario di Sophia",cat:"Documento",th:{B:1},text:"«Ho la lettera. Julian ha ucciso Gerald e la famiglia mi ha pagata perché tacessi. Domenica a tavola la leggerò a tutti. Voglio vederli in faccia.»"},
    c_regalo_pizzo:{name:"Il dono di Lady Agatha",cat:"Reperto",th:{A:1},text:"Un taglio di pizzo di Chantilly regalato a Sophia: «Per il tuo lutto. A.A.» Lo stesso pizzo che porta Lady Agatha."},
    c_candelabro:{name:"Il candelabro",cat:"Reperto",th:{},text:"Uno dei due candelabri dell'altare, insanguinato alla base. Pesantissimo: chi l'ha usato ha colpito più volte, con fatica."},
    c_corda:{name:"La corda",cat:"Testimonianza",th:{A:1,B:1},text:"Il dottor Reid: padre Ambrose non è mai stato appeso. La corda gli è stata stretta al collo da morto, da qualcuno che non aveva la forza di sollevarlo."},
    c_nota_anselmo:{name:"Il biglietto del prete",cat:"Documento",th:{T:2,A:1},text:"Mezzo bruciato, nel confessionale: «J. mi ha detto tutto. Il veleno. E il resto: il dottore ha mentito… devo parlar… alla madre, prima della Messa.»"},
    c_diario:{name:"Il diario di Sir Lionel",cat:"Documento",th:{T:2},text:"1878: Brighton. 1911: «Reid mi ha portato il referto: Julian non è mio.» Aprile 1912: «Julian ha sentito tutto, dietro la porta.» 2 maggio: «La tisana stasera me l'ha portata Julian. Gentilezza improvvisa.»"},
    c_referto_falso:{name:"Il referto del 1911",cat:"Documento",th:{T:2},text:"Su carta intestata del dottor Reid: Lionel O, Agatha O, Julian B. «Sir Lionel è escluso come padre.» Firmato M. Reid."},
    c_ada:{name:"Ada",cat:"Testimonianza",th:{},text:"Nel 1882 una cameriera, Ada, annegò nello stagno del parco. Era incinta. Sir Lionel se ne portò dietro il rimorso per trent'anni."},
    c_bugiardi:{name:"BUGIARDI",cat:"Osservazione",th:{A:1},text:"Scritta con il sangue di Helena. Ogni lettera è sbavata dal polso che passava su quella appena scritta: chi scriveva usava la sinistra."},
    c_nota_sola:{name:"Il biglietto in stampatello",cat:"Documento",th:{A:1,B:1},text:"Nella tasca di Helena: «CANTINA, ORE 15. PORTI QUELLO CHE HA. VERRÒ SOLA.» Sola: l'ha scritto una donna."},
    c_rasoio:{name:"Il rasoio di Sir Lionel",cat:"Reperto",th:{A:1},text:"Un rasoio a mano libera con le iniziali L.A., gettato dietro una botte. L'arma che ha ucciso Helena."},
    c_impronte:{name:"Impronte nella polvere di carbone",cat:"Osservazione",th:{A:1,B:1},text:"Scarpe da donna, tacco stretto, un piede piccolo. Vanno verso il corpo e tornano indietro."},
    c_taglio:{name:"La ferita di Helena",cat:"Testimonianza",th:{A:1},text:"Il dottor Reid: un taglio solo, da destra verso sinistra, dato da dietro. Chi teneva la lama usava la sinistra."},
    c_alibi_sofia1:{name:"Sophia e il prete",cat:"Testimonianza",th:{B:-1},text:"Padre Ambrose era con Sophia nel salone quando Julian è morto. Le leggeva Tennyson."},
    c_alibi_sofia3:{name:"Sophia e il dottore",cat:"Testimonianza",th:{B:-2,C:-1},text:"Sabato dalle 14:30 Sophia e il dottor Reid erano insieme nel salone. Si fanno da alibi per la morte di Helena."},
    c_certificato:{name:"Il certificato firmato sotto ricatto",cat:"Testimonianza",th:{T:2,A:-1},text:"Il dottor Reid ammette di aver firmato il certificato di morte di Sir Lionel senza esaminare il corpo: Julian lo ricattava."},
    c_confessione_jacopo:{name:"La confessione di Julian",cat:"Testimonianza",th:{T:2},text:"Padre Ambrose: venerdì pomeriggio Julian si è confessato. «In questa casa qualcuno ha creduto per trent'anni a una cosa falsa.»"},
    c_confessione_rinaldi:{name:"La menzogna del dottore",cat:"Testimonianza",th:{T:3},text:"Reid crolla: Julian era figlio di Sir Lionel, e lui lo sapeva dal 1904. Ha mentito ad Agatha per trent'anni per tenerla legata a sé, e a Sir Lionel con un referto falso."},
    c_testimonianza_rina:{name:"Kitty ritratta",cat:"Testimonianza",th:{A:3},text:"Fu Lady Agatha a ordinarle di portare il brandy a Julian in biblioteca. E la tisana delle 22:45 non l'ha mai portata: milady le disse di mentire."},
    c_mancina:{name:"La mano nascosta",cat:"Testimonianza",th:{A:2},text:"Kitty: in convento legavano la mano sinistra di Lady Agatha dietro la schiena. Ha imparato a nasconderla, non a non usarla."},
    c_ciondolo:{name:"Il medaglione di Sophia",cat:"Reperto",th:{B:2},text:"Nel medaglione, un frammento di lettera di Julian: «Gerald non doveva essere lì. Ho sparato al cervo, lo giuro… nessuno deve sapere. J.»"},
    c_appuntamento:{name:"L'appuntamento di Helena",cat:"Testimonianza",th:{C:1},text:"Kitty: a pranzo Helena disse che nel pomeriggio doveva vedere qualcuno. E rideva."}
  },
