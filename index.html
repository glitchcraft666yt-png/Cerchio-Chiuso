  clues:{
    f_letto:{name:"Il letto intatto",cat:"Osservazione",th:{A:-2,B:1},text:"Il letto della sposa non è stato disfatto. La camicia da notte è piegata sul cuscino. Isolde non si è mai coricata."},
    f_cloralio:{name:"Il cloralio della sposa",cat:"Reperto",th:{},text:"Una boccetta di cloralio prescritta dal dottor Vane per l'emicrania. È piena fino al segno: Isolde non ne ha preso, e non ne ha dato a nessuno."},
    f_vestiti:{name:"Il vestito da viaggio",cat:"Osservazione",th:{A:-1,B:2},text:"Nell'armadio mancano il tailleur da viaggio grigio, gli stivaletti e il mantello. L'abito da sposa è disteso sulla sedia, con cura."},
    f_lettere:{name:"Le lettere anonime",cat:"Documento",th:{},text:"Tre lettere senza firma, in stampatello: «Non sposarlo». Carta della casa, inchiostro viola. Le hai lette prima del matrimonio: per questo Sir Josiah ti ha fatto venire."},
    f_portagioie:{name:"Il portagioie vuoto",cat:"Osservazione",th:{B:2},text:"Il portagioie della sposa è vuoto. Le perle della madre, l'anello di zaffiri. Una sonnambula non si porta i gioielli."},
    f_registro_faro:{name:"Il registro del faro",cat:"Documento",th:{A:1},text:"Di pugno del guardiano: «03:00 bruciatore difettoso. Riacceso 03:20. Nessun passaggio in galleria.» L'inchiostro di quelle tre righe è più fresco del resto della pagina."},
    f_tazza:{name:"La tazza della cioccolata",cat:"Reperto",th:{T:1},text:"Sul tavolino della stanza di guardia, la tazza della cioccolata di mezzanotte. Fredda, con un deposito granuloso sul fondo, salato e amaro."},
    f_pompa:{name:"La pompa del bruciatore",cat:"Osservazione",th:{A:-1,T:1},text:"Il bruciatore a vapore di petrolio va pompato ogni mezz'ora. Se nessuno lo pompa, la pressione cala e la fiamma si spegne da sola in circa due ore e mezza."},
    f_velo:{name:"Il velo annodato",cat:"Reperto",th:{A:-2,B:1},text:"Il velo è legato alla ringhiera della galleria con un nodo piano, ben stretto, da ricamatrice. Ed è fradicio: ha preso tutta la pioggia della notte, che è finita alle 2:30."},
    f_almanacco:{name:"L'almanacco delle maree",cat:"Documento",th:{B:1,T:1},text:"Nell'almanacco del guardiano, 16 agosto, sizigia: bassa marea alle 03:12 e alle 15:37. La passerella resta scoperta per circa tre quarti d'ora intorno all'ora di minima."},
    f_scarpetta:{name:"La scarpetta di raso",cat:"Reperto",th:{A:-1,B:1},text:"Una scarpetta da sposa, posata su una sporgenza sopra la linea delle alghe. È asciutta, dentro e fuori. Non ha preso la pioggia della notte: qualcuno l'ha messa lì dopo le 2:30."},
    f_chiavistello:{name:"Il chiavistello della dispensa",cat:"Osservazione",th:{A:-1,B:1},text:"La porta della dispensa, che dà sul sentiero verso la passerella, è stata aperta dall'interno: il chiavistello è tirato, e sulla soglia c'è la sabbia del sentiero."},
    f_scarpe_d:{name:"Le orme nella dispensa",cat:"Osservazione",th:{B:1},text:"Sul pavimento della dispensa, orme di stivaletti da donna, piccoli e stretti, che vanno verso la porta. Nessuna torna indietro."},
    f_bromuro:{name:"Le polveri di bromuro",cat:"Reperto",th:{T:2},text:"Nella credenza della casetta, una scatola di polveri di bromuro prescritte dal dottor Vane a «Miss J. Hosking». Ne mancano due dalla scatola aperta ieri."},
    f_lanterna_j:{name:"La lanterna cieca",cat:"Reperto",th:{T:1},text:"Appesa nel capanno, la lanterna cieca della casetta. Lo stoppino è bruciato di fresco, e sul vetro c'è una crosta di sale."},
    f_foto_tom:{name:"La fotografia nel messale",cat:"Reperto",th:{B:2},text:"Nel messale di Isolde, la fotografia di un giovane in divisa da guardiano dei fari. Sul retro: «T. K. — St. Morwenna, giugno 1913». Tom Kitto, il vice guardiano."},
    f_banca:{name:"La lettera della banca",cat:"Documento",th:{B:2},text:"Banca di Falmouth, 14 agosto: «Come da sue istruzioni, le consegniamo in contanti la somma di 400 sterline.» Due giorni prima delle nozze."},
    f_gaffa:{name:"La gaffa del capanno",cat:"Reperto",th:{T:2},text:"La gaffa d'ottone e ferro è stata rimessa al gancio sbagliato. Il ferro ha ruggine fresca, da acqua di mare, e nel gancio è rimasto impigliato un lungo capello biondo."},
    f_gonna:{name:"La gonna sotto le reti",cat:"Reperto",th:{T:2},text:"Arrotolata sotto le reti, una gonna di lana scura con l'orlo ancora umido d'acqua di mare. Impigliata all'orlo, un'alga rossa e ricciuta."},
    f_bibbia:{name:"La lettera nella Bibbia",cat:"Documento",th:{T:3},text:"Nella Bibbia di Jenna, tra le pagine del Cantico dei Cantici, una lettera di Tom a Isolde: «Domenica, la bassa marea delle 3:12. Ti aspetto in fondo alla passerella con il calesse. Porta solo il necessario. T.»"},
    f_cardigan:{name:"Il cardigan di Jenna",cat:"Reperto",th:{T:2},text:"Nel baule di Jenna, un cardigan di lana grigia con i bottoni di corno. Ne manca uno, il terzo: il filo è strappato, non tagliato."},
    f_alga:{name:"L'alga del Pulpito",cat:"Osservazione",th:{T:1},text:"Sul Pulpito, la roccia a metà della passerella, cresce un'alga rossa e ricciuta che sullo scoglio non c'è da nessun'altra parte. Si trova solo lì, dove la corrente batte."},
    f_lanterna_i:{name:"La lanterna di Isolde",cat:"Reperto",th:{B:-2,T:1},text:"Incastrata nella gola sotto il Pulpito, una lanterna da viaggio con il vetro rotto. Le iniziali sul manico: I. P."},
    f_valigia:{name:"La valigetta",cat:"Reperto",th:{B:-2},text:"Una valigetta di cuoio, fradicia, tra le rocce della gola. Dentro, i gioielli della madre e 400 sterline in banconote incollate dall'acqua."},
    f_corpo:{name:"Il corpo di Isolde",cat:"Osservazione",th:{A:-2,B:-3,T:1},text:"Isolde indossa il tailleur da viaggio, gli stivaletti e il mantello. Nessuna sonnambula. Ed è morta: non c'è nessuna America."},
    f_ferita:{name:"La ferita a mezzaluna",cat:"Testimonianza",th:{A:-2,T:2},text:"Il dottor Vane: sulla tempia, una ferita a mezzaluna, netta, con un foro al centro. Non è la roccia: è un ferro curvo con una punta. È stata colpita, poi è finita in acqua."},
    f_bottone:{name:"Il bottone di corno",cat:"Reperto",th:{T:2},text:"Stretto nella mano destra di Isolde, un bottone di corno con quattro fori e un filo di lana grigia ancora attaccato."},
    f_sonno:{name:"Il guardiano dormiva",cat:"Testimonianza",th:{A:-2,T:1},text:"Hosking ammette: si è addormentato poco dopo la cioccolata di mezzanotte e si è svegliato alle quattro meno cinque, intirizzito. Ha riacceso la lanterna e ha scritto il falso nel registro."},
    f_piano:{name:"Il piano della sposa",cat:"Testimonianza",th:{A:-3,B:3},text:"Hester confessa: Isolde voleva sparire e farsi credere morta. Il velo l'ha legato lei alle 23:30, la scarpetta l'ha posata Hester alle sei. Alle tre Isolde doveva attraversare la passerella con la bassa marea, verso Tom."},
    f_lite:{name:"La lite delle undici",cat:"Testimonianza",th:{C:2},text:"Tremayne ammette: alle 23 la sposa gli ha detto che non sarebbe mai stata sua moglie. Lui ha rotto un bicchiere contro il muro."},
    f_galleria_01:{name:"Il capitano in galleria",cat:"Testimonianza",th:{C:1},text:"Hosking: all'una e dieci il capitano è salito in galleria a fumare, da solo. È ridisceso alle una e venti. Il guardiano era sveglio e l'ha visto."},
    f_rumori:{name:"Rumori nella camera della sposa",cat:"Testimonianza",th:{C:-2},text:"Tremayne, dal camerino accanto: verso le tre e un quarto ha sentito muoversi nella camera della sposa, e ha pensato che fosse lei. Era Hester, che fingeva di essere la padrona."},
    f_cane:{name:"Il cane delle tre",cat:"Testimonianza",th:{T:1},text:"Hester: il cane del guardiano ha abbaiato una volta sola, verso le tre meno cinque, quando la signora è uscita. Poi più niente, per tutta la notte."},
    f_ricetta:{name:"La ricetta del dottore",cat:"Testimonianza",th:{T:1},text:"Il dottor Vane: a Isolde ha prescritto il cloralio per l'emicrania. A Jenna Hosking il bromuro, a giugno, perché non dormiva più da quando Tom l'aveva lasciata."},
    f_due_luci:{name:"Due luci sulla passerella",cat:"Testimonianza",th:{B:-2,T:3},text:"Tom: alle tre e dieci, dal fondo della passerella, ha visto due luci. Una veniva dalla casa. L'altra era ferma a metà, al Pulpito, e si è accesa all'improvviso. Poi una si è spenta, e l'altra è tornata indietro."},
    f_posta:{name:"La cassetta della posta",cat:"Testimonianza",th:{T:2},text:"Tom: la sua lettera per Isolde l'ha lasciata giovedì nella cassetta del faro, come tutta la posta per lo scoglio. La posta la ritira e la smista Jenna."},
    f_guardiacoste:{name:"Il registro della guardia costiera",cat:"Documento",th:{A:-1,T:1},text:"Tom ha portato il telegramma della stazione di Porthcarrow: «Faro di St. Morwenna spento dalle 03:04 alle 03:58. Vento calato tra le 02:30 e le 04:00.»"},
    f_obs_tremayne:{name:"Le nocche del capitano",cat:"Osservazione",th:{C:1},text:"Le nocche della mano destra di Tremayne sono escoriate e fasciate male. Ha colpito qualcosa di duro, di recente."},
    f_obs_hester:{name:"Il dito di Hester",cat:"Osservazione",th:{},text:"L'indice destro di Hester è macchiato d'inchiostro viola. Lo stesso inchiostro delle lettere anonime."},
    f_obs_hosking:{name:"Gli occhi del guardiano",cat:"Osservazione",th:{A:-1},text:"Hosking ha la lingua impastata e le pupille piccole come capocchie di spillo. Non è il sonno di chi ha vegliato: è il sonno di chi ha dormito troppo, e male."},
    f_obs_jenna:{name:"Le mani di Jenna",cat:"Osservazione",th:{T:1},text:"Jenna ha le mani screpolate dal sale fino ai polsi, come chi le ha tenute nell'acqua di mare. E porta un cardigan nuovo: le pieghe del baule sono ancora visibili."}
  },
  map:{nostairs:true,nodoors:true,
    labels:[{t:"MORWENNA HOUSE",x:10,y:14},{t:"IL FARO",x:230,y:14},{t:"CASETTA DEL GUARDIANO",x:10,y:174},{t:"LA PASSERELLA (BASSA MAREA)",x:10,y:294}],
    rooms:[{id:"salotto",x:10,y:20,w:108,h:70},{id:"camera_sposa",x:122,y:20,w:102,h:70},{id:"dispensa_m",x:10,y:96,w:214,h:60},{id:"lanterna",x:230,y:20,w:100,h:70},{id:"scogli",x:230,y:96,w:100,h:60},{id:"casetta",x:10,y:180,w:150,h:90},{id:"capanno",x:166,y:180,w:164,h:90},{id:"passerella",x:10,y:300,w:320,h:92}],deco:''},
  rooms:{
    salotto:{name:"Salotto di Morwenna House",mapName:"Salotto",crimeFrom:99,
      desc:["Il salotto dove ieri sera si è brindato agli sposi. I bicchieri sono ancora sul tavolo, la torta a metà. Dalle finestre, solo mare in tempesta.","Sir Josiah ha fatto coprire lo specchio con un drappo nero. Si aspetta che il mare restituisca qualcosa.","Gli ospiti si sono radunati qui, intorno al fuoco. Nessuno ha fame."],
      objects:[
        {id:"ospiti",label:"Il libro degli ospiti",text:"«Agli sposi, che il mare li protegga.» Firme di parenti, il dottor Vane, il capitano Lennox di Truro. In fondo, a matita, una mano infantile: «Jenna H.», con uno scarabocchio sopra, come se avesse cambiato idea."},
        {id:"torta",label:"La torta nuziale",text:"Tre piani di glassa bianca, tagliata una volta sola. La sposa ha mangiato una fetta piccola e ha lasciato la tavola presto, ricorda il cameriere: «Sembrava avere fretta che la serata finisse.»"},
        {id:"biglietti",label:"I biglietti d'auguri",text:"Biglietti dalla costa, dalla miniera, dalla Trinity House. Uno solo senza firma: «Che tu sia felice quanto meriti.» La stessa carta delle lettere anonime, ma la grafia è diversa: rotonda, da maestra."}]},
    camera_sposa:{name:"Camera della sposa",mapName:"Camera sposa",crimeFrom:99,
      desc:["La camera nuziale, con il letto a baldacchino e le finestre sul faro. La cameriera Hester siede in un angolo e si tormenta il grembiule.","La camera è stata riordinata. L'abito da sposa è ancora sulla sedia: Sir Josiah non vuole che lo si tocchi.","Hester sta piegando le cose della padrona in un baule. Piange in silenzio."],
      objects:[
        {id:"letto",label:"Il letto",clue:"f_letto",text:"Le coperte rimboccate, il cuscino intatto. Sopra, piegata con cura, la camicia da notte di batista con le iniziali ricamate. Isolde non si è mai coricata. Una sonnambula, per camminare nel sonno, prima deve dormire."},
        {id:"cloralio",label:"La boccetta sul comò",clue:"f_cloralio",text:"Cloralio idrato, «per l'emicrania», con l'etichetta del dottor Vane. La boccetta è piena fino al segno di carta che il dottore ci ha incollato sopra. Nessuno ne ha preso."},
        {id:"abito",label:"L'abito da sposa",clue:"f_vestiti",text:"Disteso sulla sedia, il velo staccato. Apri l'armadio: mancano il tailleur da viaggio grigio, gli stivaletti allacciati e il mantello di lana. La sposa, stanotte, si è vestita per uscire."},
        {id:"cassetto",label:"Il cassetto della scrivania",clue:"f_lettere",text:"Le tre lettere anonime che Sir Josiah ti ha mostrato una settimana fa. «Non sposarlo.» Inchiostro viola, stampatello incerto. Isolde le aveva tenute, legate con un nastro."},
        {id:"portagioie",label:"Il portagioie",clue:"f_portagioie",text:"Un portagioie di madreperla, aperto e vuoto. Hester dice che ieri sera c'erano le perle della madre e l'anello di zaffiri. Le sonnambule non si portano dietro i gioielli."},
        {id:"messale",label:"Il messale",clue:"f_foto_tom",from:1,text:"Il messale di Isolde, con il nastro alla messa nuziale. Tra le pagine, una fotografia: un giovane in divisa da guardiano dei fari, sorridente, sullo sfondo del faro. Sul retro: «T. K. — St. Morwenna, giugno 1913»."},
        {id:"lettera_banca",label:"La cartella dei documenti",clue:"f_banca",from:1,text:"Nella cartella di cuoio di Isolde, tra il contratto di nozze e il passaporto, una lettera della Banca di Falmouth: 400 sterline ritirate in contanti il 14 agosto. Il passaporto è nuovo, rilasciato a luglio."}]},
    dispensa_m:{name:"Dispensa di Morwenna House",mapName:"Dispensa",crimeFrom:99,
      desc:["La dispensa della villa: rame, pietra, una porta bassa che dà sul sentiero tra gli scogli. Fa freddo, e c'è odore di mare.","La cuoca ha acceso la stufa. La porta sul sentiero è stata richiusa.","La porta sul sentiero sbatte nel vento. Dal vetro si vede la passerella, scoperta."],
      objects:[
        {id:"chiavistello",label:"La porta sul sentiero",clue:"f_chiavistello",text:"La porta bassa che dà sul sentiero verso la passerella. Il chiavistello è tirato: è stata aperta dall'interno. Sulla soglia, la sabbia scura del sentiero, che la pioggia non ha ancora lavato via."},
        {id:"scarpe_d",label:"Il pavimento",clue:"f_scarpe_d",text:"Sul pavimento di lastre, orme asciutte di stivaletti da donna, piccoli e stretti, che vanno dalla scala della servitù fino alla porta. Nessuna orma torna indietro."},
        {id:"ganci",label:"I ganci delle lanterne",text:"Una fila di ganci per le lanterne della casa. Ne manca una, la lanterna da viaggio con il manico d'ottone. La cuoca giura che ieri sera c'era."}]},
    lanterna:{name:"La stanza della lanterna",mapName:"Faro",crimeFrom:99,
      desc:["In cima alla scala a chiocciola, la stanza di guardia e, sopra, la grande lente di Fresnel. Il guardiano Hosking non ti guarda negli occhi. Dalla porta di vetro si esce sulla galleria.","La lente gira, lenta, anche di giorno. Hosking la lucida come se volesse cancellare qualcosa.","La stanza è vuota. Il guardiano è sceso alla passerella."],
      objects:[
        {id:"registro_f",label:"Il registro del faro",clue:"f_registro_faro",text:"Il registro di servizio, scritto con una calligrafia da scuola serale. «03:00 bruciatore difettoso. Riacceso 03:20. Nessun passaggio in galleria.» L'inchiostro di quelle righe è più nero e più fresco di quello sopra."},
        {id:"tazza",label:"La tazza della cioccolata",clue:"f_tazza",text:"Una tazza smaltata con una crosta di cioccolata fredda. La inclini: sul fondo c'è un deposito granuloso, bianco. Lo assaggi con la punta del dito: salato e amaro. Non è zucchero."},
        {id:"pompa",label:"La pompa del bruciatore",clue:"f_pompa",text:"Il bruciatore a vapore di petrolio ha un manometro e una pompa a mano. Hosking, controvoglia, spiega: va pompato ogni mezz'ora. Se nessuno lo pompa, la pressione cala e la fiamma si spegne da sola, in un paio d'ore."},
        {id:"ringhiera",label:"La ringhiera della galleria",clue:"f_velo",text:"Esci sulla galleria, nel vento. Il velo è legato alla ringhiera con un nodo piano, stretto, da ricamatrice. Il vento strappa, non annoda. Ed è fradicio: era qui da prima che smettesse di piovere."},
        {id:"almanacco",label:"L'almanacco delle maree",clue:"f_almanacco",text:"L'almanacco della Trinity House, consumato agli angoli. 16 agosto, sizigia: bassa marea alle 03:12 e alle 15:37. Hosking: «Con la sizigia la passerella resta scoperta tre quarti d'ora. Ma con quel mare, stanotte, non ci passava nessuno.»"}]},
    scogli:{name:"Gli scogli sotto il faro",mapName:"Scogli",crimeFrom:99,
      desc:["Gli scogli neri ai piedi del faro, battuti dalle onde. Più su, la galleria; più giù, il mare che ribolle.","Il capitano Tremayne scruta il mare da ore, con il cannocchiale.","La marea è bassa. Gli scogli sono coperti di alghe brune."],
      objects:[
        {id:"scarpetta",label:"La scarpetta di raso",clue:"f_scarpetta",to:0,text:"Una scarpetta da sposa di raso bianco, posata su una sporgenza a tre metri sopra la linea delle alghe. La tocchi: asciutta, dentro e fuori. La pioggia è finita alle 2:30. Una cosa caduta dalla galleria durante la notte sarebbe fradicia."},
        {id:"segni",label:"La linea delle alghe",text:"Le alghe segnano fin dove arriva l'alta marea. Sotto la galleria, il mare è profondo e la corrente porta al largo. Chi cade di qui non torna. Sir Josiah ci conta."},
        {id:"galleria_v",label:"La galleria, vista da sotto",text:"Da quaggiù il velo sulla ringhiera sembra una bandiera bianca. La galleria è a trenta metri. Per arrivarci, bisogna passare dalla stanza del guardiano."}]},
    casetta:{name:"La casetta del guardiano",mapName:"Casetta",crimeFrom:99,
      desc:["La casetta di Hosking e di sua figlia Jenna: una cucina con la stufa, una Bibbia sul tavolo, un cane che dorme davanti al fuoco.","Il cane sonnecchia. Sul fornello, la zuppa per il padre.","La stufa è spenta. La casa è silenziosa."],
      objects:[
        {id:"bromuro",label:"La credenza",clue:"f_bromuro",text:"Barattoli di zucchero, tè, sale. E una scatola di cartone della farmacia di Penzance: polveri di bromuro di potassio, «Miss J. Hosking, una la sera per dormire. Dott. Vane». La scatola è stata aperta ieri: mancano due polveri."},
        {id:"bibbia",label:"La Bibbia di famiglia",clue:"f_bibbia",when:g=>locOf("jenna")!=="casetta",text:"Una Bibbia pesante con i nomi della famiglia sul frontespizio. Si apre da sola al Cantico dei Cantici. Tra le pagine, una lettera che non è per Jenna: «Domenica, la bassa marea delle 3:12. Ti aspetto in fondo alla passerella con il calesse. Porta solo il necessario. T.»"},
        {id:"bibbia_j",label:"La Bibbia di famiglia",when:g=>locOf("jenna")==="casetta",text:"Allunghi la mano verso la Bibbia, e Jenna la sposta verso di sé, senza dire niente. «È di mia madre», mormora. Non insisti. Non adesso."},
        {id:"cane",label:"Il cane",text:"Un vecchio cane da pastore che dorme davanti alla stufa. Alza la testa, ti annusa, sbadiglia. Con chi conosce è docile come un agnello. Con gli estranei, dicono, abbaia come un dannato."},
        {id:"cardigan",label:"Il baule di Jenna",clue:"f_cardigan",from:2,when:g=>locOf("jenna")!=="casetta",text:"Il baule di Jenna, ai piedi del letto. In fondo, sotto la biancheria, un cardigan di lana grigia con i bottoni di corno. Ne manca uno, il terzo. Il filo è strappato, non tagliato."},
        {id:"tazze_c",label:"Il fornello",text:"Un pentolino con il fondo di cioccolata bruciata. Jenna la prepara ogni notte al padre, alle dodici e un quarto, prima del turno di guardia. «Da quando è morta la mamma», dice."}]},
    capanno:{name:"Il capanno delle barche",mapName:"Capanno",crimeFrom:2,
      desc:["Il capanno delle barche, sotto la casetta: una lancia capovolta, reti, gaffe, lanterne. Odore di catrame e di alghe.","Il vento entra dalle fessure. Le reti oscillano.","Sul pavimento, sotto un telo, il corpo di Isolde Penrose. Il dottor Vane è inginocchiato accanto. Tom Kitto non riesce a guardarla."],
      objects:[
        {id:"lanterna_j",label:"La lanterna cieca",clue:"f_lanterna_j",text:"Una lanterna cieca, con lo sportello che chiude la luce. Appartiene alla casetta. Lo stoppino è bruciato di fresco, e sul vetro c'è una crosta di sale secco. È stata fuori, con il mare."},
        {id:"gaffa",label:"La gaffa",clue:"f_gaffa",from:1,text:"Una gaffa da barca, lunga due metri, con il gancio di ferro. È appesa al gancio sbagliato. Il ferro ha la ruggine arancione, fresca, dell'acqua di mare. E nel gancio è rimasto impigliato un lungo capello biondo."},
        {id:"gonna",label:"Le reti",clue:"f_gonna",from:1,text:"Sollevi le reti ammucchiate nell'angolo. Sotto, arrotolata, una gonna di lana scura da donna, con l'orlo ancora umido d'acqua salata. All'orlo è impigliata un'alga rossa e ricciuta."},
        {id:"corpo3",label:"Il corpo di Isolde",clue:"f_corpo",from:2,text:"Sollevi il telo. Isolde Penrose ha ventisei anni, e indossa il tailleur da viaggio grigio, gli stivaletti allacciati, il mantello. Non è caduta dal faro in camicia da notte. Stava partendo. E non è mai arrivata."},
        {id:"bottone",label:"La mano destra",clue:"f_bottone",from:2,text:"La mano destra di Isolde è chiusa a pugno. Il dottor Vane te la apre con delicatezza. Dentro, un bottone di corno a quattro fori, con un filo di lana grigia ancora attaccato."}]},
    passerella:{name:"La passerella",mapName:"Passerella",crimeFrom:2,
      lock:g=>g.act<2?"La passerella è sotto due metri di mare in burrasca. Riemergerà solo con la bassa marea.":g.time>=16*60+15?"La marea è risalita: la passerella è di nuovo sott'acqua. Il mare non aspetta nessuno.":null,
      desc:[null,null,"La passerella di roccia emerge dal mare, nera, coperta d'alghe, per quattrocento metri fino alla costa. A metà, il Pulpito: una roccia alta come un uomo. Sotto, la gola dove la corrente gira."],
      objects:[
        {id:"pulpito",label:"Il Pulpito",clue:"f_alga",text:"La roccia a metà strada. Sul lato verso il mare, un'alga rossa e ricciuta che non hai visto da nessun'altra parte sullo scoglio. Hosking: «Cresce solo qui, dove batte la corrente.» E sulla pietra, all'altezza di una testa, una macchia scura che il mare non ha lavato del tutto."},
        {id:"gola",label:"La gola",clue:"f_lanterna_i",text:"La gola tra le rocce, dove hanno trovato il corpo. Incastrata più in basso, una lanterna da viaggio con il vetro rotto. Sul manico d'ottone, le iniziali: I. P. È la lanterna che mancava dai ganci della dispensa."},
        {id:"alga",label:"Le pozze di marea",text:"Pozze d'acqua ferma tra le rocce, piene di granchi. Qui la sabbia è troppo bagnata per tenere un'orma. Il mare cancella tutto, due volte al giorno."},
        {id:"valigia",label:"Tra le rocce",clue:"f_valigia",text:"Una valigetta di cuoio, fradicia, incastrata tra due rocce. Dentro, le perle della madre, l'anello di zaffiri e un pacchetto di banconote incollate dall'acqua: 400 sterline. Chi l'ha uccisa non lo ha fatto per i soldi."}]}
  },
  chars:{
    tremayne:{name:"Cap. Edward Tremayne",short:"Tremayne",mk:"ET",age:34,role:"Lo sposo, armatore di Falmouth",
      bio:"Ricco, bello, abituato a ottenere quello che vuole. Ha sposato Isolde ieri a mezzogiorno. Stamattina ha trovato lui la scarpetta.",
      p:{},loc:["salotto","scogli","salotto"],
      alibi:["«Ho dormito nel camerino. La sposa aveva l'emicrania, me l'ha detto chiaro. Non ho sentito niente.»","«Sono stato sugli scogli tutta la mattina. Se il mare la restituisce, voglio essere io a trovarla.»","«Qui. A guardare un uomo che non conosco piangere mia moglie.»"],
      unlock:{crime1:"f_lite"},
      crime:["«Sonnambula. Me l'avessero detto prima, l'avrei legata al letto.» Si accorge di quello che ha detto, e si volta.","«Avevamo litigato. Va bene? Alle undici. Mi ha detto che non sarebbe mai stata mia moglie, non in quel senso. Ho rotto un bicchiere contro il muro. Poi sono andato a dormire.»","«Chi è quel Kitto? Che cosa era, per lei?»"],
      self:"«Tre navi, due velieri, una casa a Falmouth. E una moglie per dodici ore.»",
      others:"«Sir Josiah mi ha venduto sua figlia per salvare le miniere. Hester mi odia. Il dottore beve. Il guardiano è un fanatico, sua figlia una ragazza strana: stamattina mi ha guardato come se volesse ringraziarmi di qualcosa.»",
      react:{f_lettere:"«Lettere anonime. Le ha scritte qualcuno che non voleva questo matrimonio. Cioè tutti, tranne Sir Josiah.»",f_foto_tom:"Prende la fotografia, la guarda a lungo e te la restituisce senza una parola. Le nocche gli diventano bianche.",f_piano:"«Fuggita. Con un guardiano dei fari.» Ride, una risata terribile. «E io la cercavo sugli scogli.»",f_corpo:"Il capitano si appoggia al muro. Per la prima volta, sembra un uomo e non un armatore.",f_velo:"«Annodato? Isolde faceva nodi da marinaio meglio dei miei mozzi. Gliel'aveva insegnato suo padre.»"},
      def:["«Non ne so niente.»","«Lo chieda a Sir Josiah. È lui l'esperto di affari di famiglia.»","«Mi lasci in pace, avvocato.»"]},
    josiah:{name:"Sir Josiah Penrose",short:"Sir Josiah",mk:"JP",age:61,role:"Padre della sposa, proprietario di miniere",
      bio:"Le miniere di stagno dei Penrose sono sull'orlo del fallimento. Il matrimonio con Tremayne doveva salvarle. Vuole a tutti i costi che sia stata una disgrazia.",
      p:{},loc:["salotto","salotto","salotto"],
      alibi:["«A letto, alle dodici e mezza. Ho cinquantun anni di miniera nei polmoni: dormo come un sasso.»","«Qui. Ad aspettare il mare.»","«Qui.»"],
      crime:["«Una disgrazia. Mia figlia era sonnambula da bambina. È salita in galleria, ed è caduta. Non voglio sentire altro.»","«Non voglio scandali. Le miniere danno pane a quattrocento famiglie.»","«Mia figlia.» Non riesce a dire altro."],
      self:"«Ho tirato fuori stagno da sotto il mare per quarant'anni. Ho perso una moglie e tre fratelli in miniera. Adesso il mare si prende anche lei.»",
      others:"«Tremayne è un uomo d'affari. Hester è affezionata, ma è una sciocca. Hosking è il miglior guardiano della costa. Vane è un amico di famiglia.»",
      react:{f_letto:"«Non si era coricata? Sarà salita in galleria prima di dormire. I sonnambuli…» Si ferma. Sa anche lui che non ha senso.",f_banca:"«Quattrocento sterline?» Impallidisce. «Erano i suoi risparmi. La dote di sua madre.»",f_piano:"Sir Josiah si siede. «Voleva scappare da me. Non dal matrimonio. Da me.»",f_corpo:"Il vecchio non piange. Si limita a togliersi il cappello, e lo tiene tra le mani."},
      def:["«Non capisco.»","«Non voglio sapere queste cose.»","«Faccia quello che deve, avvocato.»"]},
    hester:{name:"Hester Pascoe",short:"Hester",mk:"HP",age:40,role:"Cameriera della sposa",
      bio:"Al servizio di Isolde da quando aveva sei anni. Le ha fatto da madre. Giura che la padrona era sonnambula da bambina.",
      p:{},loc:["camera_sposa","salotto","camera_sposa"],
      alibi:["«Ho dormito nella stanzetta qui accanto. Alle sei e mezza sono entrata per svegliarla, e il letto era vuoto. Era sonnambula da bambina, signore, glielo giuro.»","«Ho detto tutto, signore. La signora camminava nel sonno.»","«A sistemare le sue cose. Qualcuno deve farlo.»"],
      crime:["«È caduta. È caduta dal faro. Me l'ha sempre detto la madre: Isolde non va lasciata sola le notti di luna.»","«Il cane? Ha abbaiato una volta, verso le tre meno cinque. Poi più niente, per tutta la notte. Non avevo chiuso occhio.»","«Lei è morta. E io ho aiutato a farla uscire. Io.»"],
      unlock:{crime1:"f_cane"},
      self:"«Vent'anni con la signorina Isolde. Le ho insegnato a cucire, a fare i nodi, a dire le preghiere. Lei mi ha insegnato a leggere.»",
      others:"«Il capitano è un uomo duro. Sir Josiah ha venduto la figlia. Jenna Hosking è una brava ragazza, ma non sorride più da giugno.»",
      react:{f_lettere:"Hester abbassa gli occhi. «Non so niente di quelle lettere.» Nasconde la mano destra nel grembiule.",f_obs_hester:"Hester si guarda il dito viola. «Sì. Le ho scritte io. Volevo che non si sposasse. Non con lui, non per i soldi del padre.» Piange. «Non ho fatto niente di male, signore.»",f_foto_tom:"«Tom.» Le sfugge, e si porta la mano alla bocca.",f_corpo:"Hester cade in ginocchio. «Doveva essere in salvo. Doveva essere in salvo, a quest'ora.»",f_due_luci:"«Due luci? Ma la signora era sola! Le ho dato io la lanterna, l'ho vista andare. Era sola.»"},
      def:["«Non lo so, signore.»","«Chieda a Sir Josiah.»","«Per carità, signore.»"]},
    vane:{name:"Dott. Lucian Vane",short:"Vane",mk:"LV",age:52,role:"Medico di famiglia dei Penrose",
      bio:"Medico condotto di Penzance e amico di famiglia. Ha visto nascere Isolde. Beve un po' troppo, e lo sa.",
      p:{},loc:["salotto","salotto","capanno"],
      alibi:["«A letto, nella stanza degli ospiti. Ho preso una polvere per dormire. Alla mia età, dopo un matrimonio…»","«Qui. Mi hanno chiesto di restare per Sir Josiah, che ha il cuore debole.»","«Qui, con lei. Qualcuno deve farlo.»"],
      unlock:{crime1:"f_ricetta",crime2:"f_ferita"},
      crime:["«Sonnambula? Isolde?» Aggrotta la fronte. «Da bambina, forse, una volta. Ma non l'ho mai curata per questo.»","«Prescrizioni? A Isolde il cloralio, per l'emicrania. E a giugno il bromuro a Jenna Hosking, la figlia del guardiano: non dormiva più da quando il fidanzato l'aveva lasciata. Povera ragazza.»","«Guardi la tempia. Una ferita a mezzaluna, netta, con un foro al centro. Non è roccia: è un ferro curvo con la punta. L'hanno colpita, e poi è finita in acqua. Nei polmoni c'è poca acqua: era già quasi morta.»"],
      self:"«Trent'anni di medicina condotta. Parti, febbri, annegati. La Cornovaglia ti insegna che il mare restituisce sempre quello che prende. Prima o poi.»",
      others:"«Sir Josiah è un uomo orgoglioso. Il capitano è un animale di lusso. Hester è una santa. Hosking è un buon uomo. Sua figlia… la figlia ha sofferto molto, quest'estate.»",
      react:{f_tazza:"Il dottore assaggia il deposito sulla punta della lingua. «Bromuro di potassio. Una dose da cavallo. Chi l'ha bevuto ha dormito come un morto per tre ore.»",f_bromuro:"«Le polveri che ho prescritto a Jenna. Una la sera. Ne mancano due?» Ti guarda, e smette di sorridere.",f_cloralio:"«La boccetta è piena. Ci avevo messo il segno io. Isolde non ne ha preso nemmeno una goccia.»",f_gaffa:"Esamina il gancio della gaffa, poi pensa alla ferita. Non dice niente. Annuisce, una volta.",f_obs_hosking:"«Pupille a spillo, lingua impastata: bromuro, o oppio. Quell'uomo non ha vegliato. È stato drogato.»"},
      def:["«Non saprei dirle.»","«Sono un medico, non un poliziotto.»","«Mi scusi, ho bisogno di un goccio.»"]},
    hosking:{name:"Jacob Hosking",short:"Hosking",mk:"JH",age:54,role:"Guardiano del faro",
      bio:"Ventidue anni al faro di St. Morwenna. Metodista, vedovo, severo. Il faro è la sua vita. Stanotte, dice, era di guardia.",
      p:{},loc:["lanterna","lanterna","passerella"],
      alibi:["«Di guardia, dalla mezzanotte alle quattro. Sveglio, come sempre. Il bruciatore si è guastato alle tre, l'ho riacceso alle tre e venti. Nessuno è passato in galleria.»","«Al faro. Il faro non si lascia.»","«Alla passerella, finché il mare la lascia scoperta.»"],
      unlock:{crime0:"f_galleria_01"},
      crime:["«All'una e dieci il capitano è salito in galleria a fumare. Gli ho detto di stare attento. È sceso dieci minuti dopo. Poi nessuno, glielo giuro sulla Bibbia.»","«Con quel mare non si passava. Nessuno poteva attraversare la passerella, stanotte.»","«L'abbiamo trovata io e Tom, nella gola, alle tre e quaranta di oggi pomeriggio. Il mare l'ha restituita.»"],
      self:"«Ventidue anni a tenere accesa questa luce. Mai una notte al buio. Mai.» La voce gli si incrina.",
      others:"«Il capitano è un uomo senza Dio. Sir Josiah è un padrone giusto. Tom Kitto era un buon vice, finché non gli ha girato la testa una signora. Mia figlia è una brava ragazza.»",
      react:{f_tazza:"«La cioccolata della mezzanotte. Me la porta Jenna, ogni notte.» Guarda il deposito sul fondo e non dice altro.",f_pompa:"«Ogni mezz'ora. Lo so meglio di lei.» Ma la voce gli trema.",f_obs_hosking:"«Ho gli occhi stanchi. Sono vecchio.»",f_guardiacoste:"Il guardiano si siede sul gradino. «Dalle tre e quattro alle quattro meno due.» Si copre la faccia. «Un'ora al buio. Ventidue anni, e un'ora al buio.»",f_bibbia:"«La Bibbia di mia moglie.» Legge la lettera, e la carta gli trema tra le dita. «Jenna», dice. Solo il nome."},
      def:["«Non lo so.»","«Il Signore sa tutto. Lo chieda a Lui.»","«Devo tornare al faro.»"]},
    jenna:{name:"Jenna Hosking",short:"Jenna",mk:"JN",age:22,role:"Figlia del guardiano",
      bio:"È cresciuta sullo scoglio. Conosce ogni roccia della passerella, ogni marea. Era fidanzata con Tom Kitto fino a giugno. Da allora, dicono, non dorme più.",
      p:{},loc:["casetta","casetta","casetta"],
      alibi:["«Ho portato la cioccolata a mio padre a mezzanotte e un quarto, come sempre. Poi ho dormito fino alle sei. Il cane dorme con me: se fossi uscita, avrebbe abbaiato.»","«In casa. Il vento era troppo forte per uscire.»","«In casa. Dove dovrei essere?»"],
      crime:["«Povera signora. Il mare di qui non perdona chi non lo conosce.»","«Tom? Era il mio fidanzato. A giugno mi ha restituito l'anello. Non c'è altro da dire.»","«Se l'è presa il mare. Il mare si prende sempre quello che vuole.»"],
      self:"«Sono nata in questa casetta. Mia madre è morta qui. Conosco la passerella a occhi chiusi: ci camminavo da bambina, con la bassa marea, a raccogliere le alghe.»",
      others:"«Mio padre è il miglior guardiano della Cornovaglia. Il capitano è un signore. Hester mi vuole bene. Tom… Tom ha fatto la sua scelta.»",
      react:{f_bromuro:"«Le mie polveri.» Un attimo di silenzio. «Ne ho prese due. Non dormo, da giugno.»",f_tazza:"«La cioccolata di mio padre. La faccio da quando è morta la mamma.» Guarda altrove.",f_foto_tom:"Il viso di Jenna non si muove. Solo le mani si chiudono sul grembiule.",f_lanterna_j:"«Quella lanterna è sempre lì. L'avrà usata mio padre.»",f_gonna:"«Non è mia. Le gonne scure le hanno tutte, sullo scoglio.»",f_due_luci:"Jenna impallidisce. «Tom vede luci ovunque. Era sconvolto.»",f_obs_jenna:"Jenna nasconde le mani sotto il grembiule. «Ho lavato i panni, stamattina. Col freddo che fa.»"},
      def:["«Non so niente.»","«Lo chieda a mio padre.»","«Devo preparare la zuppa.»"]},
    tom:{name:"Tom Kitto",short:"Tom",mk:"TK",age:27,role:"Vice guardiano del faro",
      bio:"Vice guardiano di St. Morwenna. Ieri notte era a terra, in licenza. Era il fidanzato di Jenna Hosking. Poi ha conosciuto Isolde Penrose.",
      p:{},loc:[null,null,"capanno"],hidden:g=>g.act<2&&!has("f_foto_tom")&&!has("f_piano"),
      alibi:[null,null,"«A terra. Con il calesse, in fondo alla passerella, dalle tre meno un quarto alle quattro. L'ho aspettata. Non è mai arrivata.»"],
      unlock:{alibi2:"f_due_luci",crime2:"f_posta",others:"f_guardiacoste"},
      crime:[null,null,"«La lettera? L'ho lasciata giovedì nella cassetta del faro, come tutta la posta per lo scoglio. La ritira Jenna. L'ha sempre ritirata Jenna.» Si ferma, e capisce. «Dio mio.»"],
      self:"«Volevamo andare in America. Lei aveva i soldi, io due mani. Bastava attraversare la passerella.»",
      others:"«Ho portato il telegramma della guardia costiera di Porthcarrow. Guardi gli orari. Guardi a che ora si è spento il faro.»",
      react:{f_bibbia:"Tom legge la sua lettera nella Bibbia di Jenna. Non dice niente. Gli scendono le lacrime, e non le asciuga.",f_bottone:"«Corno. Jenna ha un cardigan grigio con i bottoni di corno. Gliel'ha fatto sua madre.»",f_lanterna_j:"«La lanterna cieca della casetta. La luce ferma al Pulpito si è accesa all'improvviso, come quando si apre lo sportello.»",f_corpo:"Tom non riesce a guardare."},
      def:["«Non lo so.»","«Mi lasci stare.»","«Lei doveva arrivare.»"]},
    isolde:{name:"Isolde Penrose",short:"Isolde",age:26,role:"La sposa",deadFrom:0,st:g=>g.act<2?"Scomparsa":"Morta",
      bio:"Figlia unica di Sir Josiah. Bella, colta, testarda. Ha sposato il capitano Tremayne ieri a mezzogiorno. Stamattina non c'era più.",p:{},loc:[]}
  },
  truth:[
    "Isolde Penrose non voleva sposare il capitano Tremayne. Amava Tom Kitto, il vice guardiano del faro, e aveva deciso di sparire facendosi credere morta.",
    "Il piano era suo, e Hester l'aiutò. Alle 23:30, durante la visita alla lanterna, Isolde annodò il velo alla ringhiera. Alle 2:55 uscì dalla dispensa, vestita da viaggio, con la valigetta e una lanterna, per attraversare la passerella con la bassa marea delle 3:12. Tom l'aspettava all'altro capo. Alle sei Hester posò la scarpetta sugli scogli e raccontò del sonnambulismo.",
    "Ma la lettera di Tom era passata per la cassetta della posta del faro, e la posta la ritirava Jenna Hosking, la ragazza che Tom aveva lasciato a giugno. Jenna la lesse, e la tenne nella Bibbia.",
    "A mezzanotte e un quarto Jenna mise due polveri di bromuro nella cioccolata del padre. Hosking si addormentò di guardia; nessuno pompò il bruciatore, e alle 3:04 la lanterna del faro si spense da sola. Nessuno la spense.",
    "Alle tre Jenna uscì dalla casetta. Il cane, che dormiva con lei, non abbaiò. Aspettò al Pulpito con la lanterna cieca chiusa. Quando Isolde arrivò, aprì lo sportello e la colpì con la gaffa. Isolde le strappò un bottone del cardigan, e cadde nella gola. Jenna tornò indietro prima della marea.",
    "Alle quattro meno cinque Hosking si svegliò, riaccese la lanterna e scrisse il falso nel registro, per vergogna. Tutti mentivano, quella notte: la sposa, la cameriera, il guardiano. Solo Jenna aveva detto, a modo suo, la verità: il mare si prende quello che vuole."
  ]
};

  {id:"d2_tazza",name:"La tazza dal bordo dorato",th:{T:2,B:-1},a:["e_tazze"],b:["e_servizio"],text:"Nel 4 c'è una tazza del vagone ristorante, con il cloralio sul fondo. Qualcuno l'ha portata da cena: e Sir Alastair ha lasciato la tavola alle 22:45 con una tazza in mano."},

/* il finale del caso II dipende dalla trappola */
CASE_EXPRESS.ending=function(ans,g,sl){
  const R=(k,title,eyebrow,paras)=>({kind:k,title,eyebrow,paras});const res=(sl&&sl.res)||[],ok=res.slice(0,4).filter(Boolean).length,trap=!!(sl&&sl.trap);
  if(trap&&ok>=3)return R("vera","Un'ultima cosa","Finale vero",[
    "«Ah, Sir Alastair… un'ultima cosa. La polizia di Inverness farà l'autopsia. Cercheranno il laudano nello stomaco, naturalmente. E il segno dell'ago.»",
    "«Ma quale ago? Tra le dita del piede sinistro non c'era nessun…»",
    "Si ferma. Nella carrozza ristorante non si sente più niente, nemmeno il vento.",
    "Nessuno, a parte te e il dottor Lyle, sapeva dell'ago. Nessuno sapeva dove fosse. Tranne l'uomo che ce l'aveva messo.",
    "«L'avrà visto stamattina, esaminando il corpo?» chiede piano il dottor Lyle. «Allora perché il suo certificato dice laudano, Sir Alastair?» Sir Alastair non risponde.",
    "Sir Alastair si sfila i guanti, con calma, dito per dito, come dopo un intervento. «Ventitré anni senza un errore in sala operatoria», dice. «E mi tradisce un piede.»",
    "Guarda Margaret. «Suo fratello era il miglior assistente che abbia mai avuto. È per questo che sapeva dove cercare.»",
    "Alle 18:30 arrivò la locomotiva da Inverness. Sir Alastair scese a Kingussie, come aveva previsto. Solo che, sul marciapiede, lo aspettavano due agenti della polizia della contea.",
    "La settimana dopo, il Re nominò un altro chirurgo. Il dossier degli undici nomi fu ricostruito dai registri di San Bartolomeo, in tre mesi.",
    "Hai incastrato un assassino che conoscevi dall'inizio. Questo era il caso: non chi, ma come."]);
  if((trap&&ok<3)||(!trap&&ok>=3))return R("quasi","Non provato","Finale parzialmente corretto",[
    trap?"La trappola è scattata: Sir Alastair ha nominato l'ago tra le dita del piede, e tutti l'hanno sentito. Ma il resto del tuo caso era fragile, e i suoi avvocati lo sapevano.":"Hai smontato il suicidio, l'ora della morte e l'alibi. Ma quando hai teso l'ultima trappola, Sir Alastair non ci è caduto. «Un ago? Ne parla tutto il treno, avvocato.»",
    "Il processo si tenne a Inverness, in aprile. I giornali di Londra mandarono i loro migliori cronisti.",
    "La giuria si ritirò per sei ore. Poi pronunciò il verdetto che solo la legge scozzese conosce: non colpevole, non innocente. Non provato.",
    "Sir Alastair Graham lasciò il tribunale libero, e non operò mai più. Il Re nominò un altro chirurgo.",
    "Margaret Pell, all'uscita, ti strinse la mano. «Non provato», disse. «Ma lo sappiamo, lei e io.»",
    "Il caso era giusto. Mancava un anello. Rigioca per chiudere il cerchio."]);
  if(ok>=1)return R("parziale","Un dubbio ragionevole","Finale parzialmente corretto",[
    "Hai mostrato ai presenti che qualcosa non tornava. Ma un dubbio non è una prova, e Sir Alastair è l'uomo più rispettato d'Inghilterra.",
    "La polizia di Inverness archiviò il caso come suicidio, con una nota a margine: «circostanze non del tutto chiarite».",
    "Sir Alastair fu nominato chirurgo di Sua Maestà la settimana dopo. Al ricevimento, qualcuno sentì che fischiettava.",
    "Hai visto il delitto con i tuoi occhi, nel prologo. Ora sai quanto è difficile dimostrarlo. Rigioca."]);
  return R("errato","Il suicidio di Henry Pell","Finale errato",[
    "Sir Alastair ti ha ascoltato con pazienza, poi ha posato una mano sulla spalla di Margaret. «Il dolore, signorina. Il dolore.»",
    "Il certificato di morte, firmato da lui, diceva: suicidio per laudano, tra mezzanotte e l'una.",
    "Alle 18:30 arrivò la locomotiva. Sir Alastair scese a Kingussie, salutò con il cappello, e la settimana dopo operò il Re.",
    "Il delitto perfetto esiste, avvocato. Sono quelli che nessuno dimostra. Rigioca."]);

/* ---------- La trappola ---------- */
let TP=null;
function trapScene(onDone){lyleHide();clearTimeout(lyleT);TP={i:0,res:[],trap:false,onDone,r:null};$("#salon").classList.add("on");AU.sfx("drone");renderTrap();}
function renderTrap(){const T=S.trap||S.confronto,st=T.steps[TP.i],foc=T.who||S.culprit;
  const ring=T.cast.map((id,i)=>{const c=S.chars[id];return `<div class="seat s${i} ${id===foc?"focus acc":""}"><div class="pf">${portrait(c.p)}</div><div class="nm">${c.short}</div></div>`;}).join("");
  const res=TP.r?`<p class="sres ${TP.r.ok?"ok":"no"}">${TP.r.text}</p>`:"";
  $("#salon").innerHTML=`<div class="s-top"><div class="eb">${T.title||"Carrozza ristorante · La trappola"}</div><div class="s-prog">${T.steps.map((_,i)=>`<i class="${i<TP.i?"d":i===TP.i?"c":""}"></i>`).join("")}</div></div>
  <div class="s-ring"><div class="fire"></div>${ring}</div>
  <div class="s-text"><p class="ssay">${st.say}</p>${res}</div>
  <div class="s-act">${TP.r?`<button class="btn red" onclick="trapNext()">${TP.i<T.steps.length-1?"Avanti":"Concludi"}</button>`:
    `<div class="s-lab">${st.lab}</div><button class="btn red big" onclick="trapOpenPick()">${st.secret?"Scegli il dettaglio":"Scegli la prova"}</button>
    ${st.secret?"":`<button class="btn ink sm" onclick="trapPick(null)">Non ho una prova</button>`}`}</div>`;}
function trapPick(id){const st=(S.trap||S.confronto).steps[TP.i];let ok=!!id&&st.ok.includes(id),text;
  if(id==="e_ago"&&!st.secret)G.agoKnown=1;
  if(st.secret){if(ok&&!G.agoKnown){TP.trap=true;text=`<span class="pres">«…e il segno dell'ago, naturalmente.»</span> Sir Alastair, già in piedi, si volta: «Ma quale ago? Tra le dita del piede sinistro non c'era nessun…» Si ferma. Nessuno, oltre a te e al dottor Lyle, sapeva dell'ago. Nessuno sapeva dove fosse. E se l'avesse visto stamattina, esaminando il corpo, il suo certificato non direbbe «laudano».`;AU.sfx("gavel");AU.duck();}
    else if(ok){ok=false;text=`<span class="pres">«…e il segno dell'ago.»</span> Sir Alastair sorride. «Tra le dita del piede, sì. Ne parla tutto il treno, avvocato.» Lo sapeva già: qualcuno gliel'ha detto. La trappola non scatta.`;}
    else text=`<span class="pres">«…${id?S.clues[id].name.toLowerCase():"niente"}.»</span> Sir Alastair ti guarda con compatimento. «È tutto, avvocato? Allora, con permesso.» Non è cascato in niente.`;}
  else{TP.res[TP.i]=ok;text=(id?`<span class="pres">Presenti: ${S.clues[id].name}.</span> `:"")+(ok?st.good:st.bad);}
  TP.r={ok,text};AU.sfx(ok?"stamp":"tick");if(ok)pressCulprit(15);renderTrap();}
function trapOpenPick(){const st=(S.trap||S.confronto).steps[TP.i];openPicker({title:st.lab,sub:st.say.replace(/<[^>]+>/g,""),act:"Presenta",none:st.secret?null:"Non ho una prova",onPick:trapPick});}
function trapNext(){const TT=S.trap||S.confronto;TP.r=null;TP.i++;AU.sfx("page");if(TP.i<TT.steps.length){renderTrap();return;}
  const sl={res:TP.res,trap:TP.trap,ok:TP.res.filter(Boolean).length+(TP.trap?1:0),n:TT.steps.length,dec:TP.trap,failed:[]};
  const e=TP.onDone(sl),fin=()=>{$("#salon").classList.remove("on");showEnding();};
  if(e.kind==="vera"&&S.trap)gloveScene(fin,"Sir Alastair si sfila i guanti, con calma, dito per dito, come dopo un intervento.");else{shake();lightning();setTimeout(fin,500);}}

    {t:"Le mani",ok:1,say:"«Ha le mani screpolate dal sale fino ai polsi, Jenna. Come chi le ha tenute a lungo nell'acqua di mare. Non nell'acqua dei panni: quella non screpola così.»",reply:"Jenna nasconde le mani sotto il grembiule. «Ho lavato i panni. Col freddo.»"}]};
  Object.assign(OBJ,{
    "hosking|alibi0":{ok:["f_tazza","f_pompa","f_obs_hosking","d3_sonno"],unlock:"f_sonno",a:"Il guardiano guarda la tazza, poi la pompa, poi te. Si siede sul gradino della scala. «Mi sono addormentato. Dopo la cioccolata. Mi sono svegliato alle quattro meno cinque, gelato, e il faro era al buio.» Si copre la faccia. «Ventidue anni. Ho scritto il falso sul registro. Dio mi perdoni.»"},
    "hosking|alibi1":{ok:["f_tazza","f_pompa","f_obs_hosking","d3_sonno"],unlock:"f_sonno",a:"Hosking chiude gli occhi. «Va bene. Dormivo. Mi sono svegliato alle quattro meno cinque e il faro era spento. Ho scritto il falso sul registro.» Una pausa. «Non so come sia successo. Non mi addormento mai.»"},
    "hosking|crime1":{ok:["f_guardiacoste","f_almanacco"],a:"«Il vento calato?» Hosking legge, e si passa una mano sulla barba. «Tra le due e mezza e le quattro. Con la sizigia.» Ti guarda. «Allora si passava. Si passava benissimo.»"},
    "hester|alibi0":{ok:["f_letto","f_vestiti","f_velo","f_scarpetta","f_portagioie","d3_nodo","d3_uscita"],a:"Hester impallidisce. «Il letto… sì. Non si era coricata. Sarà salita prima.» Le trema la voce. Sta ancora difendendo qualcosa, e non è una bugia sua."},
    "hester|alibi1":{ok:["f_banca","f_foto_tom","f_almanacco","d3_fuga"],unlock:"f_piano",a:"Hester guarda la fotografia di Tom, o la lettera della banca, e qualcosa in lei si scioglie. Ride e piange insieme. «Non è caduta! È viva, signore! Il velo l'ha legato lei, la scarpetta l'ho messa io alle sei. Alle tre è passata dalla passerella, con la bassa marea. Tom l'aspettava. A quest'ora sono a Plymouth. È viva!»"},
    "tremayne|alibi0":{ok:["f_galleria_01"],unlock:"f_rumori",a:"«Va bene: all'una e dieci sono salito a fumare in galleria. Ho guardato il mare e ho pensato di buttarmi.» Ride, amaro. «Poi sono tornato a letto. E verso le tre e un quarto ho sentito qualcuno muoversi nella camera della sposa. Ho pensato: almeno lei dorme. Non sono entrato.»"},
    "jenna|alibi0":{ok:["f_lanterna_j","d3_cane","f_obs_jenna","f_gonna"],a:"Jenna non abbassa gli occhi. «Sono uscita un momento, va bene? A vedere se la barca era legata, col vento. Cinque minuti.» Una bugia nuova, detta bene. Ma adesso sai che è uscita."},
    "jenna|alibi2":{ok:["d3_alga","d3_due","f_gonna","f_lanterna_j"],a:"Jenna stringe il grembiule. «Ero in casa.» Ma la voce le si rompe a metà della frase, e non la riprende."},
    "jenna|crime2":{ok:["d3_bottone","f_cardigan","f_bottone"],a:"Jenna guarda il bottone di corno. Per la prima volta, non risponde niente. Si porta una mano al collo, dove una volta portava l'anello di Tom."}
  });
  Object.assign(TAVOLE,{f_piano:{who:"hester",cap:"«Non è caduta! È viva, signore!»"},f_due_luci:{who:"tom",cap:"«Due luci. Poi una sola.»"},f_sonno:{who:"hosking",cap:"«Ventidue anni. Dio mi perdoni.»"},f_posta:{who:"tom",cap:"«La ritira Jenna.» Si ferma, e capisce."}});

CASE_FARO.deductions=[
  {id:"d3_nodo",name:"Una messinscena",th:{A:-3,B:1},a:["f_velo"],b:["f_scarpetta","f_letto"],text:"Il velo è annodato, e fradicio della pioggia della notte. La scarpetta è asciutta, posata dopo le 2:30. Nessuno è caduto dal faro: qualcuno ha preparato la scena di una caduta."},
  {id:"d3_uscita",name:"È uscita vestita per partire",th:{A:-2,B:2},a:["f_letto","f_chiavistello"],b:["f_vestiti","f_scarpe_d"],text:"Non si è mai coricata. Si è messa gli stivaletti e il tailleur da viaggio ed è uscita dalla porta della dispensa, verso la passerella. Non tornando."},
  {id:"d3_fuga",name:"La fuga delle 3:12",th:{B:3},a:["f_banca","f_portagioie"],b:["f_almanacco","f_foto_tom"],text:"Quattrocento sterline in contanti, i gioielli, un passaporto nuovo. E la passerella scoperta alle 3:12, con un uomo che l'aspettava a terra. La sposa non è caduta: è fuggita."},
  {id:"d3_sonno",name:"Si è spenta da sola",th:{A:-1,T:1},a:["f_tazza"],b:["f_pompa","f_registro_faro"],text:"Il bruciatore va pompato ogni mezz'ora. Se il guardiano dorme, la fiamma si spegne da sola. Nessuno ha spento la lanterna: qualcuno ha addormentato il guardiano."},
  {id:"d3_bromuro",name:"Il bromuro di Jenna",th:{T:3},a:["f_tazza"],b:["f_bromuro","f_ricetta"],text:"Nella cioccolata del guardiano c'era bromuro, non il cloralio della sposa, che è intatto. Il bromuro l'ha prescritto Vane a Jenna. La cioccolata la prepara Jenna."},
  {id:"d3_cane",name:"Il cane che non abbaiò",th:{T:2},a:["f_cane"],b:["f_lanterna_j","f_obs_jenna"],text:"Il cane ha abbaiato alle 2:55, per la sposa che usciva dalla villa. Non ha abbaiato per chi è uscito dalla casetta, con la lanterna cieca: qualcuno che conosceva, e con cui dormiva."},
  {id:"d3_due",name:"La seconda luce",th:{T:3,B:-2},a:["f_due_luci"],b:["f_lanterna_j"],text:"La luce ferma al Pulpito si è accesa all'improvviso, come quando si apre lo sportello di una lanterna cieca. E la lanterna cieca della casetta ha lo stoppino bruciato e il sale sul vetro."},
  {id:"d3_alga",name:"La gonna è stata al Pulpito",th:{T:3},a:["f_gonna"],b:["f_alga"],text:"L'alga rossa impigliata all'orlo della gonna nascosta sotto le reti cresce solo sul Pulpito. Chi portava quella gonna, stanotte, è stato lì."},
  {id:"d3_gaffa",name:"L'arma è la gaffa",th:{T:2},a:["f_gaffa"],b:["f_ferita"],text:"La ferita a mezzaluna con il foro al centro ha la forma esatta del gancio della gaffa. Che è stata rimessa al gancio sbagliato, con la ruggine fresca e un capello biondo."},
  {id:"d3_bottone",name:"Il bottone di Jenna",th:{T:3},a:["f_bottone"],b:["f_cardigan"],text:"Il bottone di corno nella mano di Isolde viene dal cardigan grigio nascosto nel baule di Jenna. Il filo è strappato: glielo ha strappato lei, cadendo."},
  {id:"d3_lettera",name:"Jenna sapeva",th:{T:3},a:["f_bibbia"],b:["f_posta"],text:"La lettera di Tom con l'ora della marea è passata per la cassetta del faro, e la posta la ritira Jenna. Ora è nella sua Bibbia. Jenna sapeva dove e quando."},
  {id:"d3_hester",name:"Hester era nella camera",th:{C:-1},a:["f_rumori"],b:["f_piano"],text:"Alle tre e un quarto, nella camera della sposa, qualcuno si muoveva per far credere che Isolde dormisse: era Hester. Non poteva essere al Pulpito."},
  {id:"d3_buio",name:"Un'ora al buio",th:{T:1},a:["f_guardiacoste"],b:["f_sonno","f_registro_faro"],text:"La guardia costiera ha visto il faro spento dalle 3:04 alle 3:58, non dalle 3 alle 3:20 come dice il registro. E il vento era calato: alle tre la passerella si poteva attraversare."}
];

  {say:"«Jenna. Stanotte non hai dormito.»",lab:"Presenta la prova che Jenna era sulla passerella",ok:["d3_alga","d3_due","d3_cane","f_gonna","f_lanterna_j"],good:"«Il cane non ha abbaiato per te. La tua lanterna cieca ha il sale sul vetro. E l'alga del Pulpito era impigliata alla tua gonna, sotto le reti.» Hosking si volta verso la figlia, lentamente.",bad:"Jenna ti guarda senza espressione. «Ero in casa. Il cane è testimone.»"},
  {say:"«E sapevi dove aspettarla, e a che ora.»",lab:"Presenta la prova che Jenna conosceva l'appuntamento",ok:["d3_lettera","f_bibbia","f_posta"],good:"Posi sul tavolo la lettera di Tom, trovata nella Bibbia. «La posta per lo scoglio la ritiri tu.» Tom si copre la faccia con le mani.",bad:"«Quale appuntamento? Io non sapevo niente di loro due.»"},
  {say:"«E lei, prima di cadere, ti ha strappato questo.»",lab:"Presenta la prova decisiva",ok:["d3_bottone","f_bottone","f_cardigan"],good:"Il bottone di corno, sul tavolo, accanto al cardigan grigio con il filo strappato. Jenna lo guarda a lungo. Poi, piano, sorride.",bad:"Jenna non abbassa gli occhi. «Lei non ha niente, avvocato. Solo il mare. E il mare non parla.»"}]};

CASE_FARO.ending=function(ans,g,sl){const R=(k,title,eyebrow,paras)=>({kind:k,title,eyebrow,paras});
  const right={t1:"velo",t2:"bromuro",t3:"isolde",t4:"jenna",t5:"nessuno",t6:"gaffa",t7:"falso"},tl=Object.keys(right).filter(k=>ans[k]===right[k]).length,res=(sl&&sl.res)||[],pr=res.filter(Boolean).length;
  if(ans.t3==="sonnamb")return R("errato","La sonnambula","Finale errato",[
    "Hai confermato la versione di Sir Josiah: una sposa sonnambula, una galleria, il mare.","Il sergente di Penzance chiuse il verbale in mezz'ora. Sir Josiah ti strinse la mano. Il capitano Tremayne ereditò la dote.","Alle 15:37 del giorno dopo, con la bassa marea, un pescatore trovò nella gola sotto il Pulpito il corpo di una donna in stivaletti da viaggio. Nessuno pensò di chiederti perché una sonnambula si fosse messa gli stivaletti.","Lo scoglio aveva mentito, e tu gli hai creduto. Rigioca."]);
  if(ans.t6==="fuga")return R("errato","È in America","Finale errato",[
    "Hai annunciato a tutti la verità, o quella che sembrava la verità: Isolde è viva. Ha inscenato la propria morte ed è fuggita con Tom Kitto verso l'America.","Hester pianse di gioia. Sir Josiah si chiuse nello studio. Il capitano Tremayne ruppe un altro bicchiere.","Poi, alle quattro del pomeriggio, una barca arrivò da terra con la calma del mare. A bordo c'era Tom Kitto, solo. «Non è mai arrivata», disse. «L'ho aspettata fino alle quattro.»","Tutto quello che avevi scoperto era vero. Ti sei fermato a metà. Rigioca."]);
  if(ans.who!=="jenna"){const W={
    tremayne:"Hai accusato il capitano Tremayne. Era il colpevole perfetto: geloso, violento, in galleria all'una. Ma all'una e venti era già sceso, e alle tre e un quarto era nel camerino, ad ascoltare Hester che fingeva di essere la sposa. I suoi avvocati lo fecero uscire in una settimana.",
    hester:"Hai accusato Hester Pascoe. Aveva mentito su tutto, aveva scritto le lettere, aveva posato la scarpetta. Ma alle tre e un quarto era nella camera della sposa, e il capitano l'aveva sentita attraverso la parete. Hester aveva aiutato Isolde a fuggire. Non l'aveva uccisa.",
    hosking:"Hai accusato il guardiano Hosking. Aveva mentito sul registro, e il faro era stato al buio per un'ora. Ma dormiva: drogato con la cioccolata di mezzanotte. Chi gliel'aveva preparata, la cioccolata?",
    vane:"Hai accusato il dottor Vane. Aveva le medicine, aveva un debole per la sposa. Ma il bromuro l'aveva prescritto lui, e la sua stessa ricetta indicava un'altra persona.",
    josiah:"Hai accusato Sir Josiah. Voleva la versione dell'incidente a ogni costo, per lo scandalo e per le miniere. Ma un padre che vuole nascondere uno scandalo non è un padre che uccide la figlia, e alle tre Sir Josiah russava così forte che lo sentiva tutta la villa."};
    return R("errato","La persona sbagliata","Finale errato",[W[ans.who]||W.tremayne,"Quella notte, sullo scoglio, la sola persona a cui nessuno aveva fatto domande andò a dormire presto. Il cane dormiva con lei.","Hai seguito le bugie di tutti. Non quella giusta. Rigioca."]);}
  if(tl>=6&&pr>=2&&res[2])return R("vera","Il mare restituisce","Finale vero",[
    "Li hai riuniti nel salotto di Morwenna House, con la marea che risaliva. Hai raccontato la notte ora per ora: il velo annodato alle 23:30, la cioccolata di mezzanotte, la porta della dispensa alle 2:55.",
    "«Nessuno ha spento il faro, signori. Si è spento da solo, perché il guardiano dormiva. E il guardiano dormiva perché qualcuno gli aveva messo nella cioccolata due polveri di bromuro.»",
    "Hosking non guarda te. Guarda sua figlia.",
    "«Alle tre il cane non ha abbaiato, Jenna. Non per te. Hai aspettato al Pulpito con la lanterna cieca chiusa. Quando lei è arrivata, hai aperto lo sportello. Tom ha visto la tua luce accendersi.»",
    "Jenna Hosking non piange. Si porta una mano al collo, dove una volta c'era l'anello di Tom. «L'avevo letto nella sua lettera», dice, piano. «La bassa marea delle tre e dodici. Pensavo: se il mare se la prende, nessuno lo saprà mai. Il mare si prende sempre quello che vuole.»",
    "«Io lo conoscevo da quando avevo sei anni», aggiunge, guardando Tom. «Lei da tre mesi.»",
    "Il sergente di Penzance arrivò con la barca delle sei. Jacob Hosking accompagnò la figlia fino alla barca, poi risalì la scala del faro e accese la lanterna, alle otto in punto, come ogni sera per ventidue anni.",
    "Quella notte non si spense nemmeno per un minuto.",
    "Hai ricostruito la notte, ora per ora. Il caso più difficile dell'archivio."]);
  if(tl>=4&&pr>=1)return R("quasi","Una ragazza del faro","Finale parzialmente corretto",[
    "Hai indicato Jenna Hosking, e avevi ragione. Ma la tua ricostruzione della notte aveva dei buchi, e la difesa li trovò tutti.",
    "Al processo di Bodmin, l'avvocato di Jenna sostenne che Isolde era scivolata sulle alghe del Pulpito, e che la ragazza era uscita solo per cercarla. La giuria ascoltò, e non seppe decidere.",
    "Jenna fu condannata per occultamento e falsa testimonianza. Tre anni.","Tom Kitto lasciò la Trinity House e partì per l'America da solo, con un biglietto per due.",
    "Hai trovato l'assassina. Non tutta la notte. Rigioca per ricostruirla."]);
  return R("parziale","Il dubbio","Finale parzialmente corretto",[
    "Hai accusato Jenna Hosking, ma senza una ricostruzione solida né una prova che la legasse alla passerella.","Il sergente la interrogò per un'ora. Jenna rispose a ogni domanda con calma, e il cane dormiva ai suoi piedi.","Il caso fu chiuso come «morte per annegamento, circostanze non chiarite».","Avevi il nome giusto e nient'altro. Rigioca."]);
};
CASE_FARO.tips={
  start:"«Una sposa sonnambula, uno scoglio da cui non si esce, un faro che si spegne. Troppe cose impossibili in una notte sola: quando succede, di solito qualcuno mente. Forse più di uno.»",
  act1:"«Se la sposa è uscita vestita da viaggio, non dormiva. E chi esce di notte da uno scoglio ha bisogno di un'ora precisa, e di qualcuno che lo aspetti.»",
  act2:"«La passerella resterà scoperta fino alle 16:15, poi il mare se la riprende. E alle 17:30 arriva la polizia di Penzance. Non sprechi la marea.»"
};
CASE_FARO.lyleDed={
  d3_nodo:"«Il vento strappa, non annoda. E una scarpetta asciutta dopo una notte di pioggia è una scarpetta posata, non caduta. Qualcuno ha apparecchiato la tavola per noi.»",
  d3_uscita:"«Una sonnambula in stivaletti allacciati. Non l'ho mai vista in trent'anni di letture.»",
  d3_fuga:"«È fuggita!» Lyle sembra quasi felice. «Allora è viva. Allora…» Si ferma. «Allora perché ho questa brutta sensazione?»",
  d3_sonno:"«Nessuno ha spento il faro. È questo il trucco: tutti cercavamo una mano, e non c'era nessuna mano.»",
  d3_bromuro:"«Il bromuro della ragazza nella cioccolata del padre.» Lyle si toglie gli occhiali. «Che cosa terribile, se è quello che penso.»",
  d3_cane:"«Il cane che non abbaiò.» Lyle sorride, triste. «Il mio autore preferito ci avrebbe scritto un racconto intero.»",
  d3_due:"«La seconda luce. Qualcuno aspettava al Pulpito, al buio, con lo sportello chiuso.»",
  d3_alga:"«L'alga del Pulpito sulla gonna sotto le reti. Il mare cancella le orme, ma le alghe restano attaccate.»",
  d3_gaffa:"«La gaffa del capanno. Un'arma che tutti, sullo scoglio, hanno sotto gli occhi ogni giorno.»",
  d3_bottone:"«L'ultima cosa che ha fatto Isolde Penrose, avvocato, è stata strappare un bottone. Per noi.»",
  d3_lettera:"«La lettera di Tom nella Bibbia di Jenna. Non ha avuto il cuore di bruciarla. L'amore è il peggior complice.»",
  d3_hester:"«Hester recitava la parte della padrona addormentata. Una bugia d'amore, non di sangue.»",
  d3_buio:"«Un'ora al buio, e il vento calato. Alle tre, la passerella si attraversava benissimo. Chiunque poteva farlo. Chiunque sapesse.»"

/* ---------------- CASO IV: LA CASA DELLO SPECCHIO ---------------- */
const CASE_SPECCHIO={
  id:"specchio",num:"Caso IV",title:"La Casa dello Specchio",
  year:"Galles del Nord · ottobre 1913",issue:"N. IV · Ottobre 1913",art:"plas",
  plate:"«L'occhio crede all'architetto.»",
  blurb:"Un architetto famoso per le sue case impossibili, una villa perfettamente simmetrica, tre testimoni che lo vedono vivo alla finestra alle dieci. Alle dieci e un quarto lo trovano morto, chiuso dentro, freddo da più di un'ora. Tutti dicono la verità. È la casa che mente.",
  start:{room:"studio_h"},
  mapTitle:"Plas Gwydr",mapSub:"pianta ufficiale, firmata A. Halloway, 1888",
  accuseTitle:"La ricostruzione",
  accuseDesc:"Ricostruisci la notte di Plas Gwydr, ora per ora. Ogni carta richiede una prova. Poi nomina chi ha ucciso Ambrose Halloway.",
  acts:[
    {label:"Atto I · Venerdì notte",title:"L'uomo alla finestra",start:22*60+45,actions:8,room:"studio_h",plate:"«L'abbiamo visto. Alle dieci era vivo.»",
     intro:["Alle 22:10 uno sparo dalla casa. La finestra illuminata si spegne.","Alle 22:25 Rupert Halloway e il maggiordomo sfondano la porta dello studio, chiusa col paletto dall'interno. Ambrose Halloway è morto alla scrivania, con il revolver in mano.","«Si è ucciso», dice la vedova. Il dottor Rhys gli tocca il collo, e aggrotta la fronte. «È freddo», mormora. «Troppo freddo.»"]},
    {label:"Atto II · Sabato mattina",title:"I quattro metri",start:9*60,actions:8,room:"giardino_h",plate:"Una casa simmetrica non ha segreti. In teoria.",
     intro:["Il temporale è passato. Il lago è immobile come uno specchio, e la facciata di Plas Gwydr ci si riflette intera.","La polizia di Bangor arriverà stasera: la strada del passo è franata. Il notaio non verrà affatto.","Halloway aveva promesso di mostrare a tutti un segreto, stamattina. Nessuno sa quale."]},
    {label:"Atto III · Sabato pomeriggio",title:"La stanza riflessa",start:15*60,actions:8,room:"salone_h",plate:"Due stanze, una sola verità.",
     intro:["La notizia è arrivata col ragazzo del telegrafo: la strada è riaperta. L'ispettore di Bangor sarà qui alle sei.","Celia Halloway ha fatto preparare il tè. Nessuno lo beve.","Ognuno, in questa casa, ha visto una cosa diversa. O forse tutti hanno visto la stessa cosa, dalla parte sbagliata."]}
  ],
  forced:{eyebrow:"Sabato, 17:00",title:"L'ispettore di Bangor",paras:["Una carrozza risale il viale tra i tassi. L'ispettore Lloyd scende con due agenti e un'aria stanca.","Vuole un nome e una spiegazione, adesso. Hai quello che hai."]},
  items:{},
  theories:{
    A:{name:"Il suicidio",desc:"Halloway si è chiuso nello studio e si è sparato alle 22:10. Il paletto, il revolver nella mano, i testimoni. Così dice la vedova."},
    B:{name:"Il figlio diseredato",desc:"Rupert Halloway sarebbe stato diseredato domattina, davanti al notaio. È stato lui a sfondare la porta: il primo a entrare, il primo a toccare tutto."},
    C:{name:"La moglie e il critico",desc:"Celia Halloway e Felix Arden si scrivono lettere che un marito non dovrebbe leggere. Ed erano insieme, sotto lo stesso ombrello, a guardare la finestra."},
    T:{name:"La casa mente",hiddenName:"Una finestra di troppo…",desc:"I testimoni non mentono. Hanno visto una stanza che non era quella che credevano."}
  },
  clues:{
    g_corpo:{name:"Il corpo alla scrivania",cat:"Osservazione",th:{A:1},text:"Ambrose Halloway è seduto alla scrivania, la testa sul piano. Ha un foro alla tempia destra, con l'alone nero di un colpo a bruciapelo. Il revolver è nella mano destra. Il polso destro è stretto in una stecca di legno e garza."},
    g_revolver:{name:"Il Webley dello studio",cat:"Reperto",th:{A:1},text:"Il revolver d'ordinanza di Halloway, un Webley a sei colpi. Una sola camera sparata. La canna è fredda, e l'odore della polvere quasi svanito."},
    g_paletto:{name:"Il paletto",cat:"Osservazione",th:{A:2},text:"La porta di quercia era chiusa col paletto dall'interno: il ferro è ancora nell'anello, strappato dalla spallata. Nessuno è uscito dalla porta."},
    g_persiane:{name:"Le persiane chiuse",cat:"Osservazione",th:{A:-1,T:2},text:"Le persiane interne dello studio sono chiuse e fermate con il gancio. Il gancio è coperto da una ragnatela intatta tra la persiana e il telaio. Da ore, forse da giorni, nessuno le apre."},
    g_lampada:{name:"La lampada fredda",cat:"Osservazione",th:{A:-1,T:2},text:"La lampada a petrolio dal paralume verde, a destra della scrivania, è spenta. Il vetro è freddo come il marmo, e lo stoppino è asciutto: stasera non è stata accesa, o è stata spenta da più di un'ora."},
    g_montavivande:{name:"Il montavivande",cat:"Osservazione",th:{A:-1,T:1},text:"Nella parete dello studio, uno sportello di legno: il montavivande che sale dalla dispensa, così Halloway poteva cenare senza scendere. La cabina non c'è: è giù, al pianterreno. Lo spazio è stretto, ma una persona minuta, rannicchiata, ci starebbe."},
    g_scrittoio:{name:"Lo scrittoio",cat:"Osservazione",th:{A:-1},text:"Sulla scrivania, la penna è posata a sinistra del calamaio, e il foglio è coperto di una scrittura grande e incerta, con la sinistra. Da martedì Halloway scriveva così: la destra non la poteva usare."},
    g_testamento:{name:"Il nuovo testamento",cat:"Documento",th:{B:3},text:"Nel cassetto della scrivania, la minuta di un nuovo testamento, da firmare sabato davanti al notaio: a Rupert Halloway «non lascio niente, perché tutto quello che gli ho dato l'ha già perso alle carte»."},
    g_istruzioni:{name:"Le istruzioni della dimostrazione",cat:"Documento",th:{T:2},text:"Un cartoncino scritto con la sinistra, in grande: «Alle 22 in punto, luci spente su tutta la facciata. Andate alla meridiana e guardate la mia finestra. Resterà accesa una sola luce. Domattina vi spiegherò che cosa avete visto. A. H.»"},
    g_lettera:{name:"La lettera nella cartella",cat:"Documento",th:{C:3},text:"Nella cartella di Felix Arden, una lettera di Celia: «Dopo la dimostrazione di sabato glielo dirò. Non posso più fingere di ammirare le sue case. Mi sembrano tutte prigioni.»"},
    g_pennino:{name:"Il pennino nella cabina",cat:"Reperto",th:{T:2},text:"Sul fondo della cabina del montavivande, nella dispensa, un pennino d'acciaio da disegno, sottilissimo, con la punta sporca di china nera. E sulle assi, una sbavatura nera, come di una manica."},
    g_tuono:{name:"Il tuono delle 21:20",cat:"Testimonianza",th:{T:1},text:"Hughes, il maggiordomo: alle 21:20 un tuono tremendo, la fiamma del gas in cucina si è abbassata, e lui ha guardato l'orologio d'istinto. In salone, nello stesso momento, la signora ha smesso di suonare."},
    g_montav_scende:{name:"Il montavivande scende vuoto",cat:"Testimonianza",th:{T:2},text:"Hughes: verso le 21:30 ha sentito il montavivande scendere nella dispensa. Ha pensato che il padrone rimandasse giù il vassoio. Quando è andato ad aprire lo sportello, qualche minuto dopo, la cabina era vuota."},
    g_owen_alibi:{name:"Il capomastro a cena",cat:"Testimonianza",th:{},text:"Hughes: Owen Pryce, il capomastro, ha cenato in cucina con lui e la cuoca dalle otto e mezza alle dieci meno un quarto. Al tuono delle 21:20 era seduto al tavolo, e ha rovesciato la birra."},
    g_freddo:{name:"Il corpo freddo",cat:"Testimonianza",th:{A:-2,T:2},text:"Il dottor Rhys: alle 22:30 il corpo era freddo alle mani, e la mascella cominciava a irrigidirsi. «Un uomo che muore alle dieci e dieci non è così, venti minuti dopo. Direi un'ora, forse di più.»"},
    g_polso:{name:"Il polso steccato",cat:"Testimonianza",th:{A:-3},text:"Il dottor Rhys: martedì Halloway è caduto in cantiere e si è rotto il polso destro. Gliel'ha steccato lui stesso. «Non riusciva a stringere una tazza. Un Webley pesa più di un chilo, e scalcia come un mulo.»"},
    g_testimoni:{name:"Che cosa hanno visto",cat:"Testimonianza",th:{A:1},text:"Felix Arden: «Alle dieci l'abbiamo visto tutti. Seduto alla scrivania, di profilo, in giacca da camera rossa e berretto di velluto, che scriveva veloce, chino sul foglio. La lampada verde era a sinistra della scrivania. Ha scritto per dieci minuti. Poi lo sparo, e la luce si è spenta.»"},
    g_sinistra:{name:"La finestra a sinistra",cat:"Testimonianza",th:{T:1},text:"Rupert Halloway: «Eravamo alla meridiana, con gli ombrelli. Tutta la casa al buio, e una finestra accesa al primo piano: la prima a sinistra del portico, in fondo all'ala. Lo studio di mio padre, no?»"},
    g_schizzo:{name:"Lo schizzo delle dieci",cat:"Documento",th:{T:2},text:"Nel taccuino di Felix Arden, uno schizzo a matita fatto sotto la pioggia: la facciata di Plas Gwydr al buio, il portico al centro, e una sola finestra accesa, in alto, all'estremità sinistra. Annotazione: «22:00. L'architetto veglia. Che teatro.»"},
    g_studio_pos:{name:"Dov'è lo studio",cat:"Osservazione",th:{T:2},text:"Dalla meridiana, guardando la casa: l'ala est è a destra del portico. Lo studio di Halloway è la prima finestra a destra, in fondo all'ala est, al primo piano. A sinistra, in fondo all'ala ovest, c'è la finestra gemella. Secondo la pianta, non dà su nessuna stanza."},
    g_facciata:{name:"La targa della meridiana",cat:"Documento",th:{T:1},text:"Sulla meridiana, una targa d'ottone: «Plas Gwydr, 1888. Ambrose Halloway, architetto. Quarantaquattro metri di facciata, due ali di ventidue: perché l'occhio ami ciò che è uguale.»"},
    g_vetri:{name:"I vetri sulla ghiaia",cat:"Osservazione",th:{T:2},text:"Sotto l'ultima finestra dell'ala ovest, al primo piano, schegge di vetro sulla ghiaia bagnata. Alzi gli occhi: in un riquadro della finestra c'è un foro rotondo, con le crepe a stella. Qualcosa è uscito dalla finestra, con forza."},
    g_pianta:{name:"La pianta ufficiale",cat:"Documento",th:{},text:"La pianta del primo piano, firmata Halloway, 1888. Le due ali sono identiche: dal pianerottolo, ventidue metri. Ma mentre l'ala est finisce con lo studio, nell'ala ovest il corridoio finisce contro un muro maestro, tratteggiato. Dietro, niente."},
    g_corridoio:{name:"Il corridoio ovest",cat:"Osservazione",th:{T:2},text:"Misuri il corridoio dell'ala ovest a passi, poi con il metro del capomastro: diciotto metri dal pianerottolo al muro di fondo, dove è appeso un grande ritratto di Halloway giovane. L'ala è lunga ventidue metri. Mancano quattro metri."},
    g_lucido:{name:"I lucidi della «Stanza B»",cat:"Documento",th:{T:3},text:"Tra i lucidi della sala disegni, una serie siglata «Stanza B», 1911: lo studio di Halloway, misura per misura, ma ribaltato. Il camino a sinistra invece che a destra, la porta, la lampada, tutto. Nell'angolo, la sigla della disegnatrice: B. H."},
    g_archivio:{name:"Il registro dell'archivio",cat:"Documento",th:{T:1},text:"Il registro dell'archivio di Halloway, tenuto da Miss Hale con una calligrafia perfetta. Alla voce «Bangor, Assembly Rooms, 1899», una riga aggiunta a settembre dalla mano sinistra e incerta di Halloway: «Foglio dei calcoli delle travi: MANCANTE.»"},
    g_pennini:{name:"La scatola dei pennini",cat:"Reperto",th:{T:1},text:"La scatola di pennini da disegno di Miss Hale, con l'etichetta di un fornitore di Londra. Dodici scomparti. Uno è vuoto."},
    g_owen_sa:{name:"La stanza gemella",cat:"Testimonianza",th:{A:-2,T:3},text:"Owen Pryce confessa: nel 1911 ha costruito per Halloway una copia esatta dello studio in fondo all'ala ovest, dietro il ritratto. Rovesciata, come un riflesso, sui disegni di Miss Hale. «Il padrone diceva: domattina vi mostrerò che l'occhio crede all'architetto. Lo sapevamo in tre: lui, io e la signorina.»"},
    g_specchio:{name:"La stanza riflessa",cat:"Osservazione",th:{T:3},text:"Lo studio, ma ribaltato come in uno specchio. Il camino e la porta a sinistra, la scrivania di fronte alla finestra. E la lampada dal paralume verde a sinistra della scrivania. Le persiane sono aperte."},
    g_giacca2:{name:"La seconda giacca rossa",cat:"Reperto",th:{T:3},text:"Sulla sedia, una giacca da camera di velluto rosso, identica a quella del morto, con il berretto nero sul bracciolo. Le maniche sono state rimboccate due volte, per braccia più corte. E all'interno del polsino destro, una macchia di china nera."},
    g_revolver2:{name:"Il secondo Webley",cat:"Reperto",th:{A:-2,T:2},text:"Nel cassetto della scrivania gemella, un altro Webley identico a quello dello studio. Una camera sparata. In questa stanza, la polvere da sparo si sente ancora."},
    g_proiettile:{name:"Il foro nel vetro",cat:"Reperto",th:{T:2},text:"Un riquadro della finestra ha un foro rotondo, con le crepe a stella. Il colpo è stato sparato verso l'esterno, verso il lago. Nessuno ci è morto: serviva solo il rumore."},
    g_lampada2:{name:"La lampada calda",cat:"Osservazione",th:{T:1},text:"La lampada della stanza gemella ha il serbatoio quasi vuoto e il vetro annerito di fumo: è rimasta accesa a lungo, ieri sera. Sul piano, un fiammifero bruciato."},
    g_diario:{name:"Il diario nell'orologio",cat:"Documento",th:{T:3},text:"Nascosto nella cassa dell'orologio sul camino, il diario di Halloway, scritto con la sinistra. 21 ottobre: «Ho capito chi è la ragazza. Gli stessi occhi del padre. Llewelyn. Ha preso il foglio di Bangor. Sabato, dopo la dimostrazione, la farò arrestare per furto, e la storia finirà lì.»"},
    g_ritaglio:{name:"Il ritaglio di giornale",cat:"Documento",th:{T:2},text:"«Carnarvon Herald», marzo 1900: «Il costruttore Ifor Llewelyn, condannato per il crollo delle Assembly Rooms di Bangor in cui morirono quattordici persone durante un concerto, si è tolto la vita nel carcere di Caernarfon. Lascia la moglie e una figlia di quindici anni.»"},
    g_medaglione:{name:"Il medaglione",cat:"Reperto",th:{T:2},text:"Un medaglione d'argento consumato. Dentro, la fotografia di un uomo con le mani da muratore e una bambina sulle ginocchia. Inciso sul retro: «B. Ll. — 1895»."},
    g_calcoli:{name:"Il foglio dei calcoli",cat:"Documento",th:{T:3},text:"Nella cartella dei disegni di Miss Hale, il foglio mancante dall'archivio: i calcoli delle travi delle Assembly Rooms di Bangor, 1899, firmati A. Halloway. Una moltiplicazione è sbagliata, e il carico ammesso è il doppio del vero. L'errore era dell'architetto, non del costruttore."},
    g_obs_bea:{name:"I gomiti di Miss Hale",cat:"Osservazione",th:{T:2},text:"Miss Hale ha le dita macchiate di china, come sempre. Ma sotto i polsini della camicetta, quando alza le braccia, si vedono due graffi freschi sui gomiti e una polvere grigia, di legno vecchio, sulla stoffa."},
    g_obs_owen:{name:"Gli stivali del capomastro",cat:"Osservazione",th:{T:1},text:"Owen Pryce ha sugli stivali una polvere bianca di calce fresca. Nell'ala est e in salone non ci sono lavori in corso. Stamattina è stato in un posto dove si è mosso un intonaco."},
    g_obs_celia:{name:"La fede di Celia",cat:"Osservazione",th:{C:1},text:"Celia Halloway porta il lutto, ma non la fede. Sull'anulare c'è un segno chiaro: l'anello non lo porta da giorni, non da stanotte."},
    g_obs_rupert:{name:"I polsini di Rupert",cat:"Osservazione",th:{B:1},text:"Rupert ha i polsini grigi di cenere e le dita annerite. Stanotte, dopo i fatti, ha bruciato della carta nel camino della sua stanza. Molta carta."},
    g_cambiali:{name:"Le cambiali bruciate",cat:"Testimonianza",th:{B:-2},text:"Rupert ammette: stanotte ha bruciato le cambiali dei suoi debiti di gioco, che il padre teneva in un cassetto e gli aveva restituito a cena «come regalo d'addio». Alle 21:20 era al pianoforte a girare le pagine a Celia: «Me le ha fatte cadere tutte, al tuono.»"},
    g_piano:{name:"Il pianoforte delle nove",cat:"Testimonianza",th:{B:-1,C:-1},text:"Il dottor Rhys: dalle nove alle dieci meno un quarto erano tutti in salone, al pianoforte: la signora suonava, Rupert girava le pagine, Arden e lui ascoltavano. Miss Hale era salita alle nove e dieci, con l'emicrania. Al tuono la signora si è fermata, e Rupert ha fatto cadere lo spartito."}
  },
