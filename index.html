    rooms:[{id:"gemello",x:10,y:20,w:56,h:110,show:g=>has("d4_metri")},{id:"corridoio_o",x:70,y:20,w:100,h:52},{id:"camera_b",x:70,y:76,w:100,h:54},{id:"studio_h",x:270,y:20,w:60,h:110},
      {id:"disegni",x:10,y:160,w:110,h:110},{id:"salone_h",x:124,y:160,w:110,h:110},{id:"cucina_h",x:238,y:160,w:92,h:110},{id:"giardino_h",x:10,y:300,w:320,h:92}],
    deco:'<text x="220" y="62" text-anchor="middle" style="font-size:7px;font-style:italic">pianerottolo</text><path d="M178 70h84M178 80h84M178 90h84" stroke="#6a5236" stroke-width=".7"/>'},
  rooms:{
    studio_h:{name:"Lo studio di Halloway",mapName:"Studio",crimeFrom:0,
      desc:["Lo studio in fondo all'ala est. La porta di quercia pende da un cardine. Ambrose Halloway è chino sulla scrivania, nella giacca da camera rossa. Il dottor Rhys gli sta accanto, con la lampada in mano.","Il corpo è stato portato in cappella. La stanza è rimasta com'era, con le persiane chiuse e l'odore freddo del tabacco.","Lo studio è vuoto e ordinato. Sulla scrivania, i fogli scritti con la sinistra, in grande, come da un bambino."],
      objects:[
        {id:"corpo",label:"Il corpo",clue:"g_corpo",to:0,text:"Halloway è chino sulla scrivania, la guancia sul foglio. Un foro alla tempia destra, con l'alone nero della polvere: un colpo a bruciapelo. Il Webley è stretto nella mano destra. E il polso destro è chiuso in una stecca di legno, fasciata stretta."},
        {id:"revolver",label:"Il revolver",clue:"g_revolver",text:"Il Webley di Halloway. Apri il tamburo: una sola camera sparata. Annusi la canna: l'odore della polvere è quasi svanito, e il metallo è freddo. Un'arma che ha sparato da venti minuti dovrebbe essere ancora tiepida."},
        {id:"porta",label:"La porta",clue:"g_paletto",text:"Il paletto di ferro è ancora infilato nell'anello: l'anello si è strappato dal legno con la spallata di Rupert. La porta era chiusa dall'interno. Nessuno è uscito di qui."},
        {id:"persiane",label:"La finestra",clue:"g_persiane",text:"Le persiane interne sono chiuse e fermate con il gancio. Tra la persiana e il telaio, una ragnatela intatta. Da questa finestra, stanotte, nessuno ha guardato fuori. E nessuno, dal giardino, ha potuto guardare dentro."},
        {id:"lampada",label:"La lampada verde",clue:"g_lampada",text:"La lampada a petrolio dal paralume verde, a destra della scrivania. Il vetro è freddo come il marmo, lo stoppino asciutto. Se alle dieci Halloway scriveva qui sotto, quella lampada si è raffreddata in un tempo impossibile."},
        {id:"montav",label:"Lo sportello nella parete",clue:"g_montavivande",text:"Uno sportello di legno all'altezza della vita. Lo apri: il pozzo del montavivande, buio, con le corde che scendono fino alla dispensa. La cabina non c'è: è giù. Lo spazio è stretto. Un uomo no. Una persona minuta, rannicchiata, sì."},
        {id:"scrittoio",label:"Lo scrittoio",clue:"g_scrittoio",text:"La penna è posata a sinistra del calamaio. Sul foglio sotto la guancia del morto, poche righe in una scrittura grande, storta, da mancino forzato: «Domattina, signori, vi dirò che cosa avete visto.» Non c'è nessuna lettera d'addio."},
        {id:"cassetto",label:"Il cassetto della scrivania",clue:"g_testamento",text:"Nel cassetto, sotto le matite, la minuta di un nuovo testamento con l'intestazione del notaio di Bangor. A Rupert Halloway «non lascio niente, perché tutto quello che gli ho dato l'ha già perso alle carte». Da firmare sabato mattina."}]},
    salone_h:{name:"Il salone",mapName:"Salone",crimeFrom:99,
      desc:["Il salone al centro della casa, con il pianoforte a coda e le finestre sul giardino. Le tende sono aperte sul buio. Gli ospiti non si sono seduti.","La luce del lago entra dalle portefinestre. Sul pianoforte, lo spartito è ancora aperto.","Il tè si raffredda nelle tazze. Le ombre dei tassi si allungano sul tappeto."],
      objects:[
        {id:"piano",label:"Il pianoforte",text:"Un Bechstein a coda. Sul leggio, un notturno di Chopin, con le pagine spiegazzate: qualcuno le ha raccolte da terra in fretta. In fondo alla seconda pagina, una battuta segnata a matita, come chi si è fermato a metà."},
        {id:"cartoncino",label:"Il cartoncino sul camino",clue:"g_istruzioni",text:"Appoggiato all'orologio sul camino, il cartoncino che Halloway ha consegnato agli ospiti a cena: «Alle 22 in punto, luci spente su tutta la facciata. Andate alla meridiana e guardate la mia finestra. Resterà accesa una sola luce. Domattina vi spiegherò che cosa avete visto.» Una sola luce. Non dice quale."},
        {id:"cartella",label:"La cartella di cuoio",clue:"g_lettera",when:g=>locOf("felix")!=="salone_h",text:"La cartella di Felix Arden, lasciata su una poltrona. Bozze di articoli per «The Builder», ritagli, e una lettera con la grafia della padrona di casa: «Dopo la dimostrazione di sabato glielo dirò. Non posso più fingere di ammirare le sue case. Mi sembrano tutte prigioni. C.»"},
        {id:"cartella_f",label:"La cartella di cuoio",when:g=>locOf("felix")==="salone_h",text:"Allunghi la mano verso la cartella di cuoio sulla poltrona. Felix Arden ci posa sopra il braccio, con un sorriso troppo cortese. «Appunti di lavoro, avvocato. Noiosissimi.»"},
        {id:"ritratto_s",label:"Il ritratto della prima moglie",text:"Una signora in grigio, con gli occhi tristi, dipinta nel 1890. Rupert le assomiglia. Celia, passandoci davanti, non alza mai lo sguardo."}]},
    cucina_h:{name:"La cucina e la dispensa",mapName:"Cucina",crimeFrom:99,
      desc:["La cucina sotto l'ala est, ancora calda. Sul tavolo, i piatti della cena della servitù. Il maggiordomo Hughes è in piedi, pallido, con il panno in mano. Nella dispensa accanto, lo sportello del montavivande.","La cuoca impasta il pane come se niente fosse. Hughes lucida l'argenteria della cena di ieri.","Il fuoco è basso. L'orologio della cucina batte i quarti."],
      objects:[
        {id:"cabina",label:"La cabina del montavivande",clue:"g_pennino",text:"Apri lo sportello nella dispensa. La cabina è qui, ferma al pianterreno: una cassa di legno, stretta. Sul fondo, tra le briciole, brilla un pennino d'acciaio da disegno, sottilissimo, con la punta sporca di china nera. Sulle assi, una sbavatura nera all'altezza di un gomito."},
        {id:"orologio_c",label:"L'orologio della cucina",text:"Un orologio a muro di ottone. Hughes lo tiene avanti di due minuti, «perché la servitù non arrivi mai in ritardo», dice. Lo ha controllato stamattina con quello della stazione: è esatto, meno i suoi due minuti."},
        {id:"piatti",label:"Il tavolo della servitù",text:"Tre piatti, tre bicchieri, e una macchia di birra rovesciata sulla tovaglia, ormai asciutta. La cuoca: «Il signor Pryce. Al tuono ha fatto un salto sulla sedia, e giù la birra.»"},
        {id:"scaletta",label:"La scala di servizio",text:"Dalla dispensa, una scala di servizio sale stretta al pianerottolo del primo piano e scende al giardino. Di notte non ci passa nessuno. Chi esce dalla dispensa può essere al primo piano senza attraversare il salone."}]},
    disegni:{name:"La sala disegni",mapName:"Sala disegni",crimeFrom:99,
      desc:["La sala disegni dell'ala ovest, al pianterreno: tavoli inclinati, armadi piatti, una grande finestra a nord. A quest'ora è buia e fredda.","Miss Hale lavora già al tavolo inclinato, sotto la finestra. Disegna come se il mondo fosse in ordine.","La luce del pomeriggio cade obliqua sui tavoli da disegno. L'aria sa di gomma e di carta."],
      objects:[
        {id:"pianta",label:"La pianta incorniciata",clue:"g_pianta",text:"Incorniciata sopra l'armadio, la pianta del primo piano firmata Halloway, 1888. Le due ali sono identiche, ventidue metri dal pianerottolo. Ma l'ala est finisce con lo studio, mentre il corridoio dell'ala ovest finisce contro un muro tratteggiato. Dietro il muro, la carta è bianca."},
        {id:"lucidi",label:"L'armadio dei lucidi",clue:"g_lucido",from:1,text:"Nei cassetti piatti, i lucidi dei progetti in ordine perfetto. Una cartella senza titolo: «Stanza B, 1911». Lo studio di Halloway, misura per misura, ma ribaltato come in uno specchio: camino e porta a sinistra, lampada a sinistra della scrivania. Sigla della disegnatrice: B. H."},
        {id:"registro_a",label:"Il registro dell'archivio",clue:"g_archivio",text:"Il registro dell'archivio, tenuto da Miss Hale. Alla voce «Bangor, Assembly Rooms, 1899» qualcuno ha aggiunto a settembre, con una calligrafia storta, da sinistra: «Foglio dei calcoli delle travi: MANCANTE.» Sotto, la stessa mano ha sottolineato due volte."},
        {id:"pennini",label:"La scatola dei pennini",clue:"g_pennini",when:g=>locOf("beatrix")!=="disegni",text:"Sul tavolo di Miss Hale, una scatola di pennini da disegno di un fornitore di Londra, con dodici scomparti foderati di velluto. Undici pennini. Uno scomparto è vuoto."},
        {id:"pennini_b",label:"Il tavolo di Miss Hale",when:g=>locOf("beatrix")==="disegni",text:"Miss Hale chiude la scatola dei pennini con un gesto rapido, senza alzare gli occhi dal disegno. «Preferisco che nessuno tocchi i miei strumenti, avvocato. Si scheggiano.»"}]},
    corridoio_o:{name:"Il corridoio dell'ala ovest",mapName:"Corridoio ovest",crimeFrom:99,
      desc:["Il corridoio dell'ala ovest, al primo piano. Una fila di porte a destra, le finestre sul cortile a sinistra, e in fondo un grande ritratto di Halloway giovane, con il compasso in mano.","Il sole del mattino entra dalle finestre. In fondo, il ritratto di Halloway ti guarda arrivare.","Il corridoio è silenzioso. Il ritratto in fondo è leggermente storto."],
      objects:[
        {id:"misura",label:"La lunghezza del corridoio",clue:"g_corridoio",from:1,text:"Prendi in prestito il metro a nastro del capomastro e misuri, dal pianerottolo al muro di fondo: diciotto metri. Poi ricordi la targa della meridiana. Ogni ala è lunga ventidue metri. Dietro quel muro ne mancano quattro."},
        {id:"misura0",label:"La lunghezza del corridoio",to:0,text:"Di notte, con una candela, il corridoio sembra infinito. Domattina, con la luce, potrai misurarlo."},
        {id:"ritratto",label:"Il ritratto in fondo",when:g=>locOf("owen")!=="corridoio_o",text:g=>has("d4_metri")?"Passi le dita lungo la cornice dorata. A destra, all'altezza della mano, un rilievo che cede. Uno scatto, e il ritratto ruota su cardini nascosti, con la parete dietro. Davanti a te si apre una stanza buia, che odora di polvere da sparo. La pianta di Plas Gwydr è sbagliata.":"Ambrose Halloway a trent'anni, con il compasso in mano e uno sguardo divertito, come chi conosce una barzelletta che gli altri non sanno. La cornice è enorme, alta fino al soffitto."},
        {id:"ritratto_o",label:"Il ritratto in fondo",when:g=>locOf("owen")==="corridoio_o",text:"Owen Pryce è in piedi davanti al ritratto, con le mani dietro la schiena, come una sentinella. «Buongiorno, avvocato. Questa parte della casa non ha niente da vedere. Solo un muro.»"}]},
    camera_b:{name:"La camera di Miss Hale",mapName:"Camera di Miss Hale",crimeFrom:99,
      desc:["Una stanza piccola, ordinata come un tavolo da disegno. Miss Hale è seduta sul letto, in vestaglia, con un fazzoletto bagnato sulla fronte.","La stanza di Miss Hale. Il letto è rifatto al millimetro. Dalla finestra si vede il lago.","La finestra è aperta. Le tende si muovono appena."],
      objects:[
        {id:"valigia",label:"La valigia sotto il letto",clue:"g_ritaglio",when:g=>locOf("beatrix")!=="camera_b",text:"Una valigia piccola e consumata. Nella fodera, un ritaglio ingiallito del «Carnarvon Herald», marzo 1900: il costruttore Ifor Llewelyn, condannato per il crollo di Bangor, si è tolto la vita in carcere. «Lascia la moglie e una figlia di quindici anni.»"},
        {id:"comodino",label:"Il comodino",clue:"g_medaglione",when:g=>locOf("beatrix")!=="camera_b",text:"Nel cassetto del comodino, un medaglione d'argento consumato. Dentro, un uomo dalle mani grandi con una bambina sulle ginocchia. Sul retro, inciso: «B. Ll. — 1895». Hale non comincia per Ll."},
        {id:"cartella_b",label:"La cartella dei disegni",clue:"g_calcoli",from:1,when:g=>locOf("beatrix")!=="camera_b",text:"Una cartella di cartone con gli schizzi personali di Miss Hale. In mezzo, un foglio che non è suo: i calcoli delle travi delle Assembly Rooms di Bangor, 1899, firmati A. Halloway. Una moltiplicazione è cerchiata a matita rossa. Il carico ammesso è il doppio del vero."},
        {id:"stanza_b",label:"La stanza",when:g=>locOf("beatrix")==="camera_b",text:"Miss Hale ti guarda dal letto con gli occhi gonfi. «Vi prego. Ho ancora la testa che scoppia.» Non c'è modo di frugare tra le sue cose, finché è qui."}]},
    giardino_h:{name:"Il giardino a sud",mapName:"Giardino e meridiana",crimeFrom:99,
      desc:["Il giardino davanti alla villa, sotto la pioggia. Dalla meridiana, al centro del viale, la facciata di Plas Gwydr è un muro nero e simmetrico. Ieri sera, da qui, hanno visto la finestra accesa.","Il giardino bagnato, i tassi potati a cono, la meridiana di bronzo. La facciata è perfettamente simmetrica: due ali uguali ai lati del portico.","Il sole del pomeriggio batte sulla facciata. Ogni finestra ha la sua gemella, dall'altra parte del portico."],
      objects:[
        {id:"meridiana",label:"La meridiana",clue:"g_facciata",text:"Una meridiana di bronzo su un piedistallo di pietra, esattamente sull'asse della casa. Sulla base, una targa: «Plas Gwydr, 1888. Ambrose Halloway, architetto. Quarantaquattro metri di facciata, due ali di ventidue: perché l'occhio ami ciò che è uguale.»"},
        {id:"facciata",label:"La facciata",clue:"g_studio_pos",text:"Guardi la casa dalla meridiana, dove stavano i testimoni. Il portico al centro, le due ali identiche. L'ala est, quella dello studio, è a destra. Lo studio di Halloway è la prima finestra a destra, al primo piano, in fondo all'ala. Ha le persiane chiuse. La sua gemella, all'estremità sinistra, secondo la pianta non dà su nessuna stanza."},
        {id:"ghiaia",label:"La ghiaia sotto l'ala ovest",clue:"g_vetri",from:1,text:"Sotto l'ultima finestra dell'ala ovest, schegge di vetro sulla ghiaia, lavate dalla pioggia. Alzi lo sguardo. In un riquadro della finestra, al primo piano, c'è un foro rotondo con le crepe a stella. Dietro quella finestra, secondo la pianta, c'è un muro maestro."},
        {id:"lago",label:"Il lago",text:"Llyn Gwydr, il lago di vetro. Senza vento, riflette la villa capovolta, ogni finestra con la sua immagine rovesciata. Halloway diceva che aveva costruito la casa per il lago, perché si guardasse."}]},
    gemello:{name:"La stanza gemella",mapName:"Stanza B",crimeFrom:99,mirror:true,
      lock:g=>has("d4_metri")?null:"Secondo la pianta, qui c'è solo un muro maestro.",
      desc:["Lo studio di Halloway, ma rovesciato.","Una stanza che non esiste sulla pianta: lo studio di Halloway, oggetto per oggetto, ma ribaltato come in uno specchio. Le persiane sono aperte. Nell'aria, l'odore acre della polvere da sparo.","La stanza gemella, nella luce del pomeriggio. Fa venire il capogiro: ogni cosa al suo posto, ma dalla parte sbagliata."],
      objects:[
        {id:"stanza",label:"La stanza",clue:"g_specchio",text:"Ti fermi sulla soglia. È lo studio di Halloway: la scrivania davanti alla finestra, il camino, le librerie, il ritratto. Ma tutto è dall'altra parte. Il camino e la porta sono a sinistra. E la lampada dal paralume verde è a sinistra della scrivania. Le persiane sono aperte sul giardino."},
        {id:"giacca",label:"La giacca sulla sedia",clue:"g_giacca2",text:"Sulla poltrona, una giacca da camera di velluto rosso, identica a quella del morto, e un berretto di velluto nero. Le maniche sono rimboccate due volte, per braccia più corte di quelle di Halloway. Rovesci il polsino destro: una macchia di china nera, ancora lucida."},
        {id:"cassetto2",label:"Il cassetto della scrivania",clue:"g_revolver2",text:"Il cassetto, dalla parte sbagliata della scrivania. Dentro, un Webley identico a quello dello studio. Apri il tamburo: una camera sparata. Qui l'odore della polvere è ancora forte."},
        {id:"vetro",label:"La finestra",clue:"g_proiettile",text:"Le persiane sono aperte. In un riquadro del vetro, un foro rotondo con le crepe a stella. Il colpo è partito da qui dentro, verso il lago. Ieri alle 22:10 qualcuno ha sparato contro la notte, solo per farsi sentire."},
        {id:"lampada2",label:"La lampada verde",clue:"g_lampada2",text:"La lampada gemella, a sinistra della scrivania. Il serbatoio è quasi vuoto, il vetro annerito di fumo. Ieri sera è rimasta accesa a lungo. Accanto, un fiammifero bruciato fino alle dita."},
        {id:"orologio2",label:"L'orologio sul camino",clue:"g_diario",text:"L'orologio del camino è fermo. Apri lo sportello della cassa: dentro, al posto del pendolo, un quaderno rilegato in pelle. Il diario di Halloway, scritto con la sinistra. L'ultima pagina è del 21 ottobre: «Ho capito chi è la ragazza. Gli stessi occhi del padre. Llewelyn. Ha preso il foglio di Bangor. Sabato, dopo la dimostrazione, la farò arrestare per furto, e la storia finirà lì.»"}]}
  },
  chars:{
    celia:{name:"Celia Halloway",short:"Celia",mk:"CH",age:36,role:"La moglie, ex attrice",
      bio:"Seconda moglie di Halloway, sposata sei anni fa. Recitava al Lyric di Londra. Dice di essersi ritirata dalle scene per lui; dice anche di non aver mai capito le sue case.",
      p:{},loc:["salone_h","salone_h","salone_h"],
      alibi:["«Al pianoforte, dalle nove. Poi in giardino, alla meridiana, come voleva Ambrose. Con tutti gli altri.»","«Qui. Dove dovrei essere? Mio marito si è ucciso, avvocato.»","«Qui.»"],
      crime:["«Si è ucciso. Era malato di quella casa, di quei trucchi. Lo diceva sempre: un giorno farò sparire un uomo davanti a tutti.» Si morde il labbro.","«Il notaio non verrà. Il testamento non è firmato. Questo vi basta per sospettare di Rupert, immagino.»","«Lei crede davvero che sia stato qualcuno di noi.» Non è una domanda."],
      self:"«Ho recitato Ofelia sedici volte, a Londra. Poi ho sposato un uomo che costruiva teatri senza palcoscenico. Le sue case erano tutte scenografie.»",
      others:"«Rupert è un ragazzo rovinato, ma non è cattivo. Felix è un critico: per lui siamo tutti un articolo. Il dottore è caro. Miss Hale è l'unica che Ambrose ascoltasse. Owen gli obbediva come un cane.»",
      react:{g_lettera:"Celia impallidisce, poi alza il mento. «Sì. Volevo lasciarlo. Dopo la dimostrazione. Non volevo ucciderlo: volevo andarmene. È diverso, avvocato.»",g_istruzioni:"«Il suo teatrino. Ci ha fatto stare sotto la pioggia mezz'ora per guardare una finestra.»",g_obs_celia:"Celia si copre la mano. «L'ho tolta domenica. Non ho trovato il coraggio di dirglielo.»",g_corpo:"«Il polso? Sì, se l'era rotto martedì, in cantiere. Ma con Ambrose non si sa mai: se voleva, avrebbe sparato anche coi piedi.»",g_owen_sa:"«Una stanza gemella.» Ride, senza allegria. «Ecco il suo grande segreto. Vedete? Una scenografia.»"},
      def:["«Non lo so, avvocato.»","«Chieda a Miss Hale: lei sapeva tutto di mio marito.»","«Non ho niente da dire.»"]},
    rupert:{name:"Rupert Halloway",short:"Rupert",mk:"RH",age:29,role:"Il figlio",
      bio:"Figlio del primo matrimonio. Ha lasciato Oxford, poi l'esercito, poi il lavoro alla banca. Ha perso alle carte più di quanto il padre volesse pagare. Domattina sarebbe stato diseredato.",
      p:{},loc:["salone_h","giardino_h","salone_h"],
      alibi:["«Al pianoforte, a girare le pagine a Celia. Poi alla meridiana, a prendermi la pioggia per il teatrino di mio padre.»","«A fumare. In casa non respiro.»","«Qui, ad aspettare l'ispettore. Mi arresterà, naturalmente. Ho il movente più bello di tutti.»"],
      unlock:{alibi0:"g_sinistra"},
      crime:["«Ho sfondato io la porta, con Hughes. Era freddo, avvocato. Freddo. E dieci minuti prima lo avevo visto alla finestra.»","«Il testamento? Lo conoscevo. Me l'ha detto lui, a cena, ridendo. Mi ha anche restituito le cambiali: un regalo d'addio, ha detto.»","«Se crede che sia stato io, lo dica e basta.»"],
      self:"«Sono il figlio di un genio. È un mestiere che non auguro a nessuno.»",
      others:"«Celia lo odiava, ma con eleganza. Arden è un parassita. Il dottore beve con mio padre da trent'anni. Miss Hale è l'unica persona intelligente della casa. Pryce costruirebbe una forca, se mio padre glielo chiedesse.»",
      react:{g_testamento:"«Lo sapevo, gliel'ho detto. Mi ha diseredato a cena davanti a tutti, con il dolce.»",g_obs_rupert:{text:"Rupert si guarda i polsini anneriti, e ride. «Le cambiali. Me le aveva restituite a cena, come regalo d'addio. Le ho bruciate stanotte, tutte. Alle nove e venti, quando è venuto giù il cielo, ero al pianoforte a girare le pagine a Celia: me le ha fatte cadere tutte.»",unlock:"g_cambiali"},g_schizzo:"«Ecco. Lo vede? A sinistra. La finestra di mio padre.» Si ferma. «A sinistra?»",g_studio_pos:"Rupert guarda la facciata, poi lo schizzo nella sua memoria. Diventa bianco. «Era l'altra. Abbiamo guardato l'altra finestra.»"},
      def:["«Non lo so.»","«Chieda alla vedova.»","«Mi annoia, avvocato.»"]},
    felix:{name:"Felix Arden",short:"Arden",mk:"FA",age:41,role:"Critico di architettura",
      bio:"Scrive per «The Builder» ed è temuto da tutti gli architetti di Londra. Halloway lo ha invitato apposta per la dimostrazione. Osserva tutto, e annota tutto.",
      p:{},loc:["salone_h","salone_h","salone_h"],sched:{1:[[10*60,"giardino_h"],[1e9,"salone_h"]]},
      alibi:["«Al pianoforte, ad ascoltare un Chopin massacrato. Poi in giardino. Ho visto tutto, avvocato: è il mio mestiere vedere.»","«In giardino, a disegnare la facciata. Senza il suo autore, mi sembra più onesta.»","«Qui, ad aspettare il treno di domani.»"],
      unlock:{alibi0:"g_testimoni",crime0:"g_schizzo"},
      crime:["«Ho perfino fatto uno schizzo, sotto la pioggia. Guardi: la facciata al buio, e la sua finestra accesa, in alto, all'estremità. Che teatro. Lui adorava il teatro.»","«Una dimostrazione, aveva detto. Ci ha dimostrato soltanto che si può morire in pubblico.»","«Il mio articolo, ormai, si scrive da solo.»"],
      self:"«Critico. Cioè uno che dice agli architetti, in pubblico, quello che le loro mogli dicono in privato.»",
      others:"«Celia merita di meglio. Rupert merita esattamente quello che ha. Il dottore beve. Miss Hale ha più talento del suo padrone, e lui lo sapeva. Pryce è un muratore con l'anima di un monaco.»",
      react:{g_lettera:"Arden sospira. «Sì, ci scriviamo. No, non l'ho ucciso. Se avessi voluto distruggerlo, avrei scritto un articolo. È molto più crudele.»",g_testimoni:"«Lo ripeto quante volte vuole: giacca rossa, berretto, la lampada a sinistra della scrivania, e scriveva veloce, chino. Con la destra, sì. Perché?»",g_polso:"Arden si ferma. «Con la destra. Scriveva veloce, con la destra.» Ti guarda. «Quello alla finestra non era Ambrose.»",g_specchio:"Il critico si guarda intorno, nella stanza rovesciata, e per la prima volta non trova le parole. Poi ride, piano. «Il suo capolavoro. E noi in prima fila.»"},
      def:["«Interessante. Ma non ho niente da aggiungere.»","«Chieda al capomastro: le case le conosce dall'interno.»","«Non so.»"]},
    rhys:{name:"Dott. Elis Rhys",short:"Rhys",mk:"ER",age:64,role:"Medico di famiglia",
      bio:"Medico condotto di Llanberis, amico di Halloway da trent'anni. È stato lui a constatare la morte. Ha le mani ferme e lo sguardo di chi non dorme.",
      p:{},loc:["studio_h","salone_h","salone_h"],sched:{0:[[23*60+30,"studio_h"],[1e9,"salone_h"]]},
      alibi:["«In salone, al pianoforte con gli altri. Alle dieci non sono uscito: ho i reumatismi e c'era il diluvio. Ho sentito lo sparo da qui.»","«Qui. A scrivere un certificato che non mi piace.»","«Qui.»"],
      unlock:{crime0:"g_freddo",others:"g_piano"},
      crime:["«Il corpo era freddo alle mani, alle dieci e mezza, e la mascella cominciava a irrigidirsi. Un uomo morto alle dieci e dieci non è così, dopo venti minuti. Ma lo sparo l'abbiamo sentito tutti.» Scuote la testa.","«Ho visto molti suicidi. Di solito non lasciano scritto: domattina vi dirò che cosa avete visto.»","«La scienza dice un'ora prima. I testimoni dicono dieci minuti prima. Uno dei due mente, e la scienza non sa mentire.»"],
      self:"«Trent'anni di valli, di cave e di parti. E un amico che costruiva case per far girare la testa alla gente.»",
      others:"«Ieri sera, dalle nove alle dieci meno un quarto, eravamo tutti in salone al pianoforte. Tutti tranne Miss Hale, che è salita alle nove e dieci con l'emicrania. Al tuono Celia si è fermata, e Rupert ha fatto cadere lo spartito.»",
      react:{g_corpo:{text:"«Il polso destro. Gliel'ho steccato io, martedì: è caduto da un ponteggio. Non riusciva a stringere una tazza. Un Webley pesa più di un chilo, e scalcia come un mulo.»",unlock:"g_polso"},g_lampada:"«Freddo, sì. L'ho notato anch'io, ma non volevo vederlo.»",g_tuono:"«Le nove e venti. Il tuono.» Il dottore si toglie gli occhiali. «Uno sparo, sotto quel tuono, non l'avrebbe sentito nessuno.»",g_revolver:"«Una camera sparata, e la canna fredda.» Annuisce lentamente.",g_obs_bea:"«Graffi freschi sui gomiti? Di stanotte, direi. Come chi si è infilato in un posto stretto.»"},
      def:["«Non so dirle, avvocato.»","«Sono un medico.»","«Mi scusi, ho bisogno di aria.»"]},
    hughes:{name:"Hughes",short:"Hughes",mk:"HU",age:50,role:"Maggiordomo",
      bio:"In servizio a Plas Gwydr da dieci giorni appena, con ottime referenze da Chester. Non conosce ancora bene la casa, ma conosce benissimo gli orari.",
      p:{},loc:["cucina_h","cucina_h","cucina_h"],
      alibi:["«In cucina, signore, con la cuoca e il signor Pryce, dalla cena in poi. Alle dieci meno due ho spento le luci della facciata, come da istruzioni del padrone. Alle nove e venti c'è stato il tuono: ho guardato l'orologio, per abitudine.»","«In cucina, signore.»","«In cucina, signore. Ho lucidato l'argento. Aiuta a pensare.»"],
      unlock:{alibi0:"g_tuono",crime0:"g_montav_scende",others:"g_owen_alibi"},
      crime:["«C'è una cosa, signore. Verso le nove e mezza ho sentito il montavivande scendere nella dispensa. Ho pensato che il padrone rimandasse il vassoio. Quando sono andato ad aprire, era vuoto. Non ci ho più pensato, fino a stanotte.»","«Ho sfondato la porta io, con il signorino Rupert. Il paletto era dentro, signore. Ne sono certo.»","«Non spetta a me avere opinioni, signore.»"],
      self:"«Ventisei anni di servizio, signore. Mai visto un padrone morto prima di questa settimana.»",
      others:"«Il signor Pryce ha cenato con noi dalle otto e mezza alle dieci meno un quarto. Al tuono ha rovesciato la birra. Poi è uscito in giardino, per vedere lo spettacolo del padrone. Era l'unico a sapere a che ora sarebbe cominciato.»",
      react:{g_pennino:"«Un pennino, signore? Nella cabina? Ieri sera alle sette l'ho pulita io stesso.»",g_istruzioni:"«Luci spente alle dieci meno due, tutte quelle della facciata. Le ho spente io. Ma una finestra in fondo a sinistra è rimasta accesa, ricordo. Non ci ho pensato: credevo fosse quella del padrone.»",g_owen_sa:"Hughes si raddrizza. «Una stanza che non c'è. In dieci giorni di servizio, signore, non avevo ancora capito questa casa. Ora capisco perché.»"},
      def:["«Non saprei, signore.»","«Lo chieda alla signora, signore.»","«Mi scusi, la cuoca mi chiama.»"]},
    owen:{name:"Owen Pryce",short:"Pryce",mk:"OP",age:47,role:"Capomastro di Halloway",
      bio:"Ha costruito tutte le case di Halloway negli ultimi vent'anni, e la sua vita intera. Metodista, taciturno, con le mani piene di calce. Abita nella casetta del custode, al cancello.",
      p:{},loc:["cucina_h","giardino_h","disegni"],sched:{1:[[10*60,"giardino_h"],[11*60,"corridoio_o"],[1e9,"cucina_h"]]},
      alibi:["«A cena in cucina, con Hughes e la cuoca. Poi in giardino, al cancello, a guardare la casa. Il padrone mi aveva detto: alle dieci, Owen, guarda bene.»","«Al lavoro, avvocato. La casa non si ferma perché è morto l'architetto.»","«Qui. A rimettere in ordine i disegni del padrone. Qualcuno deve farlo.»"],
      crime:["«Il padrone non si sarebbe mai ucciso. Non prima di una dimostrazione. Non prima di vedere le vostre facce.»","«Non c'è niente da vedere in quest'ala. Solo muri. Li ho tirati su io, li conosco.»","«Ho costruito tutto quello che mi ha chiesto. Anche quello che non avrei dovuto.»"],
      self:"«Ho imparato il mestiere a quindici anni, sulle impalcature di Bangor. Muratore, poi capomastro. Il padrone diceva che i miei muri erano dritti come una preghiera.»",
      others:"«La signora non amava la casa. Il signorino non ama niente. Arden scrive. Il dottore è un brav'uomo. Miss Hale disegna meglio del padrone, ma questo non si dice. Hughes è nuovo, non sa niente.»",
      react:{g_owen_alibi:"«Sì, ero in cucina. Al tuono ho rovesciato la birra. Lo può chiedere a chiunque.»",g_obs_owen:"Pryce si guarda gli stivali bianchi di calce. Non risponde. Ma per la prima volta abbassa gli occhi.",g_ritaglio:"Il capomastro legge il ritaglio, e le mani gli tremano. «Ifor Llewelyn. Ho lavorato per lui da ragazzo, a Bangor. Era un uomo onesto. Le travi non le aveva calcolate lui.»",g_calcoli:"Pryce guarda la moltiplicazione cerchiata a matita rossa e si siede, pesantemente. «Lo sapevo», dice. «Lo sapevamo tutti, in cantiere. Nessuno l'ha mai detto.»",g_specchio:"«Diciotto mesi di lavoro, avvocato. Ogni cosa rovesciata, al millimetro. Il padrone diceva che era la cosa più bella che avessimo mai fatto.»"},
      def:["«Non so niente.»","«Lo chieda al padrone.» Si ferma. «Lo chieda a Miss Hale.»","«Devo tornare al lavoro.»"]},
    beatrix:{name:"Miss Beatrix Hale",short:"Miss Hale",mk:"BH",age:28,role:"Disegnatrice di Halloway",
      bio:"Disegna per Halloway da tre anni: i lucidi, i dettagli, gli archivi. Minuta, precisa, con le dita sempre macchiate di china. Halloway diceva che aveva la mano più ferma del Galles.",
      p:{},loc:["camera_b","disegni","disegni"],sched:{1:[[10*60+15,"disegni"],[1e9,"camera_b"]],2:[[15*60+45,"camera_b"],[1e9,"disegni"]]},
      alibi:["«Sono salita alle nove e dieci con l'emicrania. Ho preso le mie gocce e mi sono messa a letto, al buio. Mi ha svegliata lo sparo, e poi le grida.»","«Al lavoro. Il signor Halloway avrebbe voluto che i disegni fossero pronti.»","«Qui, a finire le tavole. Domani le porterò a Londra, se l'ispettore me lo permetterà.»"],
      crime:["«Il signor Halloway era un uomo difficile. Ma non lo credevo capace di uccidersi.» Si preme il fazzoletto sulla fronte.","«Una stanza gemella? Non ne so niente. Io disegno quello che mi chiedono, avvocato. Non faccio domande.»","«Che cosa vuole da me?»"],
      self:"«Sono di Shrewsbury. Mio padre faceva il maestro. Ho studiato disegno a Londra, e poi ho risposto a un annuncio. Tutto qui.»",
      others:"«La signora è stata gentile con me. Il signor Rupert non ha colpa di essere quello che è. Il signor Arden scrive cose crudeli e vere. Owen è un uomo onesto.»",
      react:{g_lucido:"«I lucidi della Stanza B?» Un'ombra le attraversa il viso. «Era un esercizio. Il signor Halloway amava gli esercizi di simmetria.»",g_pennino:"Miss Hale guarda il pennino un istante di troppo. «Tutti i pennini si somigliano, avvocato.»",g_ritaglio:"Non risponde. Le mani le si fermano sul tavolo, perfettamente immobili.",g_medaglione:"Miss Hale tende la mano verso il medaglione, poi la ritira. «È di mia madre», dice. Ma la voce non le regge.",g_diario:"Legge il nome Llewelyn nella grafia storta di Halloway. Chiude gli occhi.",g_obs_bea:"Miss Hale abbassa le maniche della camicetta, con calma. «Sono caduta dalle scale di servizio, stanotte, al buio. Avevo la testa che girava.»"},
      def:["«Non saprei, avvocato.»","«Chieda al signor Pryce.»","«Mi scusi, devo lavorare.»"]},
    halloway:{name:"Ambrose Halloway",short:"Halloway",age:63,role:"L'architetto",deadFrom:0,st:g=>"Morto",
      bio:"L'architetto delle case impossibili: scale che sembrano salire e scendono, corridoi che si allungano, stanze che cambiano. Plas Gwydr, la sua villa sul lago, è il suo capolavoro.",p:{},loc:[]}
  },
  truth:[
    "Due anni fa Ambrose Halloway fece costruire in segreto, in fondo all'ala ovest di Plas Gwydr, una copia perfetta del suo studio, ribaltata come in uno specchio. La casa era simmetrica: la stanza gemella stava esattamente dove, dall'altra parte del portico, stava lo studio vero. La costruì Owen Pryce, sui lucidi di Miss Hale, e la nascose dietro un ritratto e una pianta falsa.",
    "Venerdì sera Halloway aveva preparato la sua dimostrazione. Alle dieci, a luci spente, gli ospiti l'avrebbero visto lavorare alla finestra dello studio. Il mattino dopo avrebbe rivelato che erano stati sotto la finestra sbagliata, a guardarlo nella stanza gemella: «l'occhio crede all'architetto».",
    "Ma Miss Hale non si chiamava Hale. Era Beatrix Llewelyn, figlia del costruttore condannato per il crollo di Bangor del 1899, morto suicida in carcere. Era entrata nello studio di Halloway per trovare il foglio dei calcoli, e a settembre l'aveva trovato: l'errore era dell'architetto. Halloway se ne accorse e capì chi era. Sabato l'avrebbe fatta arrestare.",
    "Alle 21:10 Beatrix salì nello studio con la scusa dell'emicrania. Aspettò il temporale. Al tuono delle 21:20 sparò a Halloway alla tempia, con il suo Webley, e gli mise l'arma nella mano destra: non sapeva, o non ricordò, che il polso era steccato. Chiuse il paletto, spense la lampada e scese nel pozzo del montavivande fino alla dispensa. Perse un pennino, e si graffiò i gomiti.",
    "Alle 21:50 entrò nella stanza gemella, di cui conosceva ogni millimetro, perché l'aveva disegnata lei. Indossò la seconda giacca rossa e il berretto che Halloway aveva preparato per sé, accese la lampada e si sedette alla scrivania. Alle dieci, a luci spente, i testimoni videro un uomo scrivere alla finestra. Scriveva veloce, con la destra.",
    "Alle 22:10 sparò con il secondo Webley contro la finestra, spense la lampada e tornò nella sua camera, due porte più in là. Quando gli altri sfondarono la porta dello studio, Ambrose Halloway era morto da cinquanta minuti, chiuso dall'interno, con il revolver in mano. Un suicidio perfetto. L'architetto aveva preparato tutto. Lei aveva soltanto preso il suo posto."
  ]
};

  Object.assign(EV,{g_tuono:{t:"hughes"},g_montav_scende:{t:"hughes"},g_owen_alibi:{t:"hughes"},g_freddo:{t:"rhys"},g_polso:{t:"rhys"},g_piano:{t:"rhys"},g_testimoni:{t:"felix"},g_sinistra:{t:"rupert"},g_owen_sa:{t:"owen"},g_cambiali:{t:"rupert"},
    g_obs_bea:{t:"beatrix"},g_obs_owen:{t:"owen"},g_obs_celia:{t:"celia"},g_obs_rupert:{t:"rupert"},
    g_testamento:{doc:"typed",head:"MINUTA · STUDIO NOTARILE JONES, BANGOR",body:"Io, Ambrose Halloway, architetto,\nrevoco ogni disposizione precedente.\n\nA mio figlio Rupert non lascio niente,\nperché tutto quello che gli ho dato\nl'ha già perso alle carte.\n\nDa firmarsi sabato 25 ottobre."},
    g_istruzioni:{doc:"hand",body:"Alle 22 in punto,\nluci spente su tutta la facciata.\nAndate alla meridiana\ne guardate la mia finestra.\nResterà accesa una sola luce.\n\nDomattina vi spiegherò\nche cosa avete visto.\n\nA. H."},
    g_lettera:{doc:"hand",body:"F.,\ndopo la dimostrazione di sabato\nglielo dirò.\nNon posso più fingere di ammirare\nle sue case.\nMi sembrano tutte prigioni.\n\nC."},
    g_schizzo:{doc:"hand",head:"Taccuino di F. Arden",body:"[schizzo: la facciata al buio,\nil portico al centro,\nuna sola finestra accesa\nin alto, all'estremità SINISTRA]\n\n22:00. L'architetto veglia.\nChe teatro."},
    g_facciata:{doc:"form",head:"Plas Gwydr · MDCCCLXXXVIII",sub:"targa della meridiana",rows:[["Facciata","44 m"],["Ala ovest","22 m"],["Ala est","22 m"]],note:"Perché l'occhio ami ciò che è uguale."},
    g_pianta:{doc:"form",head:"Plas Gwydr · primo piano",sub:"pianta ufficiale, A. H. 1888",rows:[["Ala est: corridoio + studio","18 + 4 m"],["Ala ovest: corridoio","18 m"],["Ala ovest: in fondo","muro maestro"]],note:"Le due ali sono identiche."},
    g_lucido:{doc:"ledger",head:"Stanza B · 1911 · lucidi (B. H.)",rows:[["Camino","SINISTRA","(studio: destra)"],["Porta","SINISTRA","(studio: destra)"],["Lampada","a sinistra","(studio: a destra)"],["Accesso","dietro il ritratto",""]]},
    g_archivio:{doc:"ledger",head:"Archivio A. Halloway · registro",rows:[["1897","Chester, Corn Exchange","4 cartelle"],["1899","Bangor, Assembly Rooms","3 cartelle"],["","foglio calcoli travi","MANCANTE"],["1903","Llandudno, Pier Pavilion","5 cartelle"]]},
    g_diario:{doc:"hand",paper:"diary",body:"21 ottobre.\nHo capito chi è la ragazza.\nGli stessi occhi del padre.\nLlewelyn.\nHa preso il foglio di Bangor.\nSabato, dopo la dimostrazione,\nla farò arrestare per furto,\ne la storia finirà lì."},
    g_ritaglio:{doc:"typed",head:"CARNARVON HERALD · MARZO 1900",body:"IL COSTRUTTORE LLEWELYN SI TOGLIE LA VITA IN CARCERE\n\nIfor Llewelyn, condannato per il crollo delle Assembly Rooms di Bangor, in cui morirono quattordici persone durante un concerto, è stato trovato senza vita nella sua cella di Caernarfon.\nLascia la moglie e una figlia di quindici anni."},
    g_calcoli:{doc:"ledger",head:"Bangor, Assembly Rooms · travi del salone · A. H. 1899",rows:[["Luce","14 m",""],["Carico per m","2,8 t",""],["2,8 × 14 =","19,6 t","(39,2?)"],["Ammesso","OK","A. H."]]},

  READ.beatrix={clue:"g_obs_bea",opts:[
    {t:"Le dita",reply:"Dita macchiate di china, come sempre. È il suo mestiere. Non ti dice niente che tu non sappia."},
    {t:"I gomiti",ok:1,say:"«Quando ha alzato le braccia, Miss Hale, ho visto due graffi freschi sui gomiti, e una polvere grigia di legno vecchio sulla camicetta. Come chi si è infilato, rannicchiato, in un posto molto stretto.»",reply:"Miss Hale abbassa le maniche, con calma. «Sono caduta dalle scale di servizio, al buio. Avevo la testa che girava.» La voce è ferma. Le mani no."},
    {t:"Il fazzoletto",reply:"Un fazzoletto bagnato d'acqua di colonia, per l'emicrania. Lo stringe come una cosa preziosa."}]};
  READ.owen={clue:"g_obs_owen",opts:[
    {t:"Le mani",reply:"Mani enormi, screpolate, con la calce nelle pieghe. Le mani di un capomastro. Lo sapevi."},
    {t:"Gli stivali",ok:1,say:"«Ha gli stivali bianchi di calce fresca, Pryce. In questa casa non ci sono cantieri aperti. Stamattina è stato in un posto dove si è mosso un intonaco.»",reply:"Pryce guarda gli stivali, poi te. «Ho controllato un muro. È il mio mestiere.» Ma ha capito che hai capito."},
    {t:"La giacca della domenica",reply:"Una giacca nera, buona, troppo stretta sulle spalle. Se l'è messa per il lutto del padrone."}]};
  READ.celia={clue:"g_obs_celia",opts:[
    {t:"L'abito nero",reply:"Un abito da lutto preso in prestito alla cameriera, troppo largo. Non poteva prevedere di averne bisogno."},
    {t:"La mano sinistra",ok:1,say:"«Non porta la fede, signora. E il segno chiaro sull'anulare dice che non la porta da giorni, non da stanotte.»",reply:"Celia si copre la mano. Poi sorride, una smorfia da palcoscenico. «Lei avrebbe fatto carriera a teatro, avvocato.»"},
    {t:"Gli occhi",reply:"Occhi asciutti, truccati con cura. Un'attrice sa quando piangere. Non è adesso."}]};
  READ.rupert={clue:"g_obs_rupert",opts:[
    {t:"Il bicchiere",reply:"Whisky alle dieci del mattino. Rupert non lo nasconde nemmeno."},
    {t:"I polsini",ok:1,say:"«Ha i polsini grigi di cenere e le dita nere, Rupert. Stanotte ha bruciato della carta. Molta carta.»",reply:"Rupert ride, e alza il bicchiere verso di te. «Brindo alla sua vista, avvocato.»"},
    {t:"Le nocche",reply:"Le nocche della destra arrossate: la spallata alla porta di quercia. Questo lo sapevi già."}]};
  Object.assign(OBJ,{
    "owen|alibi1":{ok:["d4_metri","g_vetri","g_corridoio","g_lucido","g_obs_owen"],unlock:"g_owen_sa",a:"Pryce si toglie il berretto e lo rigira tra le mani. «Va bene. Dietro il ritratto c'è una stanza. L'ho costruita io, nel 1911, sui disegni della signorina. Lo studio del padrone, uguale, ma rovesciato. Doveva essere il suo segreto per stamattina: l'occhio crede all'architetto, diceva.» Una pausa. «Ieri sera, alle dieci, dal cancello, ho visto la finestra di quella stanza accesa. Ho pensato: ecco, la dimostrazione. Poi l'hanno trovato morto dall'altra parte.»"},
    "owen|alibi2":{ok:["d4_metri","g_owen_sa","g_obs_owen"],unlock:"g_owen_sa",a:"«Sì. La stanza gemella. L'ho costruita io.» Pryce non ha più niente da nascondere, e sembra sollevato. «Stamattina sono andato a guardarla, e c'era l'odore della polvere. Non ho toccato niente. Avevo paura, avvocato. Un uomo che costruisce una stanza segreta, e un morto dall'altra parte della casa.»"},
    "felix|alibi0":{ok:["d4_sinistra","g_studio_pos","d4_persiane","g_persiane"],a:"Arden apre il taccuino sullo schizzo, poi guarda la facciata dalla finestra. Il critico più temuto di Londra si toglie il monocolo. «A sinistra», dice. «L'ho disegnata a sinistra. E lo studio è a destra.» Non aggiunge altro. Per una volta, non ha una frase pronta."},
    "rupert|alibi0":{ok:["g_studio_pos","d4_sinistra"],a:"«A sinistra del portico, sì. Lo studio di mio padre è…» Rupert si ferma, conta le finestre con il dito, e diventa bianco. «A destra. Lo studio è a destra. Abbiamo guardato l'altra finestra.»"},
    "rhys|crime0":{ok:["d4_ora","g_tuono","g_lampada"],a:"Il dottore annuisce, lentamente. «Le nove e venti. Il tuono.» Si toglie gli occhiali. «Sì. Il corpo che ho visto io è quello di un uomo morto alle nove e venti. Non alle dieci e dieci. Ma allora, chi abbiamo visto alla finestra?»"},
    "beatrix|alibi0":{ok:["d4_uscita","g_pennino","g_obs_bea","g_montav_scende"],a:"Miss Hale ti guarda a lungo, con gli occhi chiari e fermi. «Avevo l'emicrania. Ero a letto, al buio.» Ripete la frase identica, parola per parola. Come una lezione imparata."},
    "beatrix|crime1":{ok:["g_lucido","g_owen_sa","d4_istruzioni"],a:"«I lucidi della Stanza B?» Una pausa di un secondo, non di più. «Li ho disegnati, sì. Il signor Halloway non mi diceva a che cosa servissero. Io disegno quello che mi chiedono.» Ha appena smentito quello che ti ha detto ieri sera."},
    "beatrix|alibi2":{ok:["d4_inchiostro","g_giacca2","d4_movente","g_calcoli"],a:"Miss Hale posa il pennino sul tavolo, allineato al bordo con una precisione assurda. «Ero qui», dice. Ma la voce, per la prima volta, si incrina."},
    "celia|alibi0":{ok:["g_lettera","g_obs_celia"],a:"«Sì, volevo lasciarlo. E alle nove e venti ero al pianoforte, davanti a tre testimoni, a suonare Chopin malissimo. Si decida, avvocato: sono un'adultera o un'assassina? Non ho il tempo di essere tutte e due.»"}
  });

CASE_SPECCHIO.deductions=[
  {id:"d4_ora",name:"Morto alle nove e venti",th:{A:-2,T:2},a:["g_freddo"],b:["g_lampada","g_tuono","g_revolver"],text:"Il corpo era freddo alle 22:30, la lampada gelida, la canna dell'arma fredda. Halloway è morto almeno un'ora prima dello sparo che tutti hanno sentito: alle 21:20, quando il tuono avrebbe coperto qualsiasi colpo."},
  {id:"d4_mano",name:"Non si è sparato",th:{A:-3},a:["g_polso"],b:["g_corpo","g_scrittoio"],text:"Il revolver era nella mano destra, e il polso destro era steccato da martedì: Halloway non riusciva a stringere una tazza. Qualcuno gli ha messo l'arma in mano, dopo."},
  {id:"d4_persiane",name:"Nessuno poteva vederlo",th:{T:2,A:-1},a:["g_persiane"],b:["g_testimoni","g_lampada"],text:"Le persiane dello studio sono chiuse, con una ragnatela intatta sul gancio, e la lampada non è stata accesa. Dallo studio, alle dieci, nessuno ha potuto guardare fuori. E nessuno ha potuto vederci dentro."},
  {id:"d4_destra",name:"La mano sbagliata",th:{T:2,A:-1},a:["g_testimoni"],b:["g_polso","g_scrittoio"],text:"L'uomo alla finestra scriveva veloce, con la destra. Halloway, da martedì, scriveva solo con la sinistra, grande e storto. Quello alla finestra non era Ambrose Halloway."},
  {id:"d4_sinistra",name:"La finestra sbagliata",th:{T:3},a:["g_sinistra","g_schizzo"],b:["g_studio_pos"],text:"Dalla meridiana, lo studio è la prima finestra a destra del portico. Ma i testimoni, e lo schizzo di Arden, mettono la finestra accesa all'estremità sinistra. Tutti hanno guardato l'ala ovest."},
  {id:"d4_metri",name:"Quattro metri",th:{T:3},a:["g_facciata","g_vetri"],b:["g_corridoio","g_pianta"],text:"Ogni ala è lunga ventidue metri, ma il corridoio ovest finisce contro un muro dopo diciotto. Dietro quel muro ci sono quattro metri che la pianta non mostra: lo spazio esatto dello studio, dall'altra parte della casa."},
  {id:"d4_specchio",name:"La stanza allo specchio",th:{T:3,A:-2},a:["g_testimoni"],b:["g_specchio","g_lucido"],text:"I testimoni hanno visto la lampada verde a sinistra della scrivania. Nello studio la lampada è a destra. Nella stanza gemella, ribaltata, è a sinistra. Alle dieci hanno visto la stanza riflessa."},
  {id:"d4_due_spari",name:"Due revolver, due spari",th:{A:-2,T:2},a:["g_revolver"],b:["g_revolver2","g_proiettile"],text:"Due Webley identici, una camera sparata in ciascuno. Il colpo che ha ucciso Halloway, alle 21:20, non l'ha sentito nessuno. Quello delle 22:10 è stato sparato contro la finestra della stanza gemella, solo per essere sentito."},
  {id:"d4_uscita",name:"Il montavivande",th:{A:-2,T:2},a:["g_paletto"],b:["g_montavivande","g_montav_scende"],text:"Il paletto era chiuso dall'interno, ma nello studio c'è un'altra uscita: il pozzo del montavivande. Alle 21:30 la cabina è scesa nella dispensa, e quando Hughes l'ha aperta era vuota. Qualcuno minuto ne era già uscito."},
  {id:"d4_inchiostro",name:"La stessa china",th:{T:3},a:["g_pennino"],b:["g_giacca2","g_obs_bea","g_pennini"],text:"Il pennino nella cabina del montavivande viene dalla scatola di Miss Hale. La china sul polsino della giacca rossa, nella stanza gemella, è la stessa. La stessa persona è scesa dal montavivande e si è seduta alla finestra."},
  {id:"d4_istruzioni",name:"Il trucco era suo",th:{T:2,A:-1},a:["g_istruzioni"],b:["g_owen_sa","g_lucido"],text:"«Resterà accesa una sola luce. Domattina vi spiegherò che cosa avete visto.» La finestra sbagliata era la dimostrazione di Halloway. L'assassino non ha inventato il trucco: ha preso il posto dell'architetto."},
  {id:"d4_owen",name:"Il capomastro era in cucina",th:{},a:["g_owen_alibi"],b:["g_tuono","d4_ora"],text:"Al tuono delle 21:20, quando Halloway moriva, Owen Pryce era seduto al tavolo della cucina e rovesciava la birra. Ha costruito la stanza gemella, ma non ha ucciso nessuno."},
  {id:"d4_alibi",name:"Tutti al pianoforte",th:{B:-2,C:-2},a:["g_piano","g_cambiali"],b:["d4_ora","g_tuono"],text:"Alle 21:20 Celia suonava, Rupert girava le pagine, Arden e il dottore ascoltavano. Hughes e Pryce erano in cucina. In tutta la casa, una sola persona era sola, al primo piano: Miss Hale, salita alle 21:10 con l'emicrania."},
  {id:"d4_movente",name:"La figlia di Llewelyn",th:{T:3},a:["g_ritaglio","g_medaglione"],b:["g_diario","g_calcoli"],text:"«B. Ll.» Beatrix Llewelyn, figlia del costruttore suicida dopo il crollo di Bangor. Ha rubato i calcoli che provano l'errore di Halloway, e Halloway l'aveva scoperta: sabato l'avrebbe fatta arrestare."}
];

  {id:"t1",q:"21:20 · Che cosa copre il tuono?",options:[{id:"niente",t:"Niente: Halloway è vivo e lavora"},{id:"sparo",t:"Lo sparo che uccide Halloway, nello studio",req:["d4_ora"]},{id:"porta",t:"Il rumore della porta della stanza segreta",req:["g_corridoio"]}]},
  {id:"t2",q:"21:25 · Come esce l'assassino dallo studio chiuso col paletto?",options:[{id:"nessuno",t:"Non esce nessuno: è un suicidio"},{id:"finestra",t:"Dalla finestra, con una corda",req:["g_persiane"]},{id:"filo",t:"Chiude il paletto dal corridoio con un filo",req:["g_paletto"]},{id:"montav",t:"Scende nel pozzo del montavivande fino alla dispensa",req:["d4_uscita"]}]},
  {id:"t3",q:"21:58 · Perché si spengono le luci della facciata?",options:[{id:"gas",t:"Il temporale fa calare il gas",req:["g_tuono"]},{id:"contatore",t:"L'assassino chiude il gas"},{id:"istruz",t:"Per la dimostrazione di Halloway, secondo le sue istruzioni",req:["g_istruzioni","d4_istruzioni"]}]},
  {id:"t4",q:"22:00 · Chi è alla finestra illuminata?",options:[{id:"halloway",t:"Halloway, vivo, nel suo studio"},{id:"complice",t:"Un complice, nello studio, con la giacca della vittima",req:["d4_persiane","d4_destra"]},{id:"gemella",t:"L'assassino, con la seconda giacca rossa, nella stanza gemella",req:["d4_specchio","d4_sinistra"]}]},

  {say:"«Alle dieci, Miss Hale, Ambrose Halloway era morto da quaranta minuti. Quello alla finestra non era lui.»",lab:"Presenta la prova che alla finestra non c'era Halloway",ok:["d4_specchio","d4_sinistra","d4_destra","d4_persiane","d4_due_spari"],good:"«La lampada era a sinistra della scrivania, e la finestra a sinistra del portico. Avete guardato tutti la stanza gemella.» Arden chiude il taccuino. Pryce abbassa la testa.",bad:"Miss Hale ti guarda con calma. «Tre persone lo hanno visto vivo alle dieci, avvocato. Io ero a letto.»"},
  {say:"«Chi sedeva lassù è sceso dal montavivande, un'ora prima. E ha lasciato la stessa firma, due volte.»",lab:"Presenta la prova che lega il montavivande e la stanza gemella alla stessa persona",ok:["d4_inchiostro","g_giacca2","g_pennino","g_obs_bea"],good:"Posi sul tavolo il pennino della cabina, accanto alla scatola con lo scomparto vuoto, e la giacca rossa con la china sul polsino. Miss Hale guarda le proprie dita, nere come sempre.",bad:"«Chiunque può infilarsi in un montavivande, avvocato. E chiunque può mettersi una giacca.»"},
  {say:"«E questo, Miss Llewelyn, è il perché.»",lab:"Presenta il movente",ok:["d4_movente","g_diario","g_calcoli","g_medaglione","g_ritaglio"],good:"Il foglio dei calcoli di Bangor, sul tavolo, con la moltiplicazione cerchiata in rosso. Accanto, il medaglione. Beatrix lo guarda a lungo. Poi lo prende, e lo stringe nel pugno.",bad:"«Non so di che cosa parla.» Ma ha sentito il nome. Tutti l'hanno visto."}]};
CASE_SPECCHIO.ending=function(ans,g,sl){const R=(k,title,eyebrow,paras)=>({kind:k,title,eyebrow,paras});
  const right={t1:"sparo",t2:"montav",t3:"istruz",t4:"gemella",t5:"secondo",t6:"camera",t7:"bangor"},tl=Object.keys(right).filter(k=>ans[k]===right[k]).length,res=(sl&&sl.res)||[],pr=res.filter(Boolean).length;
  if(ans.t5==="suicidio"||ans.t4==="halloway"&&ans.t2==="nessuno")return R("errato","Il suicidio dell'architetto","Finale errato",[
    "Hai confermato quello che tutti volevano sentire: Ambrose Halloway, stanco e malato delle sue case, si è chiuso nello studio e si è sparato alle 22:10, davanti ai suoi ospiti.","L'ispettore di Bangor firmò il verbale prima di cena. Celia partì per Londra il lunedì. Rupert impugnò il testamento non firmato, e vinse.","Miss Hale portò le ultime tavole a Londra, come aveva promesso, e non tornò più. A Plas Gwydr, dietro il ritratto in fondo all'ala ovest, una stanza rovesciata aspettò per anni qualcuno che la guardasse.","L'occhio ha creduto all'architetto. Anche il tuo. Rigioca."]);
  if(ans.who!=="beatrix"){const W={
    celia:"Hai accusato Celia Halloway. Voleva lasciare il marito, e scriveva lettere a un altro uomo. Ma alle 21:20 era al pianoforte, davanti a tre testimoni, e al tuono si è fermata a metà di una battuta.",
    rupert:"Hai accusato Rupert Halloway. Il movente era perfetto, e la sua spallata aveva aperto la porta. Ma alle 21:20 girava le pagine dello spartito, e al tuono le ha fatte cadere tutte. La difesa lo fece uscire in un pomeriggio.",
    felix:"Hai accusato Felix Arden. Amava la moglie, disprezzava il marito. Ma alle 21:20 ascoltava il pianoforte, e alle dieci disegnava sotto la pioggia: il suo schizzo, al processo, servì a scagionarlo.",
    owen:"Hai accusato Owen Pryce. Aveva costruito la stanza gemella, e aveva mentito per proteggerla. Ma alle 21:20 era al tavolo della cucina, e al tuono aveva rovesciato la birra davanti a due testimoni. Il capomastro andò in prigione per tre mesi, per falsa testimonianza. Ci andò in silenzio.",
    rhys:"Hai accusato il dottor Rhys. Ma era stato proprio lui a dire che il corpo era troppo freddo: un assassino non regala all'investigatore la prova che lo smentisce.",
    hughes:"Hai accusato Hughes, il maggiordomo. Era in casa da dieci giorni, non conosceva nemmeno la strada per la cantina. Figuriamoci quella per una stanza che non c'è."};
    return R("errato","La persona sbagliata","Finale errato",[W[ans.who]||W.rupert,"Al primo piano dell'ala ovest, due porte più in là di una stanza che nessuno conosceva, una ragazza con le dita macchiate di china finì le sue tavole e partì per Londra.","Hai visto quello che la casa voleva mostrarti. Rigioca."]);}
  if(tl>=6&&pr>=2&&res[2])return R("vera","L'occhio e l'architetto","Finale vero",[
    "Li hai riuniti in salone, con il lago che rifletteva la villa capovolta. Hai cominciato dalla fine: da un uomo che alle dieci scriveva veloce alla finestra, con la destra.",
    "«Ambrose Halloway non poteva scrivere con la destra, signori. Aveva il polso steccato. Ed era morto da quaranta minuti. Quello che avete visto era il suo ultimo trucco, recitato da qualcun altro.»",
    "Hai raccontato la stanza gemella, i quattro metri mancanti, la lampada a sinistra, il montavivande, il secondo Webley sparato contro la notte. Owen Pryce ascoltava a testa bassa.",
    "«Alle nove e dieci, Miss Hale, lei non aveva l'emicrania. Aveva un appuntamento con il tuono.»",
    "Beatrix non nega. Apre il medaglione e lo posa sul tavolo, accanto al foglio dei calcoli di Bangor. «Mio padre ha costruito quelle travi esattamente come erano disegnate», dice. «Quattordici persone a un concerto. Lui si è impiccato con la cinghia dei pantaloni, a Caernarfon. Io avevo quindici anni.»",
    "«Ho disegnato la sua stanza gemella millimetro per millimetro. Lui voleva dimostrare che l'occhio crede all'architetto.» Un sorriso minimo. «Avevo bisogno che fosse vero soltanto per dieci minuti.»",
    "L'ispettore di Bangor la portò via alle sei. Il foglio dei calcoli fu letto in tribunale a Caernarfon, nella stessa aula dove era stato condannato Ifor Llewelyn. I giornali di Londra ne parlarono per un mese.",
    "Felix Arden scrisse il suo articolo. Lo intitolò «La casa che mentiva». Non lo pubblicò mai.",
    "Hai guardato la casa dalla parte giusta."]);
  if(ans.t4==="gemella"&&tl>=4&&pr>=1)return R("quasi","La stanza riflessa","Finale parzialmente corretto",[
    "Hai indicato Beatrix Hale, e hai mostrato a tutti la stanza gemella. Ma la tua ricostruzione della notte aveva dei vuoti, e la difesa li riempì tutti.",
    "Al processo di Caernarfon, l'avvocato di Miss Hale sostenne che nella stanza gemella poteva esserci chiunque conoscesse il segreto, e che a conoscerlo erano in tre: uno era morto, uno era il capomastro.","La giuria non seppe decidere. Beatrix fu condannata per il furto dei calcoli di Bangor. Due anni.",
    "Hai trovato la stanza e l'assassina. Non tutta la notte. Rigioca per ricostruirla."]);
  return R("parziale","Il dubbio","Finale parzialmente corretto",[
    "Hai accusato Beatrix Hale, ma senza mostrare come avesse fatto. Tre testimoni giuravano di aver visto Halloway vivo alle dieci, solo nel suo studio chiuso dall'interno.","L'ispettore la interrogò per un'ora. Beatrix rispose con calma, ripetendo la stessa frase: avevo l'emicrania, ero a letto, al buio.","Il caso fu archiviato come suicidio. Lei partì per Londra il lunedì, con le sue tavole.","Avevi il nome giusto, e la casa contro. Rigioca."]);
};
CASE_SPECCHIO.tips={
  start:"«Un uomo visto vivo alle dieci, e freddo alle dieci e mezza. Una delle due cose è falsa, avvocato, e i medici sbagliano meno dei testimoni. Ma qui i testimoni non mentono: lo giurerei.»",
  act1:"«Una casa simmetrica è un invito a confondersi. Io misurerei qualcosa, se fossi in lei. Gli architetti mentono con le piante, non con i metri.»",
  act2:"«L'ispettore arriva alle cinque. A quel punto non basterà dire chi. Bisognerà dire come, minuto per minuto.»"
};
CASE_SPECCHIO.lyleDed={
  d4_ora:"«Le nove e venti. Il tuono.» Lyle rabbrividisce. «Qualcuno ha aspettato il temporale, avvocato, come si aspetta un treno.»",
  d4_mano:"«Un uomo con il polso steccato non si spara con quella mano. Me lo insegnavano al primo anno di medicina.»",
  d4_persiane:"«Persiane chiuse, ragnatela intatta. Hanno guardato una finestra, ma non questa.»",
  d4_destra:"«Scriveva con la destra.» Lyle si toglie gli occhiali. «Allora era qualcun altro, vestito da lui.»",
  d4_sinistra:"«A sinistra! Tutti hanno guardato a sinistra, e nessuno si è chiesto perché lo studio fosse a destra. Che cosa bella e terribile.»",
  d4_metri:"«Quattro metri di casa che non esistono.» Lyle guarda la pianta, poi la parete. «La mappa è sbagliata, avvocato. Guardi: la pianta adesso ha una stanza in più.»",
  d4_specchio:"«La stanza riflessa.» Lyle ride piano, incredulo. «Halloway ha costruito uno specchio grande come una stanza, e qualcuno ci è entrato dentro.»",
  d4_due_spari:"«Due revolver, due spari. Il primo per uccidere, il secondo per farsi sentire.»",
  d4_uscita:"«Il montavivande. Un uomo no. Una persona minuta, rannicchiata, sì. Lo diceva lei stesso, avvocato.»",
  d4_inchiostro:"«La stessa china, nel pozzo e sul polsino. Chi disegna lascia sempre una firma.»",
  d4_istruzioni:"«Il trucco era suo. L'assassino ha soltanto preso il suo posto sul palcoscenico.»",
  d4_owen:"«Il capomastro mentiva, ma per paura. Non per colpa.»",
  d4_alibi:"«Tutti al pianoforte, tranne una.» Lyle non dice il nome. Non ne ha bisogno.",
  d4_movente:"«Beatrix Llewelyn.» Lyle resta in silenzio a lungo. «Quattordici morti, e un padre. Non so se voglio aver ragione, questa volta.»"
};

function lensAt(cx,cy,handleDown){const L=$("#tlens"),gl=$("#tglass");if(!L||!gl)return;const g=studyGeo(),R=lensR();
  cx=Math.max(R+6,Math.min(g.W-R-6,cx));cy=Math.max(R+6,Math.min(g.H-R-6,cy));LENS.x=cx;LENS.y=cy;
  L.style.transform=`translate(${cx-R}px,${cy-R}px)`;L.classList.toggle("down",!!handleDown);
  const[ax,ay]=g.toA(cx,cy),w=2*R/g.s/LENS.Z,sv=gl.firstElementChild;if(sv)sv.setAttribute("viewBox",`${(ax-w/2).toFixed(1)} ${(ay-w/2).toFixed(1)} ${w.toFixed(1)} ${w.toFixed(1)}`);}

function lensInit(){const t=$("#title"),L=$("#tlens");if(!t||!L)return;let down=false,raf=0,px=0,py=0;
  const R=lensR();L.style.width=L.style.height=2*R+"px";
  const onUI=e=>e.target.closest(".t-panel,.t-quote");
  const go=(x,y,touch)=>{px=x;py=y;if(raf)return;raf=requestAnimationFrame(()=>{raf=0;touch?lensAt(px,py-R-58,true):lensAt(px,py,false);});};
  t.onpointermove=e=>{if(e.pointerType==="mouse"){if(onUI(e))return L.classList.remove("on");L.classList.add("on");go(e.clientX,e.clientY);}else if(down)go(e.clientX,e.clientY,true);};
  t.onpointerleave=e=>{if(e.pointerType==="mouse")L.classList.remove("on");};

  const up=()=>{if(!down)return;down=false;L.classList.remove("held");};

let filmT=[],filmEnd=null;
function playFilm(shots,onDone){AU.init();AU.music(true,"title");
  const f=$("#film");f.innerHTML=`<div id="shots"></div><div class="bars"></div><div class="cap"><p id="capt"></p></div><button class="fskip" id="skipb">Salta ›</button>`;
  f.style.opacity="1";f.style.transition="";f.classList.add("on");document.body.classList.add("filming");
  let idx=-1,cur=null,ended=false,waiting=false;
  const T=(fn,ms)=>{const t=setTimeout(fn,ms);filmT.push(t);return t;};
  const clear=()=>{filmT.forEach(clearTimeout);filmT=[];};
  const finish=()=>{if(ended)return;ended=true;clear();f.style.transition="opacity 1.1s";f.style.opacity="0";AU.music(false);
    setTimeout(()=>{f.classList.remove("on");f.innerHTML="";document.body.classList.remove("filming");snow(false);onDone&&onDone();},1100);};
  filmEnd=finish;
  const RT=t=>Math.max(3200,String(t||"").replace(/<[^>]+>/g,"").length*72+1400);
  let stT=null,advance=null;
  const next=()=>{clear();idx++;if(idx>=shots.length){finish();return;}const sh=shots[idx],t0=Date.now();
    const el=document.createElement("div");el.className="shot";
    el.innerHTML=`<div class="cam">${sh.img?`<img src="${artURL(sh.img)}" alt="">`:""}${sh.svg?sh.svg():""}${sh.svgBg?`<div style="position:absolute;inset:0;opacity:.35">${sh.svgBg()}</div>`:""}</div><div class="tint"></div>${sh.html||""}`;
    $("#shots").appendChild(el);const old=cur;cur=el;
    requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add("on")));
    if(old)setTimeout(()=>old.remove(),1500);
    const stages=[];if(sh.cap)stages.push((sh.place?`<span class="place">${sh.place}</span>`:"")+sh.cap);if(sh.cap2)stages.push(sh.cap2);
    const est=Math.max(sh.dur,(sh.capAt||900)+stages.reduce((a,x)=>a+RT(x)+700,0)+(sh.choice?9000:600));
    if(sh.cam&&el.querySelector(".cam").animate)el.querySelector(".cam").animate([{transform:sh.cam[0]},{transform:sh.cam[1]}],{duration:est+1600,easing:"ease-in-out",fill:"forwards"});
    snow(!!sh.snow);
    const c=$("#capt");c.classList.remove("on");
    if(sh.run)sh.run(el,T);
    let si=-1,lastCap="";
    const showChoice=()=>{waiting=true;c.classList.remove("on");const ch=document.createElement("div");ch.className="fchoice";
      ch.innerHTML=`${lastCap?`<div class="fctx">${lastCap.replace(/<span class="place">[^<]*<\/span>/,"")}</div>`:""}<p>${sh.choice.prompt}</p>${sh.choice.opts.map((o,i)=>`<button data-i="${i}">${o.t}</button>`).join("")}<div class="fr" id="fr"></div>`;el.appendChild(ch);
      ch.onclick=e=>{e.stopPropagation();if(e.target.classList.contains("fgo")){waiting=false;next();return;}const b=e.target.closest("button[data-i]");if(!b||b.disabled)return;const o=sh.choice.opts[+b.dataset.i];const fr=ch.querySelector("#fr");fr.textContent=o.r;fr.className="fr "+(o.ok?"ok":"no");AU.sfx(o.ok?"stamp":"tick");
        if(o.ok){ch.querySelectorAll("button[data-i]").forEach(x=>x.disabled=true);b.classList.add("ok");fr.insertAdjacentHTML("afterend",`<button class="fgo">Continua ›</button>`);T(()=>{if(waiting){waiting=false;next();}},RT(o.r)+2500);}else{b.disabled=true;b.classList.add("no");}};};
    const afterText=()=>{if(sh.choice){showChoice();return;}const left=Math.max(900,sh.dur-(Date.now()-t0));T(()=>c.classList.remove("on"),Math.max(200,left-700));T(next,left);};
    const showStage=()=>{clearTimeout(stT);si++;if(si>=stages.length){advance=null;afterText();return;}
      const go=()=>{lastCap=stages[si];c.innerHTML=stages[si];c.classList.add("on");stT=setTimeout(showStage,RT(stages[si]));filmT.push(stT);};
      if(si>0){c.classList.remove("on");stT=setTimeout(go,650);filmT.push(stT);}else go();};
    advance=()=>{if(si<stages.length)showStage();};
    if(stages.length){stT=setTimeout(showStage,sh.capAt||900);filmT.push(stT);}else{advance=null;afterText();}};
  f.onclick=e=>{if(e.target.id==="skipb"){AU.sfx("page");finish();return;}if(ended||waiting)return;AU.init();if(advance)advance();else next();};
  next();}

function chapter(o){snow(!o.art);const el=$("#chap"),step=fastText?.35:.85,long=o.paras.length>4;
  let h=o.art?`<div class="ch-art"><div class="cam">${roomSVG(o.art).replace("xMidYMid slice","xMidYMax slice")}</div>${o.plate?`<div class="plate">${o.plate}</div>`:""}</div>`:"";
  h+=`<div class="in">${o.mood==="murder"?BLOOD:""}<div class="eb">${o.eb}</div><h1>${o.title}</h1>${ORN}`;
  o.paras.forEach((p,i)=>{let c="";if(/^«/.test(p))c="q";if(p===p.toUpperCase()&&p.length<30)c="big";if(o.end&&i===o.paras.length-1)c="fin";h+=`<p class="${c}" style="animation-delay:${(.5+i*step).toFixed(2)}s">${p}</p>`;});
  h+=`<div class="acts" style="animation-delay:${(.5+o.paras.length*step).toFixed(2)}s">${o.buttons||`<button class="btn" id="chok">Continua</button>`}</div><div class="hint">tocca per mostrare tutto</div></div>`;
  el.innerHTML=h;el.classList.remove("skip");el.classList.toggle("long",long);el.classList.add("on");el.scrollTop=0;
  el.onclick=e=>{if(e.target.closest("button"))return;el.classList.add("skip");};
  const ok=$("#chok");if(ok)ok.onclick=()=>{el.classList.remove("on");snow(false);AU.sfx("page");o.onDone&&o.onDone();};
  if(o.mood==="murder"){AU.sfx("drone");setTimeout(()=>lightning(),1200);}else if(o.mood==="storm")setTimeout(()=>lightning(),700);else if(o.mood==="end"){AU.sfx("drone");}}

/* ---------------- LUCE VIVA: un solo shader WebGL, riusato da tutte le stanze ----------------
   Le luci di ogni stanza nascono dalle sue sorgenti (ROOMART[id].lights) e dai camini/stufe in scena.
   Di notte la finestra lascia entrare un raggio di luna; di giorno una luce grigia e diffusa.
   In più: la candela che porti col dito (o col mouse) e un bagliore quando trovi qualcosa.
   Ottimizzato: un solo contesto, mezza risoluzione, 30 fps, pausa sotto i pannelli e a schermo spento,
   qualità che scende da sola se il telefono fatica. */
const LUX={on:true,raf:0,gl:null,cv:null,Q:.5,slow:0,ptr:{x:0,y:0,a:0,ta:0},pulse:{x:0,y:0,t:-9},geo:null};
try{LUX.on=localStorage.getItem("cc_lux")!=="0";}catch(e){}
const LUX_FS=`precision mediump float;
uniform vec2 uR;uniform float uT,uAmb;uniform vec4 uL[6];uniform vec4 uC[6];uniform int uN;uniform vec4 uP;uniform vec4 uK;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(float x){return sin(x*1.7)*.5+sin(x*3.1+1.3)*.3+sin(x*7.3+.7)*.2;}
void main(){vec2 p=gl_FragCoord.xy;p.y=uR.y-p.y;vec3 L=vec3(0.);float lum=0.;
 for(int i=0;i<6;i++){if(i>=uN)break;vec4 l=uL[i];vec4 c=uC[i];float fl=c.a;float tp=floor(fl/10.);fl=fract(fl/10.)*10.;
  vec2 o=vec2(n(uT*2.3+float(i)*4.)*fl*6.,n(uT*1.9+float(i)*7.)*fl*4.);
  float d=length(p-(l.xy+o))/l.z;float f=pow(max(0.,1.-d),2.2);float k=l.w*(1.+fl*.16*n(uT*9.+float(i)*3.));
  if(tp>.5){vec2 q=p-l.xy;float ax=-q.x*.42+q.y*.91,ay=-q.x*.91-q.y*.42;float w=l.z*(.3+.22*max(0.,ax)/l.z);
   float beam=smoothstep(w,w*.3,abs(ay))*smoothstep(-l.z*.1,l.z*.3,ax)*smoothstep(l.z*2.6,l.z*.7,ax);beam*=.7+.3*n(ax*.03+uT*.4);f=f*.6+beam*.5;}
  L+=c.rgb*f*k;lum+=f*k;}
 if(uK.w>.01){float d=length(p-uK.xy)/uK.z;float f=pow(max(0.,1.-d),2.)*uK.w*(1.+.12*n(uT*11.));L+=vec3(1.,.7,.38)*f;lum+=f;}
 if(uP.w>.5){float a=uP.z;float d=length(p-uP.xy);float ring=smoothstep(14.,0.,abs(d-a*160.))*(1.-a);float core=smoothstep(60.,0.,d)*(1.-a)*.8;L+=vec3(1.,.85,.5)*(ring+core);lum+=ring+core;}
 float g=0.;vec2 cell=floor(p/9.);float r=h(cell);if(r>.965){vec2 c2=(cell+.5)*9.+vec2(sin(uT*.6+r*40.)*4.,-mod(uT*6.+r*90.,9.)+4.);g=smoothstep(1.6,0.,length(p-c2))*min(1.,lum*1.4)*(.5+.5*sin(uT*2.+r*60.));}
 float dark=uAmb*(1.-clamp(lum*1.35,0.,1.));vec3 glow=L*.42+vec3(1.,.92,.75)*g*.8;
 gl_FragColor=vec4(glow,dark+min(.5,dot(glow,vec3(.33))));}`;
function luxNight(){const t=G.time%1440;return t>=19*60+30||t<6*60+30;}
/* le luci della stanza, ricavate dalla scena */
function luxLights(A){if(A.lux)return A.lux;const L=[],night=luxNight();
  (A.lights||[]).forEach(([x,y,r,g])=>{if(g==="gCold")L.push(night?[x,y-20,Math.max(130,r*.85),"moon",0,.85,"beam"]:[x,y,r*1.2,"day",0,.32]);else L.push([x,y,r*1.15,"warm",.35,.95]);});
  A.props(G.act,{}).forEach(p=>{if(p[0]==="fire"||p[0]==="stove")L.unshift([p[1],p[2]-38*(p[3]||1),300*(p[3]||1),"fire",1,1.1]);});
  return L.slice(0,5);}
function luxStop(){cancelAnimationFrame(LUX.raf);LUX.raf=0;}
function luxGL(){if(LUX.gl)return LUX.gl;const cv=document.createElement("canvas");cv.className="lux";
  const gl=cv.getContext("webgl",{premultipliedAlpha:true,alpha:true,antialias:false,powerPreference:"low-power"});if(!gl)return null;
  const sh=(t,src)=>{const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);return s;};
  const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,"attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}"));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,LUX_FS));gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS))return null;gl.useProgram(pr);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const al=gl.getAttribLocation(pr,"a");gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
  const U={};["uR","uT","uAmb","uL","uC","uN","uP","uK"].forEach(k=>U[k]=gl.getUniformLocation(pr,k));
  cv.addEventListener("webglcontextlost",e=>{e.preventDefault();luxStop();LUX.gl=null;LUX.cv=null;});
  LUX.cv=cv;LUX.U=U;return LUX.gl=gl;}
const LUXCOL={warm:[1,.62,.26],fire:[1,.45,.12],cand:[1,.75,.4],moon:[.55,.7,1],day:[.78,.84,.92],cold:[.6,.72,.9]};
function luxInit(){luxStop();const sc=document.querySelector("#main .scene"),pn=sc&&sc.querySelector(".pan"),A=ROOMART[G.room];
  if(!pn||!A||A.out||!LUX.on||DARK_ROOMS.includes(G.room))return;const gl=luxGL();if(!gl)return;const cv=LUX.cv,U=LUX.U;
  pn.insertBefore(cv,pn.querySelector(".glow"));sc.classList.add("lux");cv.style.opacity="0";requestAnimationFrame(()=>requestAnimationFrame(()=>cv.style.opacity="1"));
  const lights=luxLights(A),night=luxNight(),amb=A.luxAmb!=null?A.luxAmb:night?.55:.3;let W=0,H=0,last=0,acc=0,frames=0;
  const size=()=>{const w=pn.clientWidth,h=pn.clientHeight,Q=LUX.Q*Math.min(1.5,window.devicePixelRatio||1);W=Math.max(2,Math.round(w*Q));H=Math.max(2,Math.round(h*Q));cv.width=W;cv.height=H;gl.viewport(0,0,W,H);
    const k=Math.max(w/800,h/450),ox=(w-800*k)/2,oy=(h-450*k)/2,Ls=new Float32Array(24),Cs=new Float32Array(24);LUX.geo={Q,k,ox,oy};
    lights.forEach((l,i)=>{const c=LUXCOL[l[3]]||LUXCOL.warm;Ls.set([(ox+l[0]*k)*Q,(oy+l[1]*k)*Q,l[2]*k*Q,l[5]||1],i*4);Cs.set([c[0],c[1],c[2],(l[6]==="beam"?10:0)+(l[4]||0)],i*4);});
    gl.uniform2f(U.uR,W,H);gl.uniform4fv(U.uL,Ls);gl.uniform4fv(U.uC,Cs);gl.uniform1i(U.uN,lights.length);gl.uniform1f(U.uAmb,amb);};
  size();
  /* la candela che porti tu */
  const P=LUX.ptr;P.a=0;P.ta=0;const move=e=>{const r=pn.getBoundingClientRect();P.x=e.clientX-r.left;P.y=e.clientY-r.top;};
  pn.onpointermove=e=>{move(e);if(e.pointerType==="mouse")P.ta=.55;};pn.onpointerdown=e=>{move(e);P.ta=.75;};
  pn.onpointerleave=e=>{if(e.pointerType==="mouse")P.ta=0;};pn.onpointerup=pn.onpointercancel=e=>{if(e.pointerType!=="mouse")P.ta=0;};
  const covered=()=>["#talk","#plate","#chap","#salon","#film","#pick","#tav"].some(s=>{const el=$(s);return el&&el.classList.contains("on");});
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const frame=t=>{const g=LUX.geo;gl.uniform1f(U.uT,t/1000);P.a+=(P.ta-P.a)*.12;gl.uniform4f(U.uK,P.x*g.Q,P.y*g.Q,95*g.k*g.Q,P.a);
    const pa=(t/1000-LUX.pulse.t)/.9;gl.uniform4f(U.uP,LUX.pulse.x*g.Q,LUX.pulse.y*g.Q,Math.max(0,pa),pa>=0&&pa<1?1:0);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);};
  const draw=t=>{if(!cv.isConnected||G.tab!=="room"){luxStop();return;}LUX.raf=requestAnimationFrame(draw);if(document.hidden||covered())return;const dt=t-last;if(dt<33)return;last=t;
    if(Math.round(pn.clientWidth*LUX.Q*Math.min(1.5,window.devicePixelRatio||1))!==W)size();
    if(dt<200){acc+=dt;frames++;if(frames===60){if(acc/frames>48&&LUX.Q>.3){LUX.Q=.3;size();}acc=0;frames=0;}}
    frame(t);};
  if(still)frame(1000);else LUX.raf=requestAnimationFrame(draw);}
/* un bagliore dove hai trovato qualcosa */
function luxPulse(oid){const A=ROOMART[G.room],g=LUX.geo,p=A&&A.hot&&A.hot[oid];if(!g||!p||!LUX.raf)return;const x=A.mirror?p[0]:p[0];LUX.pulse={x:g.ox+x*g.k,y:g.oy+p[1]*g.k,t:performance.now()/1000};}

function theoryScore(k){let pos=[],neg=[],sum=0;G.clues.forEach(id=>{const v=(S.clues[id].th||{})[k]||0;if(v>0)pos.push(id);if(v<0)neg.push(id);sum+=v;});return {pos,neg,sum};}

  ["A","B","C","T"].forEach(k=>{const t=S.theories[k],s=theoryScore(k),hid=k==="T"&&s.sum<4,pct=Math.max(0,Math.min(100,s.sum*(k==="T"?6:10)));

    <div class="pcards">${hid?"":s.pos.map((id,i)=>pcard(id,false,i)).join("")+s.neg.map((id,i)=>pcard(id,true,i)).join("")}${!hid&&!s.pos.length&&!s.neg.length?`<div class="emptyc">Nessun reperto appuntato.</div>`:""}</div></div>`;});

function drawStrings(){document.querySelectorAll(".cork").forEach(c=>{const svg=c.querySelector("svg.str"),tc=c.querySelector(".tcard");if(!svg||!tc)return;const sr=svg.getBoundingClientRect(),t=tc.getBoundingClientRect();let s="";
  const pt=p=>{const r=p.querySelector(".pin").getBoundingClientRect();return [r.left+r.width/2-sr.left,r.top+r.height/2-sr.top];};
  const seg=(a,b,neg)=>`<path d="M${a[0]} ${a[1]}Q${(a[0]+b[0])/2} ${Math.max(a[1],b[1])+16} ${b[0]} ${b[1]}" stroke="${neg?"#141414":"#b3141a"}" stroke-width="1.7" fill="none"${neg?` stroke-dasharray="5 3"`:""}/>`;

  let h=`<div class="court"><div class="plaque"><span class="fl"></span><h2>${S.accuseTitle||"L'accusa"}</h2><span class="fl r"></span></div><p class="desc">${G.forced?"Non c'è più tempo. Devi accusare adesso.":(S.accuseDesc||"Si accusa una volta sola. Le ipotesi barrate richiedono prove che non hai ancora trovato.")}</p>`;
  S.accusation.forEach((q,qi)=>{h+=`<div class="qblock"><h3><span class="qn">${ROMAN[qi]}.</span> ${q.q}</h3>`;
    if(q.type==="char")h+=`<div class="sus">${q.options.map(id=>{const c=S.chars[id];return `<button class="${accAns[q.id]===id?"on":""}" onclick="pick('${q.id}','${id}')"><div class="pf">${portrait(c.p,!alive(id))}</div><span>${c.short}</span></button>`}).join("")}</div>`;
    else q.options.forEach(o=>{const ok=!o.req||o.req.some(has);h+=ok?`<button class="opt${accAns[q.id]===o.id?" on":""}" onclick="pick('${q.id}','${o.id}')"><span class="bx"></span><span>${o.t}</span></button>`:`<div class="opt lock"><span class="bx"></span><span><s>${o.t}</s><span class="why">Non hai ancora prove per sostenerlo.</span></span></div>`;});
    h+=`</div>`;});
  const ready=S.accusation.every(q=>accAns[q.id]);
  return h+`<button class="btn red big" ${ready?"":"disabled"} onclick="confirmAccuse()">Pronuncia l'accusa</button></div>`;}
function pick(q,v){accAns[q]=v;AU.sfx("page");const y=$("#main").scrollTop;render();$("#main").scrollTop=y;}
function confirmAccuse(){if(S.inverted)accAns={who:S.culprit};note("Ne sei sicuro?",`<p>${S.inverted?`Stai per tendere la trappola a <b>${S.chars[accAns.who].name}</b>, davanti a tutti.`:`Stai per accusare formalmente <b>${S.chars[accAns.who].name}</b>, davanti a tutti.`} Non si torna indietro.</p><div class="row"><button class="btn red" onclick="closeOv();doAccuse()">Accuso</button><button class="btn ink" onclick="closeOv()">Aspetta</button></div>`,true);}
function doAccuse(){AU.sfx("gavel");lyleHide();G.answers={...accAns};save();setTimeout(()=>{if(S.trap)trapScene(finishAccuse);else if(S.confronto){if(accAns.who===S.confronto.who)trapScene(finishAccuse);else{finishAccuse({});shake();lightning();setTimeout(showEnding,700);}}else salonScene(finishAccuse);},500);}
function finishAccuse(sl){const e=S.ending(accAns,G,sl);G.ended=e;G.salon=sl;save();setDone(S.id,e.kind);render();return e;}
function endButtons(){return `<button class="btn red" id="rp">La pagella del caso</button>${G.ended.kind!=="vera"?`<button class="btn" id="rv">Rivela la verità</button>`:""}<button class="btn red" id="ng">Rigioca il caso</button><button class="btn" id="mn">Menu principale</button>`;}
function bindEnd(){const rp=$("#rp");if(rp)rp.onclick=()=>showReport();const rv=$("#rv");if(rv)rv.onclick=()=>revealTruth();$("#ng").onclick=()=>{$("#chap").classList.remove("on");newGame(S.id);};$("#mn").onclick=()=>{$("#chap").classList.remove("on");toMenu();};}
function showEnding(){const e=G.ended;chapter({eb:"Dagli appunti del dottor Lyle · "+e.eyebrow,title:e.title,paras:e.paras,mood:"end",end:true,buttons:endButtons()});bindEnd();}
function revealTruth(sure){if(!sure){$("#chap").classList.remove("on");note("Leggere la soluzione?",`<p>Vedrai la ricostruzione completa del caso, con tutti i colpi di scena.</p><div class="row"><button class="btn red" onclick="closeOv();revealTruth(true)">Rivela</button><button class="btn ink" onclick="closeOv()">Non ancora</button></div>`,true);return;}
  chapter({eb:"La soluzione",title:"Che cosa è successo davvero",paras:S.truth,mood:"end",buttons:`<button class="btn red" id="ng">Rigioca il caso</button><button class="btn" id="mn">Menu principale</button>`});bindEnd();}

/* ---------------- FINESTRE ---------------- */
function note(title,html,raw){$("#sheet").innerHTML=`<button class="x" onclick="closeOv()">✕</button><h2>${title}</h2>${raw?html:html}`;$("#ov").classList.add("on");armBack();AU.sfx("page");}
function closeOv(){$("#ov").classList.remove("on");}
function pause(){note("Pausa",`<div class="pmenu"><button class="btn ink" onclick="closeOv()">Riprendi l'indagine</button><button class="btn ink" onclick="AU.toggle();pause()">Audio: ${AU.on?"acceso":"spento"}</button><button class="btn ink" onclick="closeOv();toggleFull()">${isFull()?"Esci dallo schermo intero":"Schermo intero"}</button><button class="btn ink" onclick="howTo()">Come si gioca</button><button class="btn ink" onclick="closeOv();toMenu()">Torna al menu principale</button></div>`,true);}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeOv();$("#plate").classList.remove("on");closeTalk();}});

/* ---------------- NEVE (canvas leggero: 1x, 30 fps, si ferma quando è nascosta) ---------------- */
let snowOn=false,snowRun=false;
function snow(on){snowOn=!!on;$("#snow").style.opacity=on?".6":"0";if(on&&!snowRun)snowLoop();}
const SNOW={cv:null,cx:null,W:0,H:0,fl:[],last:0};
function snowInit(){const S_=SNOW;S_.cv=$("#snow");S_.cx=S_.cv.getContext("2d");const rs=()=>{S_.W=S_.cv.width=Math.round(innerWidth);S_.H=S_.cv.height=Math.round(innerHeight);};rs();addEventListener("resize",rs);
  const n=innerWidth<700?55:90;for(let i=0;i<n;i++)S_.fl.push({x:Math.random(),y:Math.random(),r:Math.random()*1.7+.5,s:Math.random()*.0026+.0008,d:Math.random()*.0016-.0012});}
function snowLoop(){snowRun=true;const S_=SNOW;
  (function loop(t){if(!snowOn||document.hidden){snowRun=false;S_.cx.clearRect(0,0,S_.W,S_.H);return;}
    if(t-S_.last>=33){S_.last=t;const cx=S_.cx;cx.clearRect(0,0,S_.W,S_.H);cx.fillStyle="rgba(232,224,206,.85)";cx.beginPath();
      for(const f of S_.fl){f.y+=f.s;f.x+=f.d+Math.sin(f.y*12)*.0005;if(f.y>1){f.y=-.02;f.x=Math.random();}if(f.x>1)f.x=0;if(f.x<0)f.x=1;const x=f.x*S_.W,y=f.y*S_.H;cx.moveTo(x+f.r,y);cx.arc(x,y,f.r,0,6.3);}
      cx.fill();}
    requestAnimationFrame(loop);})(0);}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&snowOn&&!snowRun)snowLoop();});

/* ---------------- GRANA DELLA CARTA (generata una volta come PNG) ---------------- */
(function(){try{const n=document.createElement("canvas");n.width=n.height=80;const x=n.getContext("2d"),d=x.createImageData(80,80);
  for(let i=0;i<d.data.length;i+=4){const v=232+Math.random()*23|0;d.data[i]=v;d.data[i+1]=v;d.data[i+2]=v-3;d.data[i+3]=255;}
  x.putImageData(d,0,0);const c=document.createElement("canvas");c.width=c.height=240;const y=c.getContext("2d");y.imageSmoothingEnabled=true;y.drawImage(n,0,0,240,240);
  document.documentElement.style.setProperty("--noise",`url(${c.toDataURL()})`);}catch(e){}})();

/* ---------------- AVVIO ---------------- */
document.body.insertAdjacentHTML("afterbegin",DEFS);
(function(){let t="";for(let i=0;i<12;i++){const a=i*30*Math.PI/180;t+=`<path d="M${(20+12.5*Math.sin(a)).toFixed(2)} ${(20-12.5*Math.cos(a)).toFixed(2)}L${(20+14.5*Math.sin(a)).toFixed(2)} ${(20-14.5*Math.cos(a)).toFixed(2)}" stroke="#3b2a1a" stroke-width="${i%3?.6:1.4}"/>`;}$("#wticks").innerHTML=t;})();
$("#bMenu").innerHTML=IC.menu;$("#bLyle").innerHTML=portrait(LYLE.p);$("#bWait").innerHTML=IC.hour;
snowInit();buildTitle();snow(false);
document.addEventListener("keydown",e=>{if(!started&&(e.key==="Enter"||e.key===" ")){e.preventDefault();startGame();}});

</script>
