  rooms:{
    salone:{name:"Salone", crimeFrom:99,
      desc:[
        "Soffitti a cassettoni, un camino in cui potrebbe stare in piedi un uomo, ritratti di Corbelli morti da secoli. Stanotte nessuno si siede. Il fuoco è l'unica cosa che si muove.",
        "Luce grigia di neve dalle finestre alte. Le tazze del caffè sono rimaste sul tavolino. Nessuno le ha toccate.",
        "Le tende sono state tirate. Fuori la bufera non ha pietà; dentro, il silenzio di chi conta i presenti.",
        "Tutte le candele accese. Il fuoco scoppietta. Sembra una festa, se non si guardano le facce."],
      objects:[
        {id:"ritratto",label:"Il ritratto del conte da giovane",clue:"c_ritratto",
         text:"Lorenzo Corbelli a trent'anni, in uniforme da ufficiale di cavalleria. Il pittore era bravo: ha preso la fossetta sul mento, l'attaccatura dei capelli a punta sulla fronte, il modo di inclinare la testa a sinistra. Ti torna in mente il viso di Jacopo sul tappeto della biblioteca. La stessa fossetta. La stessa punta di capelli."},
        {id:"carte",label:"Il tavolo da gioco",
         text:"Una partita a scopa abbandonata a metà. Due bicchieri: uno con un dito di grappa, l'altro vuoto e asciutto da ore. Il dottore e il prete hanno giocato fino alle undici. Uno dei due beveva, l'altro guardava."},
        {id:"camino",label:"Il camino",
         text:"Ceppi di quercia, cenere fine e uniforme. Nessun foglio bruciato. Chi brucia le cose, in questa casa, lo fa altrove."}
      ]},
    biblioteca:{name:"Biblioteca", crimeFrom:0,
      desc:[
        "Tremila volumi e una galleria in ferro battuto a cui si sale da una scala a chiocciola. Al centro, sul tappeto persiano, Jacopo Corbelli: bellissimo anche adesso, la testa piegata in un angolo impossibile.",
        "Il corpo di Jacopo è stato coperto con un lenzuolo. Il sangue sul tappeto è diventato nero.",
        "Il lenzuolo sul corpo di Jacopo. L'odore comincia a farsi sentire, nonostante il freddo.",
        "La biblioteca è al buio. Nessuno ha più voglia di entrarci."],
      objects:[
        {id:"fermacarte",label:"Il fermacarte di marmo",clue:"c_fermacarte",
         text:"Marmo verde delle Apuane, pesante come un mattone. Sangue e capelli su un solo spigolo. Jacopo è stato colpito alla tempia destra. Un destro che colpisce un uomo di fronte prende la tempia sinistra. Chi l'ha colpito gli stava davanti, e usava l'altra mano."},
        {id:"tappeto",label:"Il tappeto",clue:"c_trascinamento",
         text:"Due solchi paralleli nel pelo del tappeto, dalla base della scala a chiocciola fino al centro della stanza: talloni trascinati. Jacopo è caduto dalla galleria ed è morto lì. Poi qualcuno l'ha spostato e ha rovesciato due sedie per inscenare una lotta. Le sedie sono cadute troppo ordinatamente."},
        {id:"galleria",label:"La ringhiera della galleria",clue:"c_pizzo",
         text:"Sali la scala a chiocciola. Sulla ringhiera, all'altezza di una mano, è impigliato un frammento di pizzo nero. Chantilly: fine, caro, francese. In questa casa vestono di nero due donne."},
        {id:"bicchiere",label:"Il bicchiere sul tavolino",clue:"c_bicchiere",
         text:"Un bicchiere di brandy a metà accanto alla poltrona. Sul fondo, un deposito biancastro che con il brandy non ha niente a che fare. Lo annusi: amaro, farmaceutico."},
        {id:"leggio",label:"Il libro sul leggio",clue:"c_landsteiner",
         text:"Un trattato in tedesco, Landsteiner, sui gruppi sanguigni. Una pagina segnata con un biglietto del tram di Bologna, una tabella sottolineata con violenza. A margine, a matita, una grafia nervosa: «AB non può dare O». Se un genitore è di gruppo AB, il figlio non può essere di gruppo O. Mai."}
      ]},
    sala_pranzo:{name:"Sala da pranzo", crimeFrom:99,
      desc:[
        "La tavola di stasera non è stata sparecchiata. Sette coperti, sette segnaposti, l'argenteria che luccica sotto il lampadario spento.",
        "Rina ha sparecchiato all'alba, ma la tovaglia è ancora lì, macchiata.",
        null,null],
      objects:[
        {id:"tavola",label:"Il posto della contessa",clue:"c_bicchiere_sx",
         text:"Al posto della contessa le posate sono composte con precisione militare. Ma il bicchiere dell'acqua è a sinistra del piatto, e la macchia di vino sulla tovaglia è a sinistra. Come chi, stanca, smette per un attimo di sorvegliarsi."},
        {id:"sedia",label:"La sedia spostata",
         text:"La sedia della contessa è stata spinta indietro con calma. È uscita alle 22:20, ricordi bene: emicrania. Un'ora e dieci minuti prima dell'urlo."},
        {id:"credenza",label:"La credenza",
         text:"Argenteria in fila come soldati. Non manca niente: Rina conta i coltelli ogni sera, e lo dice con un certo orgoglio."}
      ]},
    cucina:{name:"Cucina", crimeFrom:99,
      desc:[
        "La cucina è l'unico posto caldo della villa. Rame alle pareti, un tavolo di marmo, odore di brodo e di cenere.",
        "Le stufe accese dalle cinque. Rina non si siede mai.",null,null],
      objects:[
        {id:"vassoio",label:"Il vassoio e le tazze",clue:"c_tazza",
         text:"Sul marmo, il vassoio d'argento del brandy, lavato di fresco. Accanto, la tazza da tisana della contessa, quella con le violette: pulita, asciutta, la polvere della credenza ancora sul bordo. Stanotte nessuno ci ha bevuto."},
        {id:"barattolo",label:"Il barattolo del caffè",clue:"c_figlio",
         text:"Dietro il barattolo del caffè, infilata tra il legno e il muro, una piccola fotografia: un bambino di dieci o undici anni in divisa da collegio. Sul retro, a matita: «Tonino — collegio di Pistoia — 1927»."},
        {id:"coltelli",label:"I coltelli",clue:"c_rina_destra",
         text:"I coltelli di Rina: affilati, puliti, tutti al loro posto. I manici di legno sono consumati sul lato destro, lisci come vetro. Mani destre, da trent'anni."}
      ]},
    studio:{name:"Studio del conte",mapName:"Studio", crimeFrom:99,
      desc:[
        "Lo studio di Lorenzo Corbelli è rimasto com'era. Libri contabili, un globo, la scrivania di noce. Elena Voss vi lavora come se il conte potesse rientrare da un momento all'altro.",
        "Elena è alla scrivania dalle sei. Ha l'aria di chi ha appena fatto un buon affare.",
        "La sedia di Elena è vuota. Le sue carte, ordinate fino all'ossessione, aspettano qualcuno che non tornerà.",
        null],
      objects:[
        {id:"bozza",label:"La bozza del testamento",clue:"c_testamento",
         text:act=>act<2?"Elena ti porge un fascicolo senza alzarsi. «È questo che è venuto a leggere, notaio. La versione che il conte non ha fatto in tempo a firmare.» Una rendita minima a Jacopo, «poiché egli non è sangue mio». Il grosso alla Fondazione Corbelli. Una parte cospicua a Elena Voss.":"La bozza del testamento è ancora sulla scrivania. Una rendita minima a Jacopo, «poiché egli non è sangue mio». Il grosso alla Fondazione Corbelli e a Elena Voss. Due dei tre beneficiari sono morti."},
        {id:"calendario",label:"Il calendario da tavolo",clue:"c_calendario",from:2,
         text:"Il calendario dell'anno, conservato come un registro. Il 3 maggio è cerchiato in rosso: il giorno in cui morì il conte. Sulla casella del 2 maggio, nella grafia minuta di Elena: «tisana — J.»"},
        {id:"registro",label:"Il cassetto della scrivania",clue:"c_registro",from:2,
         text:"Sotto la carta assorbente, un quaderno nero con la copertina di tela. Non sono conti della villa. Sono incassi. «R. — 5.000 entro Natale.» «S.B. — ottobre — saldato.» «C.M. — 50 mensili.» E una riga sola, diversa: «J.C. — ottobre — 3.000 — la carta del '20». Elena non vendeva solo silenzio. Vendeva anche documenti."},
        {id:"archivio",label:"Lo schedario di ferro",clue:"c_referto_vero",req:"chiavi_elena",
         reqMsg:"Uno schedario in ferro, chiuso a chiave. Elena portava le chiavi alla cintura, sempre.",
         text:"La chiave più piccola del mazzo di Elena gira con uno scatto. Fascicoli ordinati per cognome. In quello intestato a RINALDI, una busta ingiallita: Istituto di Fisiologia della Regia Università di Bologna, marzo 1920. Gruppi sanguigni. Lorenzo Corbelli: O. Allegra Corbelli: O. Jacopo Corbelli: O. Marco Rinaldi: AB. In fondo, a mano: «Il dott. R. è escluso come padre. Riservato.» Rinaldi ha saputo la verità otto anni fa. E ha taciuto."}
      ]},
    camera_jacopo:{name:"Camera di Jacopo",mapName:"Jacopo", crimeFrom:99,
      desc:[
        "La stanza di un uomo che non voleva essere qui: valigie mai disfatte, vestiti di sartoria buttati sulle sedie, un odore dolciastro sotto quello del tabacco.",
        null,null,null],
      objects:[
        {id:"camino",label:"Il camino spento",clue:"c_fiala",
         text:"Tra la cenere, qualcosa di vetro. Una piccola fiala annerita, rotta a metà. L'etichetta è bruciata per tre quarti: «…ITALINA — E. Merck, Darmstadt». Digitalina. A dosi giuste regola il cuore. A dosi sbagliate lo ferma, e un medico frettoloso scrive: infarto."},
        {id:"astuccio",label:"L'astuccio di pelle",clue:"c_morfina",
         text:"Un astuccio di coccodrillo: siringa d'argento, sei alloggi per ampolle di morfina. Quattro sono vuoti. Anche per un uomo abituato come Jacopo, quattro in una sera sono un suicidio. O un aiuto."},
        {id:"agenda",label:"L'agenda",clue:"c_agenda",
         text:"Un'agenda in pelle piena di numeri di telefono di Bologna e Milano, debiti, nomi di donna. L'ultima pagina scritta è di ieri: «Ven. — confess. da don A. — poi dirle la verità sul dottore. Prima che il notaio legga.»"},
        {id:"finestra",label:"La finestra",
         text:"Neve sul davanzale, intatta. Nessuno è entrato né uscito da qui."}
      ]},
    camera_allegra:{name:"Camera della contessa",mapName:"La contessa", crimeFrom:99,
      lock:g=>g.act<1?"La porta è chiusa a chiave. La contessa tiene la chiave su di sé.":null,
      desc:[null,
        "Una stanza severa: letto a baldacchino, un inginocchiatoio, un telaio da ricamo vicino alla finestra. Nessuno specchio.",
        "La contessa è seduta accanto alla finestra, nella luce grigia. Ti guarda entrare senza voltare la testa. «Faccia pure, notaio. Non ho niente da nascondere che lei sappia trovare.»",
        "La stanza è vuota. Il letto non è stato disfatto."],
      objects:[
        {id:"foto",label:"Le fotografie sul comò",clue:"c_foto_viareggio",
         text:"Una sola fotografia incorniciata in argento: Allegra e Lorenzo giovani, su una spiaggia, abbracciati, ridono. Lei non sembra la donna di sotto. Sul retro: «Viareggio, agosto 1894. L'unica estate. A.» Fai i conti: Jacopo è nato nel maggio del 1895."},
        {id:"messale",label:"Il messale sull'inginocchiatoio",clue:"c_lettera_allegra",
         text:"Tra le pagine della Messa dei defunti, una lettera piegata in quattro, senza busta. «Lorenzo. Il figlio di Marco ti ha ucciso. Me l'ha detto ridendo, il mese scorso, come si racconta una barzelletta: ti ho liberata, mamma. Il frutto del mio peccato ha ucciso te. Rimedierò io a ciò che ho generato, prima che il notaio legga le tue carte. Poi verrò a chiederti perdono. A.» La grafia pende all'indietro, come quella di chi scrive con la mano sinistra."},
        {id:"telaio",label:"Il telaio da ricamo",clue:"c_ricamo",
         text:"Un ricamo a punto pieno, gigli neri su lino. Il lavoro procede da destra verso sinistra, e l'ago è infilato dal lato opposto a quello di qualunque ricamatrice tu abbia mai visto."},
        {id:"comò",label:"Il cassetto del comò",clue:"c_astuccio_vuoto",from:2,
         text:"Gli effetti personali del conte, disposti con cura: i gemelli, l'orologio da tasca fermo, il portasigari. E un astuccio di cuoio per rasoio, con le iniziali L.C. impresse in oro. Lo apri. È vuoto."},
        {id:"guanti",label:"I guanti sul termosifone",clue:"c_guanti",from:2,
         text:"Un paio di guanti di capretto nero stesi ad asciugare. Lavati da poco: sono ancora umidi. Il sinistro è più rigido del destro, e sotto la cucitura del pollice resta un alone rossastro che l'acqua non ha portato via."}
      ]},
    camera_dottore:{name:"Camera del dottore",mapName:"Il dottore", crimeFrom:99,
      lock:g=>null,
      desc:[
        "Odore di grappa e di acido fenico. La borsa del medico aperta sulla sedia, una bottiglia sul comodino, già a metà.",
        "Il letto disfatto. La bottiglia è finita.",
        null,
        "Rinaldi apre la porta solo quando sente la tua voce, e la richiude subito alle tue spalle, a doppia mandata. Ha una seconda bottiglia e gli occhi di un cane bastonato."],
      objects:[
        {id:"borsa",label:"La borsa del medico",clue:"c_borsa",
         text:"Stetoscopio, bisturi, garze, un flacone di laudano. E una scatola di cartone bianco: digitalina Merck, dodici alloggi. Le fiale sono undici."},
        {id:"portafoglio",label:"Il portafoglio sul comodino",clue:"c_foto_rinaldi",
         text:"Banconote stropicciate, una ricevuta del Monte di Pietà, e una fotografia consumata agli angoli: una ragazza bellissima e severa accanto a uno studente con il cappello a falda larga. «Bologna, primavera 1894.» Dedica: «Al mio Marco — A.» La ragazza è la contessa."},
        {id:"giacca",label:"La giacca appesa",clue:"c_ricatto",
         text:"Nella tasca interna, una lettera battuta a macchina, senza firma ma con le iniziali E.V. a penna: «So del referto. So del 1920. Cinquemila lire entro Natale, o la contessa saprà.»"}
      ]},
    camera_sofia:{name:"Camera di Sofia",mapName:"Sofia", crimeFrom:99,
      desc:[
        "Una stanza per gli ospiti, piccola, ordinata in modo quasi doloroso. Una valigia già pronta ai piedi del letto.",
        null,null,null],
      objects:[
        {id:"diario",label:"Il quaderno sotto il cuscino",clue:"c_diario_sofia",
         text:"Un diario rilegato in tela grigia. Le ultime pagine: «Ho trovato la lettera tra le carte di Gustavo. Jacopo lo ha ucciso, e la famiglia mi ha pagata perché non facessi domande. Ho preso i loro soldi. Ora mi fanno schifo. Domenica, a tavola, la leggerò a tutti. Voglio vederli in faccia mentre ascoltano.»"},
        {id:"armadio",label:"L'armadio",clue:"c_regalo_pizzo",
         text:"Due abiti neri, sobri. Il colletto di pizzo del più bello è intatto. Su una mensola, avvolto in carta velina, un taglio di pizzo di Chantilly mai usato, con un biglietto: «Per il tuo lutto. A.C.» Lo stesso pizzo, identico, che orna le maniche della contessa."},
        {id:"valigia",label:"La valigia",
         text:"Pronta, chiusa con le cinghie. Sofia pensava di andarsene domenica, subito dopo il pranzo. Dopo aver detto quello che aveva da dire."}
      ]},
    cappella:{name:"Cappella", crimeFrom:1,
      desc:[
        "La cappella privata, annessa alla villa da un corridoio gelido. Banchi di noce, un altare barocco, due candelabri d'argento alti come un bambino. Fa più freddo che fuori.",
        "Padre Anselmo è disteso davanti all'altare, sulla schiena, gli occhi aperti verso un Cristo dorato. Uno dei due candelabri è a terra. La corda intorno al collo non è legata a niente.",
        "Hanno portato via il corpo del prete e l'hanno messo accanto a quello di Jacopo. La macchia sul marmo è rimasta.",
        null],
      objects:[
        {id:"altare",label:"L'altare",to:0,
         text:"Due candelabri d'argento massiccio, uno per lato, simmetrici e pesanti. Sulla tovaglia d'altare, cera fresca: padre Anselmo è passato di qui stasera, prima di cena."},
        {id:"confess0",label:"Il confessionale",to:0,
         text:"Odore di vino da messa e di legno vecchio. Sulla panca del sacerdote, una stola viola piegata con cura. Qualcuno si è confessato oggi."},
        {id:"candelabro",label:"Il candelabro a terra",clue:"c_candelabro",from:1,
         text:"Lo sollevi a fatica, con due mani. Sangue e capelli grigi alla base. Le ferite sulla testa del prete sono tante, irregolari: chi l'ha usato non aveva la forza di farlo bene al primo colpo."},
        {id:"corpo",label:"Le mani del prete",item:"chiave_torretta",from:1,to:1,
         text:"La mano destra di Anselmo è chiusa a pugno, le nocche bianche. Gliela apri, dito per dito. Dentro, una chiave di ferro lunga un palmo. Rina, sulla porta, si fa il segno della croce: «È la chiave della torretta. Il conte l'aveva data a lui. Diceva che era l'unico di cui si fidava.»"},
        {id:"confessionale",label:"Il confessionale",clue:"c_nota_anselmo",from:1,
         text:"Nella cassetta delle elemosine accanto al confessionale, tra la cenere di una candela, un foglio piegato bruciato per metà. La grafia tremante di un vecchio: «J. mi ha detto tutto. Il veleno. E il resto: che il dottore ha mentito, per trent'anni… [bruciato] …devo parlar… alla madre, prima della Messa. Dio mi perdoni il sigillo.»"}
      ]},
    torretta:{name:"Torretta", crimeFrom:99,
      lock:g=>g.items.includes("chiave_torretta")?null:"Una porta di quercia rinforzata in ferro, in cima a una scala a chiocciola. Chiusa. Rina dice che la chiave ce l'aveva solo il conte. E, forse, il suo confessore.",
      desc:["Una stanza rotonda sotto il tetto, gelida. Uno scrittoio, una finestrella che guarda il laghetto ghiacciato. Polvere su tutto, tranne che sulla sedia."],
      objects:[
        {id:"diario",label:"Il diario di Lorenzo",clue:"c_diario",
         text:"Un diario in pelle, cinquant'anni di vita a frammenti. «Agosto 1894. Viareggio. Allegra è tornata. Per un'estate siamo stati quello che avremmo dovuto essere.» «Settembre 1898. Ada. Che Dio mi perdoni, perché il lago non lo farà.» «Novembre 1927. Rinaldi mi ha portato il referto. Jacopo non è mio. Lo sospettavo da trent'anni; ora è scritto.» «Aprile 1928. Ho detto a Elena di preparare il nuovo testamento. Jacopo ha sentito tutto, dietro la porta.» L'ultima riga: «2 maggio. Stasera la tisana me l'ha portata Jacopo. Gentilezza improvvisa. Forse ci siamo capiti.»"},
        {id:"busta",label:"La busta nel diario",clue:"c_referto_falso",
         text:"Infilato nell'ultima pagina, un foglio su carta intestata «Dott. Marco Rinaldi — Medico Chirurgo — Porretta». Gruppi sanguigni: Lorenzo O. Allegra O. Jacopo B. «Ne consegue che il conte è da escludersi come padre.» Firmato e datato: novembre 1927."},
        {id:"lago",label:"La finestrella",clue:"c_ada",
         text:"Il laghetto, laggiù, è una lastra bianca. Sul davanzale qualcuno ha inciso con un temperino, tanti anni fa, un nome: ADA. Nel diario, un'altra pagina: «Era incinta. Mio. È entrata nell'acqua a novembre, e io non sono sceso a cercarla.»"}
      ]},
    cantine:{name:"Cantine", crimeFrom:2,
      desc:[
        "Volte di mattoni, botti di rovere, bottiglie coperte di polvere. Un mucchio di carbone per le stufe. Fa un freddo che entra nelle ossa.",
        null,
        "Elena Voss è seduta contro il muro tra due botti, la testa reclinata, la gola aperta. Il sangue le ha inzuppato il vestito grigio fino alla vita. Sopra di lei, sull'intonaco, a lettere alte una spanna: BUGIARDI.",
        "Il corpo di Elena è stato coperto. La parola sul muro no: nessuno ha il coraggio di cancellarla."],
      objects:[
        {id:"botti",label:"Le botti",to:1,
         text:"Sangiovese del 1921, Lambrusco, una botte di vin santo. Niente di interessante, a parte il vino."},
        {id:"parete",label:"La scritta sul muro",clue:"c_bugiardi",from:2,
         text:"BUGIARDI. Lettere grandi, tracciate con due dita. Guardi da vicino: ogni lettera è sbavata dal polso che è passato sopra quella appena scritta. Chi scrive con la destra si lascia le lettere fresche alle spalle. Chi scrive con la sinistra ci passa sopra."},
        {id:"tasche",label:"Le tasche di Elena",clue:"c_nota_sola",item:"chiavi_elena",from:2,
         text:"Alla cintura, un mazzo di chiavi d'ottone: lo prendi. Nella tasca del vestito, un biglietto in stampatello, a matita: «CANTINA, ORE 15. PORTI QUELLO CHE HA. VERRÒ SOLA.» Sola. Chi l'ha scritto è una donna."},
        {id:"rasoio",label:"Dietro la botte",clue:"c_rasoio",from:2,
         text:"Gettato nel buio dietro la botte del vin santo, un rasoio a mano libera con il manico d'avorio. Sulla lama, le iniziali incise: L.C."},
        {id:"pavimento",label:"La polvere di carbone",clue:"c_impronte",from:2,
         text:"Il carbone ha lasciato una polvere nera sul pavimento di mattoni. Ci sono le impronte di Rina, larghe, con gli zoccoli. E altre: scarpe da donna, tacco stretto, un trentasei o poco più. Vanno verso il corpo e tornano indietro."}
      ]}
  },

  chars:{
    allegra:{name:"Allegra Corbelli",short:"Allegra",age:57,role:"La contessa, vedova di Lorenzo",
      bio:"Elegante, controllata, sempre in nero. Voce calma, occhi freddi. Tiene in piedi la famiglia con la sola forza di volontà, e tutti la temono un po'.",
      p:{hair:"veil",acc:"pearls",dress:"#0d0b0a",tone:"#d9c3a5"},
      loc:["salone","salone","camera_allegra","salone"],
      alibi:[
        "«Mi sono ritirata alle dieci e venti. Emicrania. Rina mi ha portato una tisana verso le undici meno un quarto. Ho sentito l'urlo come tutti, notaio. Forse più di tutti.»",
        "«Dormivo. Alla mia età il sonno è l'unica cosa che non chiede niente in cambio.»",
        "«Riposavo. Qui. Sola. Lo scriva pure, se le fa piacere.»",
        "«Sono qui da ore, a guardare la neve che ci seppellisce tutti.»"],
      crime:[
        "«Mio figlio è morto in una biblioteca, tra libri che non ha mai aperto. C'è una certa coerenza, non trova?»",
        "«Padre Anselmo beveva. Forse il Signore si è stancato di aspettare che smettesse.»",
        "«Elena sapeva tutto di questa casa. Evidentemente qualcuno ha pensato che sapesse troppo.»",
        "«Tre morti in un giorno. Mio marito ne avrebbe approfittato per rifare il testamento.»"],
      self:"«Sono stata sposata trentotto anni a un uomo che non amavo, e ho tenuto in piedi questa casa con queste mani. Non pretendo che lei capisca quanto costa.»",
      others:"«Rinaldi è un uomo debole. Sofia è una bambina che recita la parte della vedova. Rina è fedele. Elena era indispensabile. Le persone indispensabili diventano presto insopportabili.»",
      react:{
        c_pizzo:"«Chantilly. Ne ho metri. Anche Sofia, se è per questo: gliel'ho regalato io, per il lutto. La generosità, vede, lascia tracce.»",
        c_regalo_pizzo:"«Sì, gliel'ho regalato io. Una vedova deve vestirsi da vedova. Anche quando non lo è nel cuore.»",
        c_fiala:"Una pausa appena troppo lunga. «Digitalina. Lorenzo aveva il cuore debole, lo sapevano tutti. Chi l'abbia buttata nel camino di Jacopo… lo chieda a Jacopo.»",
        c_foto_rinaldi:"«Avevo ventitré anni e un marito che passava le notti a Bologna con le ballerine. Non me ne vergogno. Me ne vergognavo, una volta.»",
        c_foto_viareggio:"La sua mano, per la prima volta, si muove: va a toccare il bordo della cornice e si ritira. «Viareggio. L'unica estate.» Un silenzio. «Metta giù quella fotografia, notaio.»",
        c_lettera_allegra:"«Ha frugato nel mio messale. Dio la perdonerà, io no. Quella lettera era per un morto. I morti non testimoniano.»",
        c_bugiardi:"«Una parola sola. Chiunque l'abbia scritta aveva un senso dell'economia che apprezzo.»",
        c_rasoio:"«Il rasoio di Lorenzo. Lo tenevo in camera, con i suoi gemelli e il suo orologio. Tutta la casa sa dove tengo le cose di mio marito. Rina lo sa. Elena lo sapeva.»",
        c_astuccio_vuoto:"«Qualcuno ha frugato nei miei cassetti prima di lei, a quanto pare. In questa casa non c'è più rispetto per niente.»",
        c_guanti:"«Mi sono sporcata scendendo in cantina, dopo, quando abbiamo trovato Elena. Lei c'era, notaio. Si ricorda chi ha toccato cosa?»",
        c_testimonianza_rina:"Silenzio. «Rina è una brava donna. Le brave donne, sotto pressione, dicono quello che l'interlocutore vuole sentirsi dire.»",
        c_mancina:"«Le suore di Santa Zita mi hanno insegnato a usare la mano giusta. Ho imparato. Si impara tutto, notaio. Anche a non essere sé stessi.»",
        c_bicchiere_sx:"«Ero stanca. Alla fine di una cena come quella, si diventa disordinati.» Ti guarda. «Lei nota cose curiose.»",
        c_ricamo:"«Ricamo come mi pare. È l'unica cosa che faccio come mi pare.»",
        c_referto_falso:"«Lo conosco. Lorenzo me lo sbatté sul tavolo un anno fa, credendo di umiliarmi. Mi confermava soltanto quello che Marco mi diceva da trent'anni. Jacopo era figlio suo. Di Marco.»",
        c_referto_vero:[
          {minAct:1,text:"Lo legge. Lo rilegge. Lo piega in due, con cura, e te lo restituisce. «Lo sapevo già, notaio.» La voce non cambia. Le mani sì. «Da stamattina. Da troppo poco.»"}],
        c_confessione_rinaldi:"Per un istante la contessa chiude gli occhi. Quando li riapre, guarda le scale, verso la camera del dottore. «Marco è sempre stato un uomo debole. Le bugie dei deboli sono le più lunghe.»",
        c_nota_anselmo:"«Padre Anselmo voleva parlare con una madre. In questa casa ce n'erano due, di madri, notaio. O forse nessuna.»",
        c_agenda:"«La verità sul dottore. Jacopo aveva molte verità. Le vendeva al chilo.»",
        c_diario:"«Lorenzo teneva un diario? A me non ha mai scritto nemmeno un biglietto d'auguri.»",
        c_bicchiere:"«Brandy. Jacopo beveva qualunque cosa avesse un tappo.»",
        c_tazza:"«Rina avrà preso un'altra tazza. Non conto le tazze, notaio. Ho personale per questo.»",
        c_ciondolo:"Legge il frammento senza espressione. «Povera Sofia. Ha scoperto che mio figlio era un assassino. Benvenuta in famiglia.»"
      },
      def:["«Mi sta facendo perdere tempo, notaio. E qui il tempo è l'unica cosa che scarseggia più del pane.»","«Non ho niente da dire su questo.»","«Lei guarda le cose come un notaio. Le conta. Non le capisce.»"]},

    rinaldi:{name:"Dott. Marco Rinaldi",short:"Rinaldi",mk:"Dr",age:54,role:"Medico di famiglia",
      bio:"Medico dei Corbelli da oltre vent'anni. Ha firmato il certificato di morte di Lorenzo. Affabile, un po' troppo servizievole, beve più di quanto ammetta.",
      p:{hair:"grey",acc:"glasses",dress:"#2a2420",tone:"#d8b896"},
      loc:["biblioteca","cappella","cantine","camera_dottore"],
      alibi:[
        "«Ho giocato a scopa con padre Anselmo fino alle undici, poi sono salito in camera. Avevo… una bottiglia. Non mi guardi così, è inverno.»",
        "«Dormivo. Male, ma dormivo. Mi ha svegliato Rina, bussando. Gridava.»",
        "«Ero nel salone con la signora Benedetti, dalle due e mezza. Mi ha fatto un caffè, cercava di rimettermi in piedi. Lo chieda a lei.»",
        "«Sono chiuso qui e ci resto. Anzi: quando esce, mi chiuda lei da fuori.»"],
      crime:[
        "«Collo spezzato. Ma guardi le pupille: due capocchie di spillo. Era pieno di morfina, molto più del solito, e Jacopo il solito lo reggeva bene. Il colpo alla tempia l'ha stordito, la caduta dalla galleria ha fatto il resto. Poi l'hanno trascinato fin qui. Chi l'ha ucciso non avrebbe potuto affrontarlo da sveglio.»",
        "«Colpito alla testa con il candelabro, quattro, cinque volte. La corda è una farsa: non è mai stato appeso, gliel'hanno stretta al collo dopo. Chi l'ha fatto non aveva la forza di sollevare un uomo.»",
        "«Un taglio solo, netto, da sinistra… no, aspetti.» Si china, si rialza pallido. «Da destra verso sinistra. Era dietro di lei. E teneva la lama con la mano sinistra.»",
        "«Ci ammazzerà tutti, uno per uno. E il prossimo sono io. Lo so.»"],
      unlock:{crime0:"c_pupille",crime1:"c_corda",crime2:"c_taglio",alibi2:"c_alibi_sofia3"},
      self:"«Faccio il medico di questa famiglia da ventidue anni. Ho fatto nascere, ho curato, ho chiuso occhi. A un certo punto smetti di distinguere una cosa dall'altra.»",
      others:"«La contessa è… una donna straordinaria. Non le farei mai del male. Jacopo era un disgraziato. Elena una serpe. Il prete un ubriacone, come me, ma con più scuse.»",
      react:{
        c_fiala:{text:"Si asciuga la fronte. «Digitalina Merck. È… è la stessa che uso io. Mi mancava una fiala da maggio, lo giuro.» Poi crolla sulla sedia. «Sì, ho firmato quel certificato senza nemmeno guardarlo. Jacopo mi teneva in pugno: sapeva di me e di Allegra. Ho visto il corpo di Lorenzo con gli occhi del colpevole, non del medico.»",unlock:"c_certificato"},
        c_borsa:"«Una fiala mancante non fa un assassino, notaio. Le ho contate a maggio. Ne mancava già una, allora.»",
        c_diario:{text:"Legge l'ultima riga e diventa grigio. «La tisana. Jacopo.» Si siede. «L'ho sempre saputo, credo. Ho firmato il certificato senza guardare. Il ragazzo mi ricattava.»",unlock:"c_certificato"},
        c_foto_rinaldi:"«Bologna. Primavera del novantaquattro. Eravamo giovani. Jacopo è nato l'anno dopo: faccia due conti, notaio. Jacopo era mio.»",
        c_foto_viareggio:"«Questo non prova niente! Un'estate al mare. A settembre lei tornò da me. Jacopo era mio, mio, lo capisce?»",
        c_ricatto:"«Elena voleva cinquemila lire per non raccontare alla contessa della nostra… relazione. Tutto qui. Roba vecchia.»",
        c_referto_falso:"«L'ho scritto io, sì. Lorenzo voleva una prova, e io gliel'ho data. Era la verità. Solo… messa in bella copia.»",
        c_landsteiner:"«Landsteiner. I gruppi sanguigni. È scienza seria.» Si passa la lingua sulle labbra. «Perché me lo mostra?»",
        c_referto_vero:{text:"Lo guarda come si guarda un cadavere. «Dove… Elena. Certo. Elena.» Si lascia cadere sul letto. «Avevo vent'anni quando l'ho amata e quarantasei quando ho fatto quell'analisi, di nascosto. Il ragazzo era di Lorenzo. Lo era sempre stato. Ma se Allegra l'avesse saputo, cosa le sarebbe rimasto di me? Una fotografia. Così ho continuato a mentire. A lei. E poi a Lorenzo, con quel referto falso: speravo che la cacciasse. Che lei venisse finalmente da me.» Si copre la faccia. «Ho ucciso tutti, vero? Senza toccare nessuno.»",unlock:"c_confessione_rinaldi"},
        c_nota_anselmo:"«Il dottore ha mentito.» Rilegge. «No. No, no. Il prete era ubriaco. Non sapeva quello che scriveva.»",
        c_agenda:"«La verità sul dottore.» Ride, una risata brutta. «Jacopo aveva sempre una verità in tasca, da vendere.»",
        c_bugiardi:"Fissa la parola e non riesce a staccarne gli occhi. «Bugiardi. Lo dice a me. Lo dice a me, quella parola.»",
        c_pupille:"«Gliel'ho detto. Era imbottito. Qualcuno gliel'ha data, o gliel'ha messa nel bicchiere.»",
        c_bicchiere:"«Morfina sciolta nel brandy. Amara come il fiele, ma Jacopo non sentiva più i sapori da anni.»",
        c_mancina:"«Mancina? Allegra?» Ci pensa. Qualcosa gli torna in mente da trent'anni fa e gli si gela la faccia. «A Bologna… sì. Scriveva le lettere con la sinistra, quando era sola con me.»",
        c_guanti:"«Il sangue non si toglie con l'acqua fredda. Serve l'acqua ossigenata. Lo sanno i medici.» Si ferma. «E le mogli dei medici. E chi ha fatto la guerra.»"
      },
      def:["«Non… non so niente di questo.»","«Posso avere qualcosa da bere, prima?»","«Chieda alla contessa. Lei sa sempre tutto.»"]},

    sofia:{name:"Sofia Benedetti",short:"Sofia",age:28,role:"Vedova di un cugino dei Corbelli",
      bio:"Vedova di Gustavo, cugino dei Corbelli, morto due anni fa in un «incidente di caccia». Bella in modo discreto, silenziosa, sembra fragile. Porta sempre al collo un ciondolo con la foto del marito.",
      p:{hair:"long",acc:"locket",dress:"#141110",tone:"#e3ccb0"},
      loc:["salone","salone","salone","salone"],
      alibi:[
        "«Ero qui, nel salone, con padre Anselmo. Mi leggeva Pascoli. Male, ma con impegno. Poi l'urlo.»",
        "«In camera mia. Non dormo più da due anni. Ho sentito la campanella della cappella verso le sei e mezza, una volta sola. Ho pensato che il padre si preparasse alla Messa.»",
        "«Con il dottor Rinaldi, qui. Tremava come una foglia. Gli ho fatto il caffè forte e l'ho tenuto sveglio dalle due e mezza fino a quando Rina ha gridato.»",
        "«Voglio solo che smetta di nevicare.»"],
      unlock:{alibi2:"c_alibi_sofia3"},
      crime:[
        "«Non piangerò Jacopo. Non me lo chieda.»",
        "«Il padre era l'unico gentile con me, in questa casa.»",
        "«Elena mi guardava come si guarda un conto da saldare.»",
        "«Chi uccide così non si ferma. Si ferma quando non resta più nessuno.»"],
      self:"«Ho sposato Gustavo a vent'anni. Due anni fa è uscito a caccia con Jacopo e non è tornato. Mi hanno detto: un incidente. Mi hanno dato dei soldi. Come se certe cose si potessero saldare.»",
      others:"«La contessa mi ha regalato il pizzo che porto. Non so se per gentilezza o per ricordarmi chi paga.»",
      react:{
        c_diario_sofia:{text:"Arrossisce, poi impallidisce. «Ha letto il mio diario.» Si slaccia il ciondolo con le dita che tremano e lo apre. Dietro la foto di Gustavo, un pezzo di carta piegato. «Ecco. È questa la lettera. Volevo leggerla domenica, davanti a tutti. Qualcuno mi ha tolto anche questo.»",unlock:"c_ciondolo"},
        c_registro:{text:"«S.B.» Sbianca. «Sì. Elena sapeva che avevo trovato una cosa. Voleva che stessi zitta, e mi faceva pagare per il suo silenzio, come se fossi io la colpevole.» Apre il ciondolo. «Ecco cosa avevo trovato.»",unlock:"c_ciondolo"},
        c_ciondolo:"«Gustavo è morto per un cinghiale che non c'era. Volevo vedere la faccia di Jacopo mentre la leggevo. Sì, lo odiavo. Ma l'odio non spezza il collo a nessuno, notaio. Servono le mani.»",
        c_pizzo:"«Il mio colletto? Guardi pure, è intatto. Ma la contessa me ne ha regalato un metro intero. Il resto l'ha tenuto per sé.»",
        c_regalo_pizzo:"«Non l'ho mai usato. Mi sembrava di indossare la sua elemosina.»",
        c_nota_sola:"«Non è la mia grafia. Io scrivo in corsivo, come le Orsoline. Lo stampatello lo usa chi non vuole essere riconosciuto.»",
        c_impronte:"«Porto il trentasei. Anche la contessa. Anche metà delle donne d'Italia.»",
        c_mancina:"«Mancina? La contessa? Non l'ho mai vista usare la sinistra. Mai, nemmeno per sbaglio.» Ci pensa. «Non è strano? Chi è così attento a una mano sola?»",
        c_alibi_sofia3:"«Il dottore può dirglielo. Non l'ho lasciato un minuto. Aveva paura di addormentarsi.»",
        c_bicchiere_sx:"«A tavola ero seduta di fronte a lei. Tagliava la carne come un chirurgo. Ma quando ha preso il bicchiere…» Esita. «Ha allungato la sinistra. Poi l'ha ritirata, come se si fosse scottata.»",
        c_fiala:"«Veleno. Allora anche il conte…» Ti guarda dritto. «Lo chieda a chi ha firmato il certificato.»"
      },
      def:["«Non so niente di questo, notaio.»","«Perché lo chiede a me? Sono l'ultima arrivata in questa famiglia.»","«Mi lasci in pace, la prego.»"]},

    anselmo:{name:"Padre Anselmo Ravelli",short:"Anselmo",age:61,role:"Sacerdote di famiglia",deadFrom:1,
      bio:"Confessore della famiglia da trent'anni. Conosce i peccati di quasi tutti. Beve in segreto. Ha l'aria stanca e disillusa di chi ha perdonato troppo.",
      p:{hair:"bald",acc:"collar",dress:"#121010",tone:"#d6b48e"},
      loc:["salone"],
      alibi:["«Ero con la signora Benedetti. Le leggevo poesie. Lei fingeva di ascoltare, io fingevo di non avere sete.»"],
      unlock:{alibi0:"c_alibi_sofia1",others:"c_ada"},
      crime:["«Ho dato l'estrema unzione a un ragazzo di trentatré anni con il collo spezzato. Signore, pietà.» Abbassa la voce. «Ci sono cose che so, notaio, ma non sono mie. Sono di Dio.»"],
      self:"«Sono il confessore di questa famiglia da trent'anni. Sapesse quante cose si possono perdonare. E quante no.»",
      others:"«La contessa è una donna di fede. Di una fede tutta sua. Il conte aveva molto da farsi perdonare: una ragazza, tanti anni fa. Ada. Annegata nel laghetto. Ma questo non gliel'ho detto io.»",
      react:{
        c_agenda:{text:"Diventa grigio. «Jacopo è venuto da me ieri pomeriggio. Ha chiesto di confessarsi, per la prima volta in quindici anni. Non posso dirle cosa. Non posso.» Si versa da bere con la mano che trema. «Le dico solo questo: in questa casa qualcuno ha creduto per trent'anni a una cosa falsa. E la verità, quando arriva tardi, è peggio di una bugia.»",unlock:"c_confessione_jacopo"},
        c_fiala:"«Rimetta via quella cosa. Non qui. Non davanti a me.»",
        c_landsteiner:"«Scienza.» Sorride, triste. «Una volta per sapere di chi era un figlio bastava chiederlo alla madre. Ora lo chiedono al sangue. Il sangue, almeno, non mente.»",
        c_testamento:"«Lorenzo voleva sistemare i conti con Dio lasciando i soldi a una fondazione. Dio non accetta assegni.»",
        c_foto_rinaldi:"«Vecchie storie. Le ho perdonate tutte, a suo tempo.» Guarda la foto un momento di troppo. «Non tutte erano vere, però.»"
      },
      def:["«Non posso parlarne, figliolo.»","«Preghi, notaio. Qui dentro è l'unica cosa che non costa niente.»","«Il sigillo della confessione non è una formalità.»"]},

    elena:{name:"Elena Voss",short:"Elena",age:42,role:"Segretaria e amministratrice",deadFrom:2,
      bio:"Al servizio di Lorenzo per diciotto anni. Tedesca di nascita, precisissima, sempre in grigio. Conosce ogni debito, ogni lettera, ogni segreto finanziario della famiglia. La chiamano «la vera padrona» della villa.",
      p:{hair:"bun",acc:"glasses",dress:"#45433f",tone:"#e6cfb3"},
      loc:["studio","studio"],
      alibi:[
        "«Nello studio, a riordinare le carte del conte. Qualcuno in questa casa deve lavorare.»",
        "«Qui dalle sei. Non ho visto nessuno. Ho sentito la campanella della cappella, verso le sei e mezza.»"],
      crime:[
        "«Jacopo aveva debiti con mezza Bologna. Ma i creditori non vengono a spezzarti il collo in villa durante una bufera. È stato qualcuno di casa.»",
        "«Il prete parlava troppo, quando beveva. E beveva sempre.»"],
      self:"«Diciotto anni al servizio del conte. Conosco ogni lira di questa famiglia. Anche quelle che non risultano.»",
      others:"«Mi chieda di chiunque, notaio. Ma sappia che in questa casa le informazioni hanno un prezzo.»",
      react:{
        c_testamento:"«Il conte era un uomo giusto, alla fine. Tardi, ma giusto. Sì, mi lasciava molto. Me l'ero guadagnato.»",
        c_ricatto:"Sorride, per la prima volta. «Il dottore conserva la mia corrispondenza. Commovente. Lei crede che parli di una vecchia tresca, vero? Lo crede anche lui. Lo crede anche la contessa. Nessuno legge con attenzione, in questa casa.»",
        c_fiala:"Gli occhi le si stringono. «Digitalina. Allora era vero.» Ti restituisce la fiala come si restituisce un assegno. «Grazie, notaio. Mi ha appena fatto guadagnare molto denaro.»",
        c_nota_anselmo:"«Il dottore ha mentito. Il prete è arrivato prima di me.» Un'occhiata alla finestra, verso la cappella. «E guardi dov'è finito.»",
        c_landsteiner:"«Il conte comprava libri che non leggeva. Qualcun altro, a quanto pare, li legge.»",
        c_figlio:"«La governante ha i suoi segreti. Ce li hanno tutti, in questa casa. Io li tengo solo in ordine alfabetico.»",
        c_agenda:"«Jacopo voleva dire la verità alla madre?» Una risatina. «Allora ha venduto la stessa merce due volte. Era il suo stile.»"
      },

CASE_CORBELLI.ending = function(ans,g){

      "«Contessa. Jacopo ha avvelenato suo padre il 2 maggio, con la digitalina del dottore. Lei lo ha saputo da lui, e lo ha ucciso venerdì notte. Senza esitare, perché da trentatré anni credeva che non fosse figlio di Lorenzo, ma del suo peccato. Di Marco Rinaldi.»",
      "«All'alba padre Anselmo le ha detto che il dottore aveva mentito. Elena aveva il referto del 1920 e voleva venderglielo. Lei li ha uccisi tutti e due. E in cantina ha scritto, con la sinistra, l'unica parola che le era rimasta.»",
      "La contessa non si muove. Poi, lentamente, si sfila il guanto sinistro, dito per dito, e lo posa sul bracciolo.",
      "«Sa qual è la cosa più ridicola, notaio? Ho ucciso il figlio di Lorenzo per vendicare Lorenzo. Trentatré anni a guardarlo e a vedere Marco. Aveva il mento di suo padre. Il mento di Lorenzo. Lo vedevo ogni mattina, e vedevo un'altra cosa, perché un uomo mi aveva detto di vederla.»",
      "Guarda Rinaldi, finalmente. Lui è sceso dalla sua stanza e sta in piedi contro il muro, e piange senza rumore.",
      "«Bugiardi. Lui per tenermi. Lorenzo per punirmi. Jacopo per i soldi. Il prete per Dio, Elena per il prezzo.» Una pausa. «E io, notaio. Io per prima.»",
      dead?"Ne mancava uno, di bugiardi. Ora non manca più: Rinaldi è morto stanotte, prima che tu parlassi. La contessa lo guarda sul letto con l'espressione di chi ha finito un ricamo.":"Rina si fa il segno della croce. Sofia non distoglie lo sguardo. Rinaldi scivola lungo il muro fino a sedersi per terra.",
      "La neve smise lunedì all'alba. I carabinieri di Porretta arrivarono a mezzogiorno, con le catene alle ruote. La contessa li aspettava nell'ingresso, vestita di nero, i guanti in mano.",
      "Sul registro del carcere femminile di Bologna, alla voce «segni particolari», un appuntato scrisse una parola sola: mancina.",
      "Hai ricostruito l'intera catena. Una sola verità."]);
    if(score===2) return R("quasi","Quasi tutta la verità","Finale parzialmente corretto",[
      "Hai accusato la contessa e hai spiegato quasi tutto. Il veleno, la vendetta, il sangue in cantina.",
      "Lei ti ha ascoltato fino in fondo, con le mani in grembo. «Brava, notaio. Ha contato bene.» Un sorriso minimo. «Quasi.»",
      "Non ha aggiunto altro, né quella sera né mai.",
      dead?"Rinaldi era già morto. Qualunque cosa sapesse, se l'è portata via.":"Al processo, a Bologna, il dottor Rinaldi giurò con le lacrime agli occhi che Jacopo era suo figlio. I giornali lo trovarono commovente. La contessa, in aula, rise una volta sola.",
      "Ti resta una domanda che non ti lascia dormire: perché, sul muro, «bugiardi» era al plurale?",
      "Hai trovato l'assassina e quasi tutto il perché. Manca un filo. Rigioca per trovarlo."]);
    return R("parziale","La Contessa Nera","Finale parzialmente corretto",[
      "Hai accusato la contessa. Hai raccontato una storia: una moglie che uccide il marito, un'amante complice, una scia di testimoni da eliminare.",
      "Lei ti ha lasciato finire. «Lei ha contato i morti, notaio. Non si è mai chiesto perché.»",
      ans.lorenzo==="allegra_rinaldi"?"I carabinieri arrestarono anche Rinaldi, per l'omicidio del conte. Lui non si difese. Forse pensava di meritarlo, per altre ragioni.":"I giornali la chiamarono «la Contessa Nera». Il processo durò tre settimane.",
      "La storia ufficiale è quella che hai raccontato tu. È sbagliata quasi in ogni punto, tranne il nome.",
      "Hai preso l'assassina, ma non hai capito niente. Rigioca."]);
  }
  const W={
    rinaldi:[
      "Hai accusato il dottor Rinaldi. Lui non ha nemmeno provato a difendersi: ha pianto, ha balbettato di un certificato firmato senza guardare, di una bugia lunga trent'anni. Sembrava una confessione. Lo hai chiuso a chiave nella sua stanza.",
      "Alle tre di notte la porta era ancora chiusa. Dentro, Rinaldi aveva la gola tagliata. La chiave di riserva era nel mazzo della governante. Il mazzo era nella stanza della contessa.",
      "Avevi la chiave giusta in mano. Hai aperto la porta sbagliata."],
    sofia:[
      "Hai accusato Sofia Benedetti. Lei ha riso, una risata secca, poi ha aperto il ciondolo e ti ha messo in mano la lettera di Jacopo. «Sì, lo odiavo. Mi arresti per questo.»",
      "L'avete chiusa nella sua stanza. All'alba di domenica il dottor Rinaldi è stato trovato morto, mentre la porta di Sofia era ancora chiusa a chiave dall'esterno.",
      "La vendetta era una maschera, sì. Ma non quella che cercavi."],
    rina:[
      "Hai accusato Rina. La governante ti ha guardato come si guarda un temporale: senza sorpresa. «Io ho mentito, signore. Ma non per me.» Non ha detto per chi.",
      "Domenica mattina il dottor Rinaldi non ha aperto la porta. La governante era chiusa in cucina, sorvegliata da te.",
      "Rina lasciò la villa a febbraio, assolta. Non disse mai, nemmeno ai carabinieri, per chi avesse mentito."]
  };
  const p=W[ans.who].slice();
  if(dead) p[1]="Rinaldi era già morto. Ma la morte di un uomo non smette di essere un indizio: nessuno degli altri poteva entrare in quella stanza senza la chiave che teneva la contessa.";
  p.push("Lunedì, quando la neve si fermò, i carabinieri trovarono nel messale della contessa una lettera indirizzata a un morto. Era troppo tardi.");
  return R("errato","La porta sbagliata","Finale errato",p);
};

function buildSplash(){$("#splash").innerHTML=`<div class="cover"><i class="cn tl">${CORNER}</i><i class="cn tr">${CORNER}</i><i class="cn bl">${CORNER}</i><i class="cn br">${CORNER}</i>
<div class="ctop"><span>Fascicolo primo</span><span>MCMXXVIII</span></div>
<h1>Cerchio Chiuso<i>gialli d'epoca a cerchio chiuso</i></h1>
<div class="ill">${villaSVG()}</div>
<div class="sub">Mille strade coerenti. Una sola verità.</div>
<div class="tap">— Tocca lo schermo per entrare —</div></div>`;}
function enter(){if(entered)return;entered=true;goFull();AU.init();lightning(true);setTimeout(()=>AU.sfx("thunder"),250);
  $("#splash").classList.add("out");setTimeout(()=>{$("#splash").classList.remove("on");$("#menu").classList.add("on");renderMenu();},950);}
function renderMenu(){const sv=loadSave(),done=getDone();snow(true);

  let h=`<div class="mhead">${ORN}<h2>Archivio dei casi</h2><p>Scegli un fascicolo. Ognuno è un delitto chiuso tra quattro mura, con una sola verità possibile.</p></div><div class="folders">`;
  STORIES.forEach((st,i)=>{
    if(st.locked){h+=`<div class="folder locked"><div class="num">${st.num}</div><h3>${st.title}</h3><div class="yr">${st.year}</div><div class="bl">${st.blurb}</div><div class="stamp">In preparazione</div><span class="tie"></span></div>`;return;}

    h+=`<div class="folder"><div class="num">${st.num}</div><h3>${st.title}</h3><div class="yr">${st.year}</div><div class="bl">${st.blurb}</div>${done[st.id]?`<div class="stamp">${mark[done[st.id]]}</div>`:`<div class="stamp">Riservato</div>`}<span class="tie"></span>
    <div class="acts">${cont?`<button class="btn red" onclick="continueGame()">Continua l'indagine</button><button class="btn ink" onclick="newGame('${st.id}',true)">Ricomincia</button>`:`<button class="btn red" onclick="newGame('${st.id}')">Apri il fascicolo</button>`}</div></div>`;});
  h+=`</div><div class="mfoot"><button class="btn" onclick="AU.toggle();renderMenu()">Audio: ${AU.on?"acceso":"spento"}</button><button class="btn" onclick="toggleFull();setTimeout(renderMenu,300)">${isFull()?"Esci dallo schermo intero":"Schermo intero"}</button><button class="btn" onclick="howTo()">Come si gioca</button></div>`;
  $("#menu").innerHTML=h;}
function howTo(){note("Come si gioca",`<p>Ogni caso è diviso in <b>capitoli</b>. In ognuno hai un numero limitato di spostamenti tra le stanze: le candele accanto all'orologio. Ogni spostamento costa un quarto d'ora.</p>
<p>Nelle stanze, i <b>bagliori</b> indicano cosa si può esaminare. Tocca le <b>sagome</b> delle persone per interrogarle, e mostra loro i reperti del taccuino: le reazioni giuste aprono nuove piste.</p>
<p>La <b>Bacheca</b> lega gli indizi alle teorie con il filo rosso. Alcune teorie sono false piste perfettamente coerenti.</p>
<p>Puoi <b>accusare</b> in ogni momento, una volta sola. Ci sono finali sbagliati, finali parziali e una sola verità.</p>
<p class="small">Su iPhone, per lo schermo intero aggiungi la pagina alla schermata Home (Condividi → Aggiungi a Home).</p>`);}
function toMenu(){closeTalk();closeOv();$("#plate").classList.remove("on");$("#game").classList.remove("on");$("#menu").classList.add("on");renderMenu();}
function newGame(id,confirmFirst){
  if(confirmFirst){note("Ricominciare?",`<p>Il fascicolo verrà riaperto da capo e i progressi attuali andranno persi.</p><div class="row"><button class="btn red" onclick="closeOv();newGame('${id}')">Ricomincia</button><button class="btn ink" onclick="closeOv()">Annulla</button></div>`,true);return;}
  S=STORIES.find(s=>s.id===id);
  G={story:id,act:0,actions:S.acts[0].actions,time:S.acts[0].start,room:S.acts[0].room,clues:[],items:[],seen:{},visited:{},log:{},shown:{},flags:{},tab:"room",ended:null,forced:false,newClues:[]};
  G.visited[G.room]=1;accAns={};wAng.last=null;save();
  $("#menu").classList.remove("on");$("#game").classList.add("on");render();
  chapter({eb:"Prologo · "+S.prologue.eyebrow,title:S.prologue.title,paras:S.prologue.paras,mood:"storm",onDone:()=>actIntro(0)});}
function continueGame(){G=loadSave();S=STORIES.find(s=>s.id===G.story);accAns={};wAng.last=null;$("#menu").classList.remove("on");$("#game").classList.add("on");snow(false);render();}
function actIntro(i){const a=S.acts[i];chapter({eb:a.label,title:a.title,paras:a.intro,mood:i<3?"murder":"storm",onDone:()=>{render();}});}

/* ---------------- CAPITOLI (scene narrative) ---------------- */
function chapter(o){snow(true);const el=$("#chap");
  let h=`<div class="in">${o.mood==="murder"?BLOOD:""}<div class="eb">${o.eb}</div><h1>${o.title}</h1>${ORN}`;
  o.paras.forEach((p,i)=>{let c="";if(/^«/.test(p))c="q";else if(i===0)c="first";if(p===p.toUpperCase()&&p.length<30)c="big";if(o.end&&i===o.paras.length-1)c="fin";h+=`<p class="${c}" style="animation-delay:${(.5+i*.8).toFixed(2)}s">${p}</p>`;});
  h+=`<div class="acts" style="animation-delay:${(.5+o.paras.length*.8).toFixed(2)}s">${o.buttons||`<button class="btn" id="chok">Continua</button>`}</div><div class="hint">tocca per mostrare tutto</div></div>`;
  el.innerHTML=h;el.classList.remove("skip");el.classList.add("on");el.scrollTop=0;
  el.onclick=e=>{if(e.target.closest("button"))return;el.classList.add("skip");};
  const ok=$("#chok");if(ok)ok.onclick=()=>{el.classList.remove("on");snow(false);AU.sfx("page");o.onDone&&o.onDone();};
  if(o.mood==="murder"){AU.sfx("drone");setTimeout(()=>lightning(),1200);}else if(o.mood==="storm")setTimeout(()=>lightning(),700);else if(o.mood==="end"){AU.sfx("drone");}}

/* ---------------- RENDER ---------------- */
function render(){if(!G)return;hud();nav();const M=$("#main");M.innerHTML=`<div class="wrap">${({room:roomView,map:mapView,notes:notesView,board:boardView,accuse:accuseView})[G.tab]()}</div>`;post();}
function post(){if(G.tab==="board"){requestAnimationFrame(drawStrings);setTimeout(drawStrings,120);setTimeout(drawStrings,600);}if(G.tab==="notes"&&G.newClues.length){G.newClues=[];save();setTimeout(nav,600);}}
function hud(){const a=S.acts[G.act];$("#hAct").textContent=a.label;$("#hRoom").textContent=S.rooms[G.room].name;$("#hTime").textContent=fmt(G.time);
  let c="";for(let i=0;i<a.actions;i++){const lit=i<G.actions;c+=`<svg viewBox="0 0 8 24">${lit?`<path class="flame" d="M4 1q-2.6 3.6 0 6q2.6 -2.4 0 -6z" fill="#ffd27a"/><rect x="1.8" y="8" width="4.4" height="16" fill="#efe6d2"/>`:`<rect x="1.8" y="18" width="4.4" height="6" fill="#7a7062"/><path d="M4 18v-3" stroke="#666" stroke-width=".7"/>`}</svg>`;}$("#cands").innerHTML=c;
  if(wAng.last===null){wAng.last=G.time;wAng.m=G.time*6;wAng.h=G.time*.5;}else{const d=((G.time-wAng.last)%1440+1440)%1440;wAng.m+=d*6;wAng.h+=d*.5;wAng.last=G.time;}
  $("#wm").style.transform=`rotate(${wAng.m}deg)`;$("#wh").style.transform=`rotate(${wAng.h}deg)`;}
function nav(){const T=[["room","Stanza"],["map","Mappa"],["notes","Taccuino"],["board","Bacheca"],["accuse","Accusa"]];
  $("#nav").innerHTML=T.map(t=>`<button data-tab="${t[0]}" class="${G.tab===t[0]?"on":""}" onclick="setTab('${t[0]}')">${IC[t[0]]}<span>${t[1]}</span>${t[0]==="notes"&&G.newClues.length?`<i class="dot"></i>`:""}</button>`).join("");}
function setTab(t){if(G.tab!==t)AU.sfx("page");G.tab=t;save();render();$("#main").scrollTop=0;}

/* ---------------- STANZA ---------------- */
function roomSVG(id){const A=ROOMART[id],act=G.act;let s=`<svg class="scn" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">${shellSVG(A)}`;
  A.props(act).forEach(p=>{s+=tr(p[1],p[2],p[3]||1,P[p[0]](p[4]||{}));});
  (A.lights||[]).forEach(l=>s+=`<circle cx="${l[0]}" cy="${l[1]}" r="${l[2]}" fill="url(#${l[3]})" class="flick" style="mix-blend-mode:screen"/>`);
  const slots=A.slots||DEFSLOTS;charsIn(id).forEach((cid,i)=>{const sl=slots[i%slots.length];s+=`<g class="fig" onclick="openTalk('${cid}')">${tr(sl[0],sl[1],.95,figure(CHARFIG[cid]||{k:"coat"},S.chars[cid].short))}</g>`;});
  s+=`<rect width="800" height="450" fill="url(#hatch)" opacity=".07" pointer-events="none"/><rect width="800" height="450" fill="url(#gVig)" pointer-events="none"/>`;
  S.rooms[id].objects.filter(objAvail).forEach(o=>{const h=A.hot[o.id];if(!h)return;const seen=G.seen[id+"."+o.id];s+=`<g class="hot${seen?" seen":""}" transform="translate(${h[0]} ${h[1]})" onclick="examine('${o.id}')"><circle r="34" fill="#fff" fill-opacity="0"/>${seen?`<circle r="4" fill="#e9dcc0" opacity=".35"/>`:`<circle class="ring" r="9" fill="none" stroke="#ffe2a0" stroke-width="1.5"/><path class="glint" d="M0 -12L2 -2L12 0L2 2L0 12L-2 2L-12 0L-2 -2Z" fill="#fff4d6"/>`}</g>`;});
  return s+`</svg>`;}
function roomView(){const R=S.rooms[G.room],pres=charsIn(G.room),objs=R.objects.filter(objAvail);
  return `<div class="scene">${roomSVG(G.room)}</div><div class="roomtxt"><div class="plaque"><span class="fl"></span><h2>${R.name}</h2><span class="fl r"></span></div><p class="desc">${byAct(R.desc)}</p>
  <div class="sect">${pres.length?"Presenti":"Nessuno: solo tu e la casa"}</div>${pres.length?`<div class="chips">${pres.map(id=>`<button class="chip pers" onclick="openTalk('${id}')"><span class="pf">${portrait(S.chars[id].p)}</span>${S.chars[id].short}</button>`).join("")}</div>`:""}
  <div class="sect">Da esaminare</div><div class="chips">${objs.map(o=>{const seen=G.seen[G.room+"."+o.id],lk=o.req&&!hasItem(o.req);return `<button class="chip ${seen?"seen":""}" onclick="examine('${o.id}')"><span class="gl">${lk?IC.lock:seen?"✓":"✦"}</span>${o.label}</button>`}).join("")}</div>
  ${G.actions<=0?`<div class="warnbar">Le candele si sono consumate. Il prossimo spostamento chiuderà il capitolo.</div>`:""}</div>`;}

/* ---------------- MAPPA ---------------- */
function roomPinXY(r){return [r.x+r.w/2+18,r.y+r.h/2+10];}
function mapSVG(){const m=S.map;let s=`<svg viewBox="-6 -46 352 456" xmlns="http://www.w3.org/2000/svg">`;
  s+=`<text x="170" y="-28" text-anchor="middle" style="font-family:'IM Fell English SC';font-size:15px;letter-spacing:3px">Villa Corbelli</text><text x="170" y="-15" text-anchor="middle" style="font-style:italic;font-size:8.5px">pianta dei tre livelli, rilevata nell'anno 1780</text>${tr(322,-24,.8,COMPASS)}`;
  m.labels.forEach(l=>s+=`<text x="${l.x}" y="${l.y}" style="font-family:'IM Fell English SC';font-size:8.5px;letter-spacing:2px;fill:#7a5a3a">${l.t}</text>`);
  s+=`<g stroke="#6a5236" stroke-width=".8">${[0,1,2,3,4,5,6].map(i=>`<path d="M${128+i*12} 98v30"/>`).join("")}</g><text x="170" y="122" text-anchor="middle" style="font-size:7px;font-style:italic">scalone</text>`;
  m.rooms.forEach(r=>{const R=S.rooms[r.id],lk=roomLocked(r.id),cur=G.room===r.id,crime=G.act>=R.crimeFrom,vis=G.visited[r.id];
    s+=`<g class="rm" onclick="goRoom('${r.id}')"><rect class="wall" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="${cur?"rgba(160,24,24,.14)":"rgba(255,250,235,.22)"}" stroke="#3b2a1a" stroke-width="3"/>`;
    if(lk)s+=`<rect x="${r.x+2}" y="${r.y+2}" width="${r.w-4}" height="${r.h-4}" fill="url(#hatchInk)" opacity=".35"/>`;
    s+=glyph(MAPG[r.id],r.x,r.y,r.w,r.h);
    let dx,dy,vert;if(r.w>200){dx=r.x+r.w/2;dy=r.y;vert=false;}else if(r.x+r.w<=120){dx=r.x+r.w;dy=r.y+r.h/2;vert=true;}else if(r.x>=220){dx=r.x;dy=r.y+r.h/2;vert=true;}else{dx=r.x+r.w/2;dy=r.y+r.h;vert=false;}
    s+=vert?`<rect x="${dx-2.5}" y="${dy-6}" width="5" height="12" fill="#e2d2ad"/><path d="M${dx} ${dy-6}a12 12 0 0 ${r.x>=220?1:0} ${r.x>=220?10:-10} 10" stroke="#6a5236" stroke-width=".6" fill="none"/>`:`<rect x="${dx-6}" y="${dy-2.5}" width="12" height="5" fill="#e2d2ad"/>`;
    s+=`<text x="${r.x+6}" y="${r.y+13}" style="font-size:10px;font-style:italic">${R.mapName||R.name}</text>`;
    if(lk)s+=`<g transform="translate(${r.x+r.w-14} ${r.y+r.h-14})" stroke="#3b2a1a" fill="none" stroke-width="1.2"><rect x="-5" y="-1" width="10" height="8"/><path d="M-3 -1v-3a3 3 0 016 0v3"/></g>`;
    if(crime)s+=`<g transform="translate(${r.x+r.w-14} ${r.y+12})"><path d="M-6 -6L6 6M6 -6L-6 6" stroke="#8a1414" stroke-width="2.4"/><path d="M5 6v6" stroke="#8a1414" stroke-width="1.2"/></g>`;
    if(!vis&&!lk&&!cur)s+=`<text x="${r.x+r.w-12}" y="${r.y+r.h-8}" style="font-size:11px;fill:#8a7a5a">?</text>`;
    charsIn(r.id).forEach((id,i)=>{const cx=r.x+13+i*21,cy=r.y+r.h-11,c=S.chars[id];s+=`<circle cx="${cx}" cy="${cy}" r="9.5" fill="#f3e8cc" stroke="#3b2a1a"/><text x="${cx}" y="${cy+3.2}" text-anchor="middle" style="font-size:8px;font-style:normal;font-family:'IM Fell English SC'">${c.mk||c.short.slice(0,2)}</text>`;});
    s+=`</g>`;});
  const cr=m.rooms.find(r=>r.id===G.room),[px,py]=roomPinXY(cr);
  s+=`<g id="pin" class="pin" style="transform:translate(${px}px,${py}px)"><ellipse cx="2" cy="1" rx="5" ry="2" fill="#000" opacity=".3"/><path d="M0 0C-5 -7 -7 -11 -7 -14A7 7 0 1 1 7 -14C7 -11 5 -7 0 0Z" fill="#a01818" stroke="#4a0808"/><circle cx="0" cy="-14" r="2.5" fill="#f3d0c6"/></g>`;
  return s+`</svg>`;}
function mapView(){return `<div class="plan">${mapSVG()}<div class="legend">Tocca una stanza per raggiungerla · un quarto d'ora a spostamento · <span style="color:#8a1414">✕</span> scena del delitto</div></div>`;}

function goRoom(id){
  if(G.ended){setTab("accuse");return;}
  if(G.room===id){setTab("room");return;}
  const lk=roomLocked(id);if(lk){AU.sfx("door");note(S.rooms[id].name,`<p>${lk}</p>`,true);return;}
  if(G.actions<=0){endAct();return;}
  const doMove=()=>{AU.sfx("step");const f=$("#fade");f.classList.add("on");setTimeout(()=>{G.actions--;G.time+=15;G.room=id;G.visited[id]=1;G.tab="room";save();render();$("#main").scrollTop=0;AU.sfx("tick");f.classList.remove("on");},700);};
  const pin=$("#pin");if(G.tab==="map"&&pin){const r=S.map.rooms.find(x=>x.id===id),[px,py]=roomPinXY(r);pin.style.transform=`translate(${px}px,${py}px)`;setTimeout(doMove,750);}else doMove();}
function askWait(){if(G.ended)return;const last=G.act>=S.acts.length-1;
  note("Lasciar passare il tempo?",`<p>${last?"Se aspetti, arriverà la mezzanotte. E qualcuno potrebbe non vedere l'alba.":"Puoi chiudere questo capitolo e passare al successivo. Gli indizi che non hai trovato potrebbero cambiare, o sparire."}</p><div class="row"><button class="btn red" onclick="closeOv();endAct()">Attendi</button><button class="btn ink" onclick="closeOv()">Continua a indagare</button></div>`,true);}
function endAct(){closeTalk();
  if(G.act<S.acts.length-1){G.act++;const a=S.acts[G.act];G.actions=a.actions;G.time=a.start;G.room=a.room;G.visited[a.room]=1;G.tab="room";save();render();actIntro(G.act);}
  else{G.forced=true;G.flags.rinaldiMorto=true;G.tab="accuse";save();render();chapter({eb:S.forced.eyebrow,title:S.forced.title,paras:S.forced.paras,mood:"murder",onDone:()=>render()});}}

/* ---------------- REPERTI ---------------- */
function addClue(id){if(!id||has(id))return false;G.clues.push(id);G.newClues.push(id);return true;}
function clueArt(cid){const e=EV[cid]||{};if(e.doc)return docHTML(e);if(e.t){const c=S.chars[e.t];return `<div class="testi"><div class="pf">${portrait(c.p,!alive(e.t))}</div><div class="tq">${S.clues[cid].text}</div></div>`;}return `<div class="art">${evArt(cid)}</div>`;}
function examine(oid){const R=S.rooms[G.room],o=R.objects.find(x=>x.id===oid);if(!o)return;
  if(o.req&&!hasItem(o.req)){AU.sfx("door");note(o.label,`<p>${o.reqMsg}</p>`,true);return;}
  G.seen[G.room+"."+o.id]=1;let nw=null,item=null;if(o.clue&&addClue(o.clue))nw=o.clue;if(o.item&&!hasItem(o.item)){G.items.push(o.item);item=o.item;}
  save();const cid=o.clue;let art="";if(cid)art=clueArt(cid);else if(item)art=`<div class="art">${itemArt(item)}</div>`;
  if(o.item&&cid)art+=`<div class="art small">${itemArt(o.item)}</div>`;
  showPlate(`${cid?`Reperto n. ${G.clues.indexOf(cid)+1} · ${S.clues[cid].cat}`:item?"Oggetto":"Osservazione"}`,o.label,art,`<div class="txt">${val(o.text)}</div>${item?`<p class="got">Hai preso: ${S.items[item]}</p>`:""}`,nw);render();}
function viewClue(id){const k=S.clues[id];showPlate(`Reperto n. ${G.clues.indexOf(id)+1} · ${k.cat}`,k.name,clueArt(id),`<div class="txt">${k.text}</div>`,null);}
function viewItem(it){showPlate("Oggetto",S.items[it],`<div class="art">${itemArt(it)}</div>`,"",null);}
function showPlate(tag,title,art,body,nw){$("#plate").innerHTML=`<div class="pl" id="pl"><div class="tag">${tag}</div><h2>${title}</h2>${art}${body}${nw?`<div class="stamp">Agli atti</div>`:""}<div class="acts"><button class="btn ink" onclick="closePlate(${nw?`'${nw}'`:""})">Riponi</button></div></div>`;
  $("#plate").classList.add("on");$("#plate").scrollTop=0;AU.sfx("page");if(nw){setTimeout(()=>AU.sfx("stamp"),420);setTimeout(()=>AU.sfx("clue"),760);}}
function closePlate(fly){if(fly)flyToNotes(fly);$("#plate").classList.remove("on");}
function flyToNotes(cid){const src=document.querySelector("#pl .art,#pl .doc,#pl .testi"),btn=document.querySelector('.nav button[data-tab="notes"]');if(!src||!btn)return;
  const a=src.getBoundingClientRect(),b=btn.getBoundingClientRect(),d=document.createElement("div");d.className="fly";d.innerHTML=evThumb(cid);d.style.left=(a.left+a.width/2-50)+"px";d.style.top=(a.top+a.height/2-33)+"px";document.body.appendChild(d);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{d.style.transform=`translate(${b.left+b.width/2-(a.left+a.width/2)}px,${b.top+b.height/2-(a.top+a.height/2)}px) scale(.18) rotate(24deg)`;d.style.opacity=".3";}));
  setTimeout(()=>{d.remove();btn.classList.add("bump");setTimeout(()=>btn.classList.remove("bump"),600);},850);}

/* ---------------- INTERROGATORI ---------------- */
function openTalk(id){talkWith=id;pickOpen=false;AU.sfx("door");$("#talk").classList.add("on");renderTalk();}
function closeTalk(){talkWith=null;const t=$("#talk");if(t)t.classList.remove("on");}
let typer=null;
function renderTalk(typeIdx){const c=S.chars[talkWith],log=G.log[talkWith]||[];
  let L=log.length?log.map((l,i)=>`${l.q?`<div class="q">${l.q}</div>`:""}<div class="a${l.r?" react":""}"${i===typeIdx?` id="typing"`:""}>${l.a}</div>`).join(""):`<div class="a muted">${c.short} ti osserva in silenzio, in attesa della prima domanda.</div>`;
  const sh=G.shown[talkWith]||[];
  $("#talk").innerHTML=`<div class="tk-glow"></div><div class="tk-head"><div class="pf">${portrait(c.p)}</div><div class="tk-id"><div class="np">${c.name}</div><div class="role">${c.role}, ${c.age} anni</div></div><button class="tk-close" onclick="closeTalk()" aria-label="Chiudi">✕</button></div>
  <div class="tk-log" id="tklog" onclick="finishType()">${L}</div>
  <div class="tk-act"><div class="topics"><button onclick="talk('alibi')">Dov'era?</button><button onclick="talk('crime')">Il delitto</button><button onclick="talk('others')">Gli altri</button><button onclick="talk('self')">Di sé</button><button class="show" onclick="togglePick()">${pickOpen?"Chiudi il taccuino":"Mostra un reperto"}</button></div>
  ${pickOpen?(G.clues.length?`<div class="strip">${G.clues.map(id=>`<button class="${sh.includes(id)?"shown":""}" onclick="showClue('${id}')">${evThumb(id)}<span>${S.clues[id].name}</span></button>`).join("")}</div>`:`<p class="muted center">Il taccuino è ancora vuoto.</p>`):""}</div>`;
  const lg=$("#tklog");lg.scrollTop=lg.scrollHeight;if(typeIdx!==undefined)typeIt();}
function typeIt(){const el=$("#typing");if(!el)return;const full=el.textContent;el.textContent="";let i=0;clearInterval(typer);
  typer=setInterval(()=>{i+=2;el.textContent=full.slice(0,i);const lg=$("#tklog");if(lg)lg.scrollTop=lg.scrollHeight;if(i>=full.length){clearInterval(typer);typer=null;el.removeAttribute("id");}},16);
  el.dataset.full=full;}
function finishType(){const el=$("#typing");if(el&&typer){clearInterval(typer);typer=null;el.textContent=el.dataset.full;el.removeAttribute("id");}}
function togglePick(){pickOpen=!pickOpen;renderTalk();}
function pushLog(q,a,react,unlock){finishType();const L=(G.log[talkWith]=G.log[talkWith]||[]);L.push({q,a,r:!!react});const idx=L.length-1;
  if(unlock&&addClue(unlock)){L.push({q:"",a:`<span class="nc"><b>Nuovo reperto nel taccuino</b>${S.clues[unlock].name}</span>`});setTimeout(()=>AU.sfx("clue"),500);}
  save();renderTalk(idx);nav();}
function talk(topic){const c=S.chars[talkWith],u=c.unlock||{};let q,a,un;
  if(topic==="alibi"){q="Dov'era?";a=byAct(c.alibi);un=u["alibi"+G.act];}
  if(topic==="crime"){q="Il delitto";a=byAct(c.crime);un=u["crime"+G.act];}
  if(topic==="others"){q="Che cosa pensa degli altri?";a=c.others;un=u.others;}
  if(topic==="self"){q="Mi parli di lei.";a=c.self;}
  pickOpen=false;AU.sfx("page");pushLog(q,a,false,un);}
function showClue(id){const c=S.chars[talkWith];let r=c.react&&c.react[id],text,un;
  if(Array.isArray(r))r=r.find(x=>(x.minAct||0)<=G.act);
  if(r){if(typeof r==="string")text=r;else{text=r.text;un=r.unlock;}}else text=c.def[(G.clues.indexOf(id)+talkWith.length)%c.def.length];
  (G.shown[talkWith]=G.shown[talkWith]||[]);if(!G.shown[talkWith].includes(id))G.shown[talkWith].push(id);
  pickOpen=false;AU.sfx("page");pushLog("Gli mostri: "+S.clues[id].name,text,!!r,un);}

/* ---------------- TACCUINO ---------------- */
function notesView(){let h=`<div class="journal"><div class="ribbons">${[["indizi","Reperti ("+G.clues.length+")"],["persone","Persone"],["oggetti","Oggetti"]].map(t=>`<button class="${noteTab===t[0]?"on":""}" onclick="noteTab='${t[0]}';AU.sfx('page');render()">${t[1]}</button>`).join("")}</div><div class="pg">`;
  if(noteTab==="indizi"){if(!G.clues.length)h+=`<p class="hand">Nessun reperto, per ora. Esamina le stanze, interroga i presenti.</p>`;
    const cats=[["Reperto","Reperti"],["Documento","Documenti"],["Testimonianza","Testimonianze"],["Osservazione","Osservazioni"]];
    cats.forEach(([cat,lab])=>{const list=G.clues.filter(id=>S.clues[id].cat===cat);if(!list.length)return;h+=`<div class="jsect">${lab}</div>`;
      list.slice().reverse().forEach(id=>{const k=S.clues[id];h+=`<div class="entry${G.newClues.includes(id)?" new":""}" onclick="viewClue('${id}')"><div class="th">${evThumb(id)}</div><div><h4>${k.name}</h4><p>${k.text}</p></div></div>`;});});}
  if(noteTab==="persone")Object.keys(S.chars).forEach(id=>{const c=S.chars[id],al=alive(id),where=al&&c.loc&&c.loc[G.act];
    h+=`<div class="dossier${al?"":" dead"}"><div class="pf">${portrait(c.p,!al)}</div><div><h4>${c.name}</h4><div class="role">${c.role}, ${c.age} anni</div><p>${c.bio}</p><div class="st${al?"":" d"}">${al?"In vita · "+(where?S.rooms[where].name:"—"):"Deceduto"}</div>${where&&where!==G.room?`<button class="btn ink sm" onclick="goRoom('${where}')">Raggiungi · ¼ d'ora</button>`:""}</div></div>`;});
  if(noteTab==="oggetti")h+=G.items.length?G.items.map(i=>`<div class="entry" onclick="viewItem('${i}')"><div class="th">${itemArt(i)}</div><div><h4>${S.items[i]}</h4></div></div>`).join(""):`<p class="hand">Non porti niente con te, a parte la borsa del notaio.</p>`;
  return h+`</div></div>`;}

/* ---------------- BACHECA ---------------- */
function theoryScore(k){let pos=[],neg=[],sum=0;G.clues.forEach(id=>{const v=(S.clues[id].th||{})[k]||0;if(v>0)pos.push(id);if(v<0)neg.push(id);sum+=v;});return {pos,neg,sum};}
function pcard(id,neg,i){const rot=((id.length*7+i*13)%9)-4;return `<div class="pcard${neg?" neg":""}" style="transform:rotate(${rot}deg)" onclick="viewClue('${id}')"><span class="pin"></span>${evThumb(id)}<span>${S.clues[id].name}</span></div>`;}
function boardView(){let h=`<div class="court"><div class="plaque"><span class="fl"></span><h2>Bacheca</h2><span class="fl r"></span></div><p class="desc">Il filo rosso lega i reperti alle teorie. Il filo nero, a ciò che le smentisce.</p></div>`;
  ["A","B","C","T"].forEach(k=>{const t=S.theories[k],s=theoryScore(k),hid=k==="T"&&s.sum<4,pct=Math.max(0,Math.min(100,s.sum*(k==="T"?6:10)));
    h+=`<div class="cork" data-k="${k}"><svg class="str"></svg><div class="tcard${hid?" hidden":""}${k==="T"&&!hid?" truth":""}"><span class="pin"></span><h3>${hid?t.hiddenName:t.name}</h3><p>${hid?`Alcuni reperti non rientrano in nessuna teoria.${s.pos.length?` Ne hai ${s.pos.length}: continua a tirare.`:""}`:t.desc}</p>${hid?"":`<div class="meter"><i style="width:${pct}%"></i></div><div class="lab"><span>Solidità</span><span>${s.sum<=0?"Nessuna prova":s.sum<4?"Debole":s.sum<8?"Plausibile":"Convincente"}</span></div>`}</div>
    <div class="pcards">${hid?"":s.pos.map((id,i)=>pcard(id,false,i)).join("")+s.neg.map((id,i)=>pcard(id,true,i)).join("")}${!hid&&!s.pos.length&&!s.neg.length?`<div class="emptyc">Nessun reperto appuntato.</div>`:""}</div></div>`;});
  return h;}
function drawStrings(){document.querySelectorAll(".cork").forEach(c=>{const svg=c.querySelector("svg.str"),tc=c.querySelector(".tcard");if(!svg||!tc)return;const sr=svg.getBoundingClientRect(),t=tc.getBoundingClientRect();let s="";
  const pt=p=>{const r=p.querySelector(".pin").getBoundingClientRect();return [r.left+r.width/2-sr.left,r.top+r.height/2-sr.top];};
  const seg=(a,b,neg)=>`<path d="M${a[0]} ${a[1]}Q${(a[0]+b[0])/2} ${Math.max(a[1],b[1])+16} ${b[0]} ${b[1]}" stroke="${neg?"#141414":"#b3141a"}" stroke-width="1.7" fill="none"${neg?` stroke-dasharray="5 3"`:""}/>`;
  const dot=(p,neg)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="${neg?"#333":"#a01818"}"/>`;
  const pos=[...c.querySelectorAll(".pcard:not(.neg)")].map(pt),neg=[...c.querySelectorAll(".pcard.neg")].map(pt);
  let prev=[t.left+t.width/2-sr.left,t.bottom-sr.top-5];s+=dot(prev);pos.forEach(p=>{s+=seg(prev,p)+dot(p);prev=p;});
  const corner=[t.right-sr.left-14,t.bottom-sr.top-5];if(neg.length)s+=dot(corner,1);neg.forEach(p=>{s+=seg(corner,p,1)+dot(p,1);});
  svg.removeAttribute("viewBox");svg.innerHTML=s;});}
let rsT=null;window.addEventListener("resize",()=>{clearTimeout(rsT);rsT=setTimeout(()=>{if(G&&G.tab==="board")drawStrings();},150);});

/* ---------------- ACCUSA ---------------- */
function accuseView(){
  if(G.ended)return `<div class="court"><div class="plaque"><span class="fl"></span><h2>Caso chiuso</h2><span class="fl r"></span></div><p class="desc">Hai formulato la tua accusa: «${G.ended.title}».</p><div class="row c"><button class="btn" onclick="showEnding()">Rileggi il finale</button>${G.ended.kind!=="vera"?`<button class="btn" onclick="revealTruth()">Rivela la verità</button>`:""}<button class="btn red" onclick="newGame('${S.id}',true)">Ricomincia</button><button class="btn" onclick="toMenu()">Archivio</button></div></div>`;
  let h=`<div class="court"><div class="plaque"><span class="fl"></span><h2>L'accusa</h2><span class="fl r"></span></div><p class="desc">${G.forced?"Non c'è più tempo. Devi accusare adesso.":"Si accusa una volta sola. Le ipotesi barrate richiedono prove che non hai ancora trovato."}</p>`;
  S.accusation.forEach((q,qi)=>{h+=`<div class="qblock"><h3><span class="qn">${["I","II","III","IV"][qi]}.</span> ${q.q}</h3>`;
    if(q.type==="char")h+=`<div class="sus">${q.options.map(id=>{const c=S.chars[id];return `<button class="${accAns[q.id]===id?"on":""}" onclick="pick('${q.id}','${id}')"><div class="pf">${portrait(c.p,!alive(id))}</div><span>${c.short}</span></button>`}).join("")}</div>`;
    else q.options.forEach(o=>{const ok=!o.req||o.req.some(has);h+=ok?`<button class="opt${accAns[q.id]===o.id?" on":""}" onclick="pick('${q.id}','${o.id}')"><span class="bx"></span><span>${o.t}</span></button>`:`<div class="opt lock"><span class="bx"></span><span><s>${o.t}</s><span class="why">Non hai ancora prove per sostenerlo.</span></span></div>`;});
    h+=`</div>`;});
  const ready=S.accusation.every(q=>accAns[q.id]);
  return h+`<button class="btn red big" ${ready?"":"disabled"} onclick="confirmAccuse()">Pronuncia l'accusa</button></div>`;}
function pick(q,v){accAns[q]=v;AU.sfx("page");const y=$("#main").scrollTop;render();$("#main").scrollTop=y;}
function confirmAccuse(){note("Ne sei sicuro?",`<p>Stai per accusare formalmente <b>${S.chars[accAns.who].name}</b>, davanti a tutti. Non si torna indietro.</p><div class="row"><button class="btn red" onclick="closeOv();doAccuse()">Accuso</button><button class="btn ink" onclick="closeOv()">Aspetta</button></div>`,true);}
function doAccuse(){AU.sfx("gavel");shake();setTimeout(()=>lightning(),300);const e=S.ending(accAns,G);G.ended=e;G.answers={...accAns};save();setDone(S.id,e.kind);render();setTimeout(showEnding,1100);}
function endButtons(){return `${G.ended.kind!=="vera"?`<button class="btn" id="rv">Rivela la verità</button>`:""}<button class="btn red" id="ng">Rigioca il caso</button><button class="btn" id="mn">Torna all'archivio</button>`;}
function bindEnd(){const rv=$("#rv");if(rv)rv.onclick=()=>revealTruth();$("#ng").onclick=()=>{$("#chap").classList.remove("on");newGame(S.id);};$("#mn").onclick=()=>{$("#chap").classList.remove("on");toMenu();};}
function showEnding(){const e=G.ended;chapter({eb:e.eyebrow,title:e.title,paras:e.paras,mood:"end",end:true,buttons:endButtons()});bindEnd();}
function revealTruth(sure){if(!sure){$("#chap").classList.remove("on");note("Leggere la soluzione?",`<p>Vedrai la ricostruzione completa del caso, con tutti i colpi di scena.</p><div class="row"><button class="btn red" onclick="closeOv();revealTruth(true)">Rivela</button><button class="btn ink" onclick="closeOv()">Non ancora</button></div>`,true);return;}
  chapter({eb:"La soluzione",title:"Che cosa è successo davvero",paras:S.truth,mood:"end",buttons:`<button class="btn red" id="ng">Rigioca il caso</button><button class="btn" id="mn">Torna all'archivio</button>`});bindEnd();}

/* ---------------- FINESTRE ---------------- */
function note(title,html,raw){$("#sheet").innerHTML=`<button class="x" onclick="closeOv()">✕</button><h2>${title}</h2>${raw?html:html}`;$("#ov").classList.add("on");AU.sfx("page");}
function closeOv(){$("#ov").classList.remove("on");}
function pause(){note("Pausa",`<div class="pmenu"><button class="btn ink" onclick="closeOv()">Riprendi l'indagine</button><button class="btn ink" onclick="AU.toggle();pause()">Audio: ${AU.on?"acceso":"spento"}</button><button class="btn ink" onclick="closeOv();toggleFull()">${isFull()?"Esci dallo schermo intero":"Schermo intero"}</button><button class="btn ink" onclick="howTo()">Come si gioca</button><button class="btn ink" onclick="closeOv();toMenu()">Torna all'archivio</button></div>`,true);}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeOv();$("#plate").classList.remove("on");closeTalk();}});

/* ---------------- NEVE ---------------- */
(function(){const cv=$("#snow"),cx=cv.getContext("2d");let W,H;const fl=[];function rs(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;}rs();addEventListener("resize",rs);
  for(let i=0;i<130;i++)fl.push({x:Math.random(),y:Math.random(),r:Math.random()*1.9+.4,s:Math.random()*.0013+.0004,d:Math.random()*.0009-.0007});
  (function loop(){if(cv.style.opacity!=="0"){cx.clearRect(0,0,W,H);cx.fillStyle="rgba(232,224,206,.8)";fl.forEach(f=>{f.y+=f.s;f.x+=f.d+Math.sin(f.y*12)*.0003;if(f.y>1){f.y=-.02;f.x=Math.random();}if(f.x>1)f.x=0;if(f.x<0)f.x=1;cx.beginPath();cx.arc(f.x*W,f.y*H,f.r*devicePixelRatio,0,7);cx.fill();});}requestAnimationFrame(loop);})();})();

/* ---------------- AVVIO ---------------- */
document.body.insertAdjacentHTML("afterbegin",DEFS);
(function(){let t="";for(let i=0;i<12;i++){const a=i*30*Math.PI/180;t+=`<path d="M${(20+12.5*Math.sin(a)).toFixed(2)} ${(20-12.5*Math.cos(a)).toFixed(2)}L${(20+14.5*Math.sin(a)).toFixed(2)} ${(20-14.5*Math.cos(a)).toFixed(2)}" stroke="#3b2a1a" stroke-width="${i%3?.6:1.4}"/>`;}$("#wticks").innerHTML=t;})();
$("#bMenu").innerHTML=IC.menu;$("#bWait").innerHTML=IC.hour;
buildSplash();snow(true);

</script>
